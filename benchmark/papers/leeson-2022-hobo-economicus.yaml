notes: >
  Headline finding: panhandlers at Washington, DC Metrorail stations
  behave as maximisers — stations with more passersby attract more
  panhandlers (Table 2: 0.005 panhandlers per passerby unit, SE 0.001,
  full sample), and hourly panhandling receipts do not differ
  significantly across five neighbouring downtown stations (Tables 3-5:
  Brown-Forsythe, ANOVA and Kruskal-Wallis tests, all p > 0.5).

  Outcome label.  The I4R verdict is "minor discrepancies"
  (perfect_reproduction = No, computational_reproduction = 1;
  why_not_perfect_repro: Table 4 swaps the within/between labels, and the
  footnote 16-17 robustness checks are not created by the package).  The
  schema's OutcomeLabel has no such value (reproducible / robust /
  not_robust / not_reproducible / inconclusive); scripts/
  import_i4r_candidates.py maps it to inconclusive pending human review.
  On review: every pinned number reproduces from the package (DP 55 and
  the cross-check below), so reproducible is used; the discrepancies are
  recorded here.  (Package detail: the analysis do-file runs Stata's
  robvar, whose W0 output is Levene's test, so the footnote 16 Levene
  variant is in the log output even though DP 55 counts it as missing;
  the footnote 17 bounded-minutes variants are genuinely absent.)

  Curation pass (2026-10-21).  Pinned 11 claims: five Table 2
  coefficients with their clustered SEs in standard_error (passersby in
  both columns, friendliness in column 1 — the one the text calls
  significant only in the full sample — and the shuttle-stop indicator in
  both columns), the two Brown-Forsythe W and two ANOVA F statistics
  (sample_size = number of panhandler observations), and the two Table 2
  observation counts.  The passersby coefficients are printed to three
  decimals (0.005, 0.006), i.e. one significant digit.  Left out: the
  homeless-service coefficients (0.450 / 0.815) and column 2
  friendliness (1.462, SE 2.793), the adjusted R2s (0.39 / 0.06), Table 1
  summary statistics, Table 3 and 5 per-station rows, the Table 4 sums
  of squares (mislabelled in the paper), the Kruskal-Wallis statistics
  (2.506 / 3.170), the in-text standardized effects (0.53 / 0.40 SD) and
  the power calculations.

  What was read.  The published EJ PDF (Tables 1-5, text, footnotes);
  the Zenodo API metadata; the whole package (downloaded to a scratch
  directory, never committed): both zips, ReadMe.pdf, the three do-files
  and the six .csv files; I4R DP 55 (EconStor PDF); the meta-database's
  16 rows.

  Independent cross-check (not the package code: pandas / scipy /
  statsmodels on the .csv files).  Reproduces every pinned value at the
  printed precision: Table 2 col 1 passersby 0.005 (0.001), friendliness
  1.595 (0.851), shuttle 0.781 (0.182), service 0.450 (0.278), adj. R2
  0.39, N 242; col 2 0.006 (0.002), 1.462 (2.793), 0.890 (0.227), 0.815
  (0.525), 0.06, N 102; Brown-Forsythe W 0.541 (p 0.706) / 0.276 (0.893);
  ANOVA F 0.398 (0.809) / 0.151 (0.962); Kruskal-Wallis 2.506 / 3.170;
  80 receipts rows, 76 unique panhandlers, 67.6 hours observed, 242
  visits to 26 stations, 258 panhandlers counted.

  Package structure (package-only facts; never in contexts).  Inside
  replicate.zip: code/0_setup.do (hard-coded Windows `cd
  "C:\Documents\Projects\replicate"`; `ssc install` stripplot, outreg,
  labutil — needs network), code/1_dataprep.do (imports the csvs with
  Windows backslash paths such as "data\metrovisitslog", builds
  stationvisit.dta and receipts.dta), code/2_analysis.do (Table 1 sum,
  Table 2 `reg panhandlers passersby friendly shuttle service i.day,
  vce(cluster metroid)` written with outreg to output\table2.doc, Table 3
  robvar, Table 4 oneway, Table 5 kwallis, Figure 1 stripplot, power
  oneway), each with an identical .txt copy.  Data: metrovisitslog.csv
  (metro, date, panhandlers; 242 rows), passersby.csv (metro, month,
  year, passersby in thousands), friendliness.csv (701 passersby,
  passresp1-5), service.csv and shuttle.csv (walking minutes to the
  nearest provider / stop; the indicators are minutes <= 10),
  receipts.csv (observationid, panhandlerid, date, metro, donations,
  minutes, cash, inkind, declinedoffer).  The five-station subsample is
  hard-coded as metroid 9/10/14/17/18 after `encode metro` (alphabetical
  ids; "Gallery Place" in the data); friendliness is the station mean of
  each passerby's highest response category.  Also Codebook.xlsx,
  ReadMe.pdf, and IRB_Approval.pdf in the outer zip.

  What could not be verified.  The package ships no logs or output and
  the do-files were not run; the cross-check above is an independent
  re-estimate.  No working paper was found, so publication_date is the
  EJ Advance Access date.

  Original analysis in Stata (three do-files); language is r, the
  reproduction target (the pipeline translates Stata originals to R, as
  for alesina-2022).
