# Original paper: Leeson, P. T., Hardy, R. A., & Suarez, P. A. (2022).
#   "Hobo Economicus." The Economic Journal, 132(646), 2325-2338.
#   doi:10.1093/ej/ueab103
#
# Reproduction report: Braga de Melo, L., Cantone, G. G., Gabani, J., &
#   Gao, X. (2023). "Replication Report: A Comment on Peter T. Leeson,
#   R. August Hardy and Paola A. Suarez (2022)." I4R Discussion Paper
#   No. 55 (I4R First Meta Database replication team 36).  Verdict:
#   computationally reproducible with minor discrepancies — every table
#   and figure reproduces from the package in Stata ("their contents are
#   the same as in the paper") and again from the .csv data in R, but
#   (1) Table 4 swaps its row labels (the "Within Metro stations" sums of
#   squares are the between-station ones and vice versa) and (2) the
#   robustness checks the paper describes in footnotes 16 and 17 are not
#   produced by the package.  The meta-database records
#   perfect_reproduction = No, computational_reproduction = 1.  The
#   schema has no "minor discrepancies" label, so outcome_label is
#   reproducible (the printed numbers all reproduce; the discrepancies
#   are a label swap and missing robustness code) — see notes.
#
# Why this paper:
#   1. Tiny package (0.4 MB): six small .csv files and two short do-files.
#   2. One regression table (Table 2, OLS with date fixed effects and
#      station-clustered SEs) plus three equality tests (Tables 3-5).
#   3. Published version available as an open PDF on the first author's
#      site; package on Zenodo under CC BY 4.0.

id: leeson-2022-hobo-economicus
i4r_report_url: https://www.econstor.eu/bitstream/10419/274554/1/I4R-DP055.pdf
language: r
outcome_label: reproducible
split: holdout
# Contamination bookkeeping.  No working-paper version was found (web
# search 2026-10-21); the paper was received by the EJ 2021-02-11,
# accepted 2021-12-20, and published Advance Access 2022-01-03 (stated on
# its first page), which is taken as the first public version.  Print:
# EJ 132(646), August 2022.  Package: Zenodo record 5719541, created and
# published 2021-11-23 (Zenodo API created / publication_date).
publication_date: "2022-01-03"
package_release_date: "2021-11-23"

paper:
  # The published EJ PDF (OUP typeset version, "Downloaded from
  # academic.oup.com ... on 17 July 2022" footer) hosted on Peter
  # Leeson's site; re-checked 2026-10-21: 200 application/pdf, %PDF
  # magic, to a Retally-curation user agent.
  source: https://www.peterleeson.com/Hobo_Economicus.pdf
  title: "Hobo Economicus"
  authors:
    - Peter T. Leeson
    - R. August Hardy
    - Paola A. Suarez

dataset:
  source: https://zenodo.org/records/5719541
  access_notes: >
    Zenodo record 5719541, open access, CC BY 4.0: ONE file, "3
    replication package.zip" (433,578 bytes; the filename has spaces).
    It is a NESTED zip: the outer zip holds a folder "3 replication
    package/" with IRB_Approval.pdf and a second zip, replicate.zip
    (~232 kB), which holds the actual package (replicate/ReadMe.pdf,
    Codebook.xlsx, code/, data/).  Data are six plain .csv files.  The code/ folder
    ships each do-file twice, as .do and as an identical .txt copy
    (0_setup, 1_dataprep, 2_analysis): the independent-mode script-free
    copy removes the .do files but not the .txt copies, so the authors'
    code stays readable there.  No logs or table output ship (the code
    writes them to an output/ folder that is not included).

code_repo:
  url: https://zenodo.org/records/5719541

original_claims:
  - description: passersby_full_sample
    value: 0.005
    claim_type: coefficient
    standard_error: 0.001
    sample_size: 242
    unit: panhandlers per passerby (Table 1 units)
    location: "Table 2, column (1) Full sample, Number of passersby"
    context: >
      Table 2 ("Determinants of the Number of Panhandlers Across Metro
      Stations"), column (1) Full sample, row Number of passersby.  OLS
      regression of the number of panhandlers counted at a Metro station
      on a visit (one square-block area around the station exits) on the
      number of passersby at the station in the month of the visit (WMATA
      monthly count of riders exiting the station, on the scale of Table
      1: mean 348.954, i.e. thousands of exits per month; Georgetown is
      assigned Foggy Bottom-GWU's count), passerby friendliness (the
      station average of passersby's friendliest response, 1-5, to a
      request for directions), a homeless shuttle stop indicator (within
      a ten-minute walk) and a homeless service indicator (within a
      ten-minute walk), with date fixed effects.  Observations are Metro
      station-visits: 242 visits to 26 stations (25 Metrorail stations
      plus the Georgetown intersection) in 2016-2017.  Robust standard
      errors clustered by Metro station.
  - description: passersby_five_station_subsample
    value: 0.006
    claim_type: coefficient
    standard_error: 0.002
    sample_size: 102
    unit: panhandlers per passerby (Table 1 units)
    location: "Table 2, column (2) Five-station subsample, Number of passersby"
    context: >
      Table 2, column (2) Five-station subsample, row Number of passersby.
      Same OLS specification as passersby_full_sample (friendliness,
      shuttle-stop and homeless-service controls, date fixed effects,
      SEs clustered by Metro station), on the visits to the five
      neighbouring downtown stations Farragut North, Farragut West,
      Gallery Place-Chinatown, McPherson Square and Metro Center (102
      station-visits).
  - description: friendliness_full_sample
    value: 1.595
    claim_type: coefficient
    standard_error: 0.851
    sample_size: 242
    unit: panhandlers per friendliness point
    location: "Table 2, column (1) Full sample, Passerby friendliness"
    context: >
      Table 2, column (1) Full sample, row Passerby friendliness.  Same
      regression as passersby_full_sample.
  - description: shuttle_stop_full_sample
    value: 0.781
    claim_type: coefficient
    standard_error: 0.182
    sample_size: 242
    unit: panhandlers
    location: "Table 2, column (1) Full sample, Homeless shuttle stop"
    context: >
      Table 2, column (1) Full sample, row Homeless shuttle stop (station
      within a ten-minute walk of a stop of the homeless shuttle).  Same
      regression as passersby_full_sample.
  - description: shuttle_stop_five_station_subsample
    value: 0.890
    claim_type: coefficient
    standard_error: 0.227
    sample_size: 102
    unit: panhandlers
    location: "Table 2, column (2) Five-station subsample, Homeless shuttle stop"
    context: >
      Table 2, column (2) Five-station subsample, row Homeless shuttle
      stop.  Same regression as passersby_five_station_subsample.
  - description: brown_forsythe_donations_per_hour
    value: 0.541
    claim_type: other
    sample_size: 80
    unit: Brown-Forsythe W statistic
    location: "Table 3, Panel A: donations per hour, Brown-Forsythe W-statistic"
    context: >
      Table 3 ("Test of Equality of Variance in Panhandling Receipts
      Across Metro Stations"), Panel A, Brown-Forsythe W-statistic
      (p-value 0.706).  Brown-Forsythe test of equal variance of the
      number of donations each panhandler received per hour (donations
      divided by minutes observed working, times 60) across the five
      subsample stations.  Observations are panhandlers observed in
      2019: 80 observations (76 unique panhandlers).
  - description: brown_forsythe_dollars_per_hour
    value: 0.276
    claim_type: other
    sample_size: 67
    unit: Brown-Forsythe W statistic
    location: "Table 3, Panel B: dollars per hour, Brown-Forsythe W-statistic"
    context: >
      Table 3, Panel B, Brown-Forsythe W-statistic (p-value 0.893).  Same
      test for dollars received per hour (cash plus the market value of
      in-kind donations, divided by minutes observed working, times 60);
      67 observations, the panhandlers whose dollar receipts were counted.
  - description: anova_f_donations_per_hour
    value: 0.40
    claim_type: other
    sample_size: 80
    unit: one-way ANOVA F statistic
    location: "Table 4, Panel A: donations per hour, ANOVA F-statistic"
    context: >
      Table 4 ("Test of Equality of Mean Panhandling Receipts Across Metro
      Stations"), Panel A, ANOVA F-statistic (p-value 0.809).  One-way
      analysis of variance of donations per hour across the five
      subsample stations (4 and 75 degrees of freedom), 80 observations.
  - description: anova_f_dollars_per_hour
    value: 0.15
    claim_type: other
    sample_size: 67
    unit: one-way ANOVA F statistic
    location: "Table 4, Panel B: dollars per hour, ANOVA F-statistic"
    context: >
      Table 4, Panel B, ANOVA F-statistic (p-value 0.962).  One-way
      analysis of variance of dollars per hour across the five subsample
      stations (4 and 62 degrees of freedom), 67 observations.
  - description: station_visits_full_sample
    value: 242
    claim_type: other
    unit: station-visits
    location: "Table 2, column (1), Observations"
    context: >
      Observations in the full-sample Table 2 regression: Metro
      station-visits (242 visits to 26 stations).
  - description: station_visits_five_station_subsample
    value: 102
    claim_type: other
    unit: station-visits
    location: "Table 2, column (2), Observations"
    context: >
      Observations in the five-station-subsample Table 2 regression.

# The meta-database's 16 rows for this paper (team 36, DP 55) are all
# ROBUSTNESS variants: twelve against Table 2 column 1 (o_coeff 0.005 /
# o_std_err 0.001; r_coeff 0.004-0.008 under monthly aggregation, season
# or station fixed effects, dropped controls, negative binomial, added
# square-root and interaction terms; station fixed effects give -0.002
# (0.006)), three against Table 4 panel A (weighted ANOVAs and pair-wise
# Wald tests), and one blank row.  None is a plain reproduction, so no
# r_coeff is transcribed.  The reproduced values below come from DP 55:
# its Table 2 column 1 ("Original LHS", from the package) prints 0.005
# (0.001), 1.595 (0.851), 0.781 (0.182); its Table 6 panel A reprints
# the Table 4 panel A ANOVA (F 0.400, p 0.809); and section 2.1 states
# all tables reproduce with "contents ... the same as in the paper"
# (blanket verdict for the remaining claims, recorded as the paper's own
# value, as in bisbee-2022 / arias-2022).
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 0.005
    outcome: matches
    notes: DP 55 Table 2 col 1, 0.005 (0.001).
  - claim_id: 1
    reproduced_value: 0.006
    outcome: matches
    notes: DP 55 blanket verdict (all tables reproduce in Stata and R); value is the paper's.
  - claim_id: 2
    reproduced_value: 1.595
    outcome: matches
    notes: DP 55 Table 2 col 1, 1.595 (0.851).
  - claim_id: 3
    reproduced_value: 0.781
    outcome: matches
    notes: DP 55 Table 2 col 1, 0.781 (0.182).
  - claim_id: 4
    reproduced_value: 0.890
    outcome: matches
    notes: DP 55 blanket verdict; value is the paper's.
  - claim_id: 5
    reproduced_value: 0.541
    outcome: matches
    notes: DP 55 blanket verdict; value is the paper's.
  - claim_id: 6
    reproduced_value: 0.276
    outcome: matches
    notes: DP 55 blanket verdict; value is the paper's.
  - claim_id: 7
