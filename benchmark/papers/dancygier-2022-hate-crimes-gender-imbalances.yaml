notes: >
  Headline findings: German municipalities with more men than women aged
  15-44 are more likely to see anti-refugee hate crime (Figure 1; SI Table
  C1 full models, Excess Males 1.406 (0.463) Sum and 1.537 (0.412)
  Annual, logit; in the text, moving from 1.0 to 1.2 raises the
  probability of at least one hate crime by 2.60 and 1.71 points), and
  survey respondents who agree that refugees make it harder for native
  men to find partners are more likely to support anti-refugee violence
  (Table 1: Mate Competition 0.437 (0.016) bivariate, 0.155 (0.019) with
  all controls; N 3,019 / 3,008).

  Curation pass (2026-11-02).  Pinned 13 claims: Table 1's Mate
  Competition coefficient in all six columns and Job Competition in
  column 2, each with its SE; the two Table 1 Ns; SI Table C1 columns 5-6
  Excess Males with SEs and their Ns (9,282 municipalities; 27,846
  municipality-years).  Values exactly as printed in the published PDF
  and SI and identical to the package's table1.tex / table_C1.tex.
  Cross-check against the meta-database: Table 1 col 6 0.155 (0.019) and
  Table C1 col 6 1.537 (0.412) equal the rows' o_coeff / o_std_err; the
  other pinned values have no row.  Table C1 columns 5-6 are pinned
  although they sit in the SI because they are the "full results and
  specification" of main-text Figure 1 (the paper's municipality-level
  headline), not a robustness check; ContextAnalysis_Main.R fits exactly
  these two models for Figure 1.  Left out: Table 1's Job Competition in
  columns 3-6 and Life Satisfaction, R2 / adjusted R2 (0.191-0.459), Table
  C1 columns 1-4 and its other covariates, the Figure 1 effects (2.60
  [0.88, 4.19] and 1.71 [0.76, 2.55] points; marginal effects from a
  custom function), Figure 2-4 quantities, the list experiment, the
  YouGov replication, and SI Tables C2-C9 and D (robustness).

  Paper vs package.  The main text (fn. 24 area) says Figure 1 includes
  "county and year fixed effects"; the code and SI Table C1 use county
  fixed effects in columns 1-4 only and STATE fixed effects (plus year in
  the annual model) in the full columns 5-6 plotted in Figure 1, with SEs
  clustered by county.  The contexts follow SI Table C1.  The paper's
  Table 1 prints stars at p < 0.1 / 0.05 / 0.01 as dagger / * / **; the
  package's table1.tex uses the stargazer default *** for the same
  thresholds (values identical).

  Package-only facts (never in contexts).  master.R sources the four
  analysis scripts and number_in_texts.R; all read the .dta files from
  the working directory with readstata13 and use Help.R's bin.summary
  (glm logit with a cluster-robust vcov via sandwich) and star_out.
  Table 1 (SurveyAnalysis_Main.R): dat[dat$wave == 4, ]; lm1
  hate_violence_means ~ MateComp.cont; lm2 adds JobComp.cont +
  LifeSatis.cont; lm3 adds factor(age_group, gender, state, citizenship,
  marital, religion, occupation, income, household_size, self_econ) +
  eduyrs; lm4 adds eight national refugee items factor(ref_integrating,
  ref_citizenship, ref_reduce, ref_moredone, ref_cultgiveup, ref_economy,
  ref_crime, ref_terror); lm5 adds eight local items factor(ref_loc_*);
  lm6 adds factor(distance_ref) + factor(settle_ref) + lrscale + afd +
  muslim_ind + afd_ind + contact_ind.  Classical lm SEs.  Table C1
  (ContextAnalysis_Appendix.R): context.dta; the Sum outcome
  Hate_all_muni_1517_bin is built on the 2015 rows by summing
  Hate_all_muni over 2015-2017 (rows aligned by position across year
  subsets); Excess Males is pop_15_44_muni_gendergap_2015, trimmed to its
  2.5-97.5 % quantiles computed on the 2015 rows; full models add
  log_unemp_all_muni_2015, d_pop1511_muni, vote_afd_2013_muni,
  log_ref_inflow_1514, log_pop_ref_2014, log_violence_percap_2015,
  pc_hidegree_all2011, d_manuf1115, pc_manufacturing_2015,
  unemp_gendergap_2015, as.factor(ags_state) (+ as.factor(year) for the
  annual Hate_all_muni_bin), clustered by ags_county.
  produce_context_data.do (Stata 16) and merge_context*.R only rebuild
  context.dta from source_data/ and are not needed for the pinned
  numbers.

  What was read.  The published AJPS PDF (all 15 pp.); the SI PDF
  (Appendix C.1-C.3 and D.5.1 in full, the rest skimmed); the Dataverse
  API metadata for versions 1.0 and 1.1; the package's 1-ReadMe.txt,
  master.R, ContextAnalysis_Main.R, ContextAnalysis_Appendix.R (Table C1
  section), SurveyAnalysis_Main.R (Table 1 and Figure 4 sections),
  table1.tex and table_C1.tex; the meta-database's 38 team-34 rows.

  Independent cross-check (2026-11-02; not the package code: pandas /
  statsmodels on the downloaded .dta files).  Table 1 col 1 0.437
  (0.016), N 3,019; col 2 Mate 0.263 (0.020), Job 0.250 (0.019), Life
  -0.015 (0.006), N 3,019; SI Table C1 col 5 logit with county-clustered
  SEs 1.406 (0.463), N 9,282; col 6 1.537 (0.413 vs the printed 0.412,
  a small-sample-correction difference between statsmodels and
  sandwich), N 27,846.  Benchmark implication: the Sum outcome sums the
  three annual hate-crime counts per municipality; the R code does it by
  row position across the 2015 / 2016 / 2017 subsets (the file is in a
  consistent municipality order within year), and a first attempt here
  that re-sorted by year with an unstable sort got 1.041 (0.365) at the
  same N — a reproduction must align years by municipality.

  What could not be verified.  The package's R code was not run (the
  cross-check above re-estimates four pinned coefficients and the Ns;
  Table 1 columns 3-6 were not re-estimated).  The date of team 34's
  replication (hence the exact Dataverse version it used) is not
  recorded; both versions are byte-identical.

  Original analysis in R 4.0.2 (readstata13, MASS, sandwich, lmtest,
  stargazer, list, pBrackets), with one Stata 16 data-construction
  do-file; language: r is the reproduction target.
