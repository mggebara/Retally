notes: >
  Headline finding: across 5,775 Italian municipalities, World War I foot
  soldier casualties (relative to the 1911 male population over six)
  raised the Socialist vote share in 1919 (first stage, Table I:
  standardized 0.12 (0.02) with basic controls, 0.10 (0.01) with all, F
  = 41.68 to 50.59); instrumenting the 1919 socialist share with
  casualties, the socialist surge raised fascist violence in 1920-22 and
  the presence of fascist branches in 1921 (Table II Panels A and C, 0.38
  to 0.53) and the fascist vote share in 1921 (Table III Panel A, 0.30 to
  0.37, N = 5,358, 175 clusters) and 1924 (Panel C, 0.40 to 0.54) — the
  "red scare" mechanism.  OLS panels are near zero for the vote shares.
  181 district clusters in the main sample.

  Original analysis in Stata (ivreg2, outreg2); two appendix tables in R.
  language: r is the reproduction target.

  Curation pass (2026-10-21).  Pinned 12 claims from Tables I-III — the
  three tables the I4R team covered: two first-stage coefficients and the
  column (6) first-stage F, five 2SLS coefficients (each with its SE in
  standard_error), and the observation and cluster counts of the two
  samples.  Values exactly as printed in the published QJE article (two
  decimals throughout, so the printed-precision floor is +-0.005 on every
  coefficient and SE).  The paper has no separate reduced-form table for
  these outcomes; the first stage (Table I) and 2SLS panels are the
  headline estimates.  The intro text quotes the Table I col 1 and Table
  III Panel A col 6 estimates, so blind-mode redaction of "0.12", "0.10",
  "0.50", "0.34" etc. will also hit unrelated numbers in other tables
  (harmless over-redaction).

  Working paper vs published.  The candidate list named NBER WP 27854
  (September 2020); its tables differ from the published ones in
  numbering AND values, so the published typeset article was used as
  paper.source.  WP Table 1 (first stage) reports UNSTANDARDIZED
  coefficients at three decimals (2.034 (0.315) ... 1.689 (0.234)) and
  older control sets (F 41.68 / 42.27 / 56.37 / 57.55 / 53.96 / 52.18,
  R-squared 0.599-0.697); the published Table I reports standardized
  coefficients at two decimals, adds an assault-troop/volunteer casualty
  row and an army-supplier dummy to the military controls, and has F
  41.68 / 42.29 / 56.39 / 55.24 / 51.69 / 50.59.  WP Table 2 is the
  falsification table (published elsewhere); WP Table 3 is the 2SLS on
  the 1924 fascist vote share only (unstandardized, 0.375-0.504; no 1921
  panel), which became published Table III Panels C-D (with the new 1921
  Panels A-B); WP Table 4 (violence and branches, unstandardized: violence
  0.230-0.329, branches 0.507-0.672) became published Table II.  The
  meta-database's o_coeff values (three decimals, e.g. 0.119, 0.098,
  0.533, 0.513) are the published standardized estimates, not WP values.
  A November 2021 author draft (MIT, 77 pp.) also exists; not used.

  What was read.  The published QJE PDF (data section, Section IV,
  Tables I-III with notes, footnotes 12-14); NBER WP 27854 (Tables 1-4,
  for the comparison above); the Dataverse API metadata and version list;
  the whole package (all do-files, both R scripts' headers, the .ado
  headers); the meta-database's 64 rows for the paper (team 104).  The
  SSRP record (doi:10.48152/ssrp-3s2g-m694 -> socialsciencereproduction.org
  /reproductions/790) could not be read: the host does not resolve
  (2026-10-21).

  Independent cross-check (not the package code; numpy on the package's
  fascism_db.dta, mimicking Tables1-7.do): every pinned number reproduces.
  Table I: 0.1186 (0.0184), 0.1140 (0.0175), 0.1034 (0.0138), 0.1015
  (0.0136), 0.0976 (0.0136), 0.0979 (0.0138); F = t^2 = 41.68 / 42.29 /
  56.39 / 55.24 / 51.69 / 50.59 exactly; N 5,775, 181 clusters.  2SLS
  (SEs without small-sample adjustment, ivreg2's default; multiplying by
  sqrt(G/(G-1)) moves them by ~0.3 %): Table II Panel A 0.3793 (0.1854),
  0.3945 (0.1905), 0.4191 (0.2059), 0.5334 (0.2104), 0.5019 (0.2118),
  0.4999 (0.2044); Panel C 0.3901 (0.1746), 0.4055 (0.1780), 0.4445
  (0.1980), 0.5006 (0.2124), 0.4983 (0.2125), 0.4984 (0.2035); Table III
  Panel A 0.3049 (0.1658), 0.3287 (0.1620), 0.3691 (0.1830), 0.3632
  (0.1915), 0.3565 (0.1971), 0.3369 (0.1842), N 5,358, 175 clusters;
  Panel C 0.3956 (0.1706), 0.4531 (0.1620), 0.5024 (0.1666), 0.5424
  (0.1663), 0.5274 (0.1746), 0.5126 (0.1661).  These equal the database's
  o_coeff / o_std_err to three decimals.

  How the printed numbers are produced (package-only; never in contexts).
  Tables1-7.do loads fascism_db.dta and standardizes every variable in
  the blocks fascist_violence-strike_agr_1920, lpop1911-volunteers1866_pop
  and rain1918-rain_var with egen std (z_ prefix) over the WHOLE file, not
  the estimation sample — this matters for the 1921 sample (5,358 of
  5,775 rows non-missing).  Controls: spec1 z_lpop1911 z_lpop2-4
  z_sh_pop_1911_be6 d_reg* (359 regiment dummies) province* (69 province
  dummies); spec2 + z_larea z_centre_alt z_max_alt; spec3 + z_psu1913_vv;
  spec4 + z_veterans74_95 z_veterans96_00 z_ard_vol_pop6m z_cruent_d
  z_army_suppliers_d; spec5 + z_dlab z_shcrop z_landlord_ass; spec6 +
  z_ind_workers z_ind_firms z_literacy z_elites z_bourgeoisie.  Table I:
  reg z_psu1919_vv z_foots_pop6m spec, cl(circondario1921), F from test
  z_foots_pop6m.  Tables II-III: ivreg2 z_fascist_violence /
  z_fascist_branch / z_fascist1921_vv / z_fascist1924_vv (z_psu1919_vv =
  z_foots_pop6m) spec, partial(d_reg* province*) cl(circondario1921) —
  no small option, so the clustered SEs carry no finite-sample
  correction (an R reproduction with fixest's default small-sample
  adjustment will get SEs a few tenths of a percent larger, well inside
  the printed precision).  outreg2 dec(2) writes TAB_1.tex, TAB_2A-D.tex,
  TAB_3A-D.tex.  The master file's paths are placeholders
  (".../replication/data").

  Package facts.  fascism_db.dta (5,775 x 1,336) is all Tables I-VII
  need; fascism_mod_elections_db.dta (379 MB) feeds only Table VIII and
  appendix Tables A1 / A22.  x_gmm.ado / x_ols.ado implement Conley
  spatial SEs for appendix Table A2.  The two R scripts (TabA13FWER.R,
  Tab_A14.R) build appendix FWER / A14 tables; TabA13FWER.R reads a CSV
  produced by a do-file and not shipped.  The candidate-list risk "map
  figures may need geodata" is confirmed but irrelevant: fig1_maps.do
  needs fascism_map_db.dta and coord_italy*.dta, absent.

  Left out.  OLS panels (Tables II-III Panels B and D; near-zero,
  printed as 0.00-0.11); columns (2)-(5) of each panel (stable, reported
  above); Table I's veterans and assault-troop rows (controls, not the
  claim); Tables IV-VIII (party vote shares, heterogeneity, deportations,
  post-WWII votes: no I4R rows); appendix tables.
