# Original paper: Arias, S. B., & Blair, C. W. (2022). "Changing Tides:
#   Public Attitudes on Climate Migration." The Journal of Politics, 84(1),
#   560-567. doi:10.1086/715163
#
# Reproduction report: this paper was reproduced on the Social Science
#   Reproduction Platform (SSRP/BITSS), reproduction #791, NOT as a numbered
#   I4R Discussion Paper — but it is recorded in the I4R First Meta Database
#   (replication report team 12), so i4r_report_url points at the SSRP record.
#   Verdict: successfully reproduced (the replicator's survey answer:
#   "Analysis and cleaning code produce the same output as presented in the
#   paper", 10 on the ten-point scale; the original authors are on record as
#   "very pleased" the results replicated); no material caveats.
#
# Why this paper:
#   1. Original analysis code is a single R script (Migration_Analysis_Final.R)
#      — Retally's native target language.
#   2. Data is on Harvard Dataverse under CC0, fully open (every file
#      unrestricted), so the pipeline fetches it unattended.
#   3. Open-access author PDF text-extracts cleanly; the JOP journal version
#      is paywalled.
#
# original_claims pins the paper's focal estimates: the eight Table 2
# AMCEs for the reason-for-migration attribute (drought, flooding,
# wildfires, persecution vs economic opportunity; U.S. and German samples),
# each with its SE in standard_error, plus the per-country respondent and
# choice-task counts the design section states.  Values were transcribed
# from the author PDF (the conditionally-accepted text of 2020-09-29); the
# respondent / choice-task counts were cross-checked against the package's
# raw survey exports and the script's sample filters (see notes).  The
# package ships no table output or logs, so the AMCEs themselves could not
# be cross-checked without running the code (not done).

id: arias-2022-changing-tides-climate-migration
i4r_report_url: https://www.socialsciencereproduction.org/reproductions/791/published/index
language: r
outcome_label: reproducible
split: holdout
# Contamination bookkeeping.  First public version: the Kleinman Center
# for Energy Policy digest "Changing Tides: Public Attitudes on Climate
# Change and Climate Migration", dated December 2019 (PDF created
# 2019-12-18); it reports the same conjoint design and the German 18,862
# tasks / 1,074 respondents, but an earlier U.S. count (1,176 respondents,
# 20,573 tasks) and no Table 2.  The author PDF used here is dated
# 2020-09-29; JOP online 2021-05-06 (OpenAlex), print January 2022.
# Package: Harvard Dataverse doi:10.7910/DVN/FDML2N version 1.0, deposited
# 2020-10-01, released 2020-12-10 (Dataverse API publicationDate /
# releaseTime).
publication_date: "2019-12"
package_release_date: "2020-12-10"

paper:
  # Open-access author copy on Sabrina Arias's site ("Conditionally
  # Accepted at the Journal of Politics", September 29, 2020); re-checked
  # 2026-10-21: 200 application/pdf to both a Retally-curation and a
  # python-requests user agent.  The JOP version (doi:10.1086/715163) is
  # paywalled (403 to curl); OpenAlex's other green copy (SSRN 3790674)
  # also answers 403 to curl.
  source: https://sabrinabarias.com/wp-content/uploads/2020/09/Climate_Migration_Main_Text__JOP_.pdf
  title: "Changing Tides: Public Attitudes on Climate Migration"
  authors:
    - Sabrina B. Arias
    - Christopher W. Blair

dataset:
  source: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/FDML2N
  access_notes: >
    Harvard Dataverse (doi:10.7910/DVN/FDML2N), CC0, fully open — all 11
    files unrestricted (Dataverse API, checked 2026-10-21; ~12.6 MB in
    total).  Analysis code is a single R script (Migration_Analysis_Final.R,
    ~3,700 lines); the Qualtrics survey exports ship as Dataverse-ingested
    .tab (tab-separated) files whose originals were .csv, alongside four
    cjoint design files (.dat) and a German state key.  No table output,
    logs or .RData ship with the package.

original_claims:
  - description: amce_drought_us
    value: 0.035
    claim_type: coefficient
    standard_error: 0.012
    sample_size: 18966
    unit: change in probability profile is preferred
    location: "Table 2, U.S. Sample, Reason for Migration: Drought"
    context: >
      Table 2 ("Main Average Marginal Component Effects (Compared to
      Baseline Levels)"), U.S. sample, row Reason for Migration: Drought.
      Choice-based conjoint experiment fielded with Dynata on a nationally
      representative online U.S. sample; respondents saw nine pairs of
      randomized migrant profiles varying on seven attributes (reason for
      migration, language fluency, gender, occupation, religion, origin,
      vulnerability; Table 1) and indicated their preference for admitting
      one of the two migrants for settlement in their state.  Estimand:
      the average marginal component effect (AMCE), the average change in
      the probability that a migrant profile is preferred when it features
      the level rather than the baseline (economic opportunity), from the
      full model with all seven attributes on all profile pairs (the left
      panel of Figure 1).  Robust standard errors clustered by respondent.
  - description: amce_flooding_us
    value: 0.037
    claim_type: coefficient
    standard_error: 0.012
    sample_size: 18966
    unit: change in probability profile is preferred
    location: "Table 2, U.S. Sample, Reason for Migration: Flooding"
    context: >
      Table 2, U.S. sample, row Reason for Migration: Flooding.  Same
      full-model AMCE as amce_drought_us (all seven attributes, all
      profile pairs, baseline economic opportunity, respondent-clustered
      robust standard errors).
  - description: amce_wildfires_us
    value: 0.040
    claim_type: coefficient
    standard_error: 0.011
    sample_size: 18966
    unit: change in probability profile is preferred
    location: "Table 2, U.S. Sample, Reason for Migration: Wildfires"
    context: >
      Table 2, U.S. sample, row Reason for Migration: Wildfires.  Same
      full-model AMCE as amce_drought_us (baseline economic opportunity,
      respondent-clustered robust standard errors).
  - description: amce_persecution_us
    value: 0.076
    claim_type: coefficient
    standard_error: 0.012
    sample_size: 18966
    unit: change in probability profile is preferred
    location: "Table 2, U.S. Sample, Reason for Migration: Political/religious/ethnic persecution"
    context: >
      Table 2, U.S. sample, row Reason for Migration: Political/religious/
      ethnic persecution.  Same full-model AMCE as amce_drought_us
      (baseline economic opportunity, respondent-clustered robust standard
      errors).
  - description: amce_drought_germany
    value: 0.081
    claim_type: coefficient
    standard_error: 0.012
    sample_size: 18862
    unit: change in probability profile is preferred
    location: "Table 2, German Sample, Reason for Migration: Drought"
    context: >
      Table 2, German sample, row Reason for Migration: Drought.  The same
      conjoint design fielded with Dynata on a nationally representative
      online German sample (factors and levels identical to the U.S.
      survey except that agnostic was replaced with atheist in Germany);
      full-model AMCE with all seven attributes on all profile pairs,
      baseline economic opportunity, robust standard errors clustered by
      respondent.
  - description: amce_flooding_germany
    value: 0.086
    claim_type: coefficient
    standard_error: 0.012
    sample_size: 18862
    unit: change in probability profile is preferred
    location: "Table 2, German Sample, Reason for Migration: Flooding"
    context: >
      Table 2, German sample, row Reason for Migration: Flooding.  Same
      full-model AMCE as amce_drought_germany.
  - description: amce_wildfires_germany
    value: 0.060
    claim_type: coefficient
    standard_error: 0.012
    sample_size: 18862
    unit: change in probability profile is preferred
    location: "Table 2, German Sample, Reason for Migration: Wildfires"
    context: >
      Table 2, German sample, row Reason for Migration: Wildfires.  Same
      full-model AMCE as amce_drought_germany.
  - description: amce_persecution_germany
    value: 0.162
    claim_type: coefficient
    standard_error: 0.013
    sample_size: 18862
    unit: change in probability profile is preferred
    location: "Table 2, German Sample, Reason for Migration: Political/religious/ethnic persecution"
    context: >
      Table 2, German sample, row Reason for Migration: Political/
      religious/ethnic persecution.  Same full-model AMCE as
      amce_drought_germany.
  - description: respondents_us
    value: 1086
    claim_type: other
    unit: respondents
    location: "Study 1: Empirical Design (text)"
    context: >
      Number of U.S. respondents in the conjoint experiment (the
      nationally representative online sample fielded with Dynata), as
      stated in the Study 1 design section.
  - description: respondents_germany
    value: 1074
