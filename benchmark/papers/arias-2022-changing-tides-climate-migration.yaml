notes: >
  Headline finding: climate migrants occupy an intermediate position in public
  preferences — more supported than economic migrants, less than refugees.  In
  the US conjoint, migrants displaced by droughts, floods, and wildfires are
  respectively ~3.5, 3.7, and 4.0 percentage points more likely to be
  preferred than economic migrants (AMCE; nationally representative US and
  German samples, N~2,160).

  Promoted from the I4R First Meta Database (replication report team 12) via
  scripts/import_i4r_candidates.py.  On holdout: touched only to confirm that
  a dev-set prompt improvement generalises.

  Curation pass (2026-10-21).  Pinned 12 claims: the eight Table 2 AMCEs
  of the focal attribute (drought, flooding, wildfires, persecution vs
  economic opportunity, U.S. and German samples), each with its SE in
  standard_error (SEs are not separate claims, as in bisbee-2022 and
  alesina-2022; separate SE claims would push the entry past 12), and the
  four design-section counts (1,086 / 1,074 respondents; 18,966 / 18,862
  choice tasks).  Every AMCE and SE is printed to three decimal places.
  The abstract's 2,160 respondents is the sum of the two respondent
  claims and is not pinned separately.

  What was read.  The author PDF (conditionally accepted, 2020-09-29;
  Table 1 design, Table 2 AMCEs, text); the Kleinman Center digest of
  December 2019 (for the first-public date); the Dataverse API metadata;
  the whole package, downloaded to a scratch directory (never committed);
  the R script's Study 1 sections; the meta-database's 8 rows.

  What could not be verified.  (1) The published JOP Table 2: the journal
  PDF is paywalled and the SSRN copy is blocked, so the pinned values are
  the conditionally-accepted author text's; the package was deposited two
  days later (2020-10-01), so the numbers are very likely final, but this
  is unconfirmed.  (2) The AMCEs against package output: the package
  ships no tables or logs, and the code was not run.  (3) The SSRP #791
  report itself (host unreachable); the verdict comes from the
  meta-database's survey fields.

  Counts cross-check.  A raw count over the package's .tab exports
  (respondents with at least one answered forced-choice item; two
  profiles per answered task) gives 1,074 respondents / 18,862 profiles
  for Germany, exactly the paper's, and 1,086 respondents / 18,970
  profiles for the U.S.  The script reshapes to one row per profile with
  cjoint::read.qualtrics and then keeps rows 5 onward for the U.S.
  (cjt_us_data[5:nrow(cjt_us_data), ], line ~172), dropping four profile
  rows (18,970 - 4 = 18,966, the paper's figure) without dropping a
  respondent; Germany drops rows with a missing choice (line ~784).  So
  the paper's "unique choice tasks" counts profile rows (two per pairing),
  and the U.S. 18,966 depends on an undocumented four-row drop a
  reproducer following the paper cannot know about: choice_tasks_us
  (and, marginally, the U.S. AMCEs) may come out on 18,970.

  Package structure (package-only facts; never in contexts).  One script,
  Migration_Analysis_Final.R, with a hard-coded Windows setwd() and a
  memory.limit() call, set.seed(8675309), and libraries tidyverse,
  xtable, ggplot2, ggpubr, corrplot, car, splines, readxl, stargazer,
  psych, lemon, boot, cjoint, cregg, margins, FindIt.  Table 2 comes from
  cjoint::amce(selected ~ Gender + Language.Fluency + Occupation + Origin
  + Reason.for.migration + Religion + Vulnerability, cluster = TRUE,
  respondent.id = 'Response.ID', design = <design file>, baselines = ...)
  printed through xtable(digits = 3): U.S. at lines ~243-261
  (cjt_us_results, design conjoint_design.dat, baseline 'Economic
  opportunity'), Germany at lines ~897-920 (cjt_ger_results, design
  conjoint_design_german2.dat, German level labels, baseline
  'Wirtschaftliche Perspektive', columns renamed by position).  The data
  are read with cjoint::read.qualtrics(new.format = TRUE, respondentID =
  "ResponseId", responses = force_choice, Q184 ... Q198) from the original
  Qualtrics .csv names ("Climate Migration 2_ Conjoint- USA_September 10,
  2019_08.56.csv", "... Germany_September 11, 2019_02.58.csv"), but
  Dataverse serves ingested .tab by default (the .csv originals need
  ?format=original); each export keeps Qualtrics' two metadata rows under
  the header.  The design files encode the randomization restrictions
  (the internal-migrant .dat variants constrain origin), which the paper
  does not describe; a reproducer that ignores them estimates unweighted
  AMCEs, which can differ slightly.  Other files: Study 2 factorial data
  (usclimate_exp1.tab, "Climate Migration 1_ Article- Germany ... .tab"),
  the 2020 follow-up survey ("Migration Follow-Up_August 1, 2020 ...
  .tab"), and germany_state_key.tab.  No .tex, .log or .RData outputs:
  the independent-mode script-free copy carries no answers.

  Left out.  The other Table 2 rows (language, gender, occupation,
  religion, origin, vulnerability), the marginal-means ranges in the text
  (0.45-0.48 / 0.48-0.53 / 0.53-0.60, from a figure, not tabulated),
  internal/international subset AMCEs (Figure 1 middle/right, appendix),
  and all of study 2 (null priming effects, appendix tables only).

  First run 2026-10-21 (Phase 3.2 evaluation pass; main 0492c17, after
  the content-aware strip rule and the printed-precision floor; Opus
  4.7, 47-package image, LLM cache on, --mode all, one run per mode;
  eval-7papers-all-modes-2026-10-21.json).  Seeded 4 / 12 (first scored
  4; 1 error + 1 claim refinement): only the four counts.  The model
  reshaped the Qualtrics exports and estimated the AMCEs with feols
  clustered by respondent rather than the package's cjoint::amce with
  the design's randomisation constraints; the AMCEs come out ~1.5-2x too
  large (0.069 vs 0.035) and one German attribute level failed a label
  regex (NA).  The 3,700-line package script with hard-coded Windows
  paths was in the prompt; the model rewrote rather than translated, so
  the seeded vs independent gap is undefined for this paper.
  Independent 0 / 12 (first scored 0; 3 error + 3 claim refinements):
  AMCEs near zero, respondents 1,033 / 1,029.  Blind 1 / 12 (first
  scored 1; 1 error repair): AMCEs again ~2x too large,
  amce_flooding_germany (0.091 vs 0.086) inside its SE band.  Most
  expensive paper of the pass ($2.44 for three modes).
