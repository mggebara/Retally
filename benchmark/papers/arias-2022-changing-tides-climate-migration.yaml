notes: >
  Headline finding: climate migrants occupy an intermediate position in public
  preferences — more supported than economic migrants, less than refugees.  In
  the US conjoint, migrants displaced by droughts, floods, and wildfires are
  respectively ~3.5, 3.7, and 4.0 percentage points more likely to be
  preferred than economic migrants (AMCE; nationally representative US and
  German samples, N~2,160).

  Promoted from the I4R First Meta Database (replication report team 12) via
  scripts/import_i4r_candidates.py.  On holdout: touched only to confirm that
  a dev-set prompt improvement generalises.
