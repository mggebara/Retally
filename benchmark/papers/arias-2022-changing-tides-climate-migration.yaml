  - description: choice_tasks_us
    value: 18966
    claim_type: other
    unit: choice tasks (profiles)
    location: "Study 1: Empirical Design (text)"
    context: >
      Number of "unique choice tasks" the design section reports for the
      U.S. sample: the observations entering the U.S. AMCE estimation (one
