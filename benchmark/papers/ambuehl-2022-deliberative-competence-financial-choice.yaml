notes: >
  Headline findings: the Treatment raises compound-interest test scores by
  1.442 (0.194) correct answers in Experiment A and 1.601 (0.143) in
  Experiment B (Table 4 cols 1-2), and lowers scores on the control
  module by -1.058 (0.146) and -0.374 (0.141) (cols 3-4); N 215 (A) and
  348 (B).  Deliberative competence (Table 7, both delays): Experiment A
  Control -24.448 (1.633), Treatment -22.864 (1.741), Substance-Only
  -22.012 (1.433), Rhetoric-Only -19.797 (1.406), N 4,550; Experiment B
  Control -25.673 (1.357), Treatment -18.569 (1.177), i.e. a 7.1-point
  gain only with practice and feedback.

  Paper text and how it was verified.  The published AER article could not
  be read (paywalled; the ZORA open-access copy is behind an Anubis
  bot-protection challenge, CEPR DP15863 behind Cloudflare; neither was
  circumvented).  The catalog source is NBER WP 20618, revised March 2022.
  Its Table 4 equals the published Table 4 in every cell checked: the
  four Difference coefficients and SEs equal the meta-database's
  o_coeff_dbl / o_std_err_dbl for "table 4" (1.442/0.194, 1.601/0.143,
  -1.058/0.146, -0.374/0.141), and every Control / Treatment / Difference
  cell and both Observations cells equal DP110 Table 1's "Original"
  columns, which reproduce the published table.  Its Table 7 equals DP110
  Table 4 ("precisely replicate the results as reported in the paper") in
  every level, SE, p-value, Observations and Subjects cell of all six
  columns, and the twelve meta-database "table 7" values (no SEs) are the
  Treatment / Substance-Only / Rhetoric-Only minus Control differences of
  those levels in columns 1-6 (1.584, 7.104, 2.436, 4.651, 1.117, 7.504,
  2.819, 3.885, 2.051, 6.704, 2.053, 5.417), all exact.  The WP thanks
  the editor (Stefano DellaVigna) and referees; its table numbering
  matches the package README's map of published Tables 4-11.  The
  published abstract is reworded relative to the WP's.  Contexts use the
  WP's wording.  The WP prints Table 4's SEs only as "Standard errors in
  parentheses"; DP110 (fn. 1) notes the code clusters by subject, which
  with one observation per subject equals heteroskedasticity-robust SEs.

  Curation pass (2026-11-09).  13 claims.  Left out: Table 4's Control and
  Treatment level rows, Table 7 columns 3-6 (36- and 72-day delays
  separately) and its p-value rows, Table 5 (valuations in the complex
  frame; not covered by the meta-database or DP110, so unverified), Table
  6 (rhetoric vs substance), Tables 9-11 (simple-frame valuations,
  corrected and quartile versions of Table 7) and all appendix tables.

  Package-only facts (never in contexts).  dataManagementExpA.do insheets
  the eight expAbatch CSVs (drop if id == 1 in each, drop if help_test
  missing), builds each price list's switch point,
  flags multi-switching (multi), and collapses to subject-by-task
  valuations; dataManagementExpB.do does the same for Experiment B.
  analysis.do builds discount_unframed = v_unframed/amount*100 and
  discount_framed = v_framed/amount_precise*100 (the complex-frame
  valuation over the exact compounded amount, "our analysis controls for
  these differences" in the paper), absDiff = |framed - unframed|, keeps
  multi == 0.  Table 4: reg score_compounding / score_indexing Full if
  tag == 1 & (Full|Control) & sample == "old" (A) or (fullNew|contNew) &
  sample == "new" (B), cl(id).  Table 7: negAbsDiff = -absDiff; reg
  negAbsDiff Control Full Rule72 Rhetoric if sample == "old", nocons
  cl(id) (Rule72 is the Substance-Only arm); reg negAbsDiff Control Full
  if sample == "new", nocons cl(id); cols 3-6 add delay == 72 / 36.  The
  package's sqDiff is still abs(framed^2 - unframed^2)/100, the coding
  error DP110 reports (appendix-only).  The README says Stata 16, under 10
  minutes; master.do's cd points at the authors' Dropbox ("AER 2/Round
  3/REPLICATION PACKAGE V2").

  Blind-mode exposure (step 6, 2026-11-09).  The blind generation prompt
  states no pinned value or SE, as printed or rounded to 3 significant
  figures; its 1-2 figure matches are column names (switch19, T20) and
  file sizes (1.4 MB, 200 KB).  It carries no script text.  The
  methodology summariser and hyperparameter extractor get the full paper
  text, as for every entry, and the paper prints Table 4 and Table 7 and
  rounded forms of some targets in prose ("-24.4%", "-25.7%", "-18.6%",
  "1.4 additional correct answers", "differences of 1.06 and 0.37
  questions"); the README's blind-mode caveat covers this.  The paper
  parser takes the WP cover line "EVALUATING DELIBERATIVE COMPETENCE:" as
  the title.

  What was read.  NBER WP 20618 (March 2022 revision) Sections 1-2 and
  Tables 1-7 in full; DP110 in full; the 51 meta-database rows;
  readMe.pdf; master.do, setup.do, the Table 4 and Table 7 blocks of
  analysis.do and the multiple-switching parts of dataManagementExpA.do;
  the strip-rule classification of the extracted package.

  What could not be verified.  The published article itself (pages, table
  notes, final wording) was not read.  Table 4's Control / Treatment level
  rows and Table 7's SEs are checked against DP110's recomputation (which
  the DP states equals the published paper), not against the published
  page.  The authors' Stata code was not run (no Stata here) and no
  independent R cross-check was made in this pass.

  Original analysis in Stata 16 (outreg2, distplot); language: r is the
  reproduction target.
