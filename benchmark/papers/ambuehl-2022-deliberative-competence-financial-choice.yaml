# Original paper: Ambuehl, S., Bernheim, B. D., & Lusardi, A. (2022).
#   "Evaluating Deliberative Competence: A Simple Method with an
#   Application to Financial Choice." American Economic Review, 112(11),
#   3584-3626.  doi:10.1257/aer.20210290 (November 2022 issue; Crossref
#   created 2022-10-26, issued 2022-11-01).  I4R tag T28.
#
# Reproduction report: Dao, C. D., Fenig, G., Sator, G., & Yoon, J. Y.
#   (2024). "Assessing Robustness to Varying Clustering Methods and
#   Samples in Ambuehl, Bernheim, and Lusardi (2022): Replication and
#   Sensitivity Analysis." I4R Discussion Paper No. 110 (April 2024; the
#   DP's own title page is dated May 5, 2023; EconStor hdl:10419/289580;
#   I4R First Meta Database replicator team 28, 51 rows).  Not listed in
#   the candidates file or corpus/openicpsr-wanted.md; found 2026-11-09 in
#   the EconPapers listing of RePEc:zbw:i4rdps (No. 110).  Verdict:
#   reproducible — Sec. 2.1, "the provided codes were functional and
#   produced consistent results as with the original paper"; Sec. 2.4,
#   "we are able to precisely replicate the results as reported in the
#   paper"; the conclusion, "we successfully replicate the findings
#   obtained from the main regressions".  The DP prints its own
#   recomputation of the two tables pinned here: DP Table 1, columns
#   labelled "Original" (paper Table 4, every Control / Treatment /
#   Difference cell and Observations identical to the paper) and DP Table
#   4 ("Replication for Table 7", every level, SE and Observations cell
#   identical).  It notes one coding error that does not touch the pinned
#   tables: the do-file's squared distance metric is (r_c^2 - r_s^2)/100
#   instead of (r_c - r_s)^2/100, used only in Online Appendix robustness
#   tables (D.5-D.7); the authors were informed and adjusted those.  The
#   meta-database's best_describe_compreprod agrees ("Analysis and
#   cleaning code produce the same output as presented in the paper");
#   its why_not_perfect_repro mentions the one mis-computed measure.  The
#   DB's 49 rows with a replicator value are robustness variants, not
#   plain recomputations: k-medoids clusters (DP Tables 2, 6), jackknife
#   (DP Tables 3, 5), multiple switchers included (DP Table 1 "Modified",
#   e.g. 1.479 (0.137) vs 1.601 (0.143); the DB writes 1.470), and for
#   Table 7 the Treatment-minus-Control differences, which those variants
#   leave unchanged.  Two DB rows filed under "table 1, column 3"
#   (-1.241 (0.184), 1.226 (0.132)) match no cell of the paper text read
#   here or of DP110 and are not used.
#
# Why this paper:
#   1. An online experiment whose package ships only the raw Qualtrics
#      exports (ten CSV batches, 668-779 columns each): the reproduction
#      has to rebuild valuations from iterated multiple price lists, drop
#      multiple switchers and pair simply and complexly framed tasks before
#      any regression runs.
#   2. A new outcome metric (deliberative competence, minus the absolute
#      gap between paired valuations) estimated as arm means with
#      subject-clustered SEs, beside conventional test-score regressions.
#   3. A small manually placed openICPSR package (data_access: manual).
#
# What original_claims pins: Table 4 (exam-style test scores), the
#   Treatment-minus-Control difference in all four columns with SEs and
#   the two experiments' subject counts; Table 7 (deliberative
#   competence), column 1's four arm levels (Experiment A) and column 2's
#   two arm levels (Experiment B) with SEs, and column 1's observation
#   count.  13 claims, values exactly as printed (3 decimals).
#
# Paper text: the published article is paywalled (AEA PDF), and the
#   open copy the candidates file lists, the University of Zurich
#   repository's ZORA 227304 file aer.20210290.pdf, cannot be read by
#   scripts: the 200 response is not a PDF but a 2 KB HTML page from the
#   Anubis bot-protection proxy ("Oh noes! ... Access Denied", proof-of-work
#   challenge), which was not attempted further.  CEPR DP15863 (March 2021)
#   answers a Cloudflare block.  The source is the open NBER Working Paper
#   20618, "October 2014, Revised March 2022" (the post-acceptance
#   revision, thanking the editor): its Table 4 and Table 7 print the
#   published numbers for every pinned claim, verified cell by cell
#   against DP110's recomputations and the meta-database (see notes).

id: ambuehl-2022-deliberative-competence-financial-choice
i4r_report_url: https://www.econstor.eu/bitstream/10419/289580/1/I4R-DP110.pdf
# Target language for regeneration (the original is Stata 16 with
# outreg2; Retally generates R and reads the raw Qualtrics CSVs).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  publication_date is the FIRST public
# version: NBER Working Paper 20618 (NBER page citation_publication_date
# 2014/10/27, "Issue Date October 2014"; revised March 2022).  The 2014
# version predates Experiment B (run October 2018), so its numbers differ;
# the March 2022 revision and CEPR DP15863 (March 2021) followed.  The
# journal version: Crossref created 2022-10-26, issued 2022-11-01.
# package_release_date is the DataCite registration of
# doi:10.3886/E171681V1 (registered 2022-10-20T17:16:33Z, DataCite API
# 2026-11-09; V2 and V3 DOIs answer 404, so V1 is the only version).
publication_date: "2014-10"
package_release_date: "2022-10-20"

paper:
  # NBER Working Paper 20618, "October 2014, Revised March 2022", open
  # PDF; checked 2026-11-09: 200 application/pdf, 109 pp., 2,414,222
  # bytes, md5 799ac686048a213923703110258905dd (PDF CreationDate
  # 2022-02-24).  A working-paper version, not the typeset article: the
  # published abstract is reworded, but the table numbering matches the
  # published article (the package README maps Tables 4-11 to the same
  # outputs) and Tables 4 and 7 print the published values (see notes).
  source: https://www.nber.org/system/files/working_papers/w20618/w20618.pdf
  title: "Evaluating Deliberative Competence: A Simple Method with an Application to Financial Choice"
  authors:
    - Sandro Ambuehl
    - B. Douglas Bernheim
    - Annamaria Lusardi

dataset:
  source: benchmark/manual-packages/T28/171681-V1.zip
  data_access: manual
  access_notes: >
    AEA Data and Code Repository on openICPSR, project 171681, version V1
    (doi:10.3886/E171681V1); login and terms-of-use click-through required,
    so the zip was downloaded by hand (2026-11-09) and placed unchanged at
    benchmark/manual-packages/T28/171681-V1.zip (1,127,520 bytes, md5
    6d0692362cd22dc693edb160c538fee8; SOURCE.txt beside it).  V1 is the
    only version.  21 entries (16 files, 5 directories), 27.8 MB
    uncompressed, all deflate, no nested archives.  readMe.pdf (3 pp.,
    titled "REPLICATION PACKAGE V2 ReadMe", dated 2022-08-17; data
    availability, Stata 16, the do-files, a dataset list and a
    table-to-line-number map; no estimates).  data/raw/: the raw Qualtrics
    exports, expAbatch1-8.csv (Experiment A, eight sessions, 668-669
    columns) and expBbatch1-2.csv (Experiment B, two sessions, 779 columns,
    21 MB together); no .dta ships (the README lists the CSVs under data/,
    they sit in data/raw/).  doFiles/: master.do, setup.do (ssc install
    outreg2, distplot), dataManagementExpA.do, dataManagementExpB.do and
    analysis.do.  graphs/ and tables/ are empty directories; no logs,
    tables or figures ship.  The script-free copy (independent / blind)
    withholds the 5 do-files by suffix
    (benchmark.strip_rule.classify_tree on the extracted package,
    2026-11-09); the 10 CSVs and readMe.pdf stay, none printing a pinned
    value.  Project page:
    https://www.openicpsr.org/openicpsr/project/171681/version/V1/view

original_claims:
  # ---- Table 4: performance in the exam-style test ----
  - description: test_score_compounding_treatment_minus_control_expA_table4_col1
    value: 1.442
    claim_type: coefficient
    standard_error: 0.194
    unit: correct answers out of 5 (compound-interest questions)
    location: "Table 4, column (1) Test score compounding, Experiment A, Difference"
    context: >
      Table 4 ("Performance in exam-style test"), column (1).  OLS
      regression of the number of correct answers on the five incentivized
      exam-style questions about compound interest on a Treatment
      indicator, Experiment A, Treatment and Control conditions only (the
      Substance-Only and Rhetoric-Only arms are excluded), one observation
      per subject; the sample is subjects who completed the study and did
      not switch more than once in any price list.  The entry is the
      Difference row (Treatment minus Control).  Standard errors in
      parentheses.
  - description: test_score_compounding_treatment_minus_control_expB_table4_col2
    value: 1.601
    claim_type: coefficient
    standard_error: 0.143
    unit: correct answers out of 5 (compound-interest questions)
    location: "Table 4, column (2) Test score compounding, Experiment B, Difference"
    context: >
      Table 4, column (2): the column (1) regression of the
      compound-interest test score on the Treatment indicator for
      Experiment B (Treatment with practice and feedback vs. a portfolio
      diversification Control), one observation per subject, multiple
      switchers excluded.  The entry is the Difference row (Treatment
      minus Control).  Standard errors in parentheses.
  - description: test_score_control_module_treatment_minus_control_expA_table4_col3
    value: -1.058
    claim_type: coefficient
    standard_error: 0.146
    unit: correct answers out of 5 (control-module questions)
    location: "Table 4, column (3) Test score control module, Experiment A, Difference"
    context: >
      Table 4, column (3): the same OLS regression with the score on the
      five exam-style questions about the material of the Control
      intervention (index funds in Experiment A) as the outcome, Experiment
      A Treatment and Control subjects, multiple switchers excluded.  The
      entry is the Difference row (Treatment minus Control).  Standard
      errors in parentheses.
  - description: test_score_control_module_treatment_minus_control_expB_table4_col4
    value: -0.374
    claim_type: coefficient
    standard_error: 0.141
    unit: correct answers out of 5 (control-module questions)
    location: "Table 4, column (4) Test score control module, Experiment B, Difference"
    context: >
      Table 4, column (4): the score on the five questions about the
      Control intervention's material (portfolio diversification in
      Experiment B) regressed on the Treatment indicator, Experiment B
      subjects, multiple switchers excluded.  The entry is the Difference
      row (Treatment minus Control).  Standard errors in parentheses.
  - description: n_obs_table4_expA_cols1_3
    value: 215
    claim_type: count
    unit: subjects
    location: "Table 4, Observations, columns (1) and (3), Experiment A"
    context: >
      Number of observations in Table 4, columns (1) and (3): Experiment A
      subjects in the Treatment and Control conditions who completed the
      study and did not switch more than once in any price list, one
      observation per subject.
  - description: n_obs_table4_expB_cols2_4
    value: 348
    claim_type: count
    unit: subjects
    location: "Table 4, Observations, columns (2) and (4), Experiment B"
    context: >
      Number of observations in Table 4, columns (2) and (4): Experiment B
      subjects (Treatment and Control) who completed the study and did not
      switch more than once in any price list, one observation per
      subject.

  # ---- Table 7: deliberative competence ----
  - description: deliberative_competence_control_expA_table7_col1
    value: -24.448
    claim_type: coefficient
    standard_error: 1.633
    unit: percentage points of the future reward (minus the absolute valuation gap)
    location: "Table 7, column (1) both delays, Experiment A, Levels, Control"
    context: >
      Table 7 ("Deliberative Competence"), column (1).  OLS regression,
      without a constant, of deliberative competence on indicators for
      the four Experiment A conditions (Control, Treatment, Substance-Only,
      Rhetoric-Only), so each coefficient is a condition's mean level.
      Deliberative competence for a subject and a pair of equivalent
      valuation tasks (same future reward and delay, 36 or 72 days) is
      minus the absolute difference between the complexly framed and the
      simply framed valuation, each expressed as a percentage of the
      future reward (0 to 100); one observation per subject and task pair,
      both delays pooled, all Experiment A subjects who did not switch
      more than once in any price list.  The entry is the Control level.
      Standard errors clustered by subject.
  - description: deliberative_competence_treatment_expA_table7_col1
    value: -22.864
    claim_type: coefficient
    standard_error: 1.741
    unit: percentage points of the future reward (minus the absolute valuation gap)
    location: "Table 7, column (1) both delays, Experiment A, Levels, Treatment"
    context: >
      Table 7, column (1): the same no-constant regression of deliberative
      competence on the four Experiment A condition indicators (both
      delays, subject-clustered standard errors).  The entry is the
      Treatment level (the full financial education video without practice
      and feedback).
  - description: deliberative_competence_substance_only_expA_table7_col1
    value: -22.012
    claim_type: coefficient
    standard_error: 1.433
    unit: percentage points of the future reward (minus the absolute valuation gap)
    location: "Table 7, column (1) both delays, Experiment A, Levels, Substance-Only"
    context: >
      Table 7, column (1): the Substance-Only level (the video's
      substantive material without the rhetoric) from the no-constant
      regression of deliberative competence on the four Experiment A
      condition indicators, both delays, standard errors clustered by
      subject.
  - description: deliberative_competence_rhetoric_only_expA_table7_col1
    value: -19.797
    claim_type: coefficient
    standard_error: 1.406
    unit: percentage points of the future reward (minus the absolute valuation gap)
    location: "Table 7, column (1) both delays, Experiment A, Levels, Rhetoric-Only"
    context: >
      Table 7, column (1): the Rhetoric-Only level (the video's rhetorical
