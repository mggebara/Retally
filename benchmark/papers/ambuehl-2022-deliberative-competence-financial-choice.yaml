      the same Experiment A regression, both delays, standard errors
      clustered by subject.
  - description: deliberative_competence_control_expB_table7_col2
    value: -25.673
    claim_type: coefficient
    standard_error: 1.357
    unit: percentage points of the future reward (minus the absolute valuation gap)
    location: "Table 7, column (2) both delays, Experiment B, Levels, Control"
    context: >
      Table 7, column (2): no-constant OLS regression of deliberative
      competence (minus the absolute gap between paired complexly and
      simply framed valuations, percentage points of the future reward) on
      the two Experiment B condition indicators, one observation per
      subject and task pair, both delays, Experiment B subjects who did not
      switch more than once.  The entry is the Control level (portfolio
      diversification module).  Standard errors clustered by subject.
  - description: deliberative_competence_treatment_expB_table7_col2
    value: -18.569
    claim_type: coefficient
    standard_error: 1.177
    unit: percentage points of the future reward (minus the absolute valuation gap)
    location: "Table 7, column (2) both delays, Experiment B, Levels, Treatment"
    context: >
      Table 7, column (2): the Treatment level (the compound-interest
      education with practice problems and automated feedback) from the
      same Experiment B regression, both delays, standard errors clustered
      by subject.
  - description: n_obs_table7_expA_col1
    value: 4550
    claim_type: count
    unit: subject-by-task-pair observations
    location: "Table 7, Observations, column (1) Experiment A"
    context: >
      Number of observations in Table 7, column (1): subject-by-task-pair
      observations (both delays) of all four Experiment A conditions,
      multiple switchers excluded.

