notes: >
  Headline finding: bill-level evidence from the 101st-111th U.S. House
  that, after addressing the selection of women into districts (close-
  election RD and inverse-propensity-score weighting), Democratic women
  recruit no more cosponsors than Democratic men but fewer from the
  opposite party, while Republican women recruit more cosponsors and
  more bipartisan support (Table 5).  DP75 reproduces the table exactly
  and finds it largely robust to amended controls and member-level
  clustering; extending to 2011-2020 removes the Republican
  bipartisanship gap and strengthens the overall gender gap in number
  of cosponsors.

  Original analysis in Stata 16.1 (README: reghdfe 5.7.3, rdrobust
  8.1.0, rddensity 2.3, DCdensity 2009, all vendored in Adofiles/);
  language: r is the reproduction target.

  Curation pass (2026-10-21).  Pinned 13 claims, all from Table 5 (the
  exhibit every I4R row refers to): nine female-sponsor coefficients
  with their SEs — Panel A (number of cosponsors): all sponsors OLS,
  Republicans OLS / RD+IPW / full-sample IPW with sponsor
  characteristics; Panel B (percent cosponsors of opposite party):
  Democrats OLS / RD / full-sample IPW with sponsor characteristics,
  Republicans OLS / full-sample IPW without sponsor characteristics —
  and four column-1 counts: bills in Panel A All (60,670), sponsor-
  Congress clusters in Panel A All (4,746), bills in Panel B Democrats
  (32,846) and Republicans (27,669).  The mix covers all three
  estimators (OLS, RD at a data-driven bandwidth, inverse-propensity
  weighting inside and outside the bandwidth).  Every pinned value is
  identical in the meta-database (o_coeff / o_std_err), DP75 Table A1,
  and the package's Output/Table5_TopPanel_Cosponsors.xls and
  Table5_BottomPanel_PctCosponsorsOpposite.xls.  Optimal bandwidths
  (25/30/13 in Panel A, 16/24/11 in Panel B, All/Dem/Rep) are printed
  in the table and given in the RD contexts; they are not pinned.

  PDF version vs published.  The PDF is NBER WP 22488 (August 2016).
  Its Table 5 has the same number, title ("RD and PS Matching
  Estimates"), panels, rows and columns as the published Table 5 (DP75
  Table A1 reprints the published one).  Differences: (a) column 3
  Republicans in both panels — WP 6.857* (3.912), 1,227 bills, 100
  sponsors and 5.038 (3.850), 1,043, 88; published 6.734* (3.946),
  1,200, 98 and 4.428 (3.737), 1,016, 86 (the package reproduces the
  published values; the WP's column-3 Republican sample is 27 bills / 2
  sponsors larger in each panel, consistent with the propensity-score
  step dropping observations in the published version); (b) column
  labels — the WP calls columns 3-5 "RD - optimal bandwidth with PS
  matching" and "PS matching - full sample", the published table
  "inverse PS-weighting"; the WP text (section 7.1) describes the same
  inverse-propensity-score weighting.  All other 28 coefficients, SEs
  and counts are identical.  No pinned value other than claim 2 is in
  a differing cell.  Table numbering of the other exhibits was not
  checked against the EJ article (paywalled), and none is pinned.

  What was read.  The NBER WP (all of sections 6-7, Tables 2-5 and the
  Table 5 notes); DP75 (all 28 pp., EconStor); the meta-database's 123
  rows for the paper (team 32); the Zenodo API metadata; the package
  README.pdf; Dofiles/Table5.do and master.do; the shipped Table 5 .xls
  output; the column list of the analysis file.

  How the printed numbers are produced (package-only; never in
  contexts).  Dofiles/Table5.do on
  Data/AnalysisData/bills_analysis_101-111_replication.dta (63,895
  bills; keep if private==0 leaves 62,349; the regression samples are
  smaller through missing controls).  Outcomes: numb_cosponsors and
  pct_cosponsors_opposite, which the do-file RECOMPUTES as
  100*numb_cosponsors_opposite/(numb_cosponsors+1) (set to missing above
  100), overwriting the column of the same name in the data.  Regressor
  sponsor_female; Congress FE i.v2; party samples sponsor_party==100
  (Democrats) / 200 (Republicans); tag_bill==1 (one row per v2 x
  HRnumber).  Bill characteristics i.minor house_*; sponsor
  characteristics sponsor_democrat, sponsor_rookie (tenure==1),
  sponsor_tenure_run, sponsor_age (set missing if >100), leader
  (comc|comr), ivycoll, black, occ0-occ4, borninstate, tot_bills (bills
  per sponsor-Congress); district characteristics NE MW WE, pct_black,
  pct_urban, pct_for_born, pct_age_over65, lninc, lnpden = lnpop -
  lnarea.  Clusters group_sponsor = group(v2 sponsor_state_abbrev
  sponsor_district sponsor_term_served); reg ..., robust
  cluster(group_sponsor).  Bandwidth: rdbwselect_2014 depvar MV1_female,
  c(0) kernel(uniform), e(h_CCT) (the vendored 2014 CCT selector, on
  bill-level rows).  Column 2: reg on sponsor_female MV1_female
  femaleXMV1_female i.v2 within abs(MV1_female)<=h, on the e(sample) of
  a preliminary mixed_gender_election==1 regression with all controls.
  Column 3: probit sponsor_female on i.v2 + district characteristics
  (one row per sponsor, within h), weights 1/p or 1/(1-p), weighted
  regression adds i.minor house_*.  Columns 4-5: probit on i.v2 +
  district characteristics + absMV (= abs(MV1_democrat)) (+ sponsor
  characteristics in col 5) on the full sample, [aw=wt] regression of
  the outcome on sponsor_female i.v2 i.minor house_*.  "n. sponsors" is
  e(N_clust).

  Benchmark implications.  The RD columns depend on reproducing
  Stata's rdbwselect_2014 bandwidth (CCT 2014, uniform kernel) in R;
  current rdrobust::rdbwselect implements the later selectors, so the
  bandwidth (and hence claims 2 and 5) may not be reproducible exactly
  without porting the 2014 routine.  The OLS and full-sample IPW claims
  need only fixest with weights.  Script-free copy (blind render,
  2026-10-21): 128 files withheld — 20 .do, 22 .log, 41 Adofiles
  (.ado/.mata/.mo/.sthlp by suffix, smcl or Stata content) and 61
  __MACOSX ._* stubs — but NONE of Output/: the legacy-Excel
  Output/Table5_TopPanel_Cosponsors.xls,
  Table5_BottomPanel_PctCosponsorsOpposite.xls and Table5_Cosponsors.xls
  (every pinned value, to six decimals) stay in the independent / blind
  mount, as do the other tables' .xls/.xlsx and the Appendix C .tex.
  The blind prompt forbids reading result files, but nothing enforces
  it; review independent and blind passes on this entry for reads of
  Output/ until the strip rule handles .xls.  The paper
  text the model sees is the WP, whose column-3 Republican numbers
  differ from the pinned published ones.

  Left out.  Table 5 cells not pinned (the remaining 21 coefficients
  and counts, kept to 13 claims), Tables 1-4 and 6-10, Appendix D and
  the Appendix C simulations; DP75's extended-sample estimates (new
  data, not in the package).
