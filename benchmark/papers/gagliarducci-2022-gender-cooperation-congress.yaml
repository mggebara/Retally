# Original paper: Gagliarducci, S., & Paserman, M. D. (2022). "Gender
#   Differences in Cooperative Environments? Evidence from the U.S.
#   Congress." The Economic Journal, 132(641), 218-257.
#   doi:10.1093/ej/ueab069
#
# I4R report: Bagues, M., Campa, P., & Etingin-Frati, G. (2023). "Gender
#   Differences in Cooperation in the U.S. Congress? An Extension of
#   Gagliarducci and Paserman (2022)." I4R Discussion Paper No. 75
#   (October 2023; I4R First Meta Database replication team 32).
#   Verdict: reproducible.  DP75 reproduces the published Table 5 with
#   the original code and data (its Appendix Table A1, "GP Table 5") and
#   finds no coding mistakes; it then (i) corrects two district controls
#   (population density and median household income are inconsistent
#   with census figures for the 108th-111th Congresses), (ii) clusters by
#   member instead of member-Congress, and (iii) adds Congresses 112-116.
#   "These changes have a relatively minor impact on results."  The
#   meta-database records perfect_reproduction = Yes,
#   computational_reproduction = 1; its 120 coefficient rows are all
#   robustness variants of Table 5 (4 per published cell), none a plain
#   reproduction row.
#
# Why this paper: a regression-discontinuity + inverse-propensity-score
#   paper (Table 5 mixes OLS, close-election RD at a data-driven optimal
#   bandwidth, RD reweighted by an inverse propensity score, and full-
#   sample inverse-propensity weighting), with a complete Stata package
#   whose shipped output matches the published table to the last digit.
#
# IMPORTANT — paper version.  paper.source is NBER Working Paper 22488
#   (August 2016), the only freely downloadable PDF; the EJ article is
#   paywalled.  The WP's Table 5 ("RD and PS Matching Estimates") is the
#   counterpart of the published Table 5 (same number, same two panels,
#   same five columns, same rows) and 28 of its 30 coefficients, all
#   their SEs and all bill/sponsor counts equal the published values.
#   The exception is column 3 (RD reweighted by the inverse propensity
#   score) for Republicans: the WP prints 6.857 (3.912), N 1,227, 100
#   sponsors (Panel A) and 5.038 (3.850), N 1,043, 88 sponsors (Panel
#   B); the published table — the meta-database's o_coeff, DP75 Table
#   A1, and the package's own Output/Table5_*.xls — prints 6.734
#   (3.946), N 1,200, 98 and 4.428 (3.737), N 1,016, 86.  Pinned values
#   are the PUBLISHED ones; claim 2 is one of the two cells that differ,
#   so a run that copies the WP's number fails it.

id: gagliarducci-2022-gender-cooperation-congress
i4r_report_url: https://www.econstor.eu/bitstream/10419/278109/1/I4R-DP075.pdf
# Target language for regeneration (the original and the package are
# Stata 16.1; Retally generates R and reads the .dta / .csv files).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  First public version: NBER WP 22488 and
# IZA DP 10128, both August 2016 (the NBER PDF's creation date is
# 2016-07-29).  EJ: published online 2021-09-20, print issue 2022-01-07
# (Crossref).  Package: Zenodo record 5111360, created / published
# 2021-07-17 (Zenodo API), described as "forthcoming on the Economic
# Journal".
publication_date: "2016-08"
package_release_date: "2021-07-17"

paper:
  # NBER WP 22488 (59 pp.), checked 2026-10-21: 200 application/pdf,
  # %PDF magic; text extracts cleanly with pymupdf (tables come out one
  # cell per line).  A working paper, NOT the published EJ version —
  # see the header comment for the two Table 5 cells that differ.
  source: https://www.nber.org/system/files/working_papers/w22488/w22488.pdf
  title: "Gender Differences in Cooperative Environments? Evidence from the U.S. Congress"
  authors:
    - Stefano Gagliarducci
    - M. Daniele Paserman

