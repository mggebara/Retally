# Original paper: Hanushek, E. A., Kinne, L., Lergetporer, P., &
#   Woessmann, L. (2022). "Patience, Risk-Taking, and Human Capital
#   Investment across Countries." The Economic Journal, 132(646),
#   2290-2307.  doi:10.1093/ej/ueab105
#
# Reproduction report: de Gendre, A., Feld, J., & Salamanca, N. (2023).
#   "A Comment on 'Patience, Risk-Taking, and Human Capital Investment
#   Across Countries' by Hanushek et al. (2021)." I4R Discussion Paper
#   No. 48, July 2023 (I4R First Meta Database replication team 63, rows
#   2751-2845).  Verdict: computationally reproducible with minor
#   discrepancies.  DP 48 re-ran the do-files and reproduced Tables 1-4,
#   "identical to the ones shown in the published paper" apart from
#   formatting (section 2).  The discrepancies are three imprecisions
#   in how the paper describes the Table 1-2 analysis: (1) Table 2's
#   notes list an OECD-country-of-origin dummy that Section 3.1 does not
#   mention; (2) the "country mean" item non-response control of Table
#   1 col 8 / Table 2 col 7 is a country-by-wave mean; (3) "migration
#   status" is two flags, first- and second-generation.  The meta-database
#   records computational_reproduction = 1, perfect_reproduction = No
#   ("Discrepencies between programming and writing in paper").  The
#   schema has no "minor discrepancies" label, so outcome_label is
#   reproducible: every printed number reproduces (as for leeson-2022).
#
# Why this paper:
#   1. Large student-level PISA x GPS regressions: about two million
#      students for Table 1, and a migrant sample with residence-country-
#      by-wave fixed effects for Table 2.  Both use clustered SEs.  It is
#      the largest data set in the catalog (930 MB zip, 5.5 GB unpacked).
#   2. The final analysis data sets ship as .dta and as .csv, so the
#      headline tables need no restricted raw PISA/GPS files.
#   3. The published EJ PDF is open on Hanushek's Stanford site, and DP
#      48 prints the baseline reproductions (Tables A1/A2).
#
# What original_claims pins: Table 1 (cross-country) col 3 patience and
#   risk-taking with SEs, col 1 patience, col 2 risk-taking, col 5
#   (natives) patience and risk-taking, and the col 3 student count;
#   Table 2 (migrant analysis) col 3 patience and risk-taking, col 1
#   patience, col 4 patience and risk-taking, and the col 3 student
#   count.  Every coefficient and SE equals the meta-database's
#   o_coeff_dbl / o_std_err_dbl where a row exists (Table 1 col 3 and
#   Table 2 col 3 are the only original_table values in the database).
#
# Contamination bookkeeping.  The paper first circulated as "Culture and
#   Student Achievement: The Intertwined Roles of Patience and
#   Risk-Taking": NBER WP 27484 and IZA DP 13453 (July 2020), and CRC TRR
#   190 Rationality & Competition DP 249, dated 2020-07-08 (EconPapers).
#   Found by web search 2026-11-02; the EJ's first-page footnote names
#   the earlier title.  publication_date is that working-paper month.
#   EJ: received 2021-03-26, accepted 2021-12-20, Advance Access
#   2021-12-31 (first page); print August 2022.
#   Package: Harvard Dataverse doi:10.7910/DVN/6HXBSD, version 1.0,
#   created 2021-09-30, released 2021-10-04 (Dataverse API releaseTime
#   and DataCite "Available").  It is the only version.  The paper and
#   DP 48 cite the AEA-style openICPSR deposit 10.3886/E153101V2 instead.
#   That deposit has the same title; DataCite registers V1 on 2021-10-21
#   and V2 on 2021-11-12, both later than the Dataverse release, so
#   package_release_date is the Dataverse date.
publication_date: "2020-07"
package_release_date: "2021-10-04"

id: hanushek-2022-patience-risk-human-capital
i4r_report_url: https://www.econstor.eu/bitstream/10419/273433/1/I4R-DP048.pdf
