notes: >
  Pinned values (kept out of every context): Table 1 col 3 patience
  1.226 (0.132) and risk-taking -1.241 (0.184); col 1 patience 0.917
  (0.127); col 2 risk-taking -0.482 (0.261); col 5 natives 1.296 (0.133)
  and -1.320 (0.189), N 1,751,822; full-sample N 1,992,276.  Table 2 col
  3 patience 0.931 (0.116) and risk-taking -0.294 (0.122); col 1 patience
  0.779 (0.115); col 4 patience 1.032 (0.133) and risk-taking -0.449
  (0.140); migrant N 80,398.  All are printed to three decimals.  Left
  out: Table 1 cols 4 and 6-8 and Table 2 cols 2 and 5-9 (other
  preferences, migrants-only and effort controls, language subsamples),
  the subsample-difference rows, R2s, Tables 3-4, the country-level R2
  of Figure 1 (0.672, from a figure), and the appendix.

  Dropped claim: Table 1 col 6 (migrants) patience 0.702 (0.172).  The
  independent cross-check below gives 0.698 (0.169) and risk-taking
  -0.371 (0.221) against the printed -0.370 (0.225), with the same N
  (192,736).  That is within one SE but outside the 2 % band.  The
  cause was not traced (possibly weight precision in the CSV export,
  or collinearity handling of the migration flags).  DP 48 reports the
  Stata run reproduces it.

  What was read.  The published EJ PDF (all 18 pp.: Tables 1-4, text,
  footnotes); I4R DP 48 (EconStor, 20 pp., incl. Tables A1-A3); the
  meta-database's 95 rows; the Dataverse and DataCite API metadata for
  both package DOIs; the whole package listing (downloaded with the
  project downloader to .cache/datasets/, never committed); README.docx;
  0_masterfile.do and the Table 1-2 sections of
  3_analysis_crosscountry.do and 3_analysis_migrants.do; the CSV
  headers.

  Independent cross-check (not the package code: pyfixest on the .csv
  copies of the working data).  It reproduces every pinned value at the
  printed precision.  Table 1 (pisa_full_gps_final.csv, 1,992,276 rows,
  49 countries): col 1 0.917 (0.127); col 2 -0.482 (0.261); col 3 1.226
  (0.132) / -1.241 (0.184); col 5 1.296 (0.133) / -1.320 (0.189), N
  1,751,822.  Table 2 (pisa_full_gps_final_imcoo.csv): col 1 0.779
  (0.115); col 2 0.183 (0.210); col 3 0.931 (0.116) / -0.294 (0.122);
  col 4 1.032 (0.133) / -0.449 (0.140).  pyfixest drops one singleton
  observation (N 80,397); Stata's reg keeps it, hence the printed
  80,398.

  Package structure (package-only facts; never in contexts).  Table 1
  is `reg pv1math patience risktaking female age migra1 migra2 image
  imfemale immigra1 i.wave [pw=wgtc], vce(cluster country)` on
  Data/Working/pisa_full_gps_final.dta.  The dependent variable is
  pv1math, the FIRST plausible value divided by 100, and wgtc is the
  equal-country-weight sampling weight.  Natives are migra0==1
  (migra1/migra2 dropped); migrants are migra0==0.  Table 2 is `reg
  pv1math coo_patience coo_risktaking female age imfemale image
  coo_oecd i.countrywave, vce(cluster coo)` on
  Data/Working/pisa_full_gps_final_imcoo.dta.  It is UNWEIGHTED (no
  pweight; the paper's Table 2 notes do not mention weights), and
  countrywave is the 180 residence-country-by-wave cells.  Column 4
  adds coo_posrecip coo_negrecip coo_altruism coo_trust.  The
  0_masterfile.do path is a hard-coded Windows G:\ drive; outputs go
  to Results\ via outreg2 (ssc).  The full cross-country file is 2.5 GB
  as .dta and 3.0 GB as .csv: a reproduction must read only the needed
  columns (haven col_select / data.table select) or memory will be the
  binding constraint.

  What could not be verified.  The do-files were not run (no Stata),
  and the cross-check is an independent re-estimate.  Whether the
  Dataverse 1.0 zip is byte-identical to the openICPSR E153101V2
  deposit that DP 48 used was not checked: openICPSR needs a login.
  Both carry the same title, and DP 48's reproduction of every table
  is consistent with the Dataverse data reproducing the pinned values
  above.

  Curation check (2026-11-02, zero cost).  I ran `benchmark.runner
  --llm-oracle curation-check --only
  hanushek-2022-patience-risk-human-capital` once in --mode blind and
  once in --mode independent.  Both cells stopped as llm_answer_pending
  on the first call, the methodology summary, with 0 API calls.  That
  prompt embeds the paper text, Tables 1-2 included, by design.  It
  carried no package script text, file names or claim tokens.  The
  project downloader fetched Dataverse 1.0 and recorded the version in
  metadata.json.  The strip rule withholds the 21 .do files
  (script-suffix) and nothing else.  The kept README.docx and six .xlsx
  inputs contain no pinned value, and Results/ is empty.  The blind
  code-generation prompt is checked by tests/test_blind_prompt.py
  (passes).

  Original analysis in Stata 15 (21 do-files).  language is r, the
  reproduction target (the pipeline translates Stata originals to R).
