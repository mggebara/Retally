  source: https://hanushek.stanford.edu/sites/default/files/Hanushek%2BKinne%2BLergetporer%2BWoessmann%202022%20EJ%20132%28646%29.pdf
  title: "Patience, Risk-Taking, and Human Capital Investment across Countries"
  authors:
    - Eric A. Hanushek
    - Lavinia Kinne
    - Philipp Lergetporer
    - Ludger Woessmann

dataset:
  source: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/6HXBSD&version=1.0
  access_notes: >
    Harvard Dataverse doi:10.7910/DVN/6HXBSD, CC0 1.0, one version
    (1.0, released 2021-10-04), pinned with &version=1.0 so a later
    deposit cannot silently change the package; 1.0 is the version
    current when I4R replicated (DP 48, July 2023).  ONE file,
    Replication.zip (929,690,049 bytes, not restricted, not ingested).
    It unpacks to Replication/ with 51 files, 5.5 GB:
    Data/Working/ holds seven Stata analysis data sets.  They are
    pisa_full_gps_final.dta (2.47 GB; cross-country, Table 1),
    pisa_full_gps_final_imcoo.dta (110 MB; migrants, Tables 2-3), and
    the alternative migrant definitions _coo, _cooavg, _coobothm,
    _imcooavg and _imcoobothm.
    Data/CSV/ holds the same seven as .csv (pisa_full_gps_final.csv
    2.97 GB) plus dist_cepii.csv.  Data/Orig/Other/ has six small
    .xlsx inputs (central exit exams, continents, GDP per capita,
    migrant selectivity, hc_data, OECD membership) and dist_cepii.dta.
    Data/Orig/PISA/ and Data/Orig/GPS/ hold only empty wave folders
    and Thumbs.db files.  The raw PISA and GPS files are public but not
    shipped, so the data-preparation do-files cannot run.  The analysis
    do-files run from Data/Working.
    Do/ holds 21 Stata do-files (0_masterfile, 1a-1e preparation, 2a-2d
    analysis prep, 3_analysis_crosscountry, 3_analysis_migrants).
    README.docx documents data provenance and maps tables to do-file
    line ranges; it prints no estimates.  Results/ is EMPTY: the code
    writes T1.xls etc. there.  No logs, .tex/.xls tables or paper PDF
    ship.  The strip rule removes the 21 .do files only.

code_repo:
  url: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/6HXBSD&version=1.0

original_claims:
  - description: table1_col3_patience
    value: 1.226
    claim_type: coefficient
    standard_error: 0.132
    sample_size: 1992276
    unit: SD of PISA math score per SD of national patience
    location: "Table 1, column (3) Full sample, Patience"
    context: >
      Table 1 ("National Preferences and Student Achievement across
      Countries: The Intertwined Roles of Patience and Risk-taking"),
      column (3), row Patience.  Student-level least squares regression
      of the PISA math test score (original PISA scores divided by 100,
      so a unit is one standard deviation), pooled over all PISA waves
      2000-2018, on the country's Global Preference Survey patience and
      risk-taking entered together.  Each preference is z-standardised
      in the analytical sample and collapsed to the country level.
      Controls: student gender, age and migration status, imputation
      dummies, and test-wave fixed effects.  Weighted by students'
      sampling probabilities within countries, giving equal weight to
      each country.  Sample: all students in the 49 PISA countries with
      GPS data.  Robust standard errors clustered at the country level.
  - description: table1_col3_risk_taking
    value: -1.241
    claim_type: coefficient
    standard_error: 0.184
    sample_size: 1992276
    unit: SD of PISA math score per SD of national risk-taking
    location: "Table 1, column (3) Full sample, Risk-taking"
    context: >
      Table 1, column (3), row Risk-taking.  Same regression as
      table1_col3_patience (patience and risk-taking entered together).
  - description: table1_col1_patience
    value: 0.917
    claim_type: coefficient
    standard_error: 0.127
    sample_size: 1992276
    unit: SD of PISA math score per SD of national patience
    location: "Table 1, column (1) Full sample, Patience"
    context: >
      Table 1, column (1), row Patience.  Same specification as
      table1_col3_patience but with patience as the only preference
      measure (risk-taking omitted).
  - description: table1_col2_risk_taking
    value: -0.482
    claim_type: coefficient
    standard_error: 0.261
    sample_size: 1992276
    unit: SD of PISA math score per SD of national risk-taking
    location: "Table 1, column (2) Full sample, Risk-taking"
    context: >
      Table 1, column (2), row Risk-taking.  Same specification as
      table1_col3_patience but with risk-taking as the only preference
      measure (patience omitted).
  - description: table1_col5_natives_patience
    value: 1.296
    claim_type: coefficient
    standard_error: 0.133
    sample_size: 1751822
    unit: SD of PISA math score per SD of national patience
    location: "Table 1, column (5) Natives, Patience"
    context: >
      Table 1, column (5) Natives, row Patience.  The column (3)
      regression (patience and risk-taking together, same weighting,
      wave fixed effects and country-clustered SEs) estimated on native
      students only.  Students are migrants if both parents were born
      abroad; natives are the rest.  The migration-status controls drop
      out within this subsample.
  - description: table1_col5_natives_risk_taking
    value: -1.320
    claim_type: coefficient
    standard_error: 0.189
    sample_size: 1751822
    unit: SD of PISA math score per SD of national risk-taking
    location: "Table 1, column (5) Natives, Risk-taking"
    context: >
      Table 1, column (5) Natives, row Risk-taking.  Same regression as
      table1_col5_natives_patience.
  - description: table1_col3_observations
    value: 1992276
    claim_type: other
    unit: students
    location: "Table 1, column (3), Observations"
    context: >
      Observations in the Table 1 column (3) regression: students in
      all PISA waves 2000-2018 in the 49 countries with GPS data (the
      full-sample N shared by columns 1-4, 7 and 8).
  - description: table2_col3_patience
    value: 0.931
    claim_type: coefficient
    standard_error: 0.116
    sample_size: 80398
    unit: SD of PISA math score per SD of country-of-origin patience
    location: "Table 2, column (3) Full sample, Patience (country-of-origin)"
    context: >
      Table 2 ("Patience, Risk-taking, and Student Achievement: Migrant
      Analysis"), column (3), row Patience (country-of-origin).
      Least squares regression of the PISA math score (divided by 100),
      PISA waves 2003-2018, on the GPS patience and risk-taking of the
      student's country of origin, entered together.  Sample: migrant
      students, both of whose parents were born outside the country
      where the student attends school, with an identified origin
      country that has GPS data.  First-generation migrants are
      assigned their country of birth, second-generation migrants their
      father's country of origin.  The sample spans 58 countries of
      origin and 48 residence countries.  Includes the 180 residence-
      country-by-wave fixed effects.  Controls: student gender, age, a
      dummy for an OECD country of origin, and imputation dummies.
      Robust standard errors clustered at the country-of-origin level.
  - description: table2_col3_risk_taking
    value: -0.294
    claim_type: coefficient
    standard_error: 0.122
    sample_size: 80398
    unit: SD of PISA math score per SD of country-of-origin risk-taking
    location: "Table 2, column (3) Full sample, Risk-taking (country-of-origin)"
    context: >
      Table 2, column (3), row Risk-taking (country-of-origin).  Same
      regression as table2_col3_patience.
  - description: table2_col1_patience
    value: 0.779
    claim_type: coefficient
    standard_error: 0.115
    sample_size: 80398
    unit: SD of PISA math score per SD of country-of-origin patience
    location: "Table 2, column (1) Full sample, Patience (country-of-origin)"
    context: >
      Table 2, column (1), row Patience (country-of-origin).  Same
      specification as table2_col3_patience but with country-of-origin
      patience as the only preference measure.
  - description: table2_col4_patience
    value: 1.032
    claim_type: coefficient
    standard_error: 0.133
    sample_size: 80398
    unit: SD of PISA math score per SD of country-of-origin patience
    location: "Table 2, column (4) Full sample, Patience (country-of-origin)"
    context: >
      Table 2, column (4), row Patience (country-of-origin).  The
      column (3) regression plus the four other GPS preferences of the
      country of origin (positive reciprocity, negative reciprocity,
      altruism, trust) as controls.
  - description: table2_col4_risk_taking
    value: -0.449
    claim_type: coefficient
    standard_error: 0.140
    sample_size: 80398
    unit: SD of PISA math score per SD of country-of-origin risk-taking
    location: "Table 2, column (4) Full sample, Risk-taking (country-of-origin)"
    context: >
      Table 2, column (4), row Risk-taking (country-of-origin).  Same
      regression as table2_col4_patience.
  - description: table2_col3_observations
    value: 80398
    claim_type: other
    unit: migrant students
    location: "Table 2, column (3), Observations"
    context: >
      Observations in the Table 2 column (3) regression: first- and
      second-generation migrant students, PISA waves 2003-2018 (the
      full-sample N shared by columns 1-5).

