# Original paper: Corno, L., La Ferrara, E., & Burns, J. (2022).
#   "Interaction, Stereotypes, and Performance: Evidence from South
#   Africa." American Economic Review, 112(12), 3848-3875.
#   doi:10.1257/aer.20181805 (December 2022 issue; Crossref issued
#   2022-12-01, DOI created 2022-11-28).
#
# Reproduction report: I4R First Meta Database replication team 44 (41
#   rows under the paper title, 40 with values, entered 2023-11-09).  No
#   I4R discussion paper was found for this report (EconStor / web search
#   for the title with "I4R", 2026-11-09; replication_link is empty).
#   Verdict: reproducible — the team's survey answer is "Analysis and
#   cleaning code produce the same output as presented in the paper"
#   (best_describe_compreprod), perfect_reproduction is "Yes"
#   (why_not_perfect_repro "Perfect Reproduction"), the run took less than
#   1 hour in Stata and the team rated it 10 of 10.  All 40 rows are
#   ROBUSTNESS variants of two published cells, not recomputations: 20
#   against Table 3 column 1 (Race IAT, white students, 0.316 (0.140)) and
#   20 against Table 4 Panel B column 1 (GPA, black students, 0.257
#   (0.125)) — dropped or changed controls and fixed effects, dfbeta
#   outlier removal, complete-case samples, a change-score outcome, a
#   redefined treatment.  So the replicator values (0.071 to 0.493 for
#   Table 3, 0.140 to 0.473 for Table 4) are different specifications, not
#   failed reproductions.  coding_correction is "Not done by replicators"
#   and result_same is blank on every row.
#
# Why this paper:
#   1. A natural experiment from random roommate assignment (University of
#      Cape Town residences, 2012): OLS with residence fixed effects (race
#      x residence in the pooled sample), own and roommate baseline
#      controls, mean-imputation dummies for missing controls, the lagged
#      outcome for the IAT, academic-program fixed effects for the
#      performance outcomes, and SEs clustered by room.
#   2. Outcomes include Implicit Association Test D-scores and a
#      first-principal-component performance index, built from a two-round
#      panel (the lagged IAT has to come from the baseline round).
#   3. A manually placed openICPSR package (data_access: manual) of 17 MB
#      with ready-made analysis .dta files and no shipped output at all
#      (the output/ folders are empty), so nothing beyond the scripts is
#      stripped in independent / blind mode.
#
# What original_claims pins: Table 3 (Race IAT) Mixed Room for white and
#   black students with SEs, and the two subsample Ns; Table 4 (academic
#   performance) Mixed Room in Panel B (black students) for all four
#   outcomes, Panel A (white students) GPA, and Panel C (full sample) GPA,
#   number of exams passed and the performance index, with SEs, and the
#   Panel C N of columns 1-2.  13 claims (3 counts), values exactly as
#   printed (3 decimals).
#
# Paper text: the published article is paywalled and no open copy of it
#   was found (AEA, Bocconi LEAP/INSPIRE, IFS, J-PAL; web search
#   2026-11-09).  The IFS working paper W19/03 named in the candidates
#   file (November 2018) has moved (old URL 404, now under
#   ifs.org.uk/sites/default/files/output_url_files/WP201903.pdf) and is a
#   different draft (its Race IAT table prints 0.282 for white students).
#   The source is the authors' manuscript "This version: June 2022" on the
#   Bocconi LEAP site (thanks the editor and three referees; PDF created
#   2022-06-13), the late revision a few months before the December 2022
#   issue.  Both cells the meta-database records equal the manuscript's
#   same table cells: Table 3 col 1 0.316 / 0.140 and Table 4 Panel B col 1
#   0.257 / 0.125.  The other 11 pinned values are not covered by the I4R
#   rows; they are pinned from this late revision because every I4R-covered
#   cell matches, and the package's data reproduce its sample sizes (see
#   notes).

id: corno-2022-interaction-stereotypes-performance
i4r_report_url: https://github.com/I4Replication/I4R-First-Meta-Paper
# Target language for regeneration (the original is Stata 17 with xi:
# reg, estout / xml_tab and three bundled .ado files; Retally generates R
# and reads the .dta files with haven).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  publication_date is the FIRST public
# version found: "Interaction, prejudice and performance. Evidence from
# South Africa", J-PAL research paper page dated 2015-02-01 (file name
# "..._March2015.pdf"; not opened), and a CERGE-EI seminar copy "This
# version: April 2015" (PDF CreationDate 2015-04-10), with the same
# experiment.  Then IFS WP W19/03 (November 2018, PDF created
# 2019-01-30) and the June 2022 manuscript (the catalog source).  The
# journal version: Crossref issued 2022-12-01 (created 2022-11-28).
# package_release_date is the DataCite registration of
# doi:10.3886/E174501V1 (registered 2022-11-21T18:40:33Z, DataCite API
# 2026-11-09); openICPSR itself needs a login.  The package README PDF was
# created 2022-11-16 and says the code was last run in September 2022.
publication_date: "2015-02"
package_release_date: "2022-11-21"

paper:
  # Authors' manuscript, "This version: June 2022", hosted by Bocconi LEAP;
  # checked 2026-11-09: 200 application/pdf, 533,205 bytes, 38 pp. (text
  # pp. 1-32, Tables 1-6 pp. 33-38; no appendix), md5
  # 82313e7c8c6a4b146b7127a8f165b151, PDF CreationDate 2022-06-13.
  source: https://leap.unibocconi.eu/sites/default/files/media/attach/CornoLaFerraraBurns_manuscript_13jun2022.pdf
  title: "Interaction, Stereotypes, and Performance: Evidence from South Africa"
  authors:
    - Lucia Corno
    - Eliana La Ferrara
    - Justine Burns

dataset:
  source: benchmark/manual-packages/T44/174501-V1.zip
  data_access: manual
  access_notes: >
    AEA Data and Code Repository on openICPSR, project 174501, version V1
    (doi:10.3886/E174501V1); login and terms-of-use click-through required,
    so the zip was downloaded by hand (2026-11-09) and placed unchanged at
    benchmark/manual-packages/T44/174501-V1.zip (16,662,899 bytes, md5
    a35ff5adaff7edee4da8a205b13b30bb; SOURCE.txt beside it).  V1 is the
    only version.  47 zip entries (32 files, 34,759,618 bytes
    uncompressed), no nested archives, all under ForJournals_a/:
    README_a.pdf (5 pp., November 2022; data provenance, Stata 17 and ssc
    packages, run time about 1 h plus 36 h for the FWER p-values,
    file-to-table map, no estimates); Data/Clean/ with eight Stata .dta
    files — uctdata_balanced.dta (0.6 MB, the two-round student panel used
    for Tables 1-6), uctdata_clean.dta, uctdata_dyadic.dta (28 MB, the
    dyadic file for Table 2 Panel C), ronstudent_sim.dta,
    new_accommodation_2012.dta, uctdata_tabA2.dta, tabA5.dta and
    nstudents_fwer.dta (the README also lists uctdata_inter.dta, which is
    not shipped, and the cleaning do-files it describes are not shipped
    either); Code/ with 17 Stata do-files (0_main.do,
    analysis/1_main_tables.do and 2_appendix_tables.do, 4_, 5_, 6_ for
    appendix tables, 3_fwer_master.do and nine FWER/*.do resampling
    programs, additional/fdr_sharpened_qvalues.do); programs/ado/ with
    dyreg.ado, ngreg.ado, qap.ado and ngreg.hlp; Questionnaires/ with the
    baseline (February 2012) and follow-up (September 2012) survey PDFs
    (14 pp. each); empty output/ folders (Main, Appendix, FWER, Figures).
    No log, table or results file ships.  The script-free copy
    (independent / blind) withholds 20 files
    (benchmark.strip_rule.classify_tree on the extracted package,
    2026-11-09): the 17 .do and 3 .ado files by suffix.  Kept: the eight
    .dta files, the README and questionnaire PDFs and ngreg.hlp, none of
    which prints a pinned value or SE.  Project page:
    https://www.openicpsr.org/openicpsr/project/174501/version/V1/view

original_claims:
  # ---- Table 3: Race IAT ----
  # The manuscript prints the column (1) SE without parentheses (a
  # typesetting slip); the meta-database records it as the SE.
  - description: race_iat_mixed_room_whites_table3_col1
    value: 0.316
    claim_type: coefficient
    standard_error: 0.140
    unit: change in the Race IAT D-score (higher = less prejudice against black people)
    location: "Table 3, Race IAT, Whites, column (1), Mixed Room"
    context: >
      Table 3 ("Stereotypes and exposure to a roommate of different race"),
      column (1).  OLS of the follow-up (end of first year) Race IAT score
      on Mixed Room, a dummy for having been assigned at baseline a
      roommate of a different race, controlling for the respondent's
      baseline Race IAT score, own baseline controls (female, UCT admission
      score, household wealth index, monthly consumption, foreign, private
      high school), the same controls for the roommate except female (rooms
      are single-sex), and residence fixed effects; missing values of
      controls other than the baseline IAT are replaced by means with
      missing-value dummies.  Sample: white first-year students in double
      rooms interviewed at baseline and follow-up with both IAT scores.
      Standard errors clustered at the room level.  The entry is the Mixed
      Room coefficient.
  - description: race_iat_mixed_room_blacks_table3_col2
    value: -0.094
    claim_type: coefficient
    standard_error: 0.069
    unit: change in the Race IAT D-score (higher = less prejudice against black people)
    location: "Table 3, Race IAT, Blacks, column (2), Mixed Room"
    context: >
      Table 3, column (2): the column (1) regression (follow-up Race IAT on
      Mixed Room, baseline Race IAT, own and roommate baseline controls,
      residence fixed effects) for black students.  Standard errors
      clustered at the room level.
  - description: n_obs_table3_whites
    value: 117
    claim_type: count
    unit: students
    location: "Table 3, No. Obs., columns (1) and (3) (Whites)"
    context: >
      Number of observations in Table 3 for the white subsample: white
      students in the working sample (interviewed at baseline and
      follow-up with non-missing values for both IATs).
  - description: n_obs_table3_blacks
    value: 332
    claim_type: count
    unit: students
    location: "Table 3, No. Obs., columns (2) and (4) (Blacks)"
    context: >
      Number of observations in Table 3 for the black subsample: black
      students in the working sample.

  # ---- Table 4, Panel B: black students ----
  - description: gpa_mixed_room_blacks_table4_panelB_col1
    value: 0.257
    claim_type: coefficient
    standard_error: 0.125
    unit: standard deviations of first-year GPA
    location: "Table 4, Panel B: Blacks, column (1) GPA, Mixed Room"
    context: >
      Table 4 ("Impact on academic performance"), Panel B, column (1).
      OLS of the student's first-year average GPA (standardized to mean 0
      and SD 1 over the full sample) on Mixed Room, own baseline controls
      (female, UCT admission score, wealth index, consumption, foreign,
      private high school, with mean imputation and missing-value
      dummies), the roommate's baseline controls (all but female),
      residence fixed effects and academic program fixed effects.  Sample:
      black students in the working sample.  Standard errors clustered at
      the room level.  The entry is the Mixed Room coefficient.
  - description: exams_passed_mixed_room_blacks_table4_panelB_col2
    value: 0.645
    claim_type: coefficient
    standard_error: 0.245
    unit: number of exams passed in the first year
    location: "Table 4, Panel B: Blacks, column (2) Number of exams passed, Mixed Room"
    context: >
      Table 4, Panel B, column (2): the same specification with the number
      of exams passed during the first year as the outcome; black students.
      Standard errors clustered at the room level.
  - description: eligible_mixed_room_blacks_table4_panelB_col3
    value: 0.152
    claim_type: coefficient
    standard_error: 0.040
    unit: change in the probability of being eligible to continue
    location: "Table 4, Panel B: Blacks, column (3) Eligible to continue, Mixed Room"
    context: >
      Table 4, Panel B, column (3): the same specification with a dummy for
      being in good standing and eligible to continue to the next academic
      year (Faculty Examination Committee assessment, possibly subject to
      make-up exams) as the outcome; black students.  Standard errors
      clustered at the room level.
  - description: performance_index_mixed_room_blacks_table4_panelB_col4
    value: 0.443
    claim_type: coefficient
    standard_error: 0.141
    unit: units of the academic performance index (first principal component)
    location: "Table 4, Panel B: Blacks, column (4) Index of Academic Performance, Mixed Room"
    context: >
      Table 4, Panel B, column (4): the same specification with the index
      of academic performance, the first principal component of GPA,
      number of exams passed and eligible to continue, as the outcome;
      black students.  Standard errors clustered at the room level.

  # ---- Table 4, Panel A: white students ----
  - description: gpa_mixed_room_whites_table4_panelA_col1
    value: -0.028
    claim_type: coefficient
    standard_error: 0.243
    unit: standard deviations of first-year GPA
    location: "Table 4, Panel A: Whites, column (1) GPA, Mixed Room"
    context: >
      Table 4, Panel A, column (1): the Panel B column (1) specification
      (standardized first-year GPA on Mixed Room, own and roommate baseline
      controls, residence and academic program fixed effects) for white
      students.  Standard errors clustered at the room level.

  # ---- Table 4, Panel C: full sample ----
  - description: gpa_mixed_room_full_table4_panelC_col1
    value: 0.147
    claim_type: coefficient
    standard_error: 0.102
    unit: standard deviations of first-year GPA
    location: "Table 4, Panel C: Full Sample, column (1) GPA, Mixed Room"
    context: >
      Table 4, Panel C, column (1): standardized first-year GPA on Mixed
      Room in the full working sample (all races), with own and roommate
      baseline controls, race dummies (White, Coloured, Indian/Other; Black
      omitted), race group x residence fixed effects (race groups: Black,
      White, and a residual group) and academic program fixed effects.
      Standard errors clustered at the room level.
  - description: exams_passed_mixed_room_full_table4_panelC_col2
    value: 0.447
    claim_type: coefficient
    standard_error: 0.204
    unit: number of exams passed in the first year
    location: "Table 4, Panel C: Full Sample, column (2) Number of exams passed, Mixed Room"
    context: >
      Table 4, Panel C, column (2): the Panel C specification (race
      dummies, race group x residence and academic program fixed effects,
      own and roommate controls) with the number of exams passed in the
      first year as the outcome; full sample.  Standard errors clustered at
      the room level.
  - description: performance_index_mixed_room_full_table4_panelC_col4
    value: 0.289
    claim_type: coefficient
    standard_error: 0.113
    unit: units of the academic performance index (first principal component)
    location: "Table 4, Panel C: Full Sample, column (4) Index of Academic Performance, Mixed Room"
    context: >
      Table 4, Panel C, column (4): the Panel C specification with the
      index of academic performance (first principal component of GPA,
      exams passed and eligible to continue) as the outcome; full sample
      with the index non-missing.  Standard errors clustered at the room
      level.
  - description: n_obs_table4_panelC_cols1_2
    value: 499
    claim_type: count
    unit: students
    location: "Table 4, Panel C: Full Sample, No. Obs., columns (1)-(2)"
    context: >
      Number of observations in Table 4 Panel C, columns (1) and (2): the
      full working sample of first-year students in double rooms
      interviewed at baseline and follow-up with both IAT scores.

# The meta-database has one published cell per table (Table 3 col 1 and
# Table 4 Panel B col 1), each with 20 robustness rows and no plain
# recomputation.  As in lopez-2022, the paper's value is recorded under the
# team's blanket verdict ("Analysis and cleaning code produce the same
# output as presented in the paper", perfect reproduction), with the range
# of robustness estimates in the note.  Claims without a meta-database row
# get no finding.
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 0.316
    outcome: matches
    notes: Blanket I4R verdict (team 44, perfect reproduction); the 20 rows are robustness variants, 0.071 to 0.493.
  - claim_id: 4
    reproduced_value: 0.257
    outcome: matches
    notes: Blanket I4R verdict (team 44, perfect reproduction); the 20 rows are robustness variants, 0.140 to 0.473.
notes: >
  Headline findings: living with a roommate of a different race raises
  white students' Race IAT by 0.316 (0.140) (Table 3 col 1, N 117; about
  0.63 SD, less prejudice against black people) and moves black students'
  by -0.094 (0.069) (col 2, N 332, not significant).  Black students in
  mixed rooms gain 0.257 (0.125) SD of GPA, pass 0.645 (0.245) more exams,
  are 0.152 (0.040) more likely to be eligible to continue, and score
  0.443 (0.141) higher on the performance index (Table 4 Panel B); for
  white students the GPA effect is -0.028 (0.243) (Panel A); in the full
  sample (N 499; 498 for cols 3-4) 0.147 (0.102) GPA, 0.447 (0.204) exams
  and 0.289 (0.113) index (Panel C).

  Paper text and how it was verified.  The published article was not read
  (paywalled; no open copy found).  The source is the authors' June 2022
  manuscript (post-referee; thanks the editor and three referees).  The
  meta-database records exactly two published cells, both checked against
  the same manuscript cells: Table 3 col 1 Mixed Room 0.316, SE 0.140 (the
  manuscript prints this SE without parentheses; in the rendered table it
  sits in the SE row under the coefficient) and Table 4 Panel B col 1
  0.257 (0.125).  The body text repeats both (0.316 in Sec. 5.1; 0.257 in
  Sec. 5.2) and the white-student GPA cell (-0.028, SE 0.243).  No
  meta-database typo was found (o_p_value 0.047 / 0.041 vs the
  manuscript's Westfall-Young p-values 0.055 / 0.040 in square brackets:
  the meta-database p-values are the conventional ones, not printed in
  the table).  The other pinned cells are not covered by any I4R row;
  they are pinned from this late revision because its I4R-covered cells
  match.  The package's uctdata_balanced.dta has 499 follow-up rows, 117
  white and 332 black, and 498 with continue / PCAperf non-missing, which
  equal the manuscript's Table 3 and Table 4 N rows.  The 2018 IFS WP and
  the 2015 drafts print different estimates and were not used.

  Curation pass (2026-11-09).  13 claims.  Left out: the Academic IAT
  columns of Table 3 (null, kept the Race IAT), the Westfall-Young
  adjusted p-values, the UCT admission score rows and the interaction row
  of Table 4, Panel A columns 2-4 (white students, all insignificant),
  Panel C column 3, the dependent-variable means and R-squared, Table 1
  (descriptive), Table 2 (balance and the dyadic sorting regression),
  Tables 5-6 (friendships, attitudes, prosocial behaviour, residential
  choice; ordered logits and indices built by principal components), and
  all appendix tables.

  Package-only facts (never in contexts).  Code/analysis/1_main_tables.do,
  "TABLE 3": use Data/Clean/uctdata_balanced.dta; xtset individual round;
  xi: reg DscoreraceIAT mixracebas L.DscoreraceIAT `controls_subsample'
  `rocontrols' i.Res_base if round==2 & white==1 (black==1), robust
  cluster(roomnum_base).  controls_subsample = Female Falseuct2012
  missfalse Foreign foreign_missing privateschool_nomiss
  privateschool_miss durpcabas_nomiss durpcabas_miss consbas_nomiss
  consbas_miss; rocontrols = roFalseuct2012 missrofalse roForeign_bas
  roforeign_missingbas roprivschool_nomiss roprivschool_miss
  rodurpcabas_nomiss rodurpcabas_miss roconsbas_nomiss roconsbas_miss.
  "TABLE 4": outcomes GPA examspassed continue PCAperf; subsamples add
  i.regprogram to the Table 3 regressors without the lag; the full sample
  uses `controls' (adds white coloured Else) and i.blackRes i.whiteRes
  i.Res_base i.regprogram.  The FWER p-values come from separate
  resampling do-files (seed 3005; about 36 h), not needed for any pinned
  claim.

  Blind-mode exposure (step 6, 2026-11-09).  Both modes reached the
  generation prompt and stopped as llm_answer_pending (oracle label, no
  API calls; the methodology-summary and hyperparameter prompts answered
  by the curator without results).  The blind generation prompt states no
  pinned value or SE at printed precision or rounded to 1-3 significant
  figures (the only hit, "117", is the file size "117.2 KB" of
  new_accommodation_2012.dta in the dataset listing) and carries no
  do-file text; the listing names the eight .dta files and their columns
  (mixracebas, roomnum_base, the ro* roommate controls and the
  missing-value dummies are data columns).  The abstract prints no
  numbers.  The paper text given to the methodology summariser carries
  the body-text statements of three pinned cells (0.316 in Sec. 5.1,
  0.257 and -0.028 (0.243) in Sec. 5.2) and the working-sample size in
  the introduction and Sec. 3; the summariser is told to leave results
  out, and the README's blind-mode caveat covers this.  The parser takes
  "Interaction, Stereotypes and Performance." as the title.

  What was read.  The June 2022 manuscript pp. 1-20 and Tables 1-6; the
  2018 IFS WP Table 4 (Race IAT) block; the 2015 CERGE-EI title page; the
  41 meta-database rows; README_a.pdf; the Table 3-4 blocks of
  1_main_tables.do and 0_main.do; the row counts of uctdata_balanced.dta;
  the strip-rule classification of the extracted package.

  What could not be verified.  The published article itself (its tables
  and notes) was not read; 11 of the 13 pinned values rest on the June
  2022 manuscript alone.  The authors' Stata code was not run (no Stata
  here) and no R cross-check of the coefficients was made.

  Original analysis in Stata 17 (xi: reg, xml_tab, estout); language: r is
  the reproduction target.
