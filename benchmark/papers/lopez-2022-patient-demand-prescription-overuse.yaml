notes: >
  Headline findings (Table 3): on Patient Voucher days voucher use was
  0.35 (0.030) higher than on Control days, against 0.26 (0.024) on Doctor
  Voucher days (the abstract's "35 percent" is the 9-point gap relative to
  the Doctor Voucher level, not the coefficient); any malaria treatment
  prescribed 0.052 (0.025) PV vs 0.016 (0.025) DV, purchased 0.14 (0.027)
  vs 0.085 (0.025); severe malaria treatment prescribed -0.046 (0.018) vs
  -0.054 (0.021), purchased -0.022 (0.020) vs -0.050 (0.019).  N 2,055 in
  column 1, 2,053 in columns 2-5.

  Paper text and how it was verified.  No open copy of the published
  article was found; the catalog source is World Bank PRWP 9482
  (November 2020).  Its Table 3 is identical to the published Table 3 in
  every cell the I4R meta-database records for "table 3": the 10
  coefficient / SE pairs 0.35/0.030, 0.26/0.024, 0.052/0.025,
  0.016/0.025, 0.14/0.027, 0.085/0.025, -0.046/0.018, -0.054/0.021,
  -0.022/0.020, -0.050/0.019 equal o_coeff_dbl / o_std_err_dbl, and the 5
  "difference in means" rows without SE (0.090, 0.036, 0.055, 0.008,
  0.028) equal beta_P - beta_D in each WP column.  The other 15 rows are
  "table b8" (online Appendix Table B8, no additional controls; 0.35/0.031,
  0.27/0.025, 0.067/0.027, 0.023/0.026, 0.15/0.031, 0.092/0.027,
  -0.033/0.019, -0.058/0.023, -0.011/0.021, -0.051/0.020 and five
  differences); the WP carries no appendix, which is why 9 of the 30
  paired values do not occur in it (the B8 values that do occur in the WP
  are tokens of other cells, not B8).  The published online
  appendix (https://aeaweb.org/content/file?id=15897, open, dated January
  22, 2021, 30 pp.) prints B8 exactly as the meta-database, with the N row
  2055 / 2053 and the control means of Table 3, so B8 is the published
  appendix and the published Table 3 sample is the WP's.  The package's
  generated Tables/3_mal_tmt_overall_new_lso.tex is cell-for-cell the WP's
  Table 3 (N row included), and its Tables 4 and 5 equal the WP's Tables
  4 and 5; but no published value of Tables 4 or 5 is recorded anywhere
  open, so they are not pinned.  The N claims are not in the
  meta-database; they are pinned from the WP Table 3 / package table and
  the published appendix's identical N rows.  The NBER WP 25284 (2018)
  prints a different Table 3 (fixed controls instead of lasso) and was
  not used.

  Curation pass (2026-11-09).  12 claims.  Left out: the beta_P = beta_D
  p-values and mechanism rows, the control-group means (descriptive),
  Tables 1-2 (descriptive and balance), Table 4 (heterogeneity by
  predicted malaria risk, bootstrapped SEs with a generated regressor)
  and Table 5 (expected match), neither verifiable against a published
  value, and all appendix tables.

  Package-only facts (never in contexts).  LSS_master_data_analysis.do,
  "TABLE 3": use LSS_analysis_datasets_20201108.dta, drop if dropme==1;
  outcomes used_vouchers_admin, RXtreat_sev_simple_mal,
  treat_sev_simple_mal, RXtreat_severe_mal, treat_severe_mal; program
  docpat_theory_lso ("Stata admin files"/LSS_TablePrograms.do) runs
  pdslasso <y> patient_voucher doctor_voucher (DD1-DD35 CL1-CL59 CC*),
  clu(cscomnum) partial(DD1-DD35) — date dummies DD* partialled out
  (always kept), clinic dummies CL* and the prepared patient-control
  block CC* (levels, squares, interactions, missing dummies) eligible for
  selection; then test patient_voucher = doctor_voucher.  README: Stata/MP
  14.0, about 3 h 20 min for the whole master file (most of it the
  bootstrap sets for Table 4 and B9/B11, which Table 3 does not need).

  Blind-mode exposure (step 6, 2026-11-09).  The blind generation prompt
  states no pinned value or SE at printed precision or rounded, and no
  script text (the one hit, "cscomnum", is a data column name in the
  listing).  Its "abstract" is the World Bank series boilerplate (the
  parser takes the cover line "Policy Research Working Paper" as the
  title), so the paper's own abstract ("increased discount use by 35
  percent", a ratio of the voucher-use gap to the Doctor Voucher level)
  does not reach it.  The paper text given to the methodology summariser
  does carry that abstract, the interview count that is the column (1)
  N ("we completed 2,055 interviews"), and Section 4.2's percentage-point
  statements of three Table 3 estimates; the summariser is told to leave
  results out, and the README's blind-mode caveat covers this.  The R
  sandbox has no lasso package (no glmnet or hdm), so a reproduction must
  code the double-selection lasso by hand or approximate it.

  What was read.  WP 9482 pp. 1-29 and Tables 1-5 (pp. 46-53); NBER WP
  25284 Tables 3-5; the published online appendix Tables B8 and B10; the
  31 meta-database rows; the package README, the Table 3 block of the
  master do-file and the docpat_theory_lso program; the strip-rule
  classification of the extracted package and the text of every kept PDF
  and .tex.

  What could not be verified.  The published article itself (its Table
  3 notes and wording) was not read.  The authors' Stata code was not run
  (no Stata here) and no R cross-check of the lasso specification was
  made; an R reproduction must approximate pdslasso (rlasso with
  cluster-robust penalty loadings) without a lasso package, so selected
  controls may differ.

  Original analysis in Stata 14 (pdslasso, rlasso, estout); language: r
  is the reproduction target.
