# Original paper: Mokyr, J., Sarid, A., & van der Beek, K. (2022). "The
#   Wheels of Change: Technology Adoption, Millwrights and the Persistence
#   in Britain's Industrialisation." The Economic Journal, 132(645),
#   1894-1926.  doi:10.1093/ej/ueab102
#
# Reproduction report: no I4R Discussion Paper.  The I4R First Meta
#   Database holds 17 rows for this paper (tag T100, replicator team 100,
#   row indices 5895-5911, entered 2023-09-28).  Verdict, row 5900:
#   computational_reproduction = 1, perfect_reproduction = Yes, "We were
#   able to replicate the outcomes presented in the paper using data and
#   code shared by the authors".  The other rows are robustness checks on
#   Table 2 column 5 and Table 3 columns 5-6 (outliers, alternative
#   dependent variables, county fixed effects, wild-bootstrap SEs for the
#   few clusters, an area-control sensitivity note: "Only control variable
#   with an impact is 'area'").  outcome_label: reproducible.
#
# Why this paper:
#   1. Small Stata package (7.8 MB in three zips; one 0.3 MB .dta with a
#      .csv copy), open on Zenodo under CC BY 4.0.
#   2. Two core tables (Section 4.1): OLS (Table 2) and IV (Table 3) of
#      eighteenth-century wright apprentices on Domesday Book watermills in
#      a cross-section of English districts — plain linear models a
#      reproduction can match from the paper's description.
#   3. Published EJ PDF open on Mokyr's Northwestern site.
#   4. First EJ-style package in the catalog whose manuscript ships as Word
#      files, and whose accepted PDF prints its tables as images: it
#      motivated the .docx and written-out-legend extensions of
#      benchmark/strip_rule.py made with this entry.
#
# What original_claims pins: the Domesday-watermills coefficient and SE in
#   all five Table 2 columns and in Table 3 column 5 (OLS) and columns 2, 4
#   and 6 (IV), the three Table 3 first-stage F-statistics, and the common
#   sample size.  13 claims; tables print two decimals and values are
#   pinned exactly as printed (the printed-precision floor gives each a
#   +/-0.005 band).

id: mokyr-2022-wheels-of-change
i4r_report_url: https://github.com/I4Replication/I4R-First-Meta-Paper
# Target language for regeneration (the original is Stata: reg and ivreg2).
language: r
outcome_label: reproducible
split: holdout
