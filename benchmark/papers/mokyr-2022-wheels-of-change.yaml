original_claims:
  # ---- Table 2: OLS, wright apprentices on Domesday watermills ----
  - description: watermills_table2_col1
    value: 0.15
    claim_type: coefficient
    standard_error: 0.02
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 2, column (1), Watermills (per capita)"
    context: >
      Table 2 ("Number of Wright Apprentices per Capita and Domesday Book
      Mills per Capita"), column (1).  Cross-section of English
      (government area) districts covered by the Domesday Book.  OLS
      regression of the number of apprentices to wrights in 1710-50 (from
      the Apprentice Tax Registers) per capita on the number of watermills
      recorded in the Domesday Book (1086) per capita, with a constant and
      no controls; both counts are converted to per capita terms using the
      district's mean population in 1710-50 (the text reads the
      coefficient as wright apprentices per mill per 10,000 people).  The
      table note says observations are clustered at the historical county
      level and heteroscedasticity robust standard errors are reported.
  - description: watermills_table2_col2
    value: 0.14
    claim_type: coefficient
    standard_error: 0.02
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 2, column (2), Watermills (per capita)"
    context: >
      Table 2, column (2): the column (1) regression adding the main
      geographic controls — latitude and longitude of the district's
      centroid, mean ruggedness and mean elevation.  Same sample, SEs
      clustered at the historical county level.
  - description: watermills_table2_col3
    value: 0.14
    claim_type: coefficient
    standard_error: 0.02
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 2, column (3), Watermills (per capita)"
    context: >
      Table 2, column (3): column (2) plus agricultural suitability, wheat
      suitability and mean pasture suitability.  Wheat suitability is the
      paper's high-wheat-suitability indicator (mean wheat suitability
      category of the district lower than or equal to 5, the lower the
      more suitable).
  - description: watermills_table2_col4
    value: 0.14
    claim_type: coefficient
    standard_error: 0.02
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 2, column (4), Watermills (per capita)"
    context: >
      Table 2, column (4): column (3) plus the climatic controls, mean
      precipitation and mean temperature.
  - description: watermills_table2_col5
    value: 0.12
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 2, column (5), Watermills (per capita)"
    context: >
      Table 2, column (5), the paper's preferred OLS specification (Figure
      1 plots its partial correlation): column (4) plus mean population in
      1710-50, minimal distance to an important harbour, distance to
      London, minimal distance to a Roman road, minimal distance to a
      navigable river, and the district's area.  SEs clustered at the
      historical county level.

  # ---- Table 3: OLS and IV ----
  - description: watermills_ols_table3_col5
    value: 0.12
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 3, column (5) OLS, Watermills (per capita)"
    context: >
      Table 3 ("Wright Apprentices per Capita and the Number of Domesday
      Mills per Capita"), column (5), OLS: the Table 2 column (5)
      specification (main geographic, agricultural, climatic and other
      geographic controls, population) with river suitability added as a
      control, i.e. the OLS counterpart of the column (6) IV.  River
      suitability is the length of rivers in the district running through
      terrain of moderate ruggedness (ruggedness between 2 and 6).  The
      Table 3 note reports heteroscedasticity robust standard errors; the
      paper states (Section 4.2) that in all regressions observations are
      clustered at the county level.
  - description: watermills_iv_table3_col2
    value: 0.16
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 3, column (2) IV, Watermills (per capita)"
    context: >
      Table 3, column (2), IV (two-stage least squares): Domesday
      watermills per capita instrumented with the paper's geographic
      suitability for grain-grinding watermills, the length of rivers in
      the district with moderate ruggedness (between 2 and 6) interacted
      with the high-wheat-suitability indicator (mean wheat suitability
      category of 5 or lower).  The two components, river suitability and
      wheat suitability, enter as controls; no other controls.  Dependent
      variable: wright apprentices per capita, 1710-50.  Standard errors
      as for column (5).
  - description: watermills_iv_table3_col4
    value: 0.15
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 3, column (4) IV, Watermills (per capita)"
    context: >
      Table 3, column (4), IV: the column (2) model adding the main
      geographic controls (longitude, latitude, mean ruggedness, mean
      elevation), the agricultural controls (agricultural and pasture
      suitability besides wheat suitability) and the climatic controls
      (mean precipitation and temperature).
  - description: watermills_iv_table3_col6
    value: 0.16
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 298
    unit: wright apprentices per capita per Domesday watermill per capita
    location: "Table 3, column (6) IV, Watermills (per capita)"
    context: >
      Table 3, column (6), the full IV specification: column (4) plus the
      other geographic controls (distance to London, to the main
      eighteenth-century harbours, to a historical Roman road and to a
      navigable river, and the district's area) and the district's mean
      population in 1710-50.
  - description: first_stage_f_table3_col2
    value: 19.90
    claim_type: other
    unit: first-stage F-statistic
    location: "Table 3, column (2), First-stage F-statistic"
    context: >
      Table 3, column (2): the first-stage F-statistic for the excluded
      instrument (river suitability x wheat suitability) in the IV with
      river suitability and wheat suitability as the only controls.
  - description: first_stage_f_table3_col4
    value: 16.96
    claim_type: other
    unit: first-stage F-statistic
    location: "Table 3, column (4), First-stage F-statistic"
    context: >
      Table 3, column (4): first-stage F-statistic of the IV with main
      geographic, agricultural and climatic controls.
  - description: first_stage_f_table3_col6
    value: 16.17
    claim_type: other
    unit: first-stage F-statistic
    location: "Table 3, column (6), First-stage F-statistic"
    context: >
      Table 3, column (6): first-stage F-statistic of the full IV
      specification.
  - description: n_districts_tables2_3
    value: 298
    claim_type: other
    unit: districts
    location: "Tables 2 and 3, Observations"
    context: >
      Number of district observations in the Table 2 and Table 3
      regressions (the same in every column): districts with Domesday Book
      watermill data.

