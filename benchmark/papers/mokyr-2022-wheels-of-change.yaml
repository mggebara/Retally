notes: >
  Headline finding: English districts with more watermills in the Domesday
  Book (1086) had more apprentices to wrights (millwrights) in 1710-50,
  conditional on geography, agriculture, climate and trade access (Table
  2: 0.15 unconditional, 0.12 (SE 0.03) with all controls), and the
  relation survives instrumenting Domesday mills with river x wheat
  suitability (Table 3 IV 0.16 / 0.15 / 0.16, first-stage F 19.90 / 16.96
  / 16.17).  N = 298 districts in every column.

  Curation pass (2026-11-02).  Pinned 13 claims from the two core tables
  of Section 4.1: Table 2's watermills coefficient in all five columns,
  Table 3's column (5) OLS and the three IV columns, each with its SE in
  standard_error; the three first-stage F-statistics; and N.  The tables
  print two decimals; I4R records three for the three originals it
  examines (0.120 (0.028), 0.117 (0.028), 0.159 (0.037)), all of which
  round to the printed values.  The abstract states no numbers; the intro
  restates Table 2 col 3-4 (0.14).  Left out: Table 2 control
  coefficients and adjusted R2s, Table 3 columns (1) and (3) (column 1 is
  Table 2 column 1 again; column 3 is an OLS without the river and wheat
  controls), the river/wheat suitability coefficients, Table 1 summary
  statistics, Table 4 (Hampshire mill counts), Table 5 (the Black Death
  interaction; its note calls the evidence "suggestive"), Tables 6-9
  (drapers, industrial vs other occupations, mediation, worsteds) and the
  online appendix.  Description tokens are distinct under substring
  matching (no col1 / col10 clash).

  What was read.  The published EJ PDF (all 33 pp.; Tables 2-3 and
  Section 4.1 in full, Tables 5-6 and the introduction); the Zenodo API
  metadata for records 5731589 and 5734954; the whole package listing,
  main.do and the Table 2 / Table 3 / Table 5-9 sections of Tables.do, the
  README PDF, the .aux and the head of the .log; Crossref metadata; the
  meta-database's 17 rows.  There is no I4R DP.

  Independent cross-check (not the package code: pandas + numpy OLS and
  2SLS with county-clustered SEs on replication_data.dta, Stata's CR1
  adjustment).  Reproduces every pinned value at the printed precision:
  Table 2 cols 1-5 0.1461 (0.0242), 0.1438 (0.0226), 0.1416 (0.0228),
  0.1407 (0.0231), 0.1199 (0.0281), adjusted R2 0.568 / 0.583 / 0.590 /
  0.590 / 0.606; Table 3 col 5 OLS 0.1168 (0.0279), adj. R2 0.616; IV col
  2 0.1591 (0.0374), col 4 0.1522 (0.0400), col 6 0.1592 (0.0376) (IV SEs
  with the G/(G-1) cluster factor only, ivreg2's default); first-stage F
  = squared clustered t of the excluded instrument with the full CR1
  adjustment: 19.90, 16.96, 16.17 exactly (without the (N-1)/(N-K) factor:
  20.11, 17.61, 17.16).  N = 298, 35 county clusters in every column.

  Package-only facts (never in contexts).  main.do: cd "your_directory";
  county_id = encode GAZ_CNTY (ancient county; 35 clusters in the
  estimation sample); mills_pc = mills / pcmean and wrights_pc = wrights /
  pcmean (pcmean: HYDE mean population 1710-50, in tens of thousands);
  wheat_suit = wheat_tmean <= 5; riv_rug26count is divided by 1000 and
  the instrument is msuit26mean = wheat_suit * riv_rug26count.  Tables.do,
  Table 2: reg wrights_pc mills_pc [controls], cluster(county_id); column
  2 adds `if e(sample)==1`; column 3 adds suitmean wheat_suit
  dist_grass_mean; column 4 precip_mean_dist temp_mean_dist; column 5
  pcmean min_harbor DIST_London min_dist* (min_dist_to_roman_rds,
  min_dist_2nav_rivers) area.  Table 3: column 2 ivreg2 wrights_pc
  (mills_pc = msuit26mean) riv_rug26count wheat_suit, cluster(county_id)
  first savefirst; column 4 adds longitude latitude dist_rug_mean
  dist_elevation_mean suitmean dist_grass_mean precip_mean_dist
  temp_mean_dist; columns 5 (reg) and 6 (ivreg2) add min_harbor
  DIST_London min_dist* pcmean area, `r cluster(county_id)`.  The
  First-stage F row is estadd scalar fstat = e(widstat), ivreg2's
  Kleibergen-Paap rk Wald F under clustering.  So every Table 3 SE is
  clustered by county although the Table 3 note mentions only
  heteroscedasticity robust SEs (the contexts quote the note and the
  Section 4.2 clustering statement).  Needs ssc estout, ivreg2, ranktest,
  sutex, medeff (mediation, Table 8).  The 298 of 325 rows are those with
  non-missing mills.

  Zero-cost end-to-end check (2026-11-02).  `uv run python -m
  benchmark.runner --llm-oracle curation-check --only
  mokyr-2022-wheels-of-change`, once with --mode blind and once with
  --mode independent: both cells stopped as llm_answer_pending on the
  first call, the methodology summary, whose prompt embeds the full
  paper text (Tables 2-3 included) by design and carried no package
  script text.  Because that stops before code generation, the blind and
  independent tasks were also rendered with benchmark.reproducers.
  render_task (no API calls): the blind task.md states none of the 13
  values or SEs (as printed or rounded to 1-4 significant figures, nor
  I4R's three-decimal originals) and no script text; the blind paper.txt
  carries 150 redactions and keeps only "(0.2)", the Table 5 column 4
  coefficient (not pinned).  The script-free mount withholds 17 files
  (five do/ado, the .log, the accepted and appendix PDFs, three
  manuscript .docx, six __MACOSX stubs) and keeps the data, the README
  codebook, figures.docx, the .aux / .synctex.gz, the xlsx and two
  figure PNGs.  Before the strip-rule extension made with this entry the
  accepted PDF, the appendix PDF and all four manuscript .docx were on
  the mount (tables_ocr.docx prints every table as text).

  What could not be verified.  The do-files were not run in Stata and no
  Stata log ships; the cross-check above is an independent re-estimate.
  The meta-database row numbers are the 0-based indices the corpus files
  use (5895-5911).

  Original analysis in Stata (main.do, Tables.do; reg and ivreg2);
  language is r, the reproduction target.
