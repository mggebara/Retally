notes: >
  Headline finding: partisans rate out-parties with more women MPs more
  warmly.  Moving an out-party's parliamentary delegation from no women to
  all women raises its mean 0-10 thermometer rating among other parties'
  partisans by 1.73 units (Table 1 col 2, p < 0.01; 1,842 directed party
  dyads, 125 parties, 20 Western democracies, 81 CSES surveys 1996-2017),
  and both women (2.10) and men (1.13) partisans show the bonus.

  Original analysis in R (replication_code.R); language: r is the
  reproduction target.

  Curation pass (2026-10-21).  Pinned 11 claims: the women-MPs coefficient
  in all four Table 1 columns, the three column-2 controls (each with its
  SE in standard_error; SEs are not separate claims, as in arias-2022),
  the three Observations counts (1,842 serves columns 1 and 2), and the
  81 election studies.  Coefficients and SEs are printed to two decimals.

  What was read.  The published APSR PDF (all 7 pages; the supplementary
  appendix was not read); the Dataverse API metadata; the whole package,
  downloaded to a scratch directory (never committed): readme.rtf and
  replication_code.R; the meta-database's 6 rows.

  Independent cross-check (not the package code).  Table 1 was
  re-estimated in Python (statsmodels OLS, election fixed effects as
  dummies) on the package's data, following the script's sample steps:
  N = 1,842 dyads in 81 elections and 20 countries (columns 1-2), 1,836
  (women) and 1,833 (men).  Every point estimate reproduces the printed
  value to the second decimal (1.887, 1.726, 2.097, 1.131; -0.596 / 0.943
  / 0.371 in column 2; adj. R2 0.154 / 0.308).  SEs: with clustering by
  COUNTRY (20 clusters) the women-MPs SEs are 0.431 / 0.514 / 0.527 /
  0.487 (CR1), i.e. the printed 0.43 / 0.52 / 0.53 / 0.50 up to the
  small-sample correction (the script uses estimatr::starprep, default
  CR2).  With clustering by ELECTION (country-year, 81 clusters), which
  is what the paper's text and table note say, they are 0.365 / 0.428 /
  0.432 / 0.401, and the column-2 controls 0.073 / 0.175 / 0.129.  So the
  printed SEs are country-clustered and the paper misdescribes the
  clustering: a reproducer following the paper's words gets the point
  estimates but SEs ~15-20% smaller.  Contexts keep the paper's wording
  ("clustered by election"); do not "fix" them.

  Package structure (package-only facts; never in contexts).  One script,
  replication_code.R (libraries tidyverse, stargazer, haven, estimatr,
  dplyr, fixest, modelsummary; no setwd, relative paths).  Table 1
  columns 1-2 (lines ~40-70): load("dyadic_data_1-4-22.Rdata") creates
  object updated_data (2,266 rows, 85 columns); cntryyr = paste(country,
  year); keep to_prior_seats >= 4; keep rile_distance_s, prior_coalition,
  prior_opposition, econ_distance_s, society_distance_s, year, country,
  party_dislike, party_like, cntryyr, to_pfeml, to_prior_seats,
  to_mp_number and na.omit (listwise, over columns the model does not
  use); lm(party_like ~ to_pfeml [+
  rile_distance_s + prior_coalition + prior_opposition] +
  as.factor(cntryyr)), SEs from starprep(clusters = dta$country) into
  stargazer (labelled "Country-Level Clustered SEs?").  Columns 3-4
  (lines ~73-117): readRDS("gender_disagregated_8-8-21.rds"), like = 10 -
  dislike, gender == 2 (women) / 1 (men), same model on countryyear.  The
  one path bug I4R fixed is at line ~671, load("Data/multilevel_1-5-22.Rdata")
  (a Data/ subfolder the package does not have) — supplementary Tables
  S11-S12 only.  Figure 1 needs only the dyadic file.  The independent-
  mode script-free copy carries no answers (no .tex/.log/.RData output).

  Left out.  Table 1 control coefficients in columns 3-4 (-0.62 / 0.94 /
  0.36 and -0.66 / 0.96 / 0.35, same pattern as column 2), adjusted R2
  (0.15 / 0.31 / 0.31 / 0.30), the 0.55-unit +/-1 SD effect and the
  0.29 / 0.16 mean / SD of the women-MPs share (derived from Table 1 and
  Figure 1), the 125-party count, and all supplementary-appendix models
  (S2-S12).

  First run 2026-10-21 (Phase 3.2 evaluation pass; main 0492c17, after
  the content-aware strip rule and the printed-precision floor; Opus
  4.7, 47-package image, LLM cache on, --mode all, one run per mode;
  eval-7papers-all-modes-2026-10-21.json).  Seeded 11 / 11 (first scored
  11, exact on the first script); independent 7 / 11 (first scored 0; 1
  error + 3 claim refinements); blind 1 / 11 (first scored 1; 1 error
  repair).  Independent's first script crashed and the passes came after
  claim refinement; the three N claims failed (1,535 / 1,535 / 1,529 vs
  1,842 / 1,836 / 1,833) and the men-partisans coefficient (1.87 vs
  1.13).  Blind's first script also crashed; after the repair only
  n_election_studies (81) matched: all seven coefficients came out with
  the opposite sign at similar magnitudes (e.g. -1.95 vs 1.89) and N was
  2,019 vs 1,842.
