notes: >
  Headline findings: in the pure control group (trimmed priors, N 921)
  Democrats score 0.691 (0.066) SD and women 0.181 (0.057) SD higher on
  the perception index (Table 3 Panel A col 4), and a one-SD higher prior
  belief about females' relative wages goes with a -0.729 (0.065) SD lower
  index (Panel B); for the policy demand index Democrat 0.669 (0.051)
  (Table 4 Panel A col 7) and prior -0.302 (0.054) (Panel B).  The ACS
  ("74") versus CPS ("94") information moves posterior beliefs by -12.955
  (0.594) dollars, -0.658 (0.030) SD (Table 5 Panel A cols 1-2), and the
  perception index by 0.417 (0.032) (col 6).  2SLS per SD of posterior
  belief: affirmative action -0.171 (0.053), equal pay legislation -0.177
  (0.053), policy demand index -0.087 (0.038) (Panel C cols 2, 3, 7; N
  3022).  Follow-up perception index 0.156 (0.045) (Table 6 Panel A col
  7, N 1105).

  Paper text and how it was verified.  The published article was not
  read (paywalled).  The source is ECONtribute DP 179 (July 22, 2022).
  Its Tables 3-6 were parsed cell by cell (panel, row, column, coefficient,
  SE) and every one of the 116 non-empty meta-database rows was matched
  to a cell of the same table: 111 rows equal a cell exactly
  (coefficient and SE; Table 5 Panel C's seven 2SLS cells checked by hand
  because the label splits across lines).  The remaining five are
  meta-database transcription slips, each next to a paper cell that
  DP12's "(1)" (original) column prints exactly as the ECONtribute copy
  does: Table 5 Panel A col 2 coded -0.685 (paper and DP -0.658, SE 0.030
  agrees); Table 3 Panel C col 4 Female SE coded 53.000 (paper and DP
  0.053); Table 6 Panel B col 6 T74 coded 0.122 (paper and DP 0.123,
  SE 0.052); Table 6 Panel A col 4 T74 SE coded 0.058 (paper and DP
  0.057); Table 3 Panel C col 3 Democrat SE coded 0.073 (paper and DP
  0.071).  The first three are the candidates file's "3 of 116" unmatched
  tokens; the last two match as tokens elsewhere in the tables.  DP12's
  own "(1)" columns match the ECONtribute copy everywhere except one DP
  typo (Table 4 Panel A col 6 Democrat printed 0.625 in DP Table 5; the
  paper copy and the meta database both read 0.635).  Every pinned value
  and SE equals its meta-database row.

  Curation pass (2026-11-09).  13 claims.  Left out: the single-item
  columns of Tables 3-4 (kept the summary indices), Table 3/4 Panel C,
  Table 5 Panels A cols 3-5 and Panel B (reduced form) and the other 2SLS
  columns, the sharpened q-values, Table 6 other columns and Panel B,
  Table 2 (correlates of incentivized priors, reported at one decimal),
  Tables 7-10 and the appendix.  Left out for feasibility: the two
  information-treatment values themselves (the ACS-based $74 and the
  CPS-based $94 relative wage of 45-year-old full-time employees with a
  Bachelor's degree, and the in-text numbers built on them), which come
  from the 5.94 GB ACS extract (usa_00025.dta) and the 170 MB CPS extract;
  the R sandbox's 300 s limit and the host's bind-mount read speed (about
  8 MB/s) rule out reading the ACS file in a run.  No pinned claim reads
  either extract.

  Package-only facts (never in contexts).  Cleaning: 03/04 code the raw
  wave A / wave B main-survey answers ("A1" ...), 05 appends them, sets
  pweight (1 in wave A; in wave B 1.4615 / 0.6298 for men / women in age
  group 1 and 1.0184 / 0.8691 in age group 5), z-scores large, problem,
  govmore and the six policy items (quotaanchor, AAanchor,
  legislationanchor, transparencyanchor, UKtool, childcare) on the
  rand==0 mean and SD, and builds z_mani_index (large, problem, govmore)
  and z_lmpolicy_index (quota, AA, legislation, transparency or UKtool,
  childcare) as inverse-correlation-matrix weighted averages over the
  full sample; 06 does the same for the follow-up (z_maniII_index2).
  Table 3/4 (08_MainTables.do): keep if rand==0, z-score prior within
  that group, keep if prior strictly between r(p5) and r(p95); reg y
  i.wave democrat indep otherpol gender [pweight=pweight], r (Panel A),
  reg y i.wave prior (Panel B).  Table 5: drop if rand==0; zscore
  posterior [aweight=pweight] in the treatment sample (the paper's
  notes say z-scored on the pure control group for the perception items,
  and call the column 2 outcome the "z-scored" posterior); reg y T1
  $controls [pweight=pweight], vce(r); ivregress 2sls y $controls
  (zposterior = T1) [pweight=pweight], vce(r).  $controls = wave gender
  prior democrat indep otherpol midwest south west age1-age4 anychildren
  loghhinc associatemore fulltime parttime selfemp unemp student; loghhinc
  is the log of the midpoint of the income bracket (DP12 Fig. 1).  Table
  6: SurveyStageIIAB_final.dta, drop if rand==0, same controls.  T1 is
  the ACS ("74") arm.

  Blind-mode exposure (step 6, 2026-11-09).  The blind generation prompt
  states no pinned value or SE at printed precision or rounded to 1-3
  significant figures (the only hit, "13", is the list number of the
  thirteenth claim), and carries no do-file text; the dataset listing
  names the raw files' columns (the follow-up raw files already carry
  merged covariates such as pweight and loghhinc).  The abstract's first
  500 characters print no numbers.  The paper parser takes the
  ECONtribute cover line ("Funding by the Deutsche
  Forschungsgemeinschaft ...") as the title.

  Mount cost (2026-11-09).  The runner extracts the zip once into
  .cache/datasets/<slug>/ (6.13 GB; a fresh blind run including
  extraction, strip and listing took about 12 s on this host, a cached
  run about 3 s); the script-free copy hard-links its files (link count
  2, no extra bytes) and the sandbox bind-mounts it read-only, so a run
  copies nothing.  The dataset listing reads only the .dta headers.

