# Paper says X, humans got Y.  Each reproduced_value is the replicators'
# value after FIXING THE CODING ERROR (removing the duplicated survey
# observations), from DP20 Table 3 cols 3-4 (levels) and Table 1 cols
# 3-4 (IQR) — the meta-database rows "Fixing coding error which removes
# three-quarters of the observations which are duplicates" (IQR) and the
# Table 5 col 1/2 coding-correction rows (levels).  DP20 first reproduced
# the printed numbers exactly from the original data and code (its Table
# 1 cols 1-2, Table 3 cols 1-2), so the discrepancy is the data error,
# not a failure to run.  For the IQR columns the paper's own stated
# five-member restriction matters as much as the duplicates; those
# variants are in the per-claim notes and in the entry notes.
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 13.21
    outcome: does_not_match
    notes: >
      DP20 Table 3 col 3 (corrected data, duplicates removed): 13.21 (SE
      32.35), N = 1,146 workers, p = 0.684 — the point estimate drops by
      ~three-quarters and loses significance.  Meta-database row labels
      this "duplicates AND sample restriction", but DP20's table is the
      duplicates-only correction (the five-member rule does not apply to
      the worker-level regression).
  - claim_id: 1
    reproduced_value: -24.24
    outcome: does_not_match
    notes: >
      DP20 Table 3 col 4 (corrected data): -24.24 (SE 41.90), N = 420
      workers, p = 0.566 — the sign flips.
  - claim_id: 2
    reproduced_value: -72.24
    outcome: does_not_match
    notes: >
      DP20 Table 1 col 3 (corrected data, duplicates removed, no
      five-member restriction, as in the original code): -72.24 (SE
      17.37), N = 324.  Imposing the paper's stated five-member
      restriction instead: on the original data -50.91 (43.09), N = 128
      with 3 treated property-years, p = 0.243 (col 5); on the corrected
      data -65.81 (45.36), N = 70 with 1 treated property-year (col 7) —
      DP20 concludes the data cannot support the analysis.
  - claim_id: 3
    reproduced_value: -79.78
    outcome: does_not_match
    notes: >
      DP20 Table 1 col 4 (corrected data, no five-member restriction):
      -79.78 (SE 22.67), N = 116.  With the five-member restriction: on
      the original data -90.86 (84.53), N = 45, 2 treated, p = 0.295 (col
      6); on the corrected data inestimable — 26 property-years, none
      above the threshold (col 8).
  - claim_id: 4
    reproduced_value: 1146
    outcome: does_not_match
    notes: DP20 Table 3 col 3 — removing duplicates cuts the 300 ha worker sample from 4,770 to 1,146.
  - claim_id: 5
    reproduced_value: 420
    outcome: does_not_match
    notes: DP20 Table 3 col 4 — 1,583 -> 420 workers.
  - claim_id: 6
    reproduced_value: 324
    outcome: does_not_match
    notes: >
      DP20 Table 1 col 3 — 327 -> 324 property-years (the six workers
      assigned to two properties are dropped).  With the five-member
      restriction: 128 (original data) / 70 (corrected).
  - claim_id: 7
    reproduced_value: 116
    outcome: does_not_match
    notes: DP20 Table 1 col 4 — 118 -> 116 property-years; with the five-member restriction 45 / 26.
  - claim_id: 8
    reproduced_value: 98
    outcome: matches
    notes: DP20 Tables 1 and 3, col 3 — 98 clusters before and after removing duplicates.
  - claim_id: 9
    reproduced_value: 36
    outcome: matches
    notes: DP20 Tables 1 and 3, col 4 — 36 clusters before and after removing duplicates.

notes: >
  Headline finding (as published): an RD at El Salvador's 1980 500 ha
  land-reform threshold shows cooperatives grow fewer cash crops and more
  staple crops, are less productive in cash crops and more in staples
  (Tables 2-4), and that cooperative workers have higher earnings ($60 per
  month, Table 5 col 1) and a ~$43 lower within-property interquartile
  range of earnings (col 3).  The I4R comment (DP20 / JPE 2023) and the
  author's own note withdraw the Table 5 / Figure 6 earnings results; the
  productivity results stand (the meta-database's 20 "recoding in a
  different software" rows reproduce Tables 2-3 exactly, e.g. -.594
  (.152), -.234 (.104), .439 (.194), 17.34 (7.236)).

  Original analysis in Stata (Montero's code and the comment's
  Replication_file.do); language: r is the reproduction target.

  Curation pass (2026-10-21).  Pinned 10 claims, all from Table 5 — the
  only exhibit the package can produce: the four Above500 coefficients
  (each with its SE in standard_error) and six counts (observations per
  column; clusters per bandwidth).  Values exactly as printed in the
  published JPE version (author-site copy of the typeset article), and
  identical to the meta-database's o_coeff / o_std_err and DP20's
  reproductions.  Mean dependent variables are in the contexts, not
  pinned.

  What was read.  The published JPE PDF (Tables 2, 3, 5, the data and
  empirical-strategy sections); the 12 January 2018 draft (for dates
  only); DP20 (all of it, EconStor, 16 pp.); Montero's 2023-03-01 note;
  the Dataverse API metadata; the whole package and the comment
  authors' own zip (andreaskotsadam.files.wordpress.com, same .dta, same
  .do up to paths), downloaded to a scratch directory (never committed);
  the meta-database's 204 rows (team 16).

  Independent cross-check (not the package code; Python/statsmodels on
  the package's .dta, mimicking the original specification): columns
  1-2 reproduce exactly — 60.495 (31.03), N = 4,770, 98 clusters; 52.791
  (40.64), N = 1,583, 36 clusters.  Columns 3-4 reproduce only with
  Stata's percentile definition (collapse (iqr)): -42.967 (17.84),
  N = 327 and -51.785 (24.92), N = 118; numpy's default linear
  interpolation gives -36.27 / -43.06 instead.  In the original data,
  199 of the 327 (73 of 118) property-years have fewer than five
  workers and 94 (33) have exactly one — the five-member rule the paper
  states was not applied.  Of the 5,060 rows only 1,260 are unique on
  the comment's identifying variables (1,195 of 4,770 within 300 ha).

  How the printed numbers were produced (package-only; never in
  contexts).  From the comment's re-run of the original code: earnings
  levels are reg hh_inc_pc_real Above500 norm_dist
  c.norm_dist#Above500 i_year* sex age age2 if abs(norm_dist) < 300
  (or 150), cluster(Expropretario_ISTA) — note the sex / age / age2
  controls, which Table 5's note does not mention (the paper mentions
  them only for the Figure 6 quantile regressions).  The IQR columns
  collapse (iqr) hh_inc_pc_real by match_id Expropretario_ISTA i_year*
  and regress on the same RD terms with year dummies only.  The outcome
  is CPI-deflated (hh_inc_pc_real = hh_income_pc x a year-specific
  index / 100) although the paper says "dollars"; the index omits 2010,
  so all 798 rows from 2010 get real earnings 0 (DP20 fn. 5; their
  correction, hh_inc_pc_realC, barely moves the estimates).  The data
  also cover 2000-2001, not just the paper's 2002-2013 (survey years
  2000, 2001, 2004-2013).  Key variables: Above500, norm_dist (own_amt, the
  former owner's cumulative landholdings, minus 500), norm_dist_Above, i_year1-i_year12,
  Expropretario_ISTA (former owner), match_id (property), hh_income_pc,
  sex, age, age2.  The do-file's corrected section (duplicates drop on
  dept munic canton year hh_income hh_income_pc Landholding_Type
  Total_Workers age norm_dist, then 43 hand-coded drop-if lines checked
  against the raw survey, then dropping 6 workers assigned to two
  properties) produces DP20 Tables 1-3.  It also runs net install
  gr0002_3 / ssc install grqreg (network) for Figure 6.

  Benchmark implications.  Seeded mode shows the model a script that
  computes BOTH the original and the corrected estimates; independent
  mode sees only the .dta and the paper, whose description
  (five-member rule, no demographic controls, nominal dollars, 2002-2013)
  does not match the code that produced the printed numbers.  A faithful
  independent reproduction is therefore expected to MISS the printed IQR
  values; reproducing them requires replicating the paper's mistakes.
  Retally agreeing with I4R requires removing the duplicates, which the
  paper gives no hint of.

  Left out.  Tables 2-4 (productivity; data not in this package), Table
  6+ (credit, migration, canton outcomes), Figure 6 quantile estimates
  (figure only), and DP20's Table 2 alternative-threshold estimates
  (+182.20 / -28.35 / +157.08 / -3.53).
