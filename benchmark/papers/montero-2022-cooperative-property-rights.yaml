# Original paper: Montero, E. (2022). "Cooperative Property Rights and
#   Development: Evidence from Land Reform in El Salvador." Journal of
#   Political Economy, 130(1), 48-93.  doi:10.1086/717042
#
# I4R replication report: Discussion Paper 20 (Kjelsrud, Kotsadam &
#   Rogeberg, "... A Comment", March 2023, updated version of March 10),
#   from the Oslo Replication Games; accepted and published as a JPE
#   comment (JPE 131, 2023, doi:10.1086/725235).  Verdict: NOT
#   reproducible as a finding — the worker-income results (Table 5 and
#   Figure 6) rest on two mistakes: three-quarters of the household-survey
#   observations are duplicates (a module-merge error), and the stated
#   "at least five members" restriction for the inequality measure was
#   never implemented.  Corrected, "the data sources and research design
#   provide no credible evidence regarding the causal effects of ownership
#   structure on income levels and inequality".  The productivity results
#   (Tables 2-4) are not challenged.  Montero's own note (2023-03-01,
#   on his website) accepts the error: "Once the data merging error is
#   corrected, these results are no longer valid."
#
# Why this paper: the benchmark's "paper says X, humans got Y" case.  The
#   pinned values are the published Table 5; the I4R findings carry the
#   replicators' corrected values, so a run can show whether Retally
#   reproduces the printed (erroneous) number, the corrected one, or
#   neither.
#
# IMPORTANT — what the package is.  dataset.source (Dataverse AMD3NO) is
#   NOT Montero's original JPE package: it is the replication package of
#   the I4R comment (its Dataverse description says so, deposited
#   2023-02-27 in the JPE dataverse, released 2023-03-31).  It holds
#   (a) Montero's ORIGINAL household-survey analysis file,
#   ehpm_incomemodule_wreform.dta — byte-identical (md5 063c3aaf...) to
#   the copy in the comment authors' own zip, where it is dated
#   2021-06-10, i.e. the uncorrected data WITH the duplicates — and (b)
#   the comment authors' Replication_file.do, which first re-runs the
#   original Table 5 specifications and then drops the duplicates and
#   re-estimates.  So the data are not corrected; the script contains
#   both the original and the corrected analysis.  Only Table 5 (and
#   Figure 6) can be computed from this package: the agricultural-census
#   data behind Tables 2-4 are not in it (Montero's original JPE
#   supplement is on journals.uchicago.edu, 403 to curl), which is why no
#   Table 2-4 claims are pinned.

id: montero-2022-cooperative-property-rights
i4r_report_url: https://www.econstor.eu/bitstream/10419/268943/1/I4R-DP020.pdf
i4r_report_doi: 10.1086/725235  # The comment as published in the JPE
# Target language for regeneration (the original and the package are
# Stata; Retally generates R and reads the .dta with haven).
language: r
outcome_label: not_reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  First public version: the job-market-paper
# era working paper — Montero's World Bank Development Impact blog post
# on it is dated December 2017 (cited in DP20); the earliest PDF found is
# the 12 January 2018 draft (University of Toronto seminar file), whose
# income table (then Table 12) has different numbers (55.06 / 53.73 /
# -37.06 / -53.06, N = 6,314).  JPE: electronically published
# 2021-12-09, print January 2022.  Package: Harvard Dataverse
# doi:10.7910/DVN/AMD3NO version 1.0, deposited 2023-02-27, released
# 2023-03-31 (Dataverse API) — AFTER the I4R DP (March 2023) and
# Montero's note (2023-03-01); the .dta inside dates from 2021-06-10.
publication_date: "2017-12"
package_release_date: "2023-03-31"

paper:
  # The JPE typeset version as posted on the author's site ("Electronically
  # published December 9, 2021 / JPE vol. 130 no. 1, January 2022",
  # pp. 48-93, 46 pages); checked 2026-10-21: 200 application/pdf, %PDF
  # magic, to both a Retally-curation and a python-requests user agent.
  # The publisher PDF (journals.uchicago.edu) answers 403.  The
  # candidate list's Jan 2018 Toronto draft was NOT used: its numbers
  # differ from the published table.  Text-extraction caveat: in this PDF
  # the minus sign extracts as "2" (Table 5 reads "242.97**" for
  # -42.97, Table 2 "2.594***" for -.594).
  source: https://emontero23.github.io/emwebsite/montero_cooperatives_jpe.pdf
  title: "Cooperative Property Rights and Development: Evidence from Land Reform in El Salvador"
  authors:
    - Eduardo Montero

dataset:
  source: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/AMD3NO
  access_notes: >
    Harvard Dataverse (doi:10.7910/DVN/AMD3NO) version 1.0, CC0, fully
    open — 3 files, all unrestricted (Dataverse API, checked 2026-10-21):
    ehpm_incomemodule_wreform (Stata 14 .dta, 4.56 MB original; 5,060
    rows x 119 columns; some strings are latin-1, not UTF-8),
    Replication_file.do (the I4R comment's script) and README.pdf.  The
    .dta was ingested by Dataverse (listed as
    ehpm_incomemodule_wreform.tab, 2.99 MB); the downloader requests
    ?format=original, so it arrives as ehpm_incomemodule_wreform.dta
    (checked by hand: 4,562,298 bytes, Stata release 118).  No archives.
    This is the comment's package, not Montero's
    original: it covers Table 5 / Figure 6 only, with Montero's
    uncorrected (duplicated) data — see the header comment.

code_repo:
  url: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/AMD3NO

original_claims:
  - description: earnings_level_above500_bw300
    value: 60.49
    claim_type: coefficient
    standard_error: 31.03
    sample_size: 4770
    unit: dollars per month (household earnings per capita)
    location: "Table 5, column 1 (Household Earnings per Capita, Levels, bandwidth 300)"
    context: >
      Table 5 ("Impact of Ownership Type on Earnings and Earnings
      Distributions"), column 1.  Regression discontinuity at the 1980
      land reform's 500 ha cumulative-landholding threshold: properties of
      former owners above 500 ha became worker cooperatives, those below
      stayed outside-owned haciendas.  Outcome: household earnings per
      capita in the previous month, in dollars per month, of agricultural
      workers in the El Salvador household surveys (Encuesta de Hogares
      de Propositos Multiples, 2002-2013), matched to cooperatives and
      haciendas through the survey's questions on working as a
      cooperative member or hacienda laborer (matching limited to cantons
      with only one cooperative/large hacienda).  Regressor: Above500, an
      indicator for the property's former owner having over 500 ha in
      cumulative landholdings in 1980.  Linear control in the former
      owner's total landholdings estimated separately on each side of the
      cutoff (equation 1), sample limited to properties within 300 ha of
      the threshold, survey-round fixed effects, standard errors
      clustered at the former-owner level.  Observations are workers
      (4,770; 327 properties; 98 clusters; mean of the dependent
      variable 73.59).
  - description: earnings_level_above500_bw150
    value: 52.79
    claim_type: coefficient
    standard_error: 40.61
    sample_size: 1583
    unit: dollars per month (household earnings per capita)
    location: "Table 5, column 2 (Household Earnings per Capita, Levels, bandwidth 150)"
    context: >
      Table 5, column 2: the same specification as column 1 (household
      earnings per capita in the previous month on Above500, local linear
      control in the former owner's landholdings on each side of the
      500 ha cutoff, survey-round fixed effects, standard errors clustered
      by former owner) with the sample limited to properties within 150 ha
      of the threshold (1,583 workers; 118 properties; 36 clusters; mean
      of the dependent variable 74.81).  Not statistically significant.
  - description: earnings_iqr_above500_bw300
    value: -42.97
    claim_type: coefficient
    standard_error: 17.82
    sample_size: 327
    unit: dollars per month (interquartile range of household earnings per capita)
    location: "Table 5, column 3 (Household Earnings per Capita, Interquartile Range, bandwidth 300)"
    context: >
      Table 5, column 3, the paper's inequality result ("the interquartile
      range of cooperatives is approximately $43 per month lower").
      Outcome: the interquartile range (75th minus 25th percentile) of
      household earnings per capita in the previous month across the
      surveyed workers of each property, with the sample limited to
      cooperatives and haciendas for which there are at least five
      members represented in the household surveys.  Regressor Above500;
      linear control in the former owner's landholdings on each side of
      the 500 ha cutoff; properties within 300 ha of the threshold;
      survey-round fixed effects; standard errors clustered at the
      former-owner level (327 observations and properties; 98 clusters;
      mean of the dependent variable 38.63).
  - description: earnings_iqr_above500_bw150
    value: -51.79
    claim_type: coefficient
    standard_error: 24.79
    sample_size: 118
    unit: dollars per month (interquartile range of household earnings per capita)
    location: "Table 5, column 4 (Household Earnings per Capita, Interquartile Range, bandwidth 150)"
    context: >
      Table 5, column 4: the interquartile-range specification of column 3
      (properties with at least five members represented in the surveys,
      Above500, local linear control on each side of the cutoff,
      survey-round fixed effects, former-owner clustering) with properties
