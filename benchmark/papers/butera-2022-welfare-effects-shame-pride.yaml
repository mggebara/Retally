notes: >
  Headline findings (Table 5): public recognition raises points scored by
  105.01 (12.25) in the Prolific sample, 134.41 (22.56) at Berkeley and
  103.61 (45.25) at BU; the financial incentive by 185.74 (12.56), 177.76
  (22.04) and 118.33 (39.62); N 2904, 1152 and 354 participant-rounds (968,
  384 and 118 participants).  Table 7 Berkeley, action-signaling model:
  gamma_1 0.30, rho 0.87, c 0.21; predicted financial incentive effect
  2.33 hundred points against an actual 1.78.

  Paper text and how it was verified.  The published article was not read
  (paywalled).  The source is NBER WP 25637 revised July 2021.  Table 5:
  every one of the 13 meta-database "table 5" rows (o_coeff_dbl /
  o_std_err_dbl) equals the WP cell of the same row and column after
  rounding the WP's 2-decimal print to the DB's 4 significant digits
  (105.01 -> 105.0, 185.74 -> 185.7, 134.41 -> 134.4, 177.76 -> 177.8,
  103.61 -> 103.6, 118.33 -> 118.3, 106.70 -> 106.7, 191.96 -> 192.0,
  -3.12 vs -3.117, -3.21 vs -3.213, -3.27 vs -3.270; 20.61 and -18.85
  exact) and every SE is identical.  The DB transcribes DP64 Table 1's
  "Original" column (Stata default format); the package's own Table 5
  code exports b(%8.2f) se(%8.2f), the WP's format.  Table 7: all 32 DB
  rows equal WP point estimates (the DB's SEs are the printed percentile
  CIs divided by 3.92, e.g. 0.34 [0.16, 1.47] -> 0.3342; c is printed in
  panels a and b, so each sample's c has two rows).  Table 6: the DB's three rows are the
  curvature-times-SD statistic, 0.245 (Prolific, equals the WP), 0.110
  (Berkeley; WP 0.114) and -0.077 (BU; WP -0.085); DP64 Table 2's
  "Original" column agrees with the DB, so the WP's Table 6 is an earlier
  computation and nothing from Table 6 is pinned.  No DB value disagrees
  with DP64; no DB typo was found.

  Independent cross-check (2026-11-09, Python on the raw CSVs, not
  Stata): applying the package's build logic (attention check failed if
  attention_check is non-missing; coherent = preference switches 0 times,
  once from no to yes, or twice starting from no; drop participants with
  more than 3000 points in any round; the package's order coding) gives
  Table 5 columns (1)-(3) exactly: 105.01 (12.25), 185.74 (12.56), N 2904,
  968 participants; 134.41 (22.56), 177.76 (22.04), 1152, 384; 103.61
  (45.25), 118.33 (39.62), 354, 118.  The Table 7 point estimates for all
  three samples also come out as printed (Prolific 0.12, -0.004, 0.58,
  0.08, prediction 2.41, actual 1.82; Berkeley 0.30, -0.004, 0.87, 0.21,
  2.33, 1.78; BU 0.38, 0.002, 1.61, 0.34, 1.48, 1.18).

  Curation pass (2026-11-09).  13 claims.  Why Berkeley only in Table 7:
  the structural code (welfare_estimates.do) does NOT drop the
  more-than-3000-points participants that Table 5 drops, so its Prolific
  sample has 970 participants instead of the paper's 968 and its Prolific
  "actual" effect is 1.82 although Table 5 prints 185.74 points; a
  reproduction that follows the paper's stated final sample would miss
  the Prolific Table 7 values by about 2 percent.  BU's Table 7 values
  move with the order-dummy coding error (c 0.34 -> 0.30, prediction 1.48
  -> 1.65).  Berkeley is affected by neither (no high-point participant;
  the corrected coding leaves its values unchanged but the prediction,
  2.33 -> 2.34).  The order-dummy error moves the BU Table 5 estimates by
  about a third of an SE (DP64 Table 1), inside the SE-aware band.  Left
  out: Table 5 column (4) (group-size interactions), the order-dummy
  F-tests and control means, Tables 1-4 and 9 (YMCA; no I4R row, and the
  WP's Table 6 mismatch rules out pinning uncovered cells), Table 6 (WP
  differs from the package output), Table 8, panel (b) of Table 7 and the
  other Table 7 columns, the appendix.

  Package-only facts (never in contexts).  Raw columns (Stata lowercases
  them): attention_check, preference_0 ... preference_1700 (yes/no
  public), pref_anom_<j>_1 / pref_rec_<j>_1 (WTP sliders; WTP is minus the
  anonymous slider, else the recognition slider), condition (round order
  string such as AER), anompts / recogpts / earnpts, badgegroupsize.
  Label_Rounds.do assigns order 1-3 per round and condition (mis-coded
  for AER, EAR, RAE and REA, DP64 Appendix A); Table 5 regresses pts on
  SR ownpay o1 o2, clus(id); the Table 6 / 7 WTP regression uses interval
  midpoints (interval + 0.5, in hundreds of points) for intervals 0-16.
  Table 7: gamma2 = r2, gamma1 = sqrt(r1^2 - 4 r2 r0), rho = (gamma1 -
  r1) / (2 gamma2 abar_PR), c = (r1 + 2 r2 abar_PR) / tau, prediction =
  p / c with p = 0.5 (Berkeley, BU) or 0.2 (Prolific) dollars per hundred
  points, where abar_PR = anonymous-round mean + tau, all in hundreds of
  points; the printed value is the bootstrap's e(b), i.e. the full-sample
  estimate.  bu_qm221_survey_data.csv is a separate BU class not in the
  main tables.

  Blind-mode exposure (step 6, 2026-11-09).  Both modes reached
  llm_answer_pending at the methodology-summary prompt.  Neither prompt
  states a pinned value or SE at printed precision or rounded to 1-3
  significant figures (the only hit, "2.3", is the section number "2.3
  Structural Versus Reduced-Form"), and neither carries do-file text.
  The paper text in the prompt runs from the title page into Section 4
  (YMCA), so none of Tables 5-7 is in it.  The paper parser takes the NBER
  cover line ("NBER WORKING PAPER SERIES") as the title.

  What was read.  NBER WP 25637 (July 2021) pp. 1-33 and Tables 1-9; DP64
  in full; the 51 meta-database rows; README.pdf / README.docx; the Table
  5 and Table 7 parts of charity_reduced_form_analysis.do and
  welfare_estimates.do, the build do-files; text of Experiment details
  appendix.pdf; the strip-rule classification of the extracted package.

  What could not be verified.  The published article itself was not read,
  so the published Table 5 / Table 7 print format is inferred from the
  package's export code and the WP; the authors' Stata code was not run
  (no Stata here); the cross-check above is Python, not R.

  Original analysis in Stata 15/16; language: r is the reproduction target.
