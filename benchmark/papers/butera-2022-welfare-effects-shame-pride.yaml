# Original paper: Butera, L., Metcalfe, R., Morrison, W., & Taubinsky, D.
#   (2022). "Measuring the Welfare Effects of Shame and Pride." American
#   Economic Review, 112(1), 122-168.  doi:10.1257/aer.20190433 (January
#   2022 issue; Crossref created 2021-12-28, issued 2022-01-01).  The I4R
#   wanted list and meta-database word the title "... of Pride and Shame";
#   the published title is used here.
#
# Reproduction report: Fries, T. (2023).  "Replication Report: The Welfare
#   Effects of Pride and Shame."  I4R Discussion Paper No. 64 (September
#   2023, report dated July 26, 2023; EconStor hdl:10419/276252; found by
#   web search 2026-11-09, the candidates file lists no DP).  I4R First
#   Meta Database: 51 rows under the paper title (48 with values, entered
#   2023-09-21, replication team 53).  Verdict: reproducible -- DP Sec. 2:
#   "I can computationally reproduce all results reported in the paper
#   using the paper's replication package" (Stata 17; the README says 15,
#   but the code uses Stata 16 syntax).  The DB's best_describe_compreprod
#   agrees ("Analysis and cleaning code produce the same output as
#   presented in the paper"); perfect_reproduction is "No" with
#   why_not_perfect_repro "Two minor coding errors in the replication
#   package".  Those two errors are what every paired DB row records: all
#   48 rows with values are "Correcting Coding Error" variants (r_coeff_dbl is the
#   CORRECTED estimate, not a recomputation), two are specification-curve
#   rows without values, one is empty; result_same is blank on all but the
#   two specification-curve rows.  (1) The round-order dummies of Table 5
#   are mis-coded for four of the six round orders (DP Appendix A); fixing
#   them moves the BU estimates by about 12 percent (DP Table 1) and,
#   through the structural model, the Table 7 values that use them (DP
#   Table 4).  (2) The curvature-times-SD statistic of Table 6 divides by
#   the linear coefficient instead of the slope at the population average
#   (DP Appendix B; Prolific 0.245 becomes 0.394).  The DP's Table 1
#   "Original" columns are a same-specification recomputation of Table 5
#   with the authors' code; they are recorded in i4r_replicator_findings.
#
# Why this paper:
#   1. A within-subject real-effort experiment (three rounds per
#      participant: anonymous, publicly recognized, paid) in three samples,
#      with an incentive-compatible WTP-for-recognition elicitation over 18
#      performance intervals, plus a closed-form structural model of social
#      signaling identified from the reduced-form estimates: new to the
#      catalog.
#   2. The package ships only RAW Qualtrics exports (.csv), so every number
#      needs the cleaning chain: the attention-check and "coherent
#      preferences" exclusions, signing the WTP answers, reshaping to the
#      participant-round and participant-interval level.
#   3. A manually placed openICPSR package (data_access: manual), 8 MB
#      zipped / 31 MB unpacked, with no shipped results files.
#
# What original_claims pins: Table 5 columns (1)-(3) (Prolific, Berkeley,
#   BU), the public recognition and financial incentive coefficients with
#   SEs and each column's number of observations; Table 7 for the Berkeley
#   sample: the action-signaling model's linear PRU parameter, reference
#   standard and cost parameter (panel a), and the model's predicted effect
#   of the financial incentive (panel c).  13 claims, values exactly as
#   printed in the open text (2 decimals).  Three are count claims.
#
# Paper text: the published article is paywalled and no open copy of it
#   was found (AEA, CBS research portal, author pages; Morrison's 2023
#   Berkeley dissertation on eScholarship answers 403 to scripts and was
#   not opened).  The source is NBER Working Paper 25637 as revised July
#   2021 (title page "March 2019, Revised July 2021"; PDF CreationDate
#   2021-07-15), the version current five months before publication.  Cell
#   check against the meta-database (which transcribes DP64's output of the
#   authors' code at Stata's default 4 significant digits, e.g. 185.7):
#   Table 5's 13 coefficient cells and 13 SEs agree (the WP prints the
#   package's own esttab format, 2 decimals: 185.74 rounds to 185.7; every
#   SE is identical), and all 32 Table 7 rows (Prolific, Berkeley, BU;
#   bootstrapped CIs converted to SEs in the DB) equal the WP's printed
#   point estimates.  Table 6 does NOT match in two of its three DB cells:
#   the curvature-times-SD statistic is 0.114 / -0.085 in the WP for
#   Berkeley / BU against 0.110 / -0.077 in the DB and in DP64's "Original"
#   column (its CIs and the Berkeley -R''/R' also differ: WP 0.027, DP
#   0.026), so the WP's Table 6 predates the package's final run.  Because
#   of that, only cells the I4R record covers are pinned: Table 5's
#   coefficients and SEs (DB rows), Table 5's Observations row (DP64 Table
#   1 prints it under "Original"), and Table 7 (DB rows).  Nothing from
#   Tables 1-4 (YMCA, no I4R row), Table 6, 8 or 9 is pinned.

id: butera-2022-welfare-effects-shame-pride
i4r_report_url: https://www.econstor.eu/bitstream/10419/276252/1/I4R-DP064.pdf
# Target language for regeneration (the original is Stata 15/16 with
# estout, binscatter and cdfplot; Retally generates R and reads the .csv
# files).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  publication_date is the FIRST public
# version: NBER Working Paper 25637, March 2019 (title page "March 2019,
# Revised July 2021"; it was "previously circulated under the title 'The
# Deadweight Loss of Social Recognition'", presented as a seminar in March
# 2019, web search 2026-11-09).  The journal version: Crossref issued
# 2022-01-01 (created 2021-12-28).  package_release_date is the DataCite
# registration of doi:10.3886/E145141V1 (registered 2021-12-27T14:07:14Z,
# DataCite API 2026-11-09); the openICPSR page itself needs a login.  The
# package README.pdf is dated 2021-12-24 (PDF CreationDate).
publication_date: "2019-03"
package_release_date: "2021-12-27"

paper:
  # NBER Working Paper 25637, revised July 2021, open PDF; checked
  # 2026-11-09: 200 application/pdf, 1,187,290 bytes, 104 pp. (paper,
  # main tables pp. 49-57, appendices).  PDF CreationDate 2021-07-15.
  source: http://www.nber.org/papers/w25637.pdf
  title: "Measuring the Welfare Effects of Shame and Pride"
  authors:
    - Luigi Butera
    - Robert Metcalfe
    - William Morrison
    - Dmitry Taubinsky

dataset:
  source: benchmark/manual-packages/T53/145141-V1.zip
  data_access: manual
  access_notes: >
    AEA Data and Code Repository on openICPSR, project 145141, version V1
    (doi:10.3886/E145141V1); login and terms-of-use click-through required,
    so the zip was downloaded by hand (2026-11-09) and placed unchanged at
    benchmark/manual-packages/T53/145141-V1.zip (8,033,487 bytes, md5
    e4a630521216084283fab7fd3b471cef; SOURCE.txt beside it).  V1 is the
    only version.  42 zip entries (33 files, 9 directories), 31,154,441
    bytes uncompressed, all under Packet/, no nested archives.  Contents:
    README.pdf (5 pp., dated 2021-12-24) and README.docx (its Word source;
    data provenance, run order, a table-to-program map, no estimates);
    "data dictionary.xlsx" (variable lists of the raw files, no numbers);
    Raw Data/ with eight .csv files: the four charity real-effort Qualtrics
    exports (prolific_survey_data.csv 1,017 participants,
    berkeley_survey_data.csv 407, bu_qm222_survey_data.csv 121 (the BU
    sample), bu_qm221_survey_data.csv 57 (a BU class not used in the main
    tables)), the YMCA survey, treatment assignment and membership files,
    and ymca_scans.csv (21 MB, 733,556 check-ins); Build/ with 7 Stata
    do-files and Analysis/Code/ with 8 (plus master_file.do); "QSF files
    and scripts/" with five Qualtrics .qsf survey definitions and
    "Experiment details appendix.pdf" (31 pp., LaTeX, 2021-07-13: survey
    questions and instructions, no results); empty Analysis/Output/,
    "Prepped Data/" and temp/ directories.  No log, table or figure output
    ships.  The script-free copy (independent / blind) withholds the 16
    .do files by suffix (benchmark.strip_rule.classify_tree on the
    extracted package, 2026-11-09) and nothing else: neither PDF, the docx
    nor the xlsx prints a pinned value (grepped at printed precision and
    rounded).  Project page:
    https://www.openicpsr.org/openicpsr/project/145141/version/V1/view

original_claims:
  # ---- Table 5: effects of public recognition and financial incentives on points ----
  - description: public_recognition_points_prolific_table5_col1
    value: 105.01
    claim_type: coefficient
    standard_error: 12.25
    unit: points scored in the round
    location: "Table 5, Public recognition, column (1) Prolific"
    context: >
      Table 5 ("The effect of public recognition and financial incentives
      on performance in the charitable contribution experiments"), column
      (1).  OLS of points scored in a round of the button-pressing task on
      indicators for the Publicly-Shared Effort Round (public recognition)
      and the round with performance-based pay for the participant
      (financial incentives), the Anonymous Effort Round being the omitted
      round, with dummies for the order in which the round appeared to the
      participant (first, second, third).  One observation per participant
      and round.  Sample: the Prolific experiment after the paper's two
      preregistered exclusions (participants failing the attention check,
      and participants with "incoherent" preferences for public
      recognition).  Standard errors clustered at the participant level.
      The entry is the public recognition coefficient.
  - description: financial_incentives_points_prolific_table5_col1
    value: 185.74
    claim_type: coefficient
    standard_error: 12.56
    unit: points scored in the round
    location: "Table 5, Financial incentives, column (1) Prolific"
    context: >
      Table 5, column (1): the same regression of points scored on the
      public recognition and financial incentive round indicators with
      round-order dummies in the Prolific sample; the entry is the
      financial incentives coefficient (Prolific incentive: two cents for every
      ten points, paid to the participant).  Participant-clustered standard errors.
  - description: public_recognition_points_berkeley_table5_col2
    value: 134.41
    claim_type: coefficient
    standard_error: 22.56
    unit: points scored in the round
    location: "Table 5, Public recognition, column (2) Berkeley"
    context: >
      Table 5, column (2): the column (1) regression (points on the public
      recognition and financial incentive round indicators, round-order
      dummies) in the Berkeley experiment, after the attention-check and
      incoherent-preference exclusions.  Participant-clustered standard
      errors.  The entry is the public recognition coefficient.
  - description: financial_incentives_points_berkeley_table5_col2
    value: 177.76
    claim_type: coefficient
    standard_error: 22.04
    unit: points scored in the round
    location: "Table 5, Financial incentives, column (2) Berkeley"
    context: >
      Table 5, column (2), Berkeley sample: the financial incentives
      coefficient (incentive five cents for every ten points).  Same regression,
      exclusions and participant-clustered standard errors.
  - description: public_recognition_points_bu_table5_col3
    value: 103.61
    claim_type: coefficient
    standard_error: 45.25
    unit: points scored in the round
    location: "Table 5, Public recognition, column (3) BU"
    context: >
      Table 5, column (3): the column (1) regression in the BU (Boston
      University classroom) experiment, after the attention-check and
      incoherent-preference exclusions.  Participant-clustered standard
      errors.  The entry is the public recognition coefficient.
  - description: financial_incentives_points_bu_table5_col3
    value: 118.33
    claim_type: coefficient
    standard_error: 39.62
    unit: points scored in the round
    location: "Table 5, Financial incentives, column (3) BU"
    context: >
      Table 5, column (3), BU sample: the financial incentives coefficient
      (incentive five cents for every ten points).  Same regression, exclusions and
      participant-clustered standard errors.
  - description: n_obs_prolific_table5_col1
    value: 2904
    claim_type: count
    unit: participant-rounds
    location: "Table 5, Observations, column (1) Prolific"
    context: >
      Number of observations in Table 5, column (1): participant-round
      observations (three rounds per participant) of the Prolific
      experiment's final sample.
  - description: n_obs_berkeley_table5_col2
    value: 1152
    claim_type: count
    unit: participant-rounds
    location: "Table 5, Observations, column (2) Berkeley"
    context: >
      Number of observations in Table 5, column (2): participant-round
      observations of the Berkeley experiment's final sample.
  - description: n_obs_bu_table5_col3
    value: 354
    claim_type: count
    unit: participant-rounds
    location: "Table 5, Observations, column (3) BU"
    context: >
      Number of observations in Table 5, column (3): participant-round
      observations of the BU experiment's final sample.

  # ---- Table 7: structural estimates, Berkeley sample ----
  - description: action_signaling_gamma1_berkeley_table7_panelA
    value: 0.30
    claim_type: coefficient
    unit: WTP in dollars per hundred points (structural PRU, linear term)
    location: "Table 7, panel (a) Action-signaling model parameter estimates, Berkeley, gamma_1^a"
    context: >
      Table 7 ("Structural estimates and tests of consistency"), panel (a),
      Berkeley row, first column: the linear coefficient of the quadratic
      structural public recognition utility of the action-signaling model,
      gamma_1 (a - rho abar) + gamma_2 (a - rho abar)^2 (Section 7.1,
      equation 5), with effort a in hundreds of points.  The structural
      parameters are functions of the reduced-form quadratic PRU r0 + r1 a
      + r2 a^2 estimated in Table 6, column (4) (OLS of stated WTP on the
      interval midpoint in hundreds of points and its square, the 1700+
      interval excluded, Berkeley final sample), with the comparison
      population being the experimental sample's performance under public
      recognition (Section 7.1, Appendix F).  The table prints the
      full-sample point estimate with a bootstrapped percentile confidence
      interval (1,000 replications clustered by participant).
  - description: action_signaling_rho_berkeley_table7_panelA
    value: 0.87
    claim_type: coefficient
    unit: multiple of average performance (reference standard rho)
    location: "Table 7, panel (a) Action-signaling model parameter estimates, Berkeley, rho^a"
    context: >
      Table 7, panel (a), Berkeley row: the action-signaling model's
      reference-standard parameter rho (image payoffs turn from negative
      to positive at rho times average performance), recovered from the
      Table 6 column (4) reduced-form quadratic PRU and the average points
      (in hundreds) scored with public recognition in the Berkeley sample
      (anonymous-round mean plus the Table 5 column (2) public recognition
      effect).  Full-sample point estimate; bootstrapped percentile
      confidence interval in the table.
  - description: cost_parameter_c_berkeley_table7_panelA
    value: 0.21
    claim_type: coefficient
    unit: dollars per hundred points squared (effort cost curvature c)
    location: "Table 7, panel (a) Action-signaling model parameter estimates, Berkeley, c"
    context: >
      Table 7, panel (a), Berkeley row, last column: the cost-of-effort
      parameter c of the quadratic material utility theta a - c a^2 / 2,
      identified by equating the model's predicted effect of public
      recognition (equations 7-8, from the Table 6 column (4) reduced-form
      PRU) with the public recognition treatment effect estimated in Table
      5, column (2), effort in hundreds of points.  Full-sample point
      estimate; bootstrapped percentile confidence interval in the table.
  - description: predicted_financial_incentive_effect_berkeley_table7_panelC
    value: 2.33
    claim_type: other
    unit: hundreds of points
    location: "Table 7, panel (c) Predicted and actual effects of financial incentives, Berkeley, Model prediction"
    context: >
      Table 7, panel (c), Berkeley row, "Model prediction": the structural
      model's predicted effect of the financial incentive on points scored
      (in hundreds of points), p / c, where p is the incentive of 5 cents
      for every ten points expressed per hundred points and c is the panel (a)
      cost parameter (Section 7.1, "Consistency with financial incentive
      effects").  Compared in the table with the directly estimated effect
      from Table 5.  Full-sample point estimate; bootstrapped percentile
      confidence interval in the table.

