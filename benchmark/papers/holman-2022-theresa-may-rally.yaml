original_claims:
  # ---- Table 4: global country-quarter analysis (the target of DP41) ----
  - description: intl_attack_table4
    value: 3.112
    claim_type: coefficient
    standard_error: 0.875
    unit: percentage points of executive approval
    location: "Table 4, International terrorist attack (All countries, attacks with more than 15 deaths)"
    context: >
      Table 4 ("Effect of Terrorist Attacks on Executive Approval
      Ratings").  Linear regression on time-series cross-sectional data of
      country-quarters: the percentage of the public approving of the
      executive in the quarter following the attack, regressed on an
      indicator for a major international terrorist attack (an attack with
      an international component under the Global Terrorism Database's
      definition and more than 15 deaths), the presence of a woman
      executive, their interaction, and controls for GDP growth, logged
      inflation, the left-center-right placement of the leader and
      elections, with country fixed effects and panel-corrected standard
      errors.  Sample: countries in the executive approval database that
      also appear in the Global Terrorism Database, 1975-2017.  This
      coefficient is the attack effect for men executives (the rally).
  - description: intl_attack_x_woman_exec_table4
    value: -4.333
    claim_type: coefficient
    standard_error: 1.859
    unit: percentage points of executive approval
    location: "Table 4, International terrorist attack x Woman executive"
    context: >
      Table 4, the paper's global test of the gender-revised rally
      framework: the coefficient on the interaction of a major
      international terrorist attack (more than 15 deaths) with a woman
      executive, in the same linear country-quarter regression of
      next-quarter executive approval (controls for woman executive, GDP,
      logged inflation, left-center-right placement of the leader and
      elections; country fixed effects; panel-corrected standard errors).
      Negative and significant at the 5% level in the paper.
  - description: n_obs_table4
    value: 4328
    claim_type: other
    unit: observations (country-quarters)
    location: "Table 4, Observations"
    context: >
      Number of country-quarter observations in the Table 4 regression
      (all countries, attacks with more than 15 deaths).

  # ---- Table 2: BES panel difference-in-differences ----
  - description: did_attack_x_time_like_may_table2
    value: -0.1274
    claim_type: coefficient
    standard_error: 0.0187
    unit: points on the 0-10 like/dislike scale
    location: "Table 2, column May likeability, Manchester attack * time"
    context: >
      Table 2 ("Difference-in-Difference, with Fixed Effects"), May
      likeability column.  British Election Study internet panel, using
      waves before and after the 22 May 2017 Manchester Arena bombing.
      Outcome: how much the respondent likes Theresa May, 0 (strongly
      dislike) to 10 (strongly like).  Regressors: Manchester attack (the
      respondent was surveyed after the attack in the attack wave, wave 12),
      time (0 for waves before the attack, 1 for waves from 12 onward),
      their interaction (the coefficient here), wave fixed effects, and
      controls for identifying as ethnically British, gender, Labour party
      membership, other party membership, income and ideology.  OLS
      according to the table note; standard errors in parentheses.
  - description: did_attack_like_may_table2
    value: 0.0178
    claim_type: coefficient
    standard_error: 0.0278
    unit: points on the 0-10 like/dislike scale
    location: "Table 2, column May likeability, Manchester attack"
    context: >
      Table 2, May likeability column: the coefficient on the Manchester
      attack (surveyed-after-the-attack) indicator in the same
      difference-in-differences regression (time, interaction, wave fixed
      effects, full controls).  Not significant.
  - description: did_time_like_may_table2
    value: -0.5007
    claim_type: coefficient
    standard_error: 0.0229
    unit: points on the 0-10 like/dislike scale
    location: "Table 2, column May likeability, Time"
    context: >
      Table 2, May likeability column: the coefficient on the time
