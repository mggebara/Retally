# Original paper: Holman, M. R., Merolla, J. L., & Zechmeister, E. J.
#   (2022). "The Curious Case of Theresa May and the Public That Did Not
#   Rally: Gendered Reactions to Terrorist Attacks Can Cause Slumps Not
#   Bumps." American Political Science Review, 116(1), 249-264.
#   doi:10.1017/S0003055421000861 (first published online 2021-08-26).
#
# I4R replication report: Jetter, M., & Stockley, K. (2023). "On the
#   Empirical Validity of 'Gendered Reactions to Terrorist Attacks Can
#   Cause Slumps not Bumps' (Holman et al., 2022)." I4R Discussion Paper
#   No. 41 (June 2023; I4R First Meta Database team 86).  The authors
#   replied in I4R DP 44 (July 2023) and published an APSR CORRIGENDUM
#   (doi:10.1017/S0003055424000820, online 2024-08-06, APSR 118(4),
#   2080-2081) that corrects Table 2 and Table 4.  (The candidate list
#   also mentions a 2023 Canadian Journal of Economics comment; no such
#   journal version was found on 2026-10-21 — DP41 appears to be the
#   only version of the comment.)
#
#   Verdict: NOT reproducible in the meta-database's sense
#   (perfect_reproduction = No, computational_reproduction = 0).  DP41
#   re-runs the package and gets the printed numbers (Table 1 col 1 of
#   DP41 = Table 4; Table B1 cols 1-2 = Table 2), but documents coding
#   errors behind them: (a) Table 4's election-quarter covariates are
#   mis-coded (no US elections, one house of Japan's Diet only, run-offs
#   coded inconsistently, assorted errors) and correcting them moves the
#   interaction from -4.333 (p = 0.020) to -3.452 (p = 0.058); (b) Table
#   2's "May best PM" outcome counts 35,060 wave 7-8 responses that were
#   about David Cameron as preferring May; (c) Table 2 col 2 is described
#   as a logit but estimated with xtreg.  Three further data errors in
#   the global panel (woman-executive coding, duplicated Macedonia rows,
#   1993 GTD gap) are reported as inconsequential.  The corrigendum
#   concedes errors "in the code" and "in one of the datasets" and
#   replaces both tables.
#
# Why this paper: a second "paper says X, humans got Y" case beside
#   Montero, here with a documented and conceded coding error in the
#   headline global table.  Pinned values are the PUBLISHED Table 4 and
#   Table 2; i4r_replicator_findings carry the replicators' corrected
#   values.
#
# IMPORTANT — package version.  dataset.source pins Harvard Dataverse
#   doi:10.7910/DVN/VHNPUO VERSION 1.0 (released 2021-08-26, with the
#   article).  Version 2.0 (2024-08-06) is the post-corrigendum package:
#   it replaces global_approval and replication_files.do with .v2 files
#   (global_approval.v2: 1,106,891 bytes vs 829,834) and adds the
#   corrected supplementary PDF, so it would not reproduce the published
#   numbers.  The downloader honours the `&version=1.0` query parameter
#   (src/retally/dataset/downloader.py, added with this entry) and records
#   the version in the package's metadata.json.  The cached copy was
#   checked file by file against the Dataverse API's version-1.0 file
#   list (names, sizes, md5: all 10 match; 4 of the 2.0-only files are
#   absent).

