notes: >
  Headline findings (Table 2): in Experiment 1 (public television) 27.97
  percent of the call group and 28.06 percent of the control group gave
  again within a year; the unconditional amount was $35.52 vs $35.49,
  the amount conditional on giving $127.00 vs $126.46, and the retention
  rate 32.68 vs 32.91 percent (N 439,510 call, 54,606 control).  In
  Experiment 3, 28.32 percent of the new-script group (N 10,780) and
  29.15 percent of the original-script group gave again.  The abstract's
  number is the experts' forecast ("would increase donor retention by 80
  percent"), which needs the Understanding America Study data not in the
  package, so it is not pinned.

  Paper text and how it was verified.  No open copy of the published
  article was found.  The catalog source is the October 29, 2019 AEA
  conference draft.  The I4R meta database cannot verify it: its 15
  rows record as "original" the team's own OLS differences (0.045
  (0.426) amount donated, -0.001 (0.002) percent donating as a share,
  -0.012 (0.010) number of gifts, 0.572 (1.207) amount given donating,
  -0.002 (0.004) retention), none of which the paper prints (none occurs
  in the draft either).  The rows' table labels are also loose: the
  "table 2, panel c" rows are Experiment 1 extensions (the OSF report
  says its extensions focus exclusively on Experiment 1), and row 890
  pairs the amount-donated original 0.045 (0.426) with the below-median
  Poisson incidence-rate ratio for the number of gifts, 0.998 (0.006)
  (OSF Table 6, printed there as "998").  The verification instead uses
  the team's OSF report (https://osf.io/fe2tr), whose Tables 2 and 3
  reprint the published Table 2 Panel A (Percent donating, Amount
  donated, Number of gifts, Amount|Donated, Retention rate,
  Observations; treatment and control) and Panel C (new-script and
  original-script columns) as "the original paper" values: all 24 cells
  equal the draft's Table 2.  The report says Panel B (Experiment 2) is
  unchanged by its recode but does not print it, so Panel B is not
  pinned; nor is the Panel C control column (not reprinted), nor any SE
  (the report prints none).  The draft's SEs (amount donated 0.14 /
  0.38, amount | donated 0.41 / 1.05 in Panel A) are therefore
  unverified against the published article.  The April 2019 SSRN draft
  prints a different Panel A (e.g. 28.31 / 28.44 percent donating, N
  445,641 / 55,434; retention already 32.68 / 32.91) and Panel B as in
  the October draft.

  Curation pass (2026-11-09/10).  13 claims (3 counts).  Left out: the
  number-of-gifts rows (printed at two decimals, 0.79 / 0.80, too coarse
  to separate groups), the p-values (Mann-Whitney / chi-squared /
  one-way ANOVA F-test), Panel B, Panel C's control column and its other
  rows, Table 1 (baseline balance), Figures 1-3 (forecasts; Figure 2
  needs UAS data) and the appendix.

  Package-only facts (never in contexts).  01_dataprep/step1: from
  transactions.dta, split gift_date, collapse to one record per
  account_id x date x station (sum payment_amount); callog.dta: drop
  accounts appearing twice, treat = 1 for segment "Active Calls", 0 for
  "Control"; drop exec_date 1704, 1707, 1710, 1801 (outcomes observed
  only through 2018Q1); merge demographics and treatments; reshape to
  periods relative to the exec date (payment_amount2 / var12 = year
  before, payment_amount3 / var13 = year after).  step2: drop if
  payment_amount2 == 0; Experiment 1 keeps exec_date not 1610 / 1701 and
  drops stations 24, 55, 61, 64 ("no control observations"); Experiment
  3 keeps edate == 01oct2016, exp3_treat 0 control, 1 old script
  (script2 == 0 & treat == 1), 2 new script (script2 == 1); Experiment
  2 from gift.dta: collapse by timeline account_id treat, drop donors
  with a payment in the earliest period (existing donors), missing
  amounts to 0.  Outcomes: renewing = var13 != 0 (Percent Donating, x
  100), payment_amount3 (Amount Donated; conditional on renewing == 1
  for Amount | Donated), retention = payment_amount3 / payment_amount2 (x
  100).  02_analysis/Table2_treatment_effects.do: summarize by treat
  (or exp3_treat), SE = sd / sqrt(N); p-values from tabulate chi2
  (Percent Donating), ranksum (others) or oneway (Experiment 3).

  Blind-mode exposure (step 6, 2026-11-10).  The blind generation prompt
  (reached with a placeholder methodology summary that states no
  result) states no pinned value at printed precision or rounded to 1-3
  significant figures (the only rounded hits are listing sizes such as
  "30 columns" and "40.1 MB") and carries no do-file text; the .do
  files are absent from the listing.  The paper text reaches the
  methodology summariser truncated after Figure 2, so the draft's Table
  2 (p. 35) is not in it, but its prose does state several pinned
  values (27.9 / 28.1 percent donating, $127.00 and $126.46 conditional
  amounts, 32.68 and 32.91 percent retention, 28.3 / 29.2 percent in
  Experiment 3); the summariser is told to leave results out, and the
  README's blind-mode caveat covers this, as for lopez-2022.  The
  abstract states no pinned value.

  Mount cost.  transactions.dta is 243 MB; at the host's bind-mount read
  speed (about 8 MB/s, settele-2022) reading it takes about 30 s of the
  R sandbox's 300 s.

  What was read.  The October 2019 draft pp. 1-15 and Tables 1-2; the
  April 2019 draft's Table 2; the OSF report in full; the 16
  meta-database rows; ReadMe.pdf; the five questionnaire PDFs' text
  (questions only); step1 and step2 of 01_dataprep and
  Table2_treatment_effects.do.

  What could not be verified.  The published article itself was not
  read, nor its SEs, Panel B or Panel C control column.  The authors'
  Stata code was not run (no Stata here) and no independent R
  cross-check was made.

  Original analysis in Stata 16.1; language: r is the reproduction target.
