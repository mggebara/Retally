notes: >
  Headline findings (as published): across DALP parties, higher electoral
  volatility goes with more Personalism and less Programmaticness
  (Hypothesis 1, Table 1 upper panel), but only for nonethnic and
  ideologically moderate parties; ethnic and extremist parties'
  strategies do not vary with volatility (Hypothesis 2), and in stable
  systems ethnic/extremist parties are more personalist while in
  volatile systems they are more programmatic (Hypothesis 3, three of
  four comparisons significant).  In Brazil, a party that barely wins a
  mayoral election is about 8-9 percentage points less likely to field a
  young (or young outsider) candidate next time (Table 2, local linear
  RD).  DP54 reproduces all of this except the extremist-party rows of
  Table 1.

  Original analysis: Stata 16 (Table 1) and R 4.0.3 with rdrobust (Table
  2); language: r is the reproduction target.

  Curation pass (2026-11-02).  Pinned 13 claims: ten Table 1 differences
  with their SEs (the volatility differences for all, nonethnic and
  moderate parties; the four Hypothesis 3 comparisons ethnic/extremist
  minus nonethnic/moderate at the relevant volatility level), the Table 1
  N, and the two Table 2 RD point estimates.  Values exactly as printed
  in the published AJPS PDF, two decimals in Table 1 (trailing zeros
  kept: 0.30, 0.20, -0.30) and three in Table 2; the printed-precision
  floor is therefore 0.005 on every Table 1 claim.  Every pinned value
  equals the meta-database's o_coeff_dbl / o_std_err_dbl where a row
  exists (the DB stores 0.30 as 0.3 and -0.30 as -0.3; Table 2 rows
  carry no SE in the DB and the paper prints none).  Not pinned: the
  Table 1 levels (the differences are what the hypotheses rest on), the
  ethnic- and extremist-party volatility differences (0.04, 0.03, 0.05,
  0.08: the "invariance" rows), the two remaining Hypothesis 3 cells
  (both near zero), and Table 2's p-values, confidence intervals,
  bandwidths and N+/N- (rdrobust outputs that move with the bandwidth
  selector version).  Table 1 N is 431 parties in 75 countries per the
  note; appendix Table D1 shows the ideology models use 430.

  What was read.  The published AJPS PDF (all 18 pp.: model, empirical
  implications, the cross-national section, Table 1, the Brazil section,
  Table 2 and footnotes 17-21); the supplementary appendix (Sections C
  and D: Tables C1-C3, D1); DP54 (27 pp., EconStor: text, Tables 2-6);
  the Dataverse API metadata for versions 1.0 and 1.1; the package
  (00-README.txt, codebook.pdf, brazil-RD-analysis.R,
  cross-national-designate-controls.do, the Table 1 section and margins
  programs of cross-national-analysis.do; estimation-sample counts of
  cross-national-data.dta); the 176 team-62 meta-database rows.

  Package-only facts (never in contexts).  Table 1: setup loads
  cross-national-data.dta and runs cross-national-designate-controls.do,
  which divides gini by 100 (DP54's "Gini coefficient of 0" comes from
  skipping this) and sets p_controls = partysize unions business
  religious and controls = pluralty i.pr b3.cl mdmh b1.system demsys
  polity gdppc gini ethfrac.  Models: reg personal|programmatic ev_total
  $p_controls $controls, cluster(ccode); then i.ethnic##c.ev_total and
  c.extremist2##c.ev_total versions.  Predicted values are Stata margins
  (average predictions over the estimation sample) at ev_total = its
  p25 and p75 in e(sample) (sum, d), and differences via lincom.  In
  the group-attachment models the high-attachment party is set at the
  p90 of the attachment variable in e(sample): 1 for ethnic, but for
  extremist2 about 3.55 (numpy linear p90 on the 430-party sample; p75
  is about 2.58), NOT the "3, approximately the 75th percentile" the
  paper states.  That is why DP54, which used 3, could not match the
  extremist rows; a run that follows the paper text is expected to miss
  claims 8 and 9 (and the extremist levels) while hitting the moderate
  rows.  Estimation sample: 431 complete cases over 75 ccode clusters
  (430 with extremist2); ev_total p25/p75 about 0.146/0.420.  Table 2:
  brazil-RD-data.dta; outcomes youngF_inc_for1 and outyg1F_inc_for1,
  running variable mv_incparty, sample dlameduck_runs == 0;
  rdrobust(y, x) with defaults (local linear, triangular kernel,
  mserd bandwidth, separate b), Estimate[1] is the conventional
  estimate; the h = b column reruns with rho = 1.

  Leak surface.  The independent/blind script-free copy drops all six
  scripts by suffix (Figure1.R, Figure2.R, brazil-RD-analysis.R,
  cross-national-analysis.do, cross-national-designate-controls.do,
  Table-E2.do) and keeps the four .dta files, 00-README.txt (a file
  list) and codebook.pdf (variable definitions); none carries a result.

  Blind-mode render check (2026-11-02, LLM oracle, zero API calls).
  Both blind and independent cells reached llm_answer_pending.  The
  blind generation prompt (reached by answering the methodology and
  hyperparameter calls with result-free placeholders) contains none of
  the 13 values or 10 SEs as printed or rounded to 1-3 significant
  figures, and no script text; its dataset listing shows only the four
  .dta files, 00-README.txt and codebook.pdf.  As for every entry, the
  methodology summariser itself receives the full paper text (Tables 1
  and 2 included) with an instruction to leave results out, so the
  blind summary is only as clean as the summariser.  The paper's prose
  also restates rounded results that a value-matching redactor (the
  claude-code reproducer's) may not catch: "about 0.3 on a 1-4 scale"
  (Table 1 overall Personalism difference), "approximately 8 percentage
  points" and "about 9 percentage points" (Table 2), plus the Table 2
  confidence intervals in the text.
