notes: >
  Headline finding: pre-colonial conflict exposure (land battles within
  250km of a district centroid, 1000-1757) is positively associated with
  contemporary district luminosity.  The Table 1 headline coefficient is
  3.713 (SE 0.305) bivariate, attenuating to ~1.47 with state fixed
  effects and controls; N=660.

  First real run (2026-07): the pipeline executes end-to-end for this R
  entry — parse, 102 quantitative claims extracted (37 coefficients, 29
  standard errors, 16 R-squared, ...), Zenodo package downloaded and
  unpacked, R reproduction code generated and run cleanly in the sandbox
  — but 0/102 claims reproduced to tolerance (`agrees_with_paper: false`).
  The gap is codegen navigating a raw replication package blind: the
  generator is told only the dataset directory path, not the file layout
  or the exact regression specification, so it cannot yet locate the
  right data files and rebuild the estimating equation.  That, plus the
  still-truncated methodology-summary window, is the actionable next step.

  Claims pinned (2026-07): five headline Table 1 claims replace the 102
  auto-extracted ones — bivariate and full-specification coefficients
  with their SEs, plus N.  Values cross-checked against the I4R meta
  database (which records six distinct Table 1 estimates for this
  paper: 3.713/0.305, 1.601/0.380, 1.465/0.370, 3.482/1.389,
  4.626/1.291, 4.930/0.609).  The four estimates not pinned here need
  paper access to map to specific columns — 1.601 is most likely the
  state-FE-without-controls column, and the 3.482/4.626/4.930 trio
  also appears under Table 2 rows, suggesting alternative outcome or
  exposure measures.  Curate them from the PDF (which the runner
  downloads anyway) when tightening this entry beyond the headline.

  Phase 1.3 (2026-10-19): curated from the replication package's own
  esttab fragments (1 paper/table1.tex, table2b.tex).  Table 1 has only
  three columns, all with population density as a control: col 1
  3.713 (0.305), col 2 +state FE 1.601 (0.380), col 3 +geographic
  controls 1.465 (0.370); N=660 throughout.  The 4.930/4.626/3.482
  trio is NOT Table 1 — it is Table 2 Panel B (IV second stage, Khyber
  Pass instrument), same three column specifications, SEs 0.609 /
  1.291 / 1.389.  The meta-database groups them under one table.
  Thirteen claims pinned in total (one over the rubric's 8-12 target,
  to keep every coefficient paired with its SE).

  First green run (2026-10-19): 13/13 claims within tolerance,
  agrees_with_paper and agrees_with_i4r both true.  The unlock was
  seeding the 185 KB wii_replication.do into codegen (it had been
  dropped by the per-file size cap, so the July-style blind guessing
  continued until the cap became a truncation).  Remaining gaps, all
  inside tolerance: the IV SEs come out 2.8% (col 2) and 3.7% (col 3)
  high because the generated code used HC1 while Stata's
  `ivreg2, r` applies no small-sample correction (HC0); everything
  else matches to 3 dp.  Single sampled generation per configuration
  (LLM cache), so run-to-run variance is not yet measured.

  Phase 1.5 first independent run (2026-10-19/20).  Seeded 13/13 (now
  re-scored by the harness after PR #34; identical values).  Independent,
  scored with the SE-aware band (coefficient claims widen to +/-1 SE,
  e.g. 3.713 +/- 0.305 = 8.2% relative; SE claims stay at 5%, N at 1%):
  0/13 in every run.  Two configurations, three generations each:
  prompt-only withholding (pre-#34: scripts withheld from the prompt but
  on disk and in the listing) 0/13, 0/13, 1/13; script-free mount
  (post-#34, the like-for-like number) 0/13, 0/13, 0/13.  The single
  pass (warfare_se_state_fe 0.3954 vs 0.380, run 3 prompt-only) is a
  coincidence: its coefficient was 5.83 vs 1.601 and N was 613.  Gap:
  13 claims lost, 0 gained.

  Lost claims, one diagnosis covers all thirteen: wrong data file /
  variable discovery, before any specification question is reached.
  Every inspected generation (5 prompt-only, 4 script-free, replayed in
  the sandbox from the LLM cache) loaded devcensuswgis.dta (640 census
  districts, no lnlights_001 outcome, no Khyber `instrument`) instead of
  conflictexposure.dta, then searched for variable names by regex.  It
  found Land_250_1757_collapsed, never the outcome, so it either exited
  early printing only N (prompt-only: N=640) or regressed on a fallback
  variable (script-free: coef -0.181, N=631, IV NA).  Why the model could
  not recover: (1) the dataset listing shows CSV headers but not .dta
  column names, and the paper text never names the file or variables
  (the only hints are figure filenames such as map_lnlights_001.png);
  (2) the claim-refinement prompt feeds back only the parsed RESULT
  values, never stdout, so the model's own print(names(df)) diagnostics
  are discarded -- one script-free refinement says so explicitly ("the
  code already prints variables but I don't see the output").  Per claim:
  warfare_coefficient_{bivariate,state_fe,full_controls} and their SEs:
  wrong file, outcome never found; warfare_iv_* (6 claims): wrong file,
  instrument never found; sample_size_districts: wrong file (640/631 vs
  660).  A second, latent error would have hit even with the right file:
  the extracted methodology summary says the key regressor is "reported
  with standardized beta", so every generation scale()d the exposure
  variable; on conflictexposure.dta that gives 0.357 instead of 3.713.
  The paper itself says "(unstandardised) coefficient estimate ... is
  3.713" and reports standardized betas only as a separate table row, so
  this is a methodology-extraction error, not an under-specified methods
  section.  Not one of the losses is a RESULT-name mismatch or a
  tolerance artifact; all were real misses.

  Script-access check: no generation (9 inspected, both configurations)
  opened a .do/.ado/.R file -- no source(), readLines(), or script paths;
  the only filesystem calls are list.files() on the Data directory and
  read_dta() of .dta files.  So prompt-only withholding was not leaky in
  practice on this paper.  The script-free copy still contains the
  paper's LaTeX (1 paper/MS_20210009_main.tex, table1.tex ...); those
  carry values already in the prompt, not code, and were not read.  The
  four variance generations ran with the LLM cache off, so their code
  was not retained; only their scores are.

  Harness note found along the way: when a claim has no RESULT line, the
  comparator's third matching strategy (claim_type name vs output keys)
  scores it against the first output whose key contains "coefficient",
  so in the script-free run all three IV coefficient claims were scored
  against warfare_coefficient_bivariate's -0.181.  No pass came from it
  here, but it can inflate "matched" (77% in REPORT.md) and could produce
  a false pass.

  Phase 1.6 plumbing fixes and re-measurement (2026-10-20).  Four fixes,
  one commit each, each followed by a --mode both run (LLM cache on, so a
  step re-runs only the calls whose prompts it changed).  Pass counts
  (seeded / independent): Phase 1.5 baseline 13/13 / 0/13.  Step 1,
  comparator no longer borrows a value by claim type (re-score, no live
  call): 13/13 / 0/13, independent "matched" 10 -> 7 of 13 (the three NA
  IV coefficients had been scored against the OLS -0.181).  Step 2, .dta
  column names in the dataset listing: 13/13 / 0/13; the model now uses
  the right variable names (lnlights_001, Land_250_1757, lnpdgpd1990, the
  ten geographic controls) but loads biclean.dta (British-India
  districts, N=271, same variable names) rather than conflictexposure.dta,
  whose 1288 columns are cut at the listing's 240-character cap before
  the outcome and the `instrument`.  Step 3, head/tail stdout/stderr in
  refinement prompts: 13/13 / 0/13; the refinement saw "Total rows in
  biclean: 271", added a DEVIATION (NA exposure -> 0) but stayed on the
  same file, produced identical numbers, and the no-progress rule stopped
  the loop after one attempt.  Step 4, methodology prompt no longer
  primes "standardised": the new summary says headline coefficients are
  unstandardised; seeded 13/13 (first attempt blocked by API credit,
  measured later the same day on main at 9b4bbb9).  Independent after
  step 4: 12/13 with the LLM cache on (baseline-both-2026-10-20.json,
  fails only warfare_iv_se_full_controls, 6.7% vs the 5% cap), and
  4/13, 10/13, 1/13 in three cache-off runs
  (variance-independent-postfix-run{1,2,3}-2026-10-20.json; median 4,
  mean 5).  The 12/13 script found conflictexposure.dta by keeping the
  .dta whose row count is closest to the target N=660, not by reading
  the listing; its values are close, not exact (N=664: the four island
  districts the authors drop are not mentioned in the paper; col 1
  3.723; IV col 3 3.713 vs 3.482, inside the 1-SE band only).  Failure
  modes of the cache-off runs, inferred from the numbers (no script was
  retained): runs 1 and 2 both give 7.1688 (0.5159) for col 1 with col 3
  exact (1.4646) -- population density omitted from col 1, as the
  "bivariate" token invites; run 2 also gets IV cols 2-3 (4.6339,
  3.4823) and N=664; run 1 gets the IV half wrong with sign flips; run 3
  loaded a wrong file (N=374).  Spend not recorded (pre-PR #41).

  Step-6 classification of the 13 independent losses (step-3 run, code
  and stdout read), plus an offline counterfactual: the step-3 generated
  R script re-run in the sandbox with only the data file swapped to
  conflictexposure.dta, the scale() removed (the step-4 extraction fix)
  and `state` renamed to `state_gadm` (the FE variable in that file),
  zero API calls.  It gives 3/13 under the independent band:
  full_controls 1.4646 (0.3685) vs 1.465 (0.370) and N=660, exact.  Adding
  lnpdgpd1990 to columns 1-2, which the model had left out, gives all
  seven OLS claims to 3-4 dp (3.7131/0.3053, 1.6005/0.3784,
  1.4646/0.3685, 660).
  - warfare_coefficient_full_controls, warfare_se_full_controls,
    sample_size_districts: data-file resolution (+ extraction error,
    standardisation).  The model's own specification is exact once
    pointed at the right file.
  - warfare_coefficient_bivariate, warfare_se_bivariate,
    warfare_coefficient_state_fe, warfare_se_state_fe: data-file
    resolution + extraction error, then specification (controls): the
    model omitted population density from columns 1-2.  Very likely
    induced by the catalog token itself: the prompt shows only
    "warfare_coefficient_bivariate" (the claim `context`, which says the
    column controls for population density, never reaches the prompt),
    and the methodology summary's equation includes PopDensity.  A
    harness/catalog artifact more than a methods-section gap.
  - warfare_iv_* (6 claims): data-file resolution.  `instrument` exists
    only in conflictexposure.dta and tehsildata.dta, both beyond what the
    truncated listing shows; the model printed RESULT:...=NA and never
    wrote an IV.  Its ability to reconstruct the IV specification from
    the text is untested.
  None of the 13 is a RESULT-name mismatch or tolerance artifact, and
  none is (yet) evidence that the paper's text cannot pin down its
  specification.  Two pipeline properties keep file resolution stuck:
  claims with no value (NA) are hard failures that the claim-refinement
  loop never targets, and the loop stops when an attempt reproduces the
  same numbers.

  Phase 1.7 file selection (2026-10-20): NOT MEASURED.  The deferred
  Phase 1.6 measurement was attempted first (seeded served 13/13 from the
  LLM cache), but the first uncached call, the independent generation,
  returned HTTP 400 "credit balance is too low" again, and so did the one
  retry (the 1.6 measurement later ran on main; see step 4 above).  The three 1.7 fixes were built and unit-tested without live
  runs, one commit each: claim location/context rendered in the prompt;
  a .dta listing with row counts, paper-matched columns first (by exact
  name or by Stata label phrase), and the most relevant .dta files first;
  NA claims sent to claim refinement, with "no progress" counting NA
  lines and waived once on a data-file switch.  Offline, the new listing
  puts conflictexposure.dta first: "666 rows, 1288 columns", with
  Land_250_1757, lnlights_001, lnpdgpd1990, instrument and state_gadm in
  view (measured with the claim contexts as they then stood).

  Context rewrite (2026-10-20, Phase 1.7).  This entry's claim contexts
  had named package variables (Land_250_1757, lnpdgpd1990, instrument),
  the Stata command (ivreg2, r) and the Andaman/Nicobar and Lakshadweep
  exclusion, none of which the paper states; once rendered they would
  have handed independent mode code-derived hints.  They were rewritten
  from the paper text alone (Table 1 and Table 2 notes and the text around them),
  ahead of the prompt change, so no measured run saw the old wording.
  With the new contexts as hints (title and claim fields only),
  conflictexposure.dta still leads the listing with lnlights_001 and
  instrument in view; Land_250_1757 and lnpdgpd1990 fall past the cap.
