# First real entry in the I4R benchmark catalog.
#
# Original paper: Dincecco, M., Fenske, J., Menon, A., & Mukherjee, S. (2022).
#   "Pre-Colonial Warfare and Long-Run Development in India."
#   Economic Journal, 132(643), 981-1010. doi:10.1093/ej/ueab089
#
# I4R replication report: DP35 (Forshaw, Ölkers, Sethi, Sovani, June 2023),
# later published as Forshaw et al. 2025, Canadian Journal of Economics.
# Verdict: "All estimates are computationally reproducible using both the
# provided replication package in Stata and code written by the present
# authors in R."
#
# Why this paper first:
#   1. I4R wrote an R routine to verify the Stata original — gives us a
#      same-language ground-truth comparison point for Retally's R generation.
#   2. The I4R verdict was a clean "reproducible," so we're not also
#      debugging "is this paper even right" while debugging the pipeline.
#   3. Replication package is on Zenodo (5583263) — public access.
#
# original_claims pins the headline Table 1 estimates (curated per the
# rubric in benchmark/README.md).  Values are cross-checked against the
# I4R First Meta Database's o_coeff_dbl / o_std_err_dbl columns
# (benchmark/corpus/) — the same numbers the human replicators scored
# against.  Descriptions are deliberately snake_case tokens: the
# comparator matches claims to RESULT:<name> outputs by normalised
# exact/substring match, and the generation prompt tells the model to
# use metric names matching the claim descriptions.

id: dincecco-2022-india-warfare
i4r_report_url: https://www.rwi-essen.de/fileadmin/user_upload/RWI/Publikationen/I4R_Discussion_Paper_Series/035_I4R_Forshaw_Oelkers_Sethi_Sovani.pdf
i4r_report_doi: 10.1111/caje.12693  # Later CJE publication of DP35
language: r
outcome_label: reproducible
# Prompt-tuning iterates against dev entries; holdout entries are only
# run to confirm a dev-set improvement generalises.
split: dev
# Contamination bookkeeping (see ROADMAP "Contamination, honestly").
# First public version: CAGE Working Paper No. 426 (2019), the PDF
# `paper.source` points at.  Package: Zenodo record 5583263, published
# 2021-10-20 (from the Zenodo API's publication_date).
publication_date: "2019"
package_release_date: "2021-10-20"

paper:
  # Direct PDF of the CAGE working paper (No. 426).  The human-facing
  # landing page for this paper is
  #   .../publications/workingpapers/2019/pre_colonial_warfare_and_long_run_development_in_india/
  # but parse_url would strip that page's HTML chrome and feed the
  # extractor navigation text rather than the paper body, so we point
  # source at the PDF the page links to.
  source: https://warwick.ac.uk/fac/soc/economics/research/centres/cage/manage/publications/426-2019_fenske.pdf
  title: "Pre-Colonial Warfare and Long-Run Development in India"
  authors:
    - Mark Dincecco
    - James Fenske
    - Anil Menon
    - Shivaji Mukherjee

dataset:
  source: https://zenodo.org/records/5583263
  access_notes: >
    Replication package on Zenodo (open access, record 5583263) — a
    single ~32 MB zip the downloader fetches and unpacks.  Contains the
    pre-colonial conflict geocoded database and Indian district
    luminosity panel.  The paper body does not name a downloadable
    dataset URL, so the extractor resolves nothing from the text; the
    runner instead builds a `dataset_reference` override from this
    `source` field.

code_repo:
  url: https://zenodo.org/records/5583263

original_claims:
  - description: warfare_coefficient_bivariate
    value: 3.713
    claim_type: coefficient
    standard_error: 0.305
    sample_size: 660
    location: "Table 1"
    context: >
      Table 1 column 1.  OLS coefficient on pre-colonial conflict exposure
      (Land_250_1757: land battles within 250 km of the district
      centroid, 1000-1757) in a regression of ln(0.01 + luminosity) on
      conflict exposure plus ln population density 1990 (lnpdgpd1990);
      no state FE, no geographic controls; robust SEs.  "Bivariate" in
      the token is a misnomer kept for run-to-run comparability: the
      column DOES control for population density.  N=660 districts.
  - description: warfare_se_bivariate
    value: 0.305
    claim_type: standard_error
    location: "Table 1"
    context: Standard error of warfare_coefficient_bivariate.
  - description: warfare_coefficient_full_controls
    value: 1.465
    claim_type: coefficient
    standard_error: 0.370
    sample_size: 660
    location: "Table 1"
    context: >
      Table 1 column 3.  Coefficient on pre-colonial conflict exposure in
      the most saturated specification: population density, state fixed
      effects, and the ten geographic controls (latitude, longitude,
      altitude, ruggedness, precipitation, land quality, dry rice, wet
      rice, wheat, malaria); robust SEs.  Attenuates from 3.713
      (column 1) to this value.
  - description: warfare_se_full_controls
    value: 0.370
    claim_type: standard_error
    location: "Table 1"
    context: Standard error of warfare_coefficient_full_controls.
  - description: sample_size_districts
    value: 660
    claim_type: other
    unit: districts
    location: "Table 1"
    context: >
      Number of district observations in the Table 1 regressions (660 in
      every column, after dropping the Andaman/Nicobar and Lakshadweep
      island districts).
  # Curated during Phase 1.3 from the replication package's own
  # 1 paper/table1.tex and table2b.tex (esttab output of
  # wii_replication.do).  Appended (not interleaved) so the claim_id
  # indices of the five claims above, and of their I4R findings, are
  # unchanged.
  - description: warfare_coefficient_state_fe
    value: 1.601
    claim_type: coefficient
    standard_error: 0.380
    sample_size: 660
    location: "Table 1, column 2"
    context: >
      Table 1 column 2.  OLS coefficient on pre-colonial conflict
      exposure with population density and state fixed effects, no
      geographic controls; robust SEs.
  - description: warfare_se_state_fe
    value: 0.380
    claim_type: standard_error
    location: "Table 1, column 2"
    context: Standard error of warfare_coefficient_state_fe.
  - description: warfare_iv_coefficient_bivariate
    value: 4.930
    claim_type: coefficient
    standard_error: 0.609
    sample_size: 660
    location: "Table 2, Panel B (second stage), column 1"
    context: >
      Table 2 Panel B column 1.  IV (2SLS) second-stage coefficient on
      pre-colonial conflict exposure, instrumented by proximity to the
      Khyber Pass (`instrument`), controlling for population density;
      no state FE, no geographic controls; robust SEs (ivreg2, r).
  - description: warfare_iv_se_bivariate
    value: 0.609
    claim_type: standard_error
    location: "Table 2, Panel B (second stage), column 1"
    context: Standard error of warfare_iv_coefficient_bivariate.
  - description: warfare_iv_coefficient_state_fe
    value: 4.626
    claim_type: coefficient
    standard_error: 1.291
    sample_size: 660
    location: "Table 2, Panel B (second stage), column 2"
    context: >
      Table 2 Panel B column 2.  IV second-stage coefficient (Khyber Pass
      instrument) with population density and state fixed effects; robust
      SEs.
  - description: warfare_iv_se_state_fe
    value: 1.291
    claim_type: standard_error
    location: "Table 2, Panel B (second stage), column 2"
    context: Standard error of warfare_iv_coefficient_state_fe.
  - description: warfare_iv_coefficient_full_controls
    value: 3.482
    claim_type: coefficient
    standard_error: 1.389
    sample_size: 660
    location: "Table 2, Panel B (second stage), column 3"
    context: >
      Table 2 Panel B column 3.  IV second-stage coefficient (Khyber Pass
      instrument) with population density, state fixed effects, and the
      ten geographic controls; robust SEs.
  - description: warfare_iv_se_full_controls
    value: 1.389
    claim_type: standard_error
    location: "Table 2, Panel B (second stage), column 3"
    context: Standard error of warfare_iv_coefficient_full_controls.

# DP35's verdict is blanket: "All estimates are computationally
# reproducible" (in Stata AND in the replicators' own R routine).  For
# the direct rerun the I4R values therefore equal the paper's stated
# values.  The meta-database's per-row r_coeff_dbl values cover
# robustness VARIANTS (sample cuts, recodings), not the direct
# reproduction, so they are deliberately not transcribed here.
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 3.713
    outcome: matches
    notes: DP35 blanket verdict — all estimates computationally reproducible.
  - claim_id: 1
    reproduced_value: 0.305
    outcome: matches
  - claim_id: 2
    reproduced_value: 1.465
    outcome: matches
