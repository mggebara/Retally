notes: >
  Headline finding: in a cluster-randomised experiment in the May 2013
  Philippine party-list election (13 municipalities, one treated and two
  control barangays each, 39 barangays), assignment of town-hall
  (deliberative) campaigns raised the treating party list's official
  vote share by 1.096 percentage points over a control mean of 2.397
  (Table 1 col 2, permutation p = .048), with no turnout effect
  (-4.544, p = .404); in the post-election survey the effect is driven
  by women (Akbayan) and low-income / less-educated voters (Umalab Ka),
  and town halls moved attitudes on gender (index +0.45 s.d.) and,
  less, poverty.

  Original analysis in R 3.6.2 (base lm, AER::ivreg, ri for
  randomization inference, stargazer / xtable output); language: r is
  the reproduction target and matches the original.

  outcome_label.  The I4R verdict is "minor discrepancies"
  (computational_reproduction = 1, perfect_reproduction = No) and the
  only reason recorded is having to install archived CRAN versions; the
  replicator answered that the code produces the paper's output.  The
  schema has no "minor discrepancies" label, so the entry is labelled
  reproducible (stratification only).  The robustness rows (dropping
  the attendance weights kills the Akbayan gender-index effect, 0.450 ->
  -0.001, and the Akbayan poverty-index effect, 0.496 -> 0.138, p =
  0.39) would argue for not_robust on the attitude claims; the
  omitted-cities rows leave Table F.1 unchanged.

  Curation pass (2026-10-21).  Pinned 13 claims: Table 1's four ITT
  coefficients and its three observation counts (39 / 39 / 18 / 21; the
  first two columns share one count), the summary-index ITTs of SI
  Tables C.3 and C.4 for both party lists (0.496, 0.126, 0.450, 0.095),
  and the pooled and Akbayan ITTs of SI Table F.1 (23.242, 31.729).
  Why this mix: Table 1 is the paper's only main-text table and is what
  the package's aggregate data produce, but it has no I4R row; every
  I4R row is from SI Tables C.3, C.4 and F.1, so their estimates are
  pinned so that six claims carry findings.  F.1 columns 1 and 4
  (turnout 1.965, Umalab Ka 14.057) also have rows but were left out to
  stay within 13 claims; C.3 / C.4 component columns have no rows.
  Values exactly as printed (published AJPS PDF for Table 1; the SI
  PDF, compiled 2020-05-23, for C.3 / C.4 / F.1), and equal to the
  database's o_coeff except the F.2 slip noted on claim 11.  The tables
  print p-values ("p = .048"), never SEs, so no standard_error is
  pinned; the CACE rows, control means and R2 are not pinned.  Observation
  counts of the SI columns are not pinned (C.3 Akbayan index 640, Umalab
  Ka 568; C.4 644 / 542; F.1 869 / 476).

  What was read.  The published AJPS PDF (all 16 pp.); the SI PDF (all
  30 pp.: Tables A.1-A.2, B.1-B.2, C.1-C.4, D.1-D.3, E.1, F.1, Figure
  G.1, survey questions H); the March 2017 working paper (front matter
  and table list, for dates and numbering only: its Table 4 is the
  barangay-level ITT, Tables 7-9 the individual ITT and attitudes);
  the package readme, main_*.R, functions_*.R, tables_figures_agg.R,
  tables_fig_ind.R, tables_fig_ind_unweighted.R and survey_clean.R; the
  database's 10 rows (team 66); the Dataverse and CaltechAUTHORS API
  metadata.  No R run of the package was made in this pass.

  How the printed numbers are produced (package-only; never in
  contexts).  Table 1: tables_figures_agg.R (run via main_agg.R) loads
  data_agg.RData (object data.all; outcomes turnout.party,
  share.treated, share.akbayan, share.umalabka; assignment, treatment,
  city, barangay, partytreat in {"akbayan","umalabka"}); the ITT is
  ri::estate(outcome, assignment, X = city dummies (dummies::dummy),
  prob = ri::genprobexact(assignment, blockvar = city, clustvar =
  barangay)) — an IPW regression with city dummies — and the p-value is
  from ri::genperms (maxiter 50000, set.seed(1983)) / gendist; the CACE
  is ri::estlate; the Control row is the intercept of a weighted lm
  without city dummies.  Output table_agg.txt (stargazer).  Columns 3-4
  subset partytreat; rows with missing outcome dropped.  SI Tables C.3 /
  C.4: tables_fig_ind.R (run via main_ind.R, after main_survey.R ->
  survey_clean.R builds survey_ind.RData / survey_agg.RData from
  survey_raw.RData): lm(index ~ assignment + city, weights = weight.att)
  per partytreat in {"Akbayan","Umalab Ka"}, clustered vcov by barangay
  (varcov.cluster in functions_ind.R).  weight.att = att.prop (official
  attendance share from data_agg) / attendance.agg (survey share of
  self-reported attendees) in treatment barangays, 1 in controls.
  Indices: poverty.all (Table C.3) and sexism (Table C.4) from
  survey_clean.R — items standardized by standard(), which centres on
  the full-sample mean and scales by the s.d. among treatment == 0
  (implemented, not assigned, status), then combined with wmean()
  (inverse-covariance weights).  Outputs table_pov.txt / table_sex.txt
  (the readme says .pdf).  SI Table F.1: tables_fig_ind_unweighted.R —
  outcomes turnout_pl, vote, vote.akbayan, vote.umalabka multiplied by
  100, lm(y ~ assignment + city, weights = weight.assign) where
  weight.assign is the inverse assignment probability from
  ri::genprobexact (so "unweighted" means no attendance weights, not no
  weights); permutation p-values; output table_itt_unweighted.txt.

  Package quirks for a run.  (1) The scripts depend on ri and dummies,
  both archived off CRAN (the I4R discrepancy), plus AER, stargazer,
  xtable, mvtnorm, MatchIt, Amelia, doParallel, fastLink, data.table.
  (2) main.dir is "" and the scripts setwd() to /data/aggregate/ and
  /data/survey/ and load "../aggregate/data_agg.RData"; the downloader
  flattens Dataverse's folders, so paths must be rewritten.  (3)
  survey_ind.RData / survey_agg.RData are generated, not shipped.

  Left out.  Table 1 CACE row (estlate) and control means; Figures 2-5
  (figures; their point estimates are in SI Tables C.2-C.4, D.3); SI
  Table C.2 (weighted individual ITT, no I4R row); C.3 / C.4 component
  columns; D / E tables (covariates, multiple imputation); maps (Figure
  A.1).

  Render check (render_task, run id curation-check, 2026-10-21).  Before
  the parser fix paper.txt was the raw PDF byte stream decoded as text
  (483 KB of "%PDF-1.6 ... endobj"); after it, 67 KB of the published
  article.  Blind: 16 files stripped (all 16 R scripts; readme.txt,
  codebooks, data and shapefiles kept), 20 paper redactions.  None of
  the 13 pinned literals appears in the blind task.md or paper.txt, but
  the article text still says "0.13 s.d. units" twice (the rounded
  Umalab Ka poverty-index ITT, claim 8 — outside its tolerance band),
  and the dataset listing shows data.all with 39 rows (the Table 1
  columns 1-2 N follows from the data).  The SI is not part of paper.txt
  in any mode, so the six SI claims rest on their location / context.
