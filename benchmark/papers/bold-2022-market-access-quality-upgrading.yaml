# Original paper: Bold, T., Ghisolfi, S., Nsonzi, F., & Svensson, J.
#   (2022). "Market Access and Quality Upgrading: Evidence from Four
#   Field Experiments." American Economic Review, 112(8), 2518-2552.
#   doi:10.1257/aer.20210122 (August 2022 issue; Crossref issued
#   2022-08-01, DOI created 2022-07-27).
#
# Reproduction report: McWay, R., Nchare, K., & Sun, P. (2023).
#   "Replication and Sensitivity Analysis of 'Market Access and Quality
#   Up-grading: Evidence from Four Field Experiments': A Comment on Bold
#   et al. (2022b)." I4R Discussion Paper No. 72 (September 2023;
#   EconStor hdl:10419/277561), from the I4R Toronto Games (22 February
#   2023); republished as JCRE vol. 3 (2024-2), doi:10.18718/81781.32
#   (EconStor hdl:10419/295068).  I4R First Meta Database replication
#   team 50, 64 rows under the paper title (entered 2023-08-29; the
#   candidates file's "27" counts only rows with a coefficient pair).
#   The candidates file listed no DP; DP72 was found by web search
#   (2026-11-09) via the JCRE article's IDEAS record.  Verdict:
#   reproducible — "all members of the team confirmed no significant
#   variation in the reported magnitudes or statistical significance ...
#   No coding errors were identified, and the reproduction of results
#   matches those reported in the published manuscript" (DP72 Sec. 2,
#   Stata 16, package downloaded 2023-02-03); the DB's
#   best_describe_compreprod agrees ("Analysis and cleaning code produce
#   the same output as presented in the paper"), perfect_reproduction
#   "Yes" on the one row that fills it.  result_same is blank and
#   coding_correction "Not done by replicators" on every row with
#   values.  Every meta-database row is a ROBUSTNESS variant, not a
#   recomputation: Table 2 cols 1-2 quantile regressions and
#   above/below-median samples (DP Tables 1-2), Table 2 col 4 with the
#   outcome redefined as net sales (sign flipped, DP Table 3), Table 7
#   outlier-robust LAV estimators (DP Tables 5-6), and Fisher-permutation
#   seed sensitivity for Tables 4-6 (DP Tables 7-9, no replicator
#   coefficient).  So the replicator values that differ from the paper
#   (-1.41 vs -2.16, -0.02 vs -0.20, -0.18 vs 0.18) are different
#   specifications, not failed reproductions.
#
# Why this paper:
#   1. A manually placed openICPSR package (data_access: manual) of 1.4 MB
#      that ships only RAW data (eight Stata files: household survey
#      panels, lab quality tests, trader sales, the buyer's records) and
#      no constructed analysis file: every number needs the authors'
#      variable construction (bags reshaped long, sales per household,
#      seasonal UGX-to-USD conversion, harvest value imputed at village
#      prices, profit as harvest value minus expenses).
#   2. Two designs in one paper: a household-level RCT with village fixed
#      effects and household-clustered SEs (Table 2, returns to quality)
#      and a village-clustered RCT panel with ANCOVA over four follow-up
#      seasons (Table 6, market access), whose parentheses print
#      clustered p-values, not standard errors.
#
# What original_claims pins: Table 2 (returns to quality experiment), the
#   Treatment coefficient with its SE in all five columns (visually
#   verifiable defects, lab defects, price, deductions, net price) and
#   two of its Observations (bags, col 1; sales, cols 3-5); Table 6
#   (impact on productivity and income), Panel A (market access
#   experiment), the treatment coefficient for price, yield, harvest
#   value, profit (monetary expenses) and profit (incl. own hours), and
#   the harvest / yield / harvest-value Observations.  13 claims, 3 of
#   them counts, values exactly as printed.  Table 6 prints no standard
#   errors (parentheses are clustered p-values), so its claims carry no
#   standard_error.
#
# Paper text: the PUBLISHED AER article (typeset PDF, "American Economic
#   Review 2022, 112(8): 2518-2552" on p. 1) as hosted on co-author Jakob
#   Svensson's website.  Every numeric meta-database value (129
#   o_coeff_dbl / o_std_err_dbl / o_p_dbl values across Tables 2, 4, 5,
#   6, 7) equals the printed number in the same table cell.  The
#   candidates file's J-PAL link (povertyactionlab.org/media/10072)
#   redirects to an HTML landing page for the August 2021 working paper
#   ("Four Field Experiments"), not the published text.  See notes.

id: bold-2022-market-access-quality-upgrading
i4r_report_url: https://www.econstor.eu/bitstream/10419/277561/1/I4R-DP072.pdf
# Target language for regeneration (the original is Stata 16 with
# estout, ritest, leebounds, xfill, mmerge and other ado files; Retally
# generates R and reads the .dta files with haven).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  publication_date is the FIRST public
# version found: the working paper "Market Access and Quality Upgrading:
# Evidence from Three Field Experiments", title page "January 2021"
# (tessabold.com/uploads/7/0/1/0/70101685/mq_2021-04-15.pdf, PDF
# CreationDate 2021-04-15; J-PAL hosts a file named ..._jan2021.pdf whose
# title page reads "Four Field Experiments, August 2021", CreationDate
# 2021-08-28).  Found by web search 2026-11-09; no 2020 version was found.
# The journal version: Crossref issued 2022-08-01 (DOI created
# 2022-07-27).  package_release_date is the DataCite registration of
# doi:10.3886/E158401V1 (registered 2022-07-26T18:26:39Z, DataCite API
# 2026-11-09); the openICPSR page needs a login.
publication_date: "2021-01"
package_release_date: "2022-07-26"

paper:
  # The published AER article (35 pp.), mirrored on Jakob Svensson's
  # website; checked 2026-11-09: 200 application/pdf, 962,743 bytes, md5
  # d05ace77eac551dfd5744d716a7cadfe, PDF producer "Atypon Systems",
  # CreationDate 2022-06-24.  The AEA PDF itself is paywalled.
  source: https://www.jakobsvensson.com/uploads/9/9/1/0/99107788/aer.20210122.pdf
  title: "Market Access and Quality Upgrading: Evidence from Four Field Experiments"
  authors:
    - Tessa Bold
    - Selene Ghisolfi
    - Frances Nsonzi
    - Jakob Svensson

dataset:
  source: benchmark/manual-packages/T50/158401-V1.zip
  data_access: manual
  access_notes: >
    AEA Data and Code Repository on openICPSR, project 158401, version V1
    (doi:10.3886/E158401V1); login and terms-of-use click-through required,
    so the zip was downloaded by hand (2026-11-09) and placed unchanged at
    benchmark/manual-packages/T50/158401-V1.zip (1,374,012 bytes, md5
    98b64c984bae25b4e3659438174e7383; SOURCE.txt beside it).  V1 is the
    only version (the one DP72 reproduced, downloaded 2023-02-03).  64 zip
    entries (53 files), 6.5 MB uncompressed, no nested archives.
    Contents: README.pdf (3 pp.; data sources, Stata packages, run order
    and times, no estimates); data/raw/ with eight Stata .dta files
    (anonym_returns_data.dta, the returns-to-quality experiment with bag
    defects, lab tests and sales; panel_g1.dta, panel_g2.dta and
    panel_g0.dta, the market-access, extension-service and quasi-control
    household survey panels; maize_quality_gr0.dta and
    maize_quality_gr1.dta, lab tests; seller_data.dta, sales by trader;
    buy_data.dta, the trading company's records); empty data/end/ and
    output/ folders; dofiles/ with 38 Stata do-files (CONFIG, master,
    seven variable-creation files, a merge file, permutations, Tables 1-7,
    Figures 1-5, appendix tables and figures, in-text replication);
    other/"Results reported in the main text.pdf" (3 pp.; quotes the
    paper's in-text sentences that cite numbers not in tables and names
    the output table that replicates each; no regression table and none
    of the pinned values); survey_materials/ with five .xlsx survey
    instruments.  No log, no generated table.  The script-free copy
    (independent / blind) withholds the 38 .do files by suffix
    (benchmark.strip_rule.classify_tree on the extracted package and the
    runner's manifest, 2026-11-09); everything else is kept.  Project
    page: https://www.openicpsr.org/openicpsr/project/158401/version/V1/view

original_claims:
  # ---- Table 2: returns to quality experiment ----
  - description: treatment_defects_visual_table2_col1
    value: -2.16
    claim_type: coefficient
    standard_error: 0.212
    unit: number of visually verified defect types per bag (out of ten)
    location: "Table 2, column (1) Defects (visually verifiable), Treatment"
    context: >
      Table 2 ("Returns to Quality: Treatment Effects"), column (1).  Returns
      to quality experiment: maize-farming households randomly assigned to
      a free harvest and postharvest service package (treatment) or not
      (control).  OLS of the number of defect types (out of ten) that
      trained enumerators visually verified in a bag the household was
      about to sell, on the treatment indicator with village fixed
      effects.  Unit of observation: a bag (all bags inspected).  Standard
      errors clustered by household.
  - description: treatment_defects_lab_table2_col2
    value: -0.20
    claim_type: coefficient
    standard_error: 0.054
    unit: share of defective grain and waste in the lab sample
    location: "Table 2, column (2) Defects (lab), Treatment"
    context: >
      Table 2, column (2): OLS of laboratory-measured defects (defective
      grain and waste in the lab sample, which the table notes describe as
      grams of defects per 200 g of maize; the text reads the coefficient
      as a percentage-point difference in the share of the content) on the
      treatment indicator with village fixed effects.  Unit of
      observation: one randomly selected bag bought from each household
      for lab testing.  Robust (heteroskedasticity-consistent) standard
      errors.
  - description: treatment_price_table2_col3
    value: 2.95
    claim_type: coefficient
    standard_error: 9.870
    unit: Ugandan shillings per kilogram
    location: "Table 2, column (3) Price, Treatment"
    context: >
      Table 2, column (3): OLS of the price received (Ugandan shillings per
      kilogram) on the treatment indicator, with village and week-of-sale
      fixed effects.  Unit of observation: a maize sale reported in the
      final household visit.  Standard errors clustered by household.  The
      paper reads it as essentially zero: no return to quality.
  - description: treatment_deductions_table2_col4
    value: 0.18
    claim_type: coefficient
    standard_error: 0.633
    unit: percent of the measured weight
    location: "Table 2, column (4) Deductions, Treatment"
    context: >
      Table 2, column (4): OLS of weight deductions, (y - z)/y in percent,
      where y is the weight of maize sold as measured by enumerators and z
      the agreed sales volume, on the treatment indicator with village and
      week-of-sale fixed effects.  Unit of observation: a maize sale.
      Standard errors clustered by household.
  - description: treatment_net_price_table2_col5
    value: 0.98
    claim_type: coefficient
    standard_error: 10.621
    unit: Ugandan shillings per kilogram
    location: "Table 2, column (5) Net price, Treatment"
    context: >
      Table 2, column (5): OLS of the net price (price net of any weight
      deductions, Ugandan shillings per kilogram) on the treatment
      indicator with village and week-of-sale fixed effects.  Unit of
      observation: a maize sale.  Standard errors clustered by household.
  - description: n_obs_table2_col1_bags
    value: 622
    claim_type: count
    unit: bags
    location: "Table 2, Observations, column (1)"
    context: >
      Number of observations in Table 2, column (1): the bags visually
      inspected by enumerators across all households in the returns to
      quality experiment.
  - description: n_obs_table2_cols3_5_sales
    value: 116
    claim_type: count
    unit: sales
    location: "Table 2, Observations, columns (3)-(5)"
    context: >
      Number of observations in Table 2, columns (3) to (5): the maize
      sales recorded in the final visit to the returns to quality
      households.

  # ---- Table 6, Panel A: market access experiment ----
  - description: market_access_price_table6_panelA_col1
    value: 0.017
    claim_type: coefficient
    unit: US dollars per kilogram
    location: "Table 6, Panel A (Market access experiment), column (1) Price, Access to a market for quality maize"
    context: >
      Table 6 ("Impact on Productivity and Income"), Panel A, column (1).
      Market access experiment: villages randomly assigned to access to an
      agricultural trading company that buys maize of sufficient quality
      at a premium (with extension service), or to control; households
      surveyed over three baseline and four follow-up seasons.  ANCOVA
      regression on follow-up seasons only: the outcome on the treatment
      indicator, season dummies and the household's pretreatment value of
      the outcome.  Outcome: average price per kilogram of maize sold, in
      US dollars.  Standard errors clustered by village (the table prints
      p-values, not standard errors, in parentheses).
  - description: market_access_yield_table6_panelA_col4
    value: 108.9
    claim_type: coefficient
    unit: kilograms per acre
    location: "Table 6, Panel A (Market access experiment), column (4) Yield, Access to a market for quality maize"
    context: >
      Table 6, Panel A, column (4): the same ANCOVA (treatment, season
      dummies, pretreatment value of the outcome; follow-up seasons;
      village-clustered inference) with yield, the maize harvest in
      kilograms per acre of cultivated land, as the outcome.
  - description: market_access_harvest_value_table6_panelA_col5
    value: 78.9
    claim_type: coefficient
    unit: US dollars per season
    location: "Table 6, Panel A (Market access experiment), column (5) Harvest value, Access to a market for quality maize"
    context: >
      Table 6, Panel A, column (5): the same ANCOVA with the harvest value
      in US dollars as the outcome; harvest value includes own-produced
      consumption, valued at the community-specific market price.
  - description: market_access_profit_monetary_table6_panelA_col7
    value: 63.1
    claim_type: coefficient
    unit: US dollars per season
    location: "Table 6, Panel A (Market access experiment), column (7) Profit (monetary expenses), Access to a market for quality maize"
    context: >
      Table 6, Panel A, column (7): the same ANCOVA with profit (monetary
      expenses) as the outcome: harvest value minus expenses on inputs,
      equipment, transport and hired labor, in US dollars.
  - description: market_access_profit_incl_own_hours_table6_panelA_col8
    value: 97.6
    claim_type: coefficient
    unit: US dollars per season
    location: "Table 6, Panel A (Market access experiment), column (8) Profit (incl. own hours), Access to a market for quality maize"
    context: >
      Table 6, Panel A, column (8): the same ANCOVA with profit including
      own hours as the outcome: harvest value minus monetary expenses and
      the cost of the household's own labor valued at market wages, in US
      dollars.
  - description: n_obs_table6_panelA_cols3_5
    value: 658
    claim_type: count
    unit: household-seasons
    location: "Table 6, Panel A, Observations, columns (3)-(5)"
    context: >
      Number of observations in Table 6, Panel A, columns (3) to (5)
      (harvest, yield, harvest value): household-season observations in
      the follow-up seasons of the market access experiment.

