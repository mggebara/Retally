notes: >
  Headline findings: in the returns to quality experiment the service
  package cut visually verified defects by -2.16 (0.212) types per bag
  (Table 2 col 1, N 622 bags) and lab-measured defects by -0.20 (0.054)
  (col 2, N 82), yet price moved by 2.95 (9.870) UGX/kg (col 3),
  deductions by 0.18 (0.633) percent (col 4) and net price by 0.98
  (10.621) (col 5; cols 3-5 N 116 sales, 94 households): the return to
  quality is zero.  In the market access experiment (Table 6 Panel A,
  ANCOVA, village-clustered p-values in parentheses, permutation p-values
  in brackets) access raised the price by 0.017 USD/kg (0.001) [0.004],
  yield by 108.9 kg/acre (0.041) [0.049], harvest value by 78.9 USD
  (0.078) [0.102], profit (monetary expenses) by 63.1 (0.061) [0.079] and
  profit incl. own hours by 97.6 (0.029) [0.031]; Ns 617 (price), 658
  (harvest, yield, harvest value), 640 (cols 6-7), 464 (col 8).

  Paper text and how it was verified.  The catalog source is the
  published AER article itself (Atypon-produced typeset PDF on Jakob
  Svensson's site), so its cells are the published values by
  construction.  It was still checked cell by cell against the
  meta-database: all 129 numeric o_coeff_dbl / o_std_err_dbl / o_p_dbl
  values of the 64 rows (Table 2 cols 1, 2, 4; Table 4 col 3; Table 5
  both panels, all 16 cells; Table 6 bracketed p-values; Table 7 all
  nine cells) equal the printed number in the same table cell (125 by
  script on the parsed table blocks, the four Table 7 Panel B bracketed
  p-values 0.680 / 0.052 by eye).  One meta-database coding quirk, not a
  typo: for Table 5 the DB records the parenthesised number as
  o_std_err_dbl, but the paper's notes say parentheses are clustered
  p-values (e.g. 2.37 (0.045) [0.049] is coded SE 0.045, p 0.049); Table
  6 rows, coded with p only, read the bracket.  Other open texts: the
  J-PAL / Tessa Bold working papers (January / April 2021 "Three Field
  Experiments", August 2021 "Four Field Experiments", January 2022) were
  not used.

  Curation pass (2026-11-09).  13 claims.  Left out: Table 2 col 2 N (82)
  and the Households / R2 / Mean control rows; Table 6 Panel A cols 2
  (acreage), 3 (harvest) and 6 (monetary expenses) and its other Ns;
  Table 6 Panel B (extension service, all null); Table 5 (investment;
  same ANCOVA, kept the entry at 13); Table 4 (quality, a difference in
  means with a quasi-control group and Horowitz-Manski / Lee bounds);
  Table 7 (trader market shares and prices); Tables 1 and 3
  (descriptive / balance); every permutation p-value and the online
  appendix.

  Package-only facts (never in contexts).  Table 2 (dofiles/table2.do on
  data/end/quality_for_analysis.dta built by FINAL_create_vars_returns.do
  from data/raw/anonym_returns_data.dta, quasicontrol==0): col 1 reshapes
  defects_visual_tot_ long by bag and runs areg ... treatment,
  a(ea_code) cluster(hhh_id); col 2 areg defects_lab_share_r treatment,
  a(ea_code) robust; cols 3-5 reshape price_ / deduct_totalshare100_ /
  net_priceavg_ long by sale, drop missing price and sale 1 (the random
  bag bought by the research team), areg y treatment i.ea_code,
  cluster(hhh_id) a(week_sale_).  Table 6 (dofiles/table6.do on
  data/end/panel_g1g2_analysis.dta built by FINAL_create_vars_main_g1.do,
  _g2.do and merge_gr1_gr2.do from data/raw/panel_g1.dta / panel_g2.dta):
  group 1, treatment buy_treatment; the ANCOVA control is the outcome's
  household mean in the last baseline season (season_spring2018), else
  the mean over pre-treatment seasons (season_ante); reg y buy_treatment
  y_p3 i.survey_season if group==1 & season_post==1, cluster(ea_code).
  Price is revenue over kilograms sold; harvest value is revenue plus the
  unsold remainder at the village-season mean price (household 10249026
  in season 3 valued at that mean); monetary values are converted from
  UGX at a season-specific rate (3575 ... 3685 UGX per USD); profit incl.
  own hours uses the household's own labor hours priced at 833 UGX/hour
  and exists only for seasons 5-7.  Randomization-inference p-values use
  10,000 village-level permutations (permutations.do; about five hours in
  Stata per the README).

  Blind-mode exposure (step 6, 2026-11-09).  Both modes reached
  llm_answer_pending at zero cost (oracle label curate-t50, placeholder
  methodology summary and an empty hyperparameter list).  The blind
  generation prompt states no pinned value or SE at printed precision or
  rounded to 1-3 significant figures (its only hits are claim list
  numbers 10 and 11, "10,000 permutations", file sizes and row counts)
  and carries no do-file text; the independent prompt names no script.
  The abstract prints no numbers.  The methodology summariser and
  hyperparameter extractor get the full paper text, as for every entry,
  and the paper's prose states several targets ("Altogether 622 bags",
  "116 sales from 94 households", "US$79 ... per season"); the README's
  blind-mode caveat covers this.  The paper parser takes the AER running
  header ("American Economic Review 2022, 112(8): 2518-2552") as the
  title.

  What was read.  The published article (all 35 pp.; Tables 2 and 4-7 in
  detail, Sections IV-V); DP72 in full and the JCRE version's
  reproducibility section; the 64 meta-database rows; README.pdf and
  "Results reported in the main text.pdf"; FINAL_master.do, table2.do,
  table6.do, merge_gr1_gr2.do and the outcome-construction part of
  FINAL_create_vars_main_g1.do; the column lists of the eight .dta
  files; the strip-rule classification of the extracted package.

  What could not be verified.  The authors' Stata code was not run (no
  Stata here) and no independent R cross-check was made in this pass.

  Original analysis in Stata 16; language: r is the reproduction target.
