# Original paper: Brouwer, T., Galeotti, F., & Villeval, M. C. (2022).
#   "Teaching Norms: Direct Evidence of Parental Transmission." The
#   Economic Journal, 133(650), 872-887 (Advance Access 2022-10-04; print
#   issue dated 2023).  doi:10.1093/ej/ueac074
#
# Reproduction report: Brun, M., De Vera, M., Kadriu, V., & Mierisch, F.
#   (2024). "Reproduction of 'Teaching Norms: Direct Evidence of Parental
#   Transmission'." I4R Discussion Paper No. 106 (March 2024; Vienna
#   Replication Games; I4R First Meta Database team 83, rows 4164-4448).
#   Verdict: computationally reproducible.  The meta-database records
#   computational_reproduction = 1, perfect_reproduction = Yes,
#   why_not_perfect_repro = "Perfect Reproduction".  DP 106 section 3:
#   "We are generally capable of replicating the results of the authors
#   when we use the vector of control variables used by the authors"; its
#   Table 3 reprints Table 2 cell for cell from the package.  The minor
#   issues it lists are about the package, not the numbers: variables not
#   lower-cased or value-labelled, no variable-construction code at first
#   (the authors sent it later), and controls that differ from the
#   pre-registration (the paper adds Morning and Witness).  All 285 rows
#   are robustness variants: pre-registered, extended or no controls,
#   own-child-only samples, and the appendix tables A6/A7/A9/A10.
#   DP 106 concludes that every result is "robust to our changes in the
#   model specification".
#
# Why this paper:
#   1. Small Stata package (4.6 MB zip, data 0.4 MB): one field-experiment
#      file (601 rows) in .dta and .csv, one do-file, a codebook.
#   2. The headline is one main table (Table 2: four linear probability
#      models with school-clustered SEs) of simple dummy regressions, so a
#      blind reproduction is testable from the paper's description alone.
#   3. The open HAL text is the accepted manuscript: it is text-identical
#      to the package's accepted PDF, and its Table 2 equals every I4R
#      o_coeff / o_std_err for Table 2.
#
# What original_claims pins: the Child, VH and Child x VH coefficients of
#   Table 2 with their clustered SEs (Child and Child x VH in all four
#   columns; VH only in the controlled columns 2 and 4, since in columns 1
#   and 3 it is a plain difference in rates), plus the observation counts
#   of column 2 (one target with missing gender dropped) and column 3.
#   The abstract states no numbers.
#
# Strip rule.  The package ships the accepted manuscript and online
#   appendix as PDFs ("1 paper/EJ MS20210782_accepted.pdf", "2
#   appendices/EJ_MS20210782_online_appendix.pdf").  The content-aware
#   rule did not content-test PDFs, so both were left on the
#   independent/blind mount with Table 2 printed in them.
#   benchmark/strip_rule.py now strips a PDF that has a page reading as a
#   regression table (added with this entry); see notes.

id: brouwer-2022-teaching-norms
i4r_report_url: https://www.econstor.eu/bitstream/10419/286490/1/I4R-DP106.pdf
# Target language for regeneration (the original is Stata; Retally
# generates R and reads master.dta / master.csv).
language: r
outcome_label: reproducible
split: holdout
