# Experimental Study" (halshs-02509758, GAEL Grenoble, 2019-12-20;
# halshs-02509764, MPI Bonn, 2020-01-08).  Both are submitType "notice",
# with no file, so they are not public texts.  No GATE, IZA or CESifo
# working paper was found (web search).  EJ Advance Access 2022-10-04
# (Crossref published-online); print EJ 133(650), 2023.
#
# Package: Zenodo record 7045559, created and published 2022-09-03
# (Zenodo API created / publication_date).  It is the only version
