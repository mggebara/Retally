code_repo:
  url: https://zenodo.org/records/7045559

original_claims:
  - description: child_punishment_no_controls
    value: 0.11
    claim_type: coefficient
    standard_error: 0.05
    sample_size: 400
    unit: probability of direct punishment (0-1)
    location: "Table 2, column (1) Punishment, row Child"
    context: >
      Table 2 ("Determinants of Punishment Rate (Left) and Helping Rate
      (Right)"), column (1), row Child.  Pooled OLS linear probability
      model of Punishment, a dummy equal to 1 if the targeted parent
      verbally and explicitly confronted the actor about the littering
      violation, on a Child dummy (the parent was accompanying one or more
      children, against walking alone), a VH dummy (the Violation + Help
      scene, in which the actor also drops the contents of a bag after
      littering) and their interaction, with no other controls.  The
      sample is the targeted parents in the Violation and Violation + Help
      scenes; the Help scene, which has no violation, is excluded.  Field
      experiment near 30 public elementary schools in Lyon, May-June 2019.
      Standard errors clustered at the school level.
  - description: child_punishment_controls
    value: 0.12
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 399
    unit: probability of direct punishment (0-1)
    location: "Table 2, column (2) Punishment, row Child"
    context: >
      Table 2, column (2), row Child.  Same punishment model and sample as
      child_punishment_no_controls, adding the controls Male Target
      (father targeted), Male Actor (the male actor played the scene),
      Morning, Witness (another non-targeted adult was observing and able
      to intervene), Rich area (the school's IRIS area median income is
      above the city-wide median), Rain and Hot.  One observation is
      dropped for missing data on the target's gender.  School-clustered
      standard errors.
  - description: child_helping_no_controls
    value: 0.21
    claim_type: coefficient
    standard_error: 0.05
    sample_size: 401
    unit: probability of helping (0-1)
    location: "Table 2, column (3) Helping, row Child"
    context: >
      Table 2, column (3), row Child.  Pooled OLS linear probability model
      of Helping, a dummy equal to 1 if the targeted parent picked up at
      least one of the dropped items (or asked the child to), on Child, VH
      and Child x VH, with no other controls.  The sample is the parents in
      the Help and Violation + Help scenes; the Violation scene, which has
      no helping opportunity, is excluded.  School-clustered standard
      errors.
  - description: child_helping_controls
    value: 0.22
    claim_type: coefficient
    standard_error: 0.06
    sample_size: 400
    unit: probability of helping (0-1)
    location: "Table 2, column (4) Helping, row Child"
    context: >
      Table 2, column (4), row Child.  Same helping model and sample as
      child_helping_no_controls, with the controls of
      child_punishment_controls (Male Target, Male Actor, Morning, Witness,
      Rich area, Rain, Hot).  The target with missing gender is dropped.
      School-clustered standard errors.
  - description: vh_punishment_controls
    value: -0.04
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 399
    unit: probability of direct punishment (0-1)
    location: "Table 2, column (2) Punishment, row VH"
    context: >
      Table 2, column (2), row VH: the Violation + Help scene dummy in the
      controlled punishment regression of child_punishment_controls.  It
      is the change in the punishment rate of parents alone when a helping
      opportunity follows the violation.
  - description: vh_helping_controls
    value: -0.10
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 400
    unit: probability of helping (0-1)
    location: "Table 2, column (4) Helping, row VH"
    context: >
      Table 2, column (4), row VH: the Violation + Help scene dummy in the
      controlled helping regression of child_helping_controls.  It is the
      change in the helping rate of parents alone when the actor littered
      before dropping the items (indirect punishment).
  - description: child_x_vh_punishment_no_controls
    value: -0.13
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 400
    unit: probability of direct punishment (0-1)
    location: "Table 2, column (1) Punishment, row Child x VH"
    context: >
      Table 2, column (1), row Child x VH: the interaction of the Child and
      Violation + Help dummies in the uncontrolled punishment regression of
      child_punishment_no_controls.
  - description: child_x_vh_punishment_controls
    value: -0.12
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 399
    unit: probability of direct punishment (0-1)
    location: "Table 2, column (2) Punishment, row Child x VH"
    context: >
      Table 2, column (2), row Child x VH, in the controlled punishment
      regression of child_punishment_controls.
  - description: child_x_vh_helping_no_controls
    value: -0.06
    claim_type: coefficient
    standard_error: 0.07
    sample_size: 401
    unit: probability of helping (0-1)
    location: "Table 2, column (3) Helping, row Child x VH"
    context: >
      Table 2, column (3), row Child x VH, in the uncontrolled helping
      regression of child_helping_no_controls.  This is the test of the
      indirect-punishment conjecture (Result 3: not significant).
  - description: child_x_vh_helping_controls
    value: -0.07
    claim_type: coefficient
    standard_error: 0.08
    sample_size: 400
    unit: probability of helping (0-1)
    location: "Table 2, column (4) Helping, row Child x VH"
    context: >
      Table 2, column (4), row Child x VH, in the controlled helping
      regression of child_helping_controls.
  - description: observations_punishment_controls
    value: 399
    claim_type: other
    unit: targeted parents
    location: "Table 2, column (2), Observations"
    context: >
      Observations in the controlled punishment regression (Table 2,
      column 2): parents in the Violation and Violation + Help scenes with
      non-missing controls.
  - description: observations_helping_no_controls
    value: 401
    claim_type: other
    unit: targeted parents
    location: "Table 2, column (3), Observations"
    context: >
      Observations in the uncontrolled helping regression (Table 2,
      column 3): parents in the Help and Violation + Help scenes.

