notes: >
  Headline finding: in a natural field experiment near 30 Lyon elementary
  schools (601 targeted parents, May-June 2019), parents walking with
  their child are more likely to confront a litterer directly (Table 2
  col 2: Child 0.12, SE 0.04; raw rates 22 vs 11 percent, Figure 1a) and
  more likely to help a stranger who drops their belongings (col 4: Child
  0.22, SE 0.06; 47 vs 26 percent).  They are not more likely to punish
  indirectly by withholding help (col 4: Child x VH -0.07, SE 0.08, not
  significant).  With a helping opportunity, direct punishment by parents
  with children falls (Child x VH -0.12, SE 0.04, col 2), which the
  authors read as greater fear of retaliation.

  Curation pass (2026-11-01).  Pinned 12 claims, all from Table 2: Child
  in columns 1-4, VH in columns 2 and 4, Child x VH in columns 1-4 (each
  with its school-clustered SE in standard_error, printed to two
  decimals, so the printed-precision floor is +/-0.005), and two
  observation counts.  Column 2 (punishment, controls) has 399 and
  column 3 (helping, no controls) has 401; columns 1 and 4 have 400, and
  all four have 30 school clusters.  Columns 1 and 3 have no controls
  and are saturated in Child x VH, so their coefficients are differences
  in the Figure 1 rates printed in the paper (0.11, 0.22, 0.07, 0.05 and
  0.26, 0.47, 0.16, 0.31).  A model that reads Figure 1 can derive them;
  the controlled columns 2 and 4 are not derivable that way.  Left out:
  the VH rows of columns 1 and 3 (also pure rate differences), the
  control coefficients, constants, R2 (0.04 / 0.07 / 0.06 / 0.13) and F
  (7.74 / 5.17 / 7.36 / 6.45), Table 1 summary statistics, the in-text
  chi-squared tests (4.39, 9.82, 6.26, 12.37, 0.98), the witness
  confidence intervals, and everything in the appendix (logit marginal
  effects, Table A7 sample restrictions, A9/A10 heterogeneity, vignette
  and video studies).

  Paper version check (brief step 1).  Table 2 in the July 2022 submitted
  version (hal-03725575) and in the August 2022 accepted manuscript
  (hal-03793652, the paper.source) is identical.  Both equal the six
  distinct Table 2 o_coeff / o_std_err pairs of the I4R meta-database:
  0.12 (0.04), 0.22 (0.06), -0.04 (0.03), -0.10 (0.04), -0.12 (0.04),
  -0.07 (0.08).  The OUP typeset version could not be fetched (403); the
  accepted manuscript is what the EJ typeset.

  Independent cross-check (not the package code: pandas / statsmodels OLS
  with school-clustered SEs on master.csv).  Reproduces every pinned value
  at the printed precision.  Col 1: Child 0.1100 (0.0481), VH -0.0400
  (0.0312), Child x VH -0.1300 (0.0446), N 400.  Col 2: 0.1161 (0.0441),
  -0.0386 (0.0285), -0.1223 (0.0429), N 399.  Col 3: 0.2126 (0.0546),
  -0.0974 (0.0453), -0.0626 (0.0710), N 401.  Col 4: 0.2214 (0.0568),
  -0.1035 (0.0436), -0.0677 (0.0772), N 400.  30 clusters throughout;
  R2 0.043 / 0.068 / 0.060 / 0.131.

  Package structure (package-only facts; never in contexts).  master.csv /
  master.dta columns include School (30 school codes, e.g. "CB"), day,
  Child (0/1), scene and Condition (strings), Violation, ViolationHelp,
  Help (scene dummies), Punishment, Helping, HelpingParents, male (target
  is a father; one missing), hugo (male actor), Morning, witness, rich,
  Rain, Hot, inc_Q, povrate, response2, OwnChild, numkids and child-age
  dummies.  Table 2 in the do-file: `reg Punishment
  i.Child##i.ViolationHelp [$controls] if Help==0, cluster(School)` and
  `reg Helping i.Child##i.ViolationHelp [$controls] if Violation==0,
  cluster(School)`, with $controls = i.male i.hugo i.Morning i.witness
  i.rich i.Rain i.Hot, written by esttab to Results/Table2.tex.  The
  do-file sets a hard-coded global PATH with Windows backslash paths
  ("$PATH\Data") and needs esttab (ssc).

  Strip-rule change made with this entry.  benchmark/strip_rule.py now
  content-tests .pdf files with pymupdf, the pipeline's own PDF parser.
  A PDF is withheld as regression-table when one page carries three of
  the five regression-table markers the .tex test counts: Observations,
  an R2 row, a standard-errors note, a significance-star legend, and
  three or more parenthesised SEs.  There is no table-tool shortcut, and
  unreadable PDFs are kept.  Here it withholds the accepted manuscript
  PDF and the online appendix PDF.  Over the 97 PDFs in the 18 locally
  cached packages, every non-manuscript PDF (README, codebook, IRB,
  instructions, pre-registration) scores 0 or 1 and is kept.  The
  manuscript and appendix PDFs of dincecco-2022 (4) and hanlon-2022 (3)
  are newly withheld too; hanlon-2022's notes recorded that leak.

  What was read.  Both HAL PDFs (main text and Table 2; the July
  version's appendix skimmed); I4R DP 106 (EconStor PDF, sections 2-4 and
  Tables 3-5); the meta-database's 285 rows; Zenodo API metadata; the
  whole package listing, the ReadMe PDF, the do-file's Table 2 block, the
  master.csv header, and the kept Results/*.tex tables (to confirm none
  carries a Table 2 number).

  What could not be verified.  The OUP typeset PDF (403), though the
  accepted manuscript is text-identical to the package's accepted PDF.
  The do-file was not run.  DP 106 says the authors later sent I4R the
  variable-construction code and "incorporated it into the replication
  package".  Zenodo 7045559 has a single version (2022-09-03) without
  that code, so the update, if any, lives elsewhere (perhaps the EJ's own
  copy or I4R's Zenodo 8114738); it does not affect the analysis data.

  Curation check (2026-11-01, zero cost).  `benchmark.runner --llm-oracle
  curation-check --only brouwer-2022-teaching-norms`, run once in each
  of --mode blind and --mode independent.  Both cells stopped as
  llm_answer_pending on the first call, the methodology summary.  That
  prompt embeds the paper text, Table 2 included, by design; it carried
  no package script text, file names or claim tokens.  The project
  downloader fetched Zenodo 7045559, and the script-free copy withholds
  18 files (16 plus two __MACOSX stubs); no Table 2 cell occurs in what
  it keeps.  The blind code-generation prompt for these claims is
  checked by tests/test_blind_prompt.py (passes).

  Original analysis in Stata (one do-file); language is r, the
  reproduction target.
