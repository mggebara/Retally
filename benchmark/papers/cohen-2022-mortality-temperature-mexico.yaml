# No I4R row covers Table 5: all 42 meta-database rows are Table 2 /
# Figure 2 robustness variants (see the header), and no discussion paper
# prints a reproduction of the Seguro Popular tables.  As in lopez-2022, a
# robustness variant is not recorded as a reproduction; unlike lopez-2022
# there is no row for any pinned cell at all, so no finding is recorded.
i4r_replicator_findings: []

notes: >
  Headline findings: the Seguro Popular reduced the extra mortality of
  mildly cold days among the eligible (uninsured) population.  Table 5,
  Seguro Popular x days per bin (deaths per 100,000 per month per day):
  col 1 (baseline, bins also x municipality-by-month FE) below 12°C
  0.013 (0.022), 12-16°C -0.031 (0.012), 16-20°C -0.017 (0.011); col 2
  (bins x month-by-year FE only) 0.010 (0.019), -0.032 (0.011), -0.017
  (0.009), 20-24°C -0.005 (0.010), 28-32°C -0.001 (0.012), above 32°C
  -0.011 (0.052); col 3 (bins x month-by-year and x state FE) 0.010
  (0.019), -0.034 (0.011), -0.016 (0.009), -0.005 (0.010), -0.001
  (0.012), -0.017 (0.054); col 4 (all causes) 12-16°C -0.043 (0.016).
  Abstract: at least 1,600 lives per year since 2004, from col 1.  Only
  cols 2 and 3 are pinned (feasibility, see the header).

  Curation pass (2026-11-10).  Pinned 12 claims, values exactly as
  printed in the accepted manuscript, every one equal to the package's
  Table 5.rtf (esttab b(8), per-person rates; x 100,000, e.g. col 2
  12-16°C -0.00000032 (0.00000011)) and to a curation run in the sandbox
  image (R 4 / fixest feols with weights, varying slopes MA[...] and
  CVE_ENT[...], cluster = municipality): col 2 0.0102 (0.0193), -0.0320
  (0.0109), -0.0173 (0.0093), -0.0053 (0.0098), -0.0006 (0.0122),
  -0.0109 (0.0518); col 3 0.0101 (0.0195), -0.0336 (0.0109), -0.0163
  (0.0093), -0.0052 (0.0099), -0.0014 (0.0125), -0.0168 (0.0538).  Note
  col 2 28-32°C: -0.00064 prints as -0.001, inside the printed-precision
  half unit.  No meta-database row covers these cells (all 42 rows are
  Table 2 / Figure 2), so there is nothing to cross-check and no
  meta-database typo to record; the Table 2 cells the rows do cover all
  match the manuscript.  Left out: Table 5 cols 1 and 4, all of Table 6
  and the abstract's 1,600 (municipality-by-month x bin interactions:
  the fixest run of col 1 had not finished after 13 minutes, over the
  300 s sandbox limit); Table 5 cols 5-6 (also weights from
  pop_A_Derecho0_censo.dta, written by the section-5 census scripts and
  not shipped); Table 2 (the I4R-covered table), Tables 3-4 and Figures
  2-3 (daily distributed-lag model on the two multi-GB panels removed
  from the catalog copy; the README says they need more than 250 GB of
  RAM); Table 1 (summary statistics); every appendix table.

  Package-only facts (never in contexts).  "7. Produce Table 5 and Table
  6/1. Estimations for Table 5 and Table 6.do": use DEATH_OCUR_MONTHLY.dta
  (828,711 municipality-months, 240 variables); TREATMENT = (time -
  TIMING >= 0), where Stata treats a missing TIMING (365 rows) as +inf,
  so those rows are coded 1 (the curation run kept that coding; whether
  it matters was not tested); merge 1:1 on CVE_ENT CVE_MUN anio mes with
  BINS_MONTHLY.dta (scale_*_m day counts per 2°C bin, PREC_m, a_m days
  observed; incomplete months already dropped); 4°C bins scale_12_x =
  scale_10_m + scale_12_m (below 12), scale_16_x = 14+16, scale_20_x =
  18+20, scale_24_x = 22+24, scale_32_x = 30+32 (28-32), scale_32p_x =
  scale_32_p_m; PREC_x = PREC_m / a_m; TREATMENT_* = TREATMENT x bin;
  merge m:1 on CVE_ENT CVE_MUN anio with
  SIMBAD_PoblacionDerechohabiente.dta (Share_derecho); Pop_Derecho0 =
  int(pop_total x (1 - Share_derecho)); outcome DR_Derecho0_Popular_c =
  sum_Derecho0_Popular_c / Pop_Derecho0 (per person; the paper reports x
  100,000).  reghdfe DR TREATMENT_scale_12 _16 _20 _24 _32 _32p
  TREATMENT_PREC TREATMENT [fweight=Pop_Derecho0], absorb(FE1 FE2
  TREATMENT mes_anio##c.(PREC_x scale_*_x)) cluster(ID_Large), FE1 =
  group(CVE* mes), FE2 = group(CVE* anio); col 3 adds
  CVE_ENT##c.(PREC_x scale_*_x); col 1 adds FE1##c.(...) instead.  esttab
  reports Observations = sum of fweights (18,156,447,450); the estimation
  sample is about 672,000 municipality-months after missing weather
  months and zero weights.  The do-file also merges
  Death_quartile_ingreso_90_small.dta, Ingreso_medio.dta and
  pop_A_Derecho0_censo.dta, which the package does not ship; none enters
  the pinned regressions (a Stata run of the file as shipped would stop
  at the first missing merge).

  Catalog copy of the package.  The full zip (39.7 GB uncompressed)
  exceeds the downloader's 20 GiB extraction cap, so dataset.source is a
  copy with the two daily panels deleted (command in access_notes); it
  must be recreated next to the placed zip on any machine that runs this
  entry.  Sandbox I/O: reading the needed columns of the 0.94 GB
  mortality panel and the weather panel took about 90 s in the curation
  run; a reproduction should read them once and keep a compact copy for
  the regressions.  The generation prompt's file listing (curation run,
  2026-11-10) shows 14 files ("... and 281 more files"), mostly
  2000-census person files, and the data inventory is capped before the
  two monthly panels; neither DEATH_OCUR_MONTHLY.dta nor
  SIMBAD_PoblacionDerechohabiente.dta is named in the prompt, so a
  reproduction has to find them by listing the directory.

  What was read.  The accepted manuscript (abstract, Sections V.A-V.B,
  Tables 2, 5 and 6 in detail); the 42 meta-database rows; Readme.pdf;
  the Table 5/6 do-file; Table 5.rtf and Table 6.rtf; the variable lists
  of the three input files; the strip-rule classification of the
  package's text files.

  What could not be verified.  The published typeset article (paywalled)
  was not compared with the manuscript beyond the I4R-recorded Table 2
  cells.  The authors' Stata code was not run (no Stata here); the R run
  above is the curation's own.

  Original analysis in Stata (reghdfe, estout); language: r is the
  reproduction target.
