# Original paper: Cohen, F., & Dechezleprêtre, A. (2022). "Mortality,
#   Temperature, and Public Health Provision: Evidence from Mexico."
#   American Economic Journal: Economic Policy, 14(2), 161-192.
#   doi:10.1257/pol.20180594 (May 2022 issue; Crossref issued 2022-05-01,
#   DOI created 2022-04-29).
#
# Reproduction report: I4R First Meta Database replication team 55 (42
#   rows under the paper title, entered 2023-11-21).  No I4R discussion
#   paper was found for this report (EconStor / web search for the title
#   with "I4R", 2026-11-10).  Verdict: reproducible — the team's survey
#   answer is "Analysis and cleaning code produce the same output as
#   presented in the paper" (best_describe_compreprod), perfect_reproduction
#   is "Yes" with the note "The code ran perfectly. There was a minor
#   coding error from the paper, however, where the original authors
#   dropped February 29th during leap years", the run took 36-48 hours in
#   Stata and the team rated it 10 of 10.  Every row is about Table 2 or
#   Figure 2 (the daily distributed-lag model), and every row with a
#   replicator value is a ROBUSTNESS variant, not a plain recomputation:
#   no weights, no precipitation control, state-level clustering, the
#   leap-day fix, and the leap-day fix combined with each of the other
#   three (result_same blank on all of them).  None covers Table 5,
#   which is all this entry pins, so i4r_replicator_findings is empty
#   (see the comment above it).
#
# Why this paper:
#   1. A manually placed openICPSR package (data_access: manual) that is
#      far larger than anything else in the catalog: 39.7 GB uncompressed,
#      dominated by two daily panels (13.7 GB weather bins with 30 lags,
#      9.8 GB daily death rates) that the paper's Tables 2-4 are estimated
#      from (the README says those steps need more than 250 GB of RAM).
#      Those tables cannot run in the 300 s sandbox; the Seguro Popular
#      tables (5 and 6) use the monthly aggregates (a 0.94 GB mortality
#      panel and a 0.26 GB weather-bin panel).
#   2. A difference-in-differences-style interaction design: a policy
#      dummy interacted with temperature-bin day counts, three overlapping
#      sets of fixed effects, temperature bins and precipitation
#      interacted with month-by-year (and state) fixed effects, frequency
#      weights and municipality-clustered SEs, on a panel near the
#      sandbox's I/O limit.
#   3. The package ships its estimates three ways the strip rule used to
#      keep (125 Stata .ster files, esttab .rtf tables and unnumbered
#      plain-text esttab tables); this PR extends the strip rule for them.
#
# What original_claims pins: Table 5 (effect of the Seguro Popular on the
#   eligible population), columns (2) and (3): the Seguro Popular
#   interaction with each of the six non-reference temperature bins, with
#   SEs as printed.  12 claims, values exactly as printed (3 decimals),
#   none a count.  Feasibility decided the columns: an R/fixest run of
#   these two columns on the package files (curation check, 2026-11-10,
#   the sandbox image, 6 cores) read the two input panels in about 90 s
#   and estimated column (2) in 16 s and column (3) in 46 s, reproducing
#   all twelve printed cells.  Every other Table 5 / Table 6 column (the
#   baseline column (1), the abstract's "1,600 lives" derived from it,
#   column (4), and all of Table 6) also interacts the bins with the
#   municipality-by-month fixed effects (about 29,000 groups x 7 slopes):
#   the same fixest run of column (1) had not converged after 13 minutes,
#   so those cells cannot be reproduced inside the 300 s sandbox limit and
#   are not pinned.  Table 5 columns (5)-(6) also need census-derived
#   population shares the package does not ship (see notes).
#
# Paper text: the published article is paywalled.  The source is the
#   accepted manuscript (AEJPol-2018-0594 REV3, LSE Research Online
#   eprint 115766, cover page "Version: Accepted Version").  Its Table 2
#   prints every value the I4R meta-database records for the published
#   Table 2, cell for cell: 5,705 (591), 11,142 (1,494), 7,536 (1,449),
#   -367 (718), 1,769 (403), 539 (75), total 26,324 (3,609) equal the
#   rows' o_coeff_dbl / o_std_err_dbl (the candidates file's "0 of 7
#   exact" was a token-format artefact: the manuscript prints thousands
#   separators).  So Table 5, which no I4R row covers, is pinned from
#   this accepted manuscript on the strength of its I4R-covered cells all
#   matching.  The package's own esttab output (Table 5.rtf; per-person
#   rates, 8 decimals) and the curation's R run agree with every pinned
#   cell after scaling by 100,000.

id: cohen-2022-mortality-temperature-mexico
i4r_report_url: https://github.com/I4Replication/I4R-First-Meta-Paper
# Target language for regeneration (the original is Stata with reghdfe,
# estout and did_multiplegt; Retally generates R and reads the .dta files
# with haven).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  publication_date is the FIRST public
# version: Grantham Research Institute / CCCEP Working Paper 268,
# "Mortality inequality, temperature and public health provision:
# evidence from Mexico" (May 2017; LSE eprint 88020; data 1998-2010 and
# different headline numbers, "45,000 deaths a year").  Later revisions
# of WP 268 are dated October 2019 and October 2020 (file names on
# cccep.ac.uk / lse.ac.uk; found by web search 2026-11-10, not opened).
# The journal version: Crossref issued 2022-05-01 (DOI created
# 2022-04-29).  package_release_date is the DataCite registration of
# doi:10.3886/E125201V1 (registered 2022-04-21T18:23:15Z, DataCite API
# 2026-11-10); the openICPSR page itself needs a login.  The package's
# Stata logs are in a folder named "March 2021", and the .rtf tables are
# stamped 2021-03-06.
publication_date: "2017-05"
package_release_date: "2022-04-21"

paper:
  # Accepted manuscript on LSE Research Online (eprint 115766); checked
  # 2026-11-10: 200 application/pdf, 2,553,091 bytes, md5
  # fab2f9a358b5f0f0cfdb47f7fc91caaf, 81 pp. (cover page, 33 pp. of
  # text, main Tables 1-6 on pp. 34-39, then figures and the online
  # appendices).  Its footnote 36 quotes the column (1) 12-16°C
  # coefficient once as "-0.035" and once, in the formula, as "0.031"
  # (Table 5 prints -0.031); the formula's value is the one that gives
  # "≈ 1,600".
  source: https://researchonline.lse.ac.uk/id/eprint/115766/1/AEJPol_2018_0594_REV3_manuscript_POSTPRINT.pdf
  title: "Mortality, Temperature, and Public Health Provision: Evidence from Mexico"
  authors:
    - François Cohen
    - Antoine Dechezleprêtre

dataset:
  source: benchmark/manual-packages/T55/125201-V1-no-daily-panels.zip
  data_access: manual
  access_notes: >
    AEA Data and Code Repository on openICPSR, project 125201, version V1
    (doi:10.3886/E125201V1); login and terms-of-use click-through required,
    so the zip was downloaded by hand (2026-11-09) and placed unchanged at
    benchmark/manual-packages/T55/125201-V1.zip (6,300,749,153 bytes, md5
    5236ca017e660e3caf5a0f8c5e495fd6; SOURCE.txt beside it).  V1 is the
    only version.  555 entries, 39,692,074,204 bytes uncompressed: more
    than the downloader's 20 GiB extraction cap, which refuses the whole
    archive.  The catalog source is therefore a copy of that zip with the
    two daily analysis panels deleted, made with
    `cp 125201-V1.zip 125201-V1-no-daily-panels.zip && zip -d
    125201-V1-no-daily-panels.zip "1. Create weather data/data
    sources/Weather data from CONAGUA/Processed/30L_BINS_4C_AEJ.dta" "2.
    Create death rates/Daily/data created/DEATH_1998_2017_AEJ.dta"` in
    benchmark/manual-packages/T55/ (2,528,016,270 bytes, md5
    a6c5bd9dcf5efe74b11212f5c6b55720 with Info-ZIP 3.0 on macOS; 553
    entries, 16,208,981,448 bytes uncompressed).  The two deleted files
    (13.7 GB weather bins with 30 daily lags, 9.8 GB daily death rates)
    feed only Tables 2-4, Figures 2-3 and the daily appendix models, none
    of which is pinned, and could not be read in the 300 s sandbox anyway.
    Contents: Readme.pdf (23 pp.; data sources, run order, file-to-table
    map, variable naming, no estimates); Master.do; folders "1. Create
    weather data" (three do-files, raw CONAGUA daily station data as .CSV
    and .DTA for 32 states, processed MIN/MAX_TEMPERATURE, PRECIPITATION,
    EVAPORATION .dta and BINS_MONTHLY.dta, 262 MB, the monthly weather
    bins), "2. Create death rates" (raw INEGI death records DEFUN90-17.DTA,
    population files, the 0.94 GB monthly panel DEATH_OCUR_MONTHLY.dta,
    SIMBAD_PoblacionDerechohabiente.dta/.xlsx with the insured share by
    municipality and year, the 2016 Seguro Popular nomenclature as PDF,
    .xlsx and .dta), "3. Produce Figure 1" to "7. Produce Table 5 and
    Table 6" (do-files, figure PNGs, Table 1.xlsx summary statistics,
    Table 5.rtf and Table 6.rtf), "5. Produce Figure 3, Table 4 and
    Appendix C" (2000 census person files PER_F*.DTA, about 2.2 GB),
    Appendix A (climate-model .txt grids, about 4.0 GB, life-table and
    climate-change .xlsx, appendix .rtf tables), Appendix B (pollution
    .xlsx, climate-zone and INEGI shapefiles, four nested INEGI map zips),
    Appendix D (appendix .txt/.rtf tables, figure data .dta),
    "Required Stata Package" (did_multiplegt.ado/.sthlp), log/March 2021
    (18 .smcl logs), and 125 Stata .ster saved-estimate files in the
    output/ folders.  The script-free copy (independent / blind)
    withholds 202 files (the runner's manifest, 2026-11-10): 67 by
    script suffix (48 .do, 1 .ado, 18 .smcl), 125 .ster saved estimates
    (by name, rule added with this entry) and 10 esttab tables by content
    (Table 5.rtf, Table 6.rtf, Appendix A Table Monthly Main/FEs.rtf,
    Appendix D Table D3-D6 .rtf, and the unnumbered plain-text Table
    D1.txt / D2.txt; rule extended with this entry).  Kept: Readme.pdf,
    the data, Table 1.xlsx (summary statistics), the other .xlsx
    workbooks, the figure PNGs, did_multiplegt.sthlp and a 162-byte Word
    lock file (~$ble Monthly FEs.rtf, no numbers).  Table 5 columns (5)-(6) and the Table 5/6 do-file's merges also
    read three files the package does not ship (Death_quartile_ingreso_90_
    small.dta, Ingreso_medio.dta, pop_A_Derecho0_censo.dta, written by the
    section-5 census scripts); none enters the pinned regressions.
    Project page:
    https://www.openicpsr.org/openicpsr/project/125201/version/V1/view

original_claims:
  # ---- Table 5, column (2): bins x month-by-year fixed effects ----
  - description: sp_x_days_below_12_table5_col2
    value: 0.010
    claim_type: coefficient
    standard_error: 0.019
    unit: deaths per 100,000 eligible inhabitants per month, per additional day below 12°C in the month
    location: "Table 5, column (2), Seguro Popular x days below 12°C"
    context: >
      Table 5 ("Impact of the Seguro Popular on the eligible population"),
      column (2).  Monthly municipality panel, 1998-2017.  Outcome: the
      monthly mortality rate per 100,000 inhabitants among people without
      any other (standard) health insurance (no insurance, the Seguro
      Popular or IMSS Oportunidades), dying from weather-sensitive causes
      (all causes except infectious and parasitic diseases, neoplasms and
      violent and accidental deaths) covered by the Seguro Popular.
      Regressors: a Seguro Popular availability dummy (1 in a municipality
      from the first month in which a death of someone covered by the
      Seguro Popular is recorded there) interacted with the number of days
      in the month in each average-daily-temperature bin (below 12°C,
      12-16, 16-20, 20-24, 28-32, above 32°C; 24-28°C is the reference)
      and with precipitation, plus the dummy itself.  Fixed effects:
      municipality by month, municipality by year and month by year; the
      temperature-bin day counts and precipitation are each interacted
      with the month-by-year fixed effects (column (2) drops the
      municipality-by-month interactions of the baseline column (1)).
      Weighted by the municipality population with no access to any other
      health insurance; standard errors clustered by municipality.  The
      entry is the interaction with the number of days below 12°C.
  - description: sp_x_days_12_16_table5_col2
    value: -0.032
    claim_type: coefficient
    standard_error: 0.011
    unit: deaths per 100,000 eligible inhabitants per month, per additional day at 12-16°C in the month
    location: "Table 5, column (2), Seguro Popular x days at 12-16°C"
    context: >
      Table 5, column (2), the specification described for the column (2)
      days-below-12°C entry (eligible population, weather-sensitive
      covered causes, bins and precipitation interacted with month-by-year
      fixed effects, weights for the uninsured population, municipality-
      clustered SEs).  The entry is the interaction of the Seguro Popular
      dummy with the number of days at 12-16°C.
  - description: sp_x_days_16_20_table5_col2
