# Original paper: Hanlon, W. W., & Jaworski, T. (2022). "Spillover Effects
#   of Intellectual Property Protection in the Interwar Aircraft Industry."
#   The Economic Journal, 132(645), 1824-1851. doi:10.1093/ej/ueab091
#
# Reproduction report: none in the I4R Discussion Paper series (the IDEAS
#   listing of all 333 I4R DPs, checked 2026-10-21, has no Hanlon /
#   Jaworski / aircraft entry), but the paper is in the I4R First Meta
#   Database (replicator team 78, 23 rows, entered 2023-12-12), so
#   i4r_report_url points at that database's source repository.  Verdict:
#   reproducible (computational_reproduction = 1, perfect_reproduction =
#   Yes, "Use R instead of Stata to recode same data"; the replicators'
#   survey answer: "Analysis and cleaning code produce the same output as
#   presented in the paper", ten_point_scale 10).
#
# Why this paper:
#   1. Small, clean Stata package on Zenodo (CC-BY-4.0, one 7.7 MB zip):
#      four analysis .dta files plus the raw .csv inputs, three data-build
#      do-files and one main-results do-file.  As with dincecco-2022 and
#      alesina-2022, Retally targets R (language: r) against an R-verified
#      Stata original.
#   2. The I4R replicators re-coded Table 1 in R and matched columns 1-4
#      exactly (a same-language yardstick), with small differences in the
#      control columns 5-6 (see notes).
#   3. The NBER working paper ("Revised September 2021") is open and its
#      Tables 1 and 4 are digit-for-digit the accepted manuscript's and the
#      package's own .tex output; the OUP journal version is paywalled.
#
# original_claims pins the before/after-1926 innovation slopes the abstract
# rests on: Table 1 columns 1-4 (airframes: wing load and maximum speed,
# U.S. only and U.S. relative to the U.K.) and Table 4 column 1 (aero-
# engines: horsepower per pound, U.S. only), each with its robust SE in
# standard_error, plus the two corresponding observation counts.

id: hanlon-2022-aircraft-ip-spillovers
# No I4R report exists to link (see header); this is the public source of
# the I4R First Meta Database rows used below (team 78).
i4r_report_url: https://github.com/I4Replication/I4R-First-Meta-Paper
language: r
outcome_label: reproducible
split: holdout
# Contamination bookkeeping.  First public version: NBER Working Paper
# 26490, November 2019 (a seminar of the same title was given at Oxford
# in May 2019, no paper posted); the PDF used here is the September 2021
# revision.  EJ advance access 2021-11-27 (OpenAlex), print 2022.
# Package: Zenodo record 5627298, publication_date 2021-10-30 (Zenodo API;
# record created the same day; zip named MS20201110_archive_12Oct2021).
publication_date: "2019-11"
package_release_date: "2021-10-30"

paper:
  # NBER w26490, "November 2019, Revised September 2021" — a working-paper
  # PDF, NOT the published EJ text.  Checked 2026-10-21: 200
  # application/pdf, %PDF magic, 84 pages.  The EJ version
  # (doi:10.1093/ej/ueab091) answers 403 at academic.oup.com.  The
  # package's accepted manuscript (MS20201110_accepted.pdf / _main.tex,
  # 2021-10-06) has the same table numbering and identical Table 1 and
  # Table 4 numbers.
  source: https://www.nber.org/system/files/working_papers/w26490/w26490.pdf
  title: "Spillover Effects of Intellectual Property Protection in the Interwar Aircraft Industry"
  authors:
    - Walker Hanlon
    - Taylor Jaworski

dataset:
  source: https://zenodo.org/records/5627298
  access_notes: >
    Zenodo record 5627298, CC-BY-4.0, open (API checked 2026-10-21): a
    single 7.7 MB zip, MS20201110_archive_12Oct2021.zip, which the
    downloader fetches and extracts.  Top-level folders have spaces in
    their names ("1 paper", "2 appendix", "3 replication files") and the
    zip carries a macOS __MACOSX/ tree of AppleDouble "._*" stubs,
    including ._*.do files (300-500 bytes of binary resource-fork data,
    not Stata code) that a script selector keyed on the .do suffix will
    pick up unless it skips __MACOSX.  Data: four Stata .dta analysis
    files (data/dta/) built from 17 raw .csv files (data/raw/).  The
    package also ships the LaTeX source and PDFs of the accepted
    manuscript and online appendix, and the main-table outputs as .tex
    (tables/Table1_*.tex ... Table4_*.tex), so the paper's numbers are
    present in the unpacked directory.

code_repo:
  url: https://zenodo.org/records/5627298

original_claims:
  - description: airframe_wingload_trend_before_1926_us
    value: 0.013
    claim_type: coefficient
    standard_error: 0.006
    sample_size: 116
    unit: log points per year
    location: "Table 1, column 1 (United States Only, Wing Load), Before 1926 x year x US"
    context: >
      Table 1 ("Results for Airframe Innovation Before and After 1926"),
      column 1, row Before 1926 x year x US.  OLS of equation (4): the
      dependent variable is the log of wing load (airframe weight in
      pounds divided by wing area in square feet) for each new U.S.
      military fighter or bomber airframe model (an observation is the
      introduction of a new model, including new versions of existing
      designs, dated by year of first delivery; the paper's figures cover
      1918-1935).  The regressors are a two-piece linear spline in year
      with a knot at 1926, giving separate slopes before and after 1926
      while keeping the level continuous; a constant is the only other
      term.  This claim is the before-1926 slope (the annual rate of
      technological progress before 1926).  Robust standard errors.
  - description: airframe_wingload_trend_after_1926_us
    value: 0.074
    claim_type: coefficient
    standard_error: 0.006
    sample_size: 116
    unit: log points per year
    location: "Table 1, column 1 (United States Only, Wing Load), After 1926 x year x US"
    context: >
      Table 1, column 1, row After 1926 x year x US: the after-1926 slope
      of the same U.S.-only regression as
      airframe_wingload_trend_before_1926_us (log wing load of U.S.
      fighter and bomber models on a continuous two-piece linear spline
      in year with a knot at 1926 plus a constant; robust standard
      errors).
  - description: airframe_maxspeed_trend_before_1926_us
    value: -0.001
    claim_type: coefficient
    standard_error: 0.006
    sample_size: 174
    unit: log points per year
    location: "Table 1, column 2 (United States Only, Maximum Speed), Before 1926 x year x US"
    context: >
      Table 1, column 2, row Before 1926 x year x US.  Same U.S.-only
      specification as airframe_wingload_trend_before_1926_us (equation
      (4): two-piece linear spline in year, knot at 1926, plus a
      constant; robust standard errors) with the log of maximum speed in
      miles per hour as the dependent variable, for U.S. fighter and
      bomber airframe models.  Before-1926 slope.
  - description: airframe_maxspeed_trend_after_1926_us
    value: 0.067
    claim_type: coefficient
    standard_error: 0.006
    sample_size: 174
    unit: log points per year
    location: "Table 1, column 2 (United States Only, Maximum Speed), After 1926 x year x US"
    context: >
      Table 1, column 2, row After 1926 x year x US: the after-1926 slope
      of the U.S.-only log maximum speed regression described in
      airframe_maxspeed_trend_before_1926_us.
  - description: airframe_wingload_trend_before_1926_us_vs_uk
    value: 0.004
    claim_type: coefficient
    standard_error: 0.009
    sample_size: 165
    unit: log points per year
    location: "Table 1, column 3 (Comparison of US and UK, Wing Load), Before 1926 x year x US"
    context: >
      Table 1, column 3, row Before 1926 x year x US.  OLS of equation
      (5) on pooled U.S. and U.K. military fighter and bomber airframe
      models; dependent variable the log of wing load.  The coefficients
      of interest are the two pieces of a linear spline in year (knot at
      1926) interacted with an indicator for the United States, measuring
      the rate of innovation in the United States relative to the United
      Kingdom before and after 1926.  Other terms: a constant, an
      indicator for the United States, and a linear spline (same knot)
      for the comparison country (the United Kingdom).  No engine
      controls.  Robust standard errors.  Before-1926 relative slope.
  - description: airframe_wingload_trend_after_1926_us_vs_uk
    value: 0.025
    claim_type: coefficient
    standard_error: 0.010
    sample_size: 165
    unit: log points per year
    location: "Table 1, column 3 (Comparison of US and UK, Wing Load), After 1926 x year x US"
    context: >
      Table 1, column 3, row After 1926 x year x US: the after-1926 U.S.
      relative slope of the pooled U.S.-U.K. log wing load regression
      described in airframe_wingload_trend_before_1926_us_vs_uk.
  - description: airframe_maxspeed_trend_before_1926_us_vs_uk
    value: -0.028
    claim_type: coefficient
    standard_error: 0.009
    sample_size: 233
    unit: log points per year
    location: "Table 1, column 4 (Comparison of US and UK, Maximum Speed), Before 1926 x year x US"
    context: >
      Table 1, column 4, row Before 1926 x year x US.  Same pooled
      U.S.-U.K. specification as
      airframe_wingload_trend_before_1926_us_vs_uk (equation (5): spline
      in year with knot at 1926 interacted with a U.S. indicator, plus a
      constant, a U.S. indicator and the U.K. spline; no engine controls;
      robust standard errors) with the log of maximum speed in miles per
      hour as the dependent variable.  Before-1926 relative slope.
  - description: airframe_maxspeed_trend_after_1926_us_vs_uk
    value: 0.031
    claim_type: coefficient
    standard_error: 0.010
    sample_size: 233
    unit: log points per year
    location: "Table 1, column 4 (Comparison of US and UK, Maximum Speed), After 1926 x year x US"
    context: >
      Table 1, column 4, row After 1926 x year x US: the after-1926 U.S.
      relative slope of the pooled U.S.-U.K. log maximum speed regression
      described in airframe_maxspeed_trend_before_1926_us_vs_uk.
  - description: engine_hp_per_weight_trend_before_1926_us
    value: 0.039
    claim_type: coefficient
    standard_error: 0.009
    sample_size: 85
    unit: log points per year
    location: "Table 4, column 1 (United States Only, HP / Weight), Before 1926 x year x US"
    context: >
      Table 4 ("Results for Aero-Engine Innovation Before and After
      1926"), column 1, row Before 1926 x year x US.  OLS on U.S.
      aero-engines used in military fighter and bomber aircraft, with a
      specification similar to equation (4): the dependent variable is
      the log of horsepower divided by engine weight in pounds; the
      regressors are a two-piece linear spline in year with a knot at
      1926 (continuous level), a constant, and an indicator for whether
      the engine is liquid-cooled.  Robust standard errors.  Before-1926
      slope.
  - description: engine_hp_per_weight_trend_after_1926_us
    value: -0.010
    claim_type: coefficient
    standard_error: 0.005
    sample_size: 85
    unit: log points per year
    location: "Table 4, column 1 (United States Only, HP / Weight), After 1926 x year x US"
    context: >
      Table 4, column 1, row After 1926 x year x US: the after-1926 slope
      of the U.S.-only log horsepower-per-pound regression described in
      engine_hp_per_weight_trend_before_1926_us (the paper's evidence that
      aero-engine performance growth slowed after 1926).
  - description: observations_airframe_wingload_us
    value: 116
    claim_type: other
    unit: airframe models
    location: "Table 1, column 1, observations"
    context: >
      Number of observations in Table 1 column 1: new U.S. military
      fighter and bomber airframe models with wing load observed, the
      sample of the U.S.-only log wing load regression.
  - description: observations_engine_us
    value: 85
    claim_type: other
    unit: aero-engines
    location: "Table 4, column 1, observations"
    context: >
      Number of observations in Table 4 column 1: U.S. aero-engines used
      in fighters and bombers with horsepower per pound observed, the
      sample of the U.S.-only engine regression.

