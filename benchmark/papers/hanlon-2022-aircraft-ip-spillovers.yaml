notes: >
  Headline finding: after the 1926 change gave U.S. airframe producers
  property rights over new designs, U.S. fighter and bomber airframe
  performance grew much faster (wing load about 1.3% a year before 1926 vs
  7.4% after; maximum speed -0.1% vs 6.7%), the acceleration survives a
  comparison with the U.K., and aero-engine performance growth slowed (U.S.
  horsepower per pound 3.9% a year before vs -1.0% after).

  Original analysis in Stata (15.1 do-files); language: r is the
  reproduction target, as for alesina-2022 and dincecco-2022.

  Curation pass (2026-10-21).  Pinned 12 claims: the before/after-1926
  spline slopes of Table 1 columns 1-4 (the four airframe regressions
  without engine controls) and Table 4 column 1 (U.S.-only horsepower per
  pound, the engine measure the paper calls most relevant), each with its
  robust SE in standard_error, and the two matching observation counts
  (116, 85).  The I4R rows cover only Table 1, so columns 1-4 have direct
  per-claim replicator values; Table 4 rests on the blanket verdict.

  Working-paper caveat.  paper.source is NBER w26490 ("Revised September
  2021"), not the EJ text.  Its Table 1 and Table 4 are identical to the
  package's accepted manuscript (MS20201110_main.tex, 2021-10-06, same
  table numbers), to the package's own tables/Table1_*.tex and
  Table4_*.tex, and (for Table 1) to the meta-database's o_coeff /
  o_std_err (the replicators' record of the published values).  The EJ
  print version itself (paywalled, 403) was not seen.

  Left out.  Table 1 columns 5-6 (adds an indicator for more than one
  engine and log engine horsepower): the I4R R recode got 0.004 (0.010)
  and 0.020 (0.008) for column 5 vs the paper's -0.005 (0.010) and 0.023
  (0.010), and -0.025 (0.010) / 0.025 (0.010) for column 6 vs -0.031
  (0.009) / 0.024 (0.009), yet the database still records a perfect
  reproduction.  The likely cause is package-only: the do-file builds the
  multi-engine indicator as no_engines > 1, which Stata evaluates as true
  for a missing no_engines (11 of the 330 U.S./U.K. fighter-bomber rows),
  so Stata keeps 140 / 192 observations where an R recode dropping
  missings keeps 139 / 191.  A pinned claim that depends on Stata's
  missing-value ordering would penalise a correct R reproduction, so
  these columns are not pinned.  Also left out (12-claim target): Table 4
  columns 2-6 (horsepower per displacement and per frontal area, and the
  U.S.-U.K. engine comparison, whose column 4 after-1926 slope is -0.048
  (0.008), N 123), the F-statistics and p-values of the
  equality tests, Table 2 (liquid-cooled shares, descriptive), and Table
  3 (adoption lag; column 2's interaction is only marginally significant).

  Package structure (package-only facts; never in contexts).  Stata 15.1;
  ssc packages keeporder, estout (README also lists grc1leg, pspline).
  Run order: do/1-data-airframes.do, 1-data-engines.do,
  1-data-vintage.do (build data/dta/*.dta from data/raw/*.csv), then
  do/2-results-main.do (Figures 1-2, Tables 1-4) and
  3-results-appendix.do.  The path is a commented-out global
  ($aircraft).  Table 1 (2-results-main.do lines ~246-400): use
  airframe_data.dta, keep country United States / United Kingdom and
  type fighter / bomber, mkspline pre1926 1926 post1926 = year,
  pre1926_US = US*pre1926, post1926_US = US*post1926; reg ln_wingload /
  ln_maxspeed pre1926_US post1926_US if US==1, vce(r) (cols 1-2);
  reg ... pre1926* post1926* US, vce(r) (cols 3-4); adding ln_enginehp
  and engines (cols 5-6).  Table 4 (lines ~507-600): engine_data.dta,
  keep US / UK, same spline, reg ln_hp_per_lbs pre1926_US post1926_US
  liquid_cooled if US, vce(r).  Note mkspline puts 1926 itself in the
  before segment.  Checked from the shipped .dta (read only, no code
  run): the U.S. fighter-bomber airframe sample has 116 non-missing
  ln_wingload and 174 ln_maxspeed, the pooled sample 165 / 233, and
  engine_data.dta has 85 U.S. / 123 U.S.+U.K. engines with
  ln_hp_per_lbs, matching every printed N.  Years run 1918-1935.  The
  unpacked directory contains the answers (tables/*.tex, the accepted
  manuscript .tex/.pdf); script_free_copy keeps .tex and .pdf, so
  independent and blind runs rely on the prompt's instruction not to
  read them.

  First run 2026-10-21 (Phase 3.2 evaluation pass; main 0492c17, after
  the content-aware strip rule and the printed-precision floor; Opus
  4.7, 47-package image, LLM cache on, --mode all, one run per mode;
  eval-7papers-all-modes-2026-10-21.json).  Seeded 12 / 12 and blind 12
  / 12, both exact on the first script (first scored 12; blind after 1
  error repair); independent 10 / 12 (first scored 10; 1 claim
  refinement): the two Table 4 US max-speed trend claims off (-0.0082 vs
  -0.001, 0.075 vs 0.067).  Blind > independent here is single-run
  noise, not a finding.  11 files stripped from the independent / blind
  mount by the content-aware rule.
