# Original paper: Alesina, A., Miano, A., & Stantcheva, S. (2023).
#   "Immigration and Redistribution." The Review of Economic Studies, 90(1),
#   1-39. doi:10.1093/restud/rdac011 (advance access 2022).
#
# I4R replication report: Discussion Paper 40 (Albrecht, Collins, Gauriot,
#   Wu, June 2023).  Verdict: computationally reproducible and robust — the
#   replicators reproduced Figure 2 and Tables 4-6 with identical point
#   estimates from the authors' package, and every robustness check held.
#   (Minor: a typo in the paper's stated sample size — text says 22,506 /
#   4,500 US, the data has 22,006 / 4,000 US — and no code for Appendix output.)
#
# Why this paper (the Dincecco pattern):
#   1. Replication package is on Zenodo (record 5997521, CC-BY-4.0), openly
#      downloadable with no login — the downloader fetches and unpacks it.
#   2. The estimating code is primarily Stata (.do), with some figure scripts
#      in R Markdown; the I4R replicators re-verified in R.  As with
#      dincecco-2022, Retally targets R (language: r) against an R-verified
#      Stata original rather than shipping a Stata sandbox.
#   3. An open-access PDF of the final text exists: NBER w24733 "Revised
#      March 2022", whose Tables 4-6 are digit-for-digit the replication
#      package's own .tex output.  The OUP journal version is paywalled.
#
# original_claims pins the Order (salience) treatment effects in Table 4
# (the abstract's experimental headline), the two first-stage / immigration
# support results the abstract leans on, and the Figure 2 misperceptions the
# I4R replicators re-tabulated.  Values were checked against the paper text,
# the package's Out/Tables/*.tex and Out/Figures_data/figure_2_l_data.csv,
# and (for Figure 2) DP40 Table 1 and the meta-database's o_coeff_dbl.

id: alesina-2022-immigration-redistribution
i4r_report_url: https://www.econstor.eu/bitstream/10419/272841/1/I4R-DP040.pdf
language: r
outcome_label: reproducible
split: dev
# Contamination bookkeeping.  First public version: NBER Working Paper
# 24733, June 2018 (rev0, 2018-06-28).  Package: Zenodo record 5997521,
# publication_date 2022-01-18 per the Zenodo API (record created
# 2022-02-07 — the date it actually became downloadable).
publication_date: "2018-06"
package_release_date: "2022-01-18"

paper:
  # NBER w24733, latest revision ("June 2018, Revised March 2022"), the
  # final pre-publication text.  Was the Stantcheva Harvard-site PDF
  #   https://scholar.harvard.edu/files/stantcheva/files/0alesina_miano_stantcheva_immigration_restud.pdf
  # but that host now answers 403 Access Denied to curl, WebFetch and a
  # python-requests user agent (Akamai bot block, checked 2026-10-20), so
  # the pipeline could never fetch it.  The NBER direct PDF returns 200
  # application/pdf to a python-requests user agent.  The OUP version
  # (doi:10.1093/restud/rdac011) is paywalled (OpenAlex: oa_status closed).
  source: https://www.nber.org/system/files/working_papers/w24733/w24733.pdf
  title: "Immigration and Redistribution"
  authors:
    - Alberto Alesina
    - Armando Miano
    - Stefanie Stantcheva

dataset:
  source: https://zenodo.org/records/5997521
  access_notes: >
    Replication package on Zenodo (record 5997521, CC-BY-4.0, open access) —
    a single ~4 MB zip (Alesina_Miano_Stantcheva_replication.zip, 4,060,656
    bytes; re-downloaded without login 2026-10-20).  Estimating code is
    Stata (.do) with some R Markdown figure scripts; the analysis data is
    one file, Data/survey_analysis.dta.  The package also ships its result
    tables (Out/Tables/*.tex) and Figure 2's plotted means
    (Out/Figures_data/figure_2_l_data.csv) — these survive the independent
    mode's script-free copy, so they carry the answers.  The I4R
    replicators independently re-implemented the analysis in R.

original_claims:
  - description: order_effect_tax_top1
    value: -1.948
    claim_type: coefficient
    standard_error: 0.416
    sample_size: 19765
    unit: percentage points
    location: "Table 4, column 1"
    context: >
      Table 4 column 1, row "Order/Salience T".  OLS (Stata reg, robust)
      of the preferred top-1% income tax rate (tax_top1) on the Order
      treatment indicator (immigfirst: immigration block shown before the
      redistribution block), the three video treatments (Share of
      Immigrants, Origin of Immigrants, Hard Work) and their interactions
      with the Order treatment, plus controls: indicators for right, left,
      male, age < 45, having children, top income quartile, college
      degree, an immigrant parent, working in a high-immigration sector,
      and country fixed effects.  Robust (HC1) SEs.  Sample excludes the
      fastest/slowest 2% of respondents by survey duration and the top 2%
      by video-watching time.  The interactions mean the Order effect is
      identified among respondents who saw no video.  Control mean 37.12.
  - description: order_effect_tax_bottom50
    value: 0.914
    claim_type: coefficient
    standard_error: 0.276
    sample_size: 19765
    unit: percentage points
    location: "Table 4, column 2"
    context: >
      Table 4 column 2, Order/Salience T.  Same specification as
      order_effect_tax_top1 with the preferred tax rate on the bottom 50%
      (tax_bottom50) as outcome.  Control mean 10.94.
  - description: order_effect_social_budget
    value: -0.543
    claim_type: coefficient
    standard_error: 0.238
    sample_size: 19765
    unit: percentage points
    location: "Table 4, column 3"
    context: >
      Table 4 column 3, Order/Salience T.  Outcome: share of the budget
      allocated to income support plus health (budget_social_w = winsorized
      budget_safetynet + winsorized budget_health, each winsorized at the
      5th/95th percentile within country).  Same regressors and controls as
      order_effect_tax_top1.  Control mean 29.53.
  - description: order_effect_education_budget
    value: 0.439
    claim_type: coefficient
    standard_error: 0.175
    sample_size: 19765
    unit: percentage points
    location: "Table 4, column 4"
    context: >
      Table 4 column 4, Order/Salience T.  Outcome: share of the budget
      allocated to education (budget_education_w, winsorized 5/95 within
      country).  Same specification as order_effect_tax_top1.  Control
      mean 16.00.
  - description: order_effect_inequality_serious_problem
    value: -0.0280
    claim_type: coefficient
    standard_error: 0.0132
    sample_size: 19763
    location: "Table 4, column 5"
    context: >
      Table 4 column 5, Order/Salience T.  Outcome: indicator that
      inequality is a serious problem (ineq_problem_ser).  Same
      specification as order_effect_tax_top1; N = 19,763.  Control mean
      0.59.
  - description: order_effect_donation_above_median
    value: -0.0479
    claim_type: coefficient
    standard_error: 0.0138
    sample_size: 19765
    location: "Table 4, column 6"
    context: >
      Table 4 column 6, Order/Salience T.  Outcome: indicator for donating
      above the median to charity in the incentivized donation question
      (total_donation_d).  Same specification as order_effect_tax_top1.
      The abstract's "including actual donations to charities".  Control
      mean 0.47.
  - description: sample_size_table4
    value: 19765
    claim_type: other
    unit: respondents
    location: "Table 4, columns 1-4 and 6"
    context: >
      Number of observations in the Table 4 regressions (19,765 in every
      column except column 5, which has 19,763).
  - description: share_treatment_effect_misperception_share
    value: -4.864
    claim_type: coefficient
    standard_error: 0.411
    sample_size: 19735
    unit: percentage points
    location: "Table 5, column 1"
    context: >
      Table 5 column 1, row "T: Share of Immigrants".  First stage: OLS
      (robust SEs) of the misperception of the share of immigrants
      (mis_share_foreign = perceived minus actual share; for the US the
      actual share is set to 13.5, legal plus undocumented) on the three
      video-treatment indicators plus the Table 4 controls and country
      fixed effects (no Order interactions).  Control mean 17.02.
  - description: hard_work_effect_immigration_support_index
    value: 0.0708
    claim_type: coefficient
    standard_error: 0.0181
    sample_size: 19765
    location: "Table 6, column 6"
    context: >
      Table 6 column 6, row "T: Hard Work".  OLS (robust SEs) of the
      Immigration Support Index (Kling et al. 2007 style: mean of the
      control-group-standardized components imm_not_problem,
      imm_benefits_soon, imm_citizenship_soon, trully_american_cit and
      q_govt_imm, with missing components imputed at the treatment-arm
      mean, then re-standardized on the control group) on the three video
      treatments plus the Table 4 controls and country fixed effects.
  - description: misperception_share_immigrants_us
    value: 26.082
    claim_type: other
    standard_error: 0.728
    sample_size: 960
    unit: percentage points
    location: "Figure 2, left panel (US); text section 3.1"
    context: >
      Mean misperception of the share of immigrants in the US: mean
      perceived share (36.1%) minus the actual share used in Figure 2
      (10%), among US control-group respondents (no video treatment,
      inattentive respondents dropped).  The paper states the two levels
      in the text ("36.1% ... when the actual share of immigrants is
      10%"); the difference to 3 dp, its SE and N are from DP40 Table 1
      column 1 and the meta-database.  Note Figure 2 uses 10% for the US,
      whereas Tables 4-6 use 13.5% (legal plus undocumented).
  - description: misperception_share_immigrants_sweden
    value: 9.402
    claim_type: other
    standard_error: 0.814
    sample_size: 481
    unit: percentage points
    location: "Figure 2, left panel (Sweden); text section 3.1"
    context: >
      Mean misperception of the share of immigrants in Sweden: mean
      perceived share (27.0%) minus actual (17.6%) among Swedish
      control-group respondents.  The smallest misperception of the six
      countries ("with the exception of Sweden" in the text).  Value, SE
      and N from DP40 Table 1 column 1 and the meta-database.

# DP40's verdict for the direct rerun is blanket: "We find that the point
# estimates are identical" for Figure 2 and Tables 4, 5 and 6 using the
# authors' code.  The meta-database's 73 rows for this paper (team 41) are
# all ROBUSTNESS variants of Figure 2 (fastest/slowest 2% retained, all
# treatment arms pooled, alternative actual-share sources), so none of
# their r_coeff_dbl values is a direct reproduction; they are deliberately
# not transcribed.  For the Figure 2 claims, DP40 Table 1 column 1 prints
# the replicators' value explicitly, and it equals the paper's.
