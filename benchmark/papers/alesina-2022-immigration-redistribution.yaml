notes: >
  Headline finding: across surveys of ~22,000 native respondents in six
  countries (US, UK, France, Germany, Italy, Sweden), people vastly
  overestimate the number and welfare-dependence of immigrants, and
  respondents primed to think about immigration before redistribution
  questions subsequently support less redistribution.

  Promoted from the I4R First Meta Database (replication report team 41) via
  scripts/import_i4r_candidates.py.

  Curation pass (2026-10-20, ROADMAP Phase 3).  Pinned 11 claims: the six
  Order/Salience treatment effects in Table 4 (the abstract's experimental
  result, including the donation outcome), Table 4's N, the Share-of-
  Immigrants first stage on misperceptions (Table 5 col 1), the Hard Work
  effect on the immigration support index (Table 6 col 6; the abstract's
  "hard working immigrant has somewhat stronger effects"), and the US and
  Swedish misperceptions of the immigrant share from Figure 2 (the
  abstract's "greatly overestimate", the largest and smallest of the six
  countries).  Every coefficient carries its SE in standard_error, so the
  independent mode's SE band applies; SEs are not pinned as separate
  claims (unlike dincecco-2022).

  Sources and cross-checks.  The paper.source URL (Stantcheva's Harvard
  site) returns 403 to every non-browser client, so it was replaced with
  NBER w24733 "Revised March 2022" (see the comment on paper.source).
  The published RES PDF could not be read (paywalled), so "the paper's
  printed value" here is the NBER March 2022 text; its Tables 4-6 match
  the package's Out/Tables/table_2stage_redistribution.tex,
  table_1stage.tex and table_2stage_immigration.tex digit for digit, and
  DP40 confirms Tables 4-6 are the reproduced tables, so the table
  numbering agrees with RES.  Figure 2 numbers: the text gives the levels
  (US 36.1% perceived vs 10% actual; Sweden 27% vs 17.6%; Italy 26.4% vs
  10%); the package's figure_2_l_data.csv gives 36.082291 - 10 = 26.082
  and 27.002079 - 17.6 = 9.402, matching DP40 Table 1 col 1 and the
  meta-database's o_coeff_dbl exactly.  No paper-vs-meta-database
  discrepancies.

  Left out.  Table 4's three video-treatment rows (all small and mostly
  insignificant — the paper's point is that information does NOT move
  redistribution; pinning nulls tests noise), Table 5 columns 2-7 and
  Table 6 columns 1-5 (component outcomes; the index and the headline
  first stage carry the claim), Tables 1-3 (sample characteristics and
  descriptive correlations), the other four Figure 2 left-panel countries
  and the twelve right-panel subgroup means (figure-only values; two
  country endpoints suffice and the right panel is never stated
  numerically in the text), the paper's 22,506 / 4,500-US sample size (a
  typo per DP40; the data has 22,006 / 4,000), and all appendix tables.

  Runnability caveats.  The analysis is Stata; the I4R replicators also
  verified it in R.  Two traps a reproducer must avoid: Figure 2 uses a US
  actual share of 10% while Tables 4-6 use 13.5% (legal plus
  undocumented, set in Tab4to6.do), and the sample restriction drops the
  fastest/slowest 2% by survey duration and the top 2% by video time per
  treatment.  The immigration support index (claim 8) involves a
  multi-step standardize-impute-restandardize construction.  The package
  ships Out/Tables/*.tex and Out/Figures_data/*.csv, which survive the
  script-free copy, so an independent-mode run can read every pinned
  value off disk; Do/Figures/.Rhistory (no file suffix, so not on
  SCRIPT_SUFFIXES) also survives it with raw R commands.  Review
  independent passes accordingly.
