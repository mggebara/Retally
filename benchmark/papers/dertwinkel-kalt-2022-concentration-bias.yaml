notes: >
  Headline finding: in a lab experiment where subjects trade extra
  real-effort tasks on eight future workdays against a larger restaurant
  voucher, the indifference point in an unbalanced trade-off (extra tasks
  on all eight days for the summed voucher raise) exceeds what the eight
  balanced trade-offs imply: concentration bias raises the per-workday
  willingness to work by 22.4% (Table 2).  Table 3 shows the effect is
  smaller when the voucher raise is framed as a sum of parts
  (Mechanism-Treatment), present with donations, and absent in the
  Control conditions that repeat a balanced trade-off.

  Original analysis in Stata (do-files last run in Stata 17); R is used
  in the package only for the Section 4 / Appendix C calibration
  exercise (Calibration Exercise.R), which produces no pinned number.
  language: r is the reproduction target.

  Curation pass (2026-10-21).  Pinned 13 claims: Table 2 columns 2 and 4
  of the absolute measure, all three columns of the relative measure,
  Table 3's three Treatment-vs-Control / Main-vs-Mechanism differences
  plus the Mechanism-Treatment and Donation-Treatment levels, and the two
  observation counts (Table 2: 100 in every column; Table 3: 200 in every
  column).  Each coefficient carries its robust SE as standard_error.
  Left out to stay within 13: Table 2 columns 1 and 3 of the absolute
  measure (31.640 (2.685), 43.580 (4.683); both reproduced exactly by
  I4R, rows 629 / 643) and the two Control-condition levels in Table 3
  (Main-Control -0.023 (0.008), Mechanism-Control -0.014 (0.010)).

  Paper version and published-vs-DP check.  The PDF is ECONtribute DP 076
  (1 April 2021); the REStud typeset version could not be obtained.  The
  DP's Table 2 and Table 3 carry the same table numbers as the
  published article (the I4R database labels them "table 2" / "table
  3"; DP42 cites "Table 2/3 of DGRSS") and every pinned value equals the
  database's o_coeff / o_std_err in magnitude.  Signs: the database (and
  DP42's transcription of the published Table 3, Panel A) records the
  Donation difference as -0.158, Main-Control as +0.023 and the Main
  difference as -0.247, where the DP prints 0.158, -0.023 and 0.247.  The
  package (the published version's REStud replication package, July
  2021) settles it: its log gives control = -0.1576 with the comment
  "the difference Donation-Treatment - Donation-Control that is reported
  in the manuscript (0.158) is positive", and treatment = +0.2467 with
  constant -0.0226 for Main; the DP's signs are internally consistent
  (Main-Control + difference = Main-Treatment mean 0.224), the
  database's are not.  The paper's signs are pinned.  Appendix numbering
  differs: in the DP the money experiment is Appendix C (Table C.1
  reports 0.063 (0.011), N = 277, 185 subjects) while the published
  version and the package README put the calibration in Appendix C and
  the money experiment in Appendix D (Tables D1-D4; the database's
  "appendix table d.1" rows are 0.057 / 0.068 / 0.081 / 0.066 / 0.026 /
  0.065 / 0.036, which the DP does not print in that form) — the money
  appendix was revised between the DP and publication; none of it is
  pinned.

  What was read.  The DP 076 PDF (Sections 2-4, Tables 1-3, appendix
  headings); DP42 in full (EconStor, 17 pp.; its IDEAS listing
  zbw/i4rdps/42); the Zenodo API metadata for both package versions; the
  package README.md, the consumption do-file in full and its log for
  Tables 2-3, the money do-file header, the .csv headers; the 32 I4R
  database rows for the paper (team 15; 31 with values, one empty).

  How the printed numbers are produced (package-only; never in
  contexts).  Consumption_Experiment tables and values.do, lines 70-114
  (README: log lines 122-394), produces Tables 2 and 3; the money
  do-file produces only Section 5 / Appendix D numbers, the figures
  do-file only figures.  It reads Consumption_Experiment.csv with import
  delimited.  The csv is long: nine rows per subject (decision_number
  1-8 balanced, 9 the final trade-off) and the subject-level outcomes
  (id_stage2, avg_id_stage2, id_stage2_upper, qe_ard, qe_ard_lower,
  qe_ard_upper, qe_rad*) are non-missing only on the decision_number == 9
  row (769 subjects), so the regressions run on one row per subject
  without an explicit filter.  Main sample: pap_sample == 1.  Table 2:
  reg id_stage2 / avg_id_stage2 / id_stage2_upper and qe_ard_lower /
  qe_ard / qe_ard_upper on a constant, if pap_sample == 1 & dispersed ==
  0 & treatment == 1, r (HC1); col 4 is tobit id_stage2, ll(-63) ul(63)
  with conventional (non-robust) SEs (log: 73 uncensored, 27
  right-censored).  Table 3: reg qe_ard main if pap_sample == 1 &
  treatment == 1, r (col 1); reg qe_ard control if pap_sample == 1 &
  pizza == 0, r (col 2; coefficient -0.158, sign flipped in print); reg
  qe_ard treatment if pap_sample == 1 & pizza == 1 & dispersed == 0
  (col 3) / dispersed == 1 (col 4), r.  dispersed is missing for the
  Donation conditions.  Condition sizes before exclusion (subjects):
  Main-Treatment 135, Main-Control 135, Mechanism-Treatment 123,
  Mechanism-Control 125, Donation-Treatment 122, Donation-Control 128; 100
  of each in pap_sample.  The relative measure is pre-computed in the
  csv; recomputing it from indifference_point and the mandatory-task
  vector (paper fn. 3) reproduces it only up to the third decimal (DP42
  Figure 1: differences for negative d~rel, rounding / corner handling).

  Benchmark implications.  Seeded mode is close to a transcription of
  eight one-line regressions.  Independent/blind mode needs the model to
  find the right csv among ~370 files (oTree/z-Tree noise; the task's
  file listing truncates after ~80 entries, mostly oTree files, though
  the consumption csv and its columns are listed before the cut), map the
  paper's conditions to main / dispersed / pizza / treatment / control
  and the exclusion to pap_sample, and pick the pre-computed outcome
  columns (or recompute d~rel and land within the printed rounding).  A
  sign trap: column 2's difference needs Treatment minus Control.
  Blind caveat (curation render 2026-10-21, 153 paper redactions, 53
  files stripped — every .do/.R/.log and the oTree .py sources): the
  redacted paper.txt still states three pinned values as percentages —
  "22.4%" (claim 3, abstract, intro, Section 2.4, Result 1), "7.5%"
  (claim 6) and "13.5%" (claim 8) — because the blind redactor matches
  decimal forms only (0.224, not 22.4).  Blind passes on claims 3, 6 and
  8 are therefore not target-free for this entry.

  Left out.  Table 1 (design), the Section 3 / 4 tests reported only in
  the text, Appendix A (full sample, heterogeneity, alternative relative
  measure), the money experiment (Section 5 / Appendix D; revised since
  the DP, and its csv lacks the raw choices per DP42), and the
  calibration exercise (Appendix C, R, 1-8 h runtime).
