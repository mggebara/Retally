# Original paper: Dertwinkel-Kalt, M., Gerhardt, H., Riener, G.,
#   Schwerter, F., & Strang, L. (2022). "Concentration Bias in
#   Intertemporal Choice." The Review of Economic Studies, 89(3),
#   1314-1334.  doi:10.1093/restud/rdab043
#
# I4R replication report: Deer, L., Ellingsrud, S., Kordt, A. H., &
#   Heuer, F. (2023). "Replication Report: Concentration Bias in
#   Intertemporal Choice." I4R Discussion Paper No. 42 (June 2023; the
#   report itself is dated February 2023), I4R First Meta Database
#   replication team 15.  Verdict: reproducible — "Our results confirm
#   the sign, magnitude and statistical significance of the author's
#   reported estimates across each of their five main findings."  With
#   the authors' pre-computed outcome measures every Table 2 and Table 3
#   estimate and SE is reproduced exactly (in R); recomputing the relative
#   measure from the elicited indifference points moves some estimates at
#   the third decimal.  Candidate verdict: perfect_reproduction = Yes,
#   computational_reproduction = 1 -> reproducible.
#
# Why this paper:
#   1. Plain .csv data (no .dta translation), Stata analysis in one short
#      do-file whose Table 2/3 block is about 45 lines.
#   2. Two headline tables built from intercept-only and one-dummy OLS
#      regressions with robust SEs (plus one Tobit): 15 printed
#      coefficient/SE pairs, 31 paired I4R database rows.
#   3. Exact reproduction by the replicators, so a miss is Retally's.
#
# IMPORTANT — paper version.  paper.source is the ECONtribute Discussion
#   Paper No. 076 (dated 1 April 2021), NOT the REStud typeset article
#   (academic.oup.com answers 403; no open copy of the published PDF was
#   found: KUPS Cologne 404, Southampton eprints 403, the Bonn deposit
#   epflicht.ulb.uni-bonn.de/download/pdf/698670 is the same DP 076).
#   Pinned values are the published Table 2 / Table 3 as recorded in the
#   I4R database's o_coeff / o_std_err, checked against the DP (same
#   table numbers, identical magnitudes for every pinned value) and the
#   package's own Stata log.  Three database rows carry the opposite
#   sign to the DP and to the log — see the notes; the paper's sign is
#   pinned.  The appendices are numbered differently (see notes); no
#   appendix value is pinned.
#
# What the package is.  Zenodo record 5091975 (version 1.0.1 of concept
#   record 5005989), the authors' own REStud replication package: one zip
#   (11.2 MB) holding the analysis data as two .csv files, the Stata
#   do-files and their logs, an R script for the Section 4 calibration
#   exercise, the oTree (Python/Django: .py, .pyc, HTML, web fonts) code
#   of the consumption experiment and the z-Tree code of the money
#   experiment.  Licence CC BY-NC 4.0 (data and code).

id: dertwinkel-kalt-2022-concentration-bias
i4r_report_url: https://www.econstor.eu/bitstream/10419/272844/1/I4R-DP042.pdf
# Target language for regeneration (the original analysis is Stata; R is
# used in the package only for the calibration exercise).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  First public version: ECONtribute DP 076,
# title page dated 1 April 2021 (also CESifo WP 9011 and SSRN 3830216,
# April 2021); no earlier working paper found (web search 2026-10-21; the
# preregistrations AEA RCT 4341 / 4446 are from 2019).  REStud: advance
# access 2021 (OpenAlex publication_date 2021-09-21), print 89(3), May
# 2022.  Package: Zenodo concept doi:10.5281/zenodo.5005989, first
# version 1.0.0 (record 5005990) published 2021-06-27 (10.6 MB zip);
# the pinned dataset.source is version 1.0.1 (record 5091975,
# doi:10.5281/zenodo.5091975), published 2021-07-12 (Zenodo API).
publication_date: "2021-04-01"
package_release_date: "2021-06-27"

paper:
  # ECONtribute Discussion Paper 076 (working paper, 1 April 2021,
  # 56 pp. including the online appendices); checked 2026-10-21: 200
  # application/pdf, %PDF magic, to a Retally-curation user agent.
  # Tables 2 and 3 carry the same numbers as the published version (see
  # notes).  Text extracts cleanly with pymupdf; the tilde over d
  # extracts as a separate "˜" and the minus sign as U+2212.
  source: https://www.econtribute.de/RePEc/ajk/ajkdps/ECONtribute_076_2021.pdf
  title: "Concentration Bias in Intertemporal Choice"
  authors:
    - Markus Dertwinkel-Kalt
    - Holger Gerhardt
    - Gerhard Riener
    - Frederik Schwerter
    - Louis Strang

dataset:
  source: https://zenodo.org/records/5091975
  access_notes: >
    Zenodo record 5091975 (doi:10.5281/zenodo.5091975, version 1.0.1 of
    concept doi:10.5281/zenodo.5005989), open access, licence CC BY-NC
    4.0 (Attribution-NonCommercial; the package README applies it to
    both data and code) — non-commercial use only.  One file,
    "Dertwinkel-Kalt et al. (2021), replication package.zip" (11,222,819
    bytes, md5 fba593910af20114b81a60834c6b542b), extracted by the
    downloader to 369 files / 16 MB.  Analysis data, plain .csv:
    Consumption Experiment/Stata/Consumption_Experiment.csv (952,816
    bytes; 7,254 rows x 53 columns, long format, nine decision rows per
