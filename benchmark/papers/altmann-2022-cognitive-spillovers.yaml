# Original paper: Altmann, S., Grunewald, A., & Radbruch, J. (2022).
#   "Interventions and Cognitive Spillovers." The Review of Economic
#   Studies, 89(5), 2293-2328.  doi:10.1093/restud/rdab087 (advance
#   access 2021-11-30, OpenAlex publication_date).
#
# I4R replication report: Bachler, S., Erhart, A., & Holzknecht, A.
#   (2023). "Replication Report on Altmann et al. (2022)." I4R Discussion
#   Paper No. 43, June 2023 (I4R First Meta Database replication team
#   45).  Verdict: computationally reproducible with minor discrepancies
#   — "all results described in the main text of the paper can be
#   reproduced with the original Stata code" and re-coded in R "with
#   only some minor deviations of test statistics and estimates at the
#   3rd decimal place"; two robustness checks (logit instead of the
#   linear probability models; an alternative control battery) leave the
#   conclusions unchanged.  The meta-database records
#   perfect_reproduction = No, computational_reproduction = 1,
#   why_not_perfect_repro = "A minor difference in the 0.001 rounding of
#   decimals for coefficients".  DP43 notes two documentation gaps: the
#   control variables are not fully declared in the table notes, and the
#   payoff subsetting is not obvious without the Stata code.
#
# Why this paper:
#   1. Laboratory + online experiment with simple OLS treatment-effect
#      regressions (subject-clustered SEs) on two small Stata datasets.
#   2. 71 I4R rows with replicator values; the Tables 2-4 reproductions
#      match the printed numbers to the last digit, so the I4R findings
#      are a precise yardstick.
#   3. REStud adds journal variety to the catalog.
#
# PAPER VERSION — read before using paper.txt.  The only open PDF the
#   pipeline can fetch is the May 2019 IZA working paper (DP 12337,
#   "Passive Choices and Cognitive Spillovers"), from the Bonn ULB
#   deposit copy; docs.iza.org now redirects to liser.lu, and the KU
#   accepted manuscript sits behind a Cloudflare challenge.  The draft is
#   a substantially earlier version of the study: 564 lab subjects in a
#   3x2 design (Baseline / Directed Attention / "Active Choice" x Scarce
#   / Ample), no variation in the decision-task incentives, no second lab
#   wave and no online experiment, and NO regression tables (its Table 2
#   is a table of treatment means).  None of the pinned numbers appear in
#   it.  The pinned values are the PUBLISHED REStud Tables 2-4, taken
#   from the I4R meta-database o_coeff / o_std_err, DP43's "Paper"
#   panels (its Tables 4-6 reprint the published Tables 2-4), and the
#   package's own esttab output (out/table2-4.tex) — all three agree on
#   every pinned digit.  The claim contexts describe the published tables
#   from their notes as DP43 reprints them, so they carry the
#   specification the draft lacks (Forced Choice, payoff schemes,
#   experiment waves, online Memory task).

id: altmann-2022-cognitive-spillovers
i4r_report_url: https://www.econstor.eu/bitstream/10419/272845/1/I4R-DP043.pdf
# Target language for regeneration (the original analysis is Stata 15;
# Retally generates R and reads the .dta files with haven).
language: r
# Candidate verdict "minor discrepancies" (perfect_reproduction = No,
# computational_reproduction = 1) -> reproducible, as for Leeson and
# Manekin.
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  First public version: IZA DP 12337, May
# 2019 (the working paper's cover date; no earlier version found).
# REStud advance access 2021-11-30, print October 2022 (89:5).  Package:
# Zenodo record 5652808, created / published 2021-11-08 (Zenodo API), a
# single version.
publication_date: "2019-05"
package_release_date: "2021-11-08"

paper:
  # IZA DP 12337 (May 2019, 47 pages), as deposited with the Bonn
  # university library's e-Pflicht service; checked 2026-10-21: 200
  # application/pdf, %PDF magic, to a Retally-curation user agent.  The
  # candidate URL https://docs.iza.org/dp12337.pdf now answers 301 to
  # https://liser.lu (an HTML page), so it cannot be used.  This is the
  # working paper, not the published article — see the header comment.
  source: https://epflicht.ulb.uni-bonn.de/download/pdf/501850
  title: "Interventions and Cognitive Spillovers"
  authors:
    - Steffen Altmann
    - Andreas Grunewald
    - Jonas Radbruch

dataset:
  source: https://zenodo.org/records/5652808
  access_notes: >
    Zenodo record 5652808 (CC BY 4.0 on the record; the package README
    licenses the data CC BY-NC 4.0), fully open: one file,
    ReplicationPackage.zip (8,167,836 bytes; the downloader extracts it
    and deletes the zip; 248 files, 17 MB unpacked).  Contents:
    ReplicationPackage/README.md (AEA-template README with the table ->
    do-file map); EmpiricalAnalysis/master.do; six do-files in
    EmpiricalAnalysis/dofiles/; two Stata datasets in
    EmpiricalAnalysis/original_data/ — formatted_data_replication.dta
    (lab experiment, 3.8 MB, 17,840 subject-round rows x 46 columns) and
    formatted_data_long_mturk.dta (online experiment, 222 KB, 5,472 rows
    x 12 columns); EmpiricalAnalysis/out/ with the authors' own output
    (six .log files, table2-4.tex, tableB_1-2.tex, tableO_1-10.tex,
    figure PNGs); EmpiricalAnalysis/library/stata/ado_ext/plus/ (bundled
    user-written Stata commands: estout/esttab/eststo/estadd, coefplot,
    cdfplot, binscatter, fmm, oaxaca, grc1leg, ...); and oTree/ (the
    oTree 3.3 / Python experiment software: 36 .py, 60 .pyc, 32 HTML
    templates, 13 images, a db.sqlite3).  No nested archives.

code_repo:
  url: https://zenodo.org/records/5652808

original_claims:
  - description: choice_quality_intervention_t2_col1
    value: 0.107
    claim_type: coefficient
    standard_error: 0.018
    unit: change in the probability of correctly solving the decision task
    location: "Table 2, Panel (a) Choice quality, column 1, Intervention"
    context: >
      Table 2 ("Behavior in the targeted choice domain"), Panel (a),
      column 1.  Lab experiment, subjects with scarce cognitive resources
      (the demanding background task of memorising a seven-digit number)
      in the Baseline, Directed Attention and Forced Choice environments,
      pooled over the decision-task payoff schemes and both experiment
      waves; the Ample-resources condition is not part of this table.
      OLS of an indicator equal to 1 if the subject correctly solves the
      decision task in a given round (one observation per subject and
      round of the main part) on Intervention, an indicator for being in
      Directed Attention or Forced Choice rather than Baseline.  No
      controls.  Robust standard errors clustered at the subject level.
  - description: choice_quality_intervention_t2_col2
    value: 0.110
    claim_type: coefficient
    standard_error: 0.017
    unit: change in the probability of correctly solving the decision task
    location: "Table 2, Panel (a) Choice quality, column 2, Intervention"
    context: >
      Table 2, Panel (a), column 2: the column 1 regression (decision-task
      choice quality on the Intervention indicator, same subject-round
      sample) with controls: subjects' age, gender, field of study, high
      school GPA and last high-school math grade, ability in the
      background and the decision task (measured in the practice parts),
      perceived multitasking ability, and indicator variables for the
      subject's assigned payoff scheme and experiment wave.  Robust
      standard errors clustered at the subject level.
  - description: default_adherence_intervention_t2_col5
    value: -0.217
    claim_type: coefficient
    standard_error: 0.022
    unit: change in the probability of choosing the default option
    location: "Table 2, Panel (b) Default adherence, column 5, Intervention"
    context: >
      Table 2, Panel (b), column 5.  Same sample as Panel (a).  OLS of an
      indicator equal to 1 if the subject's choice in the decision task in
      a given round coincides with the (choice alternative corresponding
      to the) default option, on the Intervention indicator (Directed
