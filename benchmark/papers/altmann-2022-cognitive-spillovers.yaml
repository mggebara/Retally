notes: >
  Headline finding (as published): policies that steer attention to a
  decision (Directed Attention) or force an active choice (Forced
  Choice) raise decision-task choice quality by about 11 percentage
  points and cut default adherence (Table 2), but lower performance in
  the simultaneous background task — a negative cognitive spillover, in
  the lab and in an online Memory-game experiment (Table 3) — so that
  overall payoffs do not change (Table 4).

  Original analysis in Stata 15 (README: "code was last run with version
  15"); the experiment itself ran in oTree 3.3.11 / Python 3.7.
  language: r is the reproduction target.

  Curation pass (2026-10-21).  Pinned 13 claims from the published
  Tables 2-4: eleven coefficients, each with its SE (Table 2 cols 1, 2,
  5, 6 and both col 7 environment coefficients; Table 3 cols 1, 2, 5
  and 6; Table 4 col 1) and two counts — N = 12,160 subject-rounds and
  608 subjects (= clusters) in every lab column.  The online columns'
  N = 5,472 was deliberately NOT pinned: it is the full row count of the
  online data file, which the task's dataset listing prints in every
  mode (blind included), so it would be a free claim.  Values exactly as printed (three decimals; 0.110 and -0.300
  keep their trailing zeros).  Every pinned number appears identically in
  the meta-database (o_coeff / o_std_err), in DP43's reprint of the
  published tables, and in the package's out/table2.tex, table3.tex and
  table4.tex.

  Published vs working-paper version.  paper.source is the May 2019 IZA
  DP 12337 ("Passive Choices and Cognitive Spillovers"), the only open
  PDF reachable without a bot challenge.  It does not contain Tables 2-4
  of the published article in any form: its Table 1 is the 3x2
  treatment overview, its Table 2 ("Decision Quality and Payoffs") is a
  table of treatment means with between-subject SDs (e.g. 59.11 / 71.98
  / 68.76 % correct in the decision task under scarcity), its appendix
  Tables C.1-C.2 are descriptives and attention.  The draft reports 564
  lab subjects, calls the third environment "Active Choice" (published:
  "Forced Choice"), has one decision-task payoff (EUR 0.10) and no online
  experiment; the published version adds decision-task payoff schemes of
  10 / 20 / 40 cents (the Baseline-10/20/40 treatments), a second lab
  wave, and the online (MTurk) Memory-game experiment.  Table numbering
  therefore does not carry over at all: published Table 2 (regressions,
  targeted domain) has no counterpart in the draft, and the draft's
  Table 2 is not a regression table.  Because paper.txt describes an
  earlier design, the claim contexts carry the published specification
  (taken from the published table notes as reprinted in DP43 Tables
  4-6).  Blind / independent runs therefore depend on the contexts more
  than usual.

  What was read.  The IZA draft (all 47 pp., for design and numbering);
  DP43 (all 18 pp., EconStor); the meta-database's 75 team-45 rows; the
  Zenodo API record; the package README, master.do, all six do-files and
  out/table2-4.tex; the published-article metadata (OpenAlex, RePEc).
  The published PDF itself was not obtainable (OUP paywall; KU research
  portal accepted manuscript behind a Cloudflare challenge).

  Which script produces the pinned tables (package-only; never in
  contexts).  Per the README table: Table 2 <-
  dofiles/4_2_Interventions_targeted_domain.do (out/table2.tex); Table 3
  <- dofiles/4_2_Cognitive_Spillover.do (out/table3.tex); Table 4 <-
  dofiles/4_3_Payoffs_And_Efficiency.do (out/table4.tex); master.do runs
  them in sequence after defining the control globals.  Tables 2 and 4
  and Table 3 cols 1-4 use original_data/formatted_data_replication.dta
  restricted to Treatment_Incentives != 4 (4 = the Ample condition; 1-3
  are the 10 / 20 / 40-cent payoff schemes): reg <y>
  i.Treatment_intervention [controls], robust cluster(subject_id), with
  y = summation_correct (decision-task choice quality),
  default_followed (default adherence), load_correct (background task),
  payoff_share (Table 4); the environment columns use
  i.Treatment_Environment (1 Baseline, 2 Directed Attention, 3 Forced
  Choice).  The controls are $Incentive_control (i.Treatment_Incentives)
  $Wave_control (i.original_lab) $Ability_control
  (c.(ability_task ability_load)##i.original_lab — ability interacted
  with the wave, which the table notes do not mention; DP43 flags the
  control declaration as insufficient) and $Controls (q_age i.q_gender
  i.perc_multitasking_1_easy perc_multitasking_2 i.subject_cat
  i.q_abitur_grade_cat i.q_math_grade_cat).  Table 3 cols 5-6 use
  original_data/formatted_data_long_mturk.dta: reg memory
  i.Treatment_intervention [window_height1 window_width1 age i.gender],
  cluster(subject_id).  The full lab file has 17,840 rows (892 subjects
  x 20 rounds, including the Ample condition); the restriction leaves
  12,160 rows / 608 subjects.  The online file is 608 subjects x 9 rounds
  = 5,472 rows (the online No. Subjects of 608 is therefore genuine, not
  a copy of the lab count).

  Independent cross-check (Python/statsmodels on the package's .dta,
  OLS with subject-clustered SEs, no controls): decision-task
  Intervention 0.1069 (0.0178); default adherence -0.2168 (0.0222);
  Directed Attention -0.1370 (0.0256), Forced Choice -0.2999 (0.0211);
  background task -0.0282 (0.0171); payoff share 0.0058 (0.0132);
  online Memory -0.1143 (0.0188), N = 5,472, 608 subjects; lab
  N = 12,160, 608 subjects — all round to the printed values.  The
  with-controls columns were not re-estimated here (I4R reproduced them
  exactly in Stata and R).

  Package file-selection facts.  Seeded mode lists the two .dta files
  with their columns and shows master.do plus all six do-files under
  "Original Replication Scripts" (no oTree .py file was selected).  The
  script-free copy (independent / blind) withholds the do-files, the six
  .log files, the regression .tex tables, the bundled .ado files and the
  oTree .py sources; the README (which names the do-file behind each
  table) stays.  The oTree directory and the bundled ado library are
  noise a reproducer has to ignore.

  Left out.  Table 2 cols 3-4 and 8 (environment split of choice quality
  and with-controls default adherence) and Table 3 cols 3-4 (to
  stay within 13 claims; all reproduce exactly per I4R); the online N
  (see above); Table 4 col 2
  (printed -0.000, a zero target the relative tolerance cannot score
  meaningfully) and cols 3-4; constants, R-squared and the
  Directed = Forced p-values; Table 5 (hypothetical payoffs, assembled
  by hand from a log); appendix Table B.1 (Baseline attention, a 203- /
  298-subject subsample) and the supplementary O-tables; DP43's in-text
  Spearman correlations.
