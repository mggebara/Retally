# Original paper: Manekin, D., & Mitts, T. (2022). "Effective for Whom?
#   Ethnic Identity and Nonviolent Resistance." American Political Science
#   Review, 116(1), 161-180. doi:10.1017/S0003055421000940
#
# I4R replication report: Discussion Paper 86 (Dollbaum, Borbath &
#   Dollbaum, November 2023; replicator team 25 in the I4R First Meta
#   Database).  Verdict: computationally reproducible with minor
#   discrepancies.  The survey-experiment tables reproduce exactly ("Tables
#   1 and Tables A13 through A15 ... reproduce exactly like in the paper";
#   "The results in Table 2 replicate perfectly"); the discrepancy is in
#   the observational part: the Figure 1 code omits two controls that
#   Table A5 includes, so Figure 1's confidence intervals come out wider
#   (Table A5 point estimates "close" but not exact; Table A3 exact).  The
#   meta-database records perfect_reproduction = No, "Needed to change code
#   to include correct controls to reproduce original images/tables".
#   Robustness: the main claim holds but is "more patchy" (re-weighting
#   cuts the share of significant survey effects; aggregating the
#   observational data removes the interaction).
#
# Why this paper:
#   1. Original analysis code is R (a master script sourcing one script per
#      exhibit) — Retally's native target language.
#   2. Data is on Harvard Dataverse under CC0, one unrestricted 2.7 MB
#      .tgz the downloader fetches and extracts.
#   3. The published APSR article is open access (CC-BY) and its PDF
#      text-extracts cleanly.
#
# original_claims pins the protester-identity effects the abstract states
# (Study 1: minority protesters perceived as more violent and requiring
# more police action, U.S. and Israel; Study 2: Black vs white protesters
# in the U.S.), each with its SE in standard_error, plus the four survey
# sample sizes.  Values transcribed from the published PDF and checked
# against the package's own Tables/table_1_panel_*.tex and
# table_4_panel_*.tex (the latter is the paper's Table 2) and the
# meta-database's o_coeff / o_std_err.

id: manekin-2022-effective-for-whom
i4r_report_url: https://www.econstor.eu/bitstream/10419/279959/1/I4R-DP086.pdf
language: r
outcome_label: reproducible
split: holdout
# Contamination bookkeeping.  First public version: APSR FirstView,
# 2021-09-14 (OpenAlex publication_date; the PDF carries "(c) The
# Author(s), 2021"); no earlier working paper was found (web search,
# 2026-10-21).  Print issue February 2022.  Package: Harvard Dataverse
# doi:10.7910/DVN/SHHVCA version 1.0, released 2021-09-14 (Dataverse API
# publicationDate / releaseTime; the archive's files are dated July 2021).
publication_date: "2021-09-14"
package_release_date: "2021-09-14"

paper:
  # Open-access published version from Cambridge Core (CC-BY 4.0).
  # Checked 2026-10-21: 200 application/pdf, %PDF magic, 20 pages.
  source: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/D78EE1F9EE3B41D6F1500311F17B8EA6/S0003055421000940a.pdf/div-class-title-effective-for-whom-ethnic-identity-and-nonviolent-resistance-div.pdf
  title: "Effective for Whom? Ethnic Identity and Nonviolent Resistance"
  authors:
    - Devorah Manekin
    - Tamar Mitts

dataset:
  source: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/SHHVCA
  access_notes: >
    Harvard Dataverse (doi:10.7910/DVN/SHHVCA), CC0, version 1.0, one
    unrestricted file: Replication.tgz (2.7 MB, contentType
    application/x-gzip, datafile id 4917244; Dataverse API checked
    2026-10-21).  Not tabular, so Dataverse does not ingest it and no
    ?format=original request is needed.  The downloader extracts the
    .tgz (tarfile "r:*") into a top-level Replication/
    folder (Code/, Data/, Tables/, Figures/, plus macOS .DS_Store files).
    Data are ten R .rdata files (survey waves for the U.S. and Israel,
    text-analysis corpora, and the NAVCO/EPR cross-national data).  The
    package ships every table's LaTeX output (Tables/*.tex) and every
    figure (Figures/*.pdf), so the paper's numbers are present in the
    unpacked directory.

code_repo:
  url: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/SHHVCA

original_claims:
  - description: study1_us_black_perceived_violence
    value: 0.235
    claim_type: coefficient
    standard_error: 0.117
    sample_size: 2269
    unit: points on a 0-10 scale
    location: "Table 1, Panel (A) US Sample, Black protesters, Perceived degree of violence"
    context: >
      Table 1 ("Group Identity and Protest Tactic"), Panel (A) U.S.
      sample, row Black protesters, column Perceived degree of violence.
      Study 1 online survey experiment (U.S., three waves, November
      2018-January 2019): respondents read a simulated news article about
      a protest with the protesters' identity randomized (white vs Black,
      signaled by names and a photo) and the tactic randomized (marching
      in streets, shutting down traffic, destroying police cars), a 2 x 3
      factorial design.  Outcome: how violent the respondent would say
      the protest was, 0 (completely nonviolent) to 10 (extremely
      violent).  OLS of the outcome on an indicator for Black protesters
      and indicators for the two more intense tactics; base category
      white protesters marching in the streets.  The paper's supplementary
      information (Section 3) states that Study 1 oversampled Black
      Americans and Arab Israelis and that sample weights correct for
      this; the Study 1 estimates are weighted.
  - description: study1_us_black_police_action
    value: 0.268
    claim_type: coefficient
    standard_error: 0.127
    sample_size: 2269
    unit: points on a 0-10 scale
    location: "Table 1, Panel (A) US Sample, Black protesters, Police action required"
    context: >
      Table 1, Panel (A) U.S. sample, row Black protesters, column Police
      action required.  Same Study 1 U.S. design and OLS specification as
      study1_us_black_perceived_violence (Black protester indicator plus
      tactic indicators; base white protesters marching in the streets;
      weighted), with the outcome the respondent's view, 0-10, of the
      extent to which police action is required to address the protest.
  - description: study1_israel_ethiopian_perceived_violence
    value: 0.425
    claim_type: coefficient
    standard_error: 0.107
    sample_size: 3063
    unit: points on a 0-10 scale
    location: "Table 1, Panel (B) Israel Sample, Ethiopian protesters, Perceived degree of violence"
    context: >
      Table 1, Panel (B) Israel sample, row Ethiopian protesters, column
      Perceived degree of violence.  Study 1 Israeli survey (two waves,
      February-March 2019): protester identity randomized among white
      Jews (majority), Ethiopian Jews and Israeli Arabs (minorities),
      noted in the article title, and tactic among marching in streets,
      shutting down traffic and destroying garbage cans (3 x 3 design).
      Outcome: perceived violence of the protest, 0-10.  OLS on
      indicators for Ethiopian and Arab protesters and the two more
      intense tactics; base white protesters marching in the streets;
      weighted (see study1_us_black_perceived_violence).
  - description: study1_israel_ethiopian_police_action
    value: 0.181
    claim_type: coefficient
    standard_error: 0.118
    sample_size: 3063
    unit: points on a 0-10 scale
    location: "Table 1, Panel (B) Israel Sample, Ethiopian protesters, Police action required"
    context: >
      Table 1, Panel (B) Israel sample, row Ethiopian protesters, column
      Police action required (0-10).  Same Study 1 Israeli specification
      as study1_israel_ethiopian_perceived_violence.
  - description: study1_israel_arab_perceived_violence
    value: 0.623
    claim_type: coefficient
    standard_error: 0.108
    sample_size: 3063
    unit: points on a 0-10 scale
    location: "Table 1, Panel (B) Israel Sample, Arab protesters, Perceived degree of violence"
    context: >
      Table 1, Panel (B) Israel sample, row Arab protesters, column
      Perceived degree of violence (0-10).  Same Study 1 Israeli
      specification as study1_israel_ethiopian_perceived_violence; this
      is the coefficient on the Arab protester indicator.
  - description: study1_israel_arab_police_action
    value: 0.964
    claim_type: coefficient
    standard_error: 0.119
    sample_size: 3063
    unit: points on a 0-10 scale
    location: "Table 1, Panel (B) Israel Sample, Arab protesters, Police action required"
    context: >
      Table 1, Panel (B) Israel sample, row Arab protesters, column Police
      action required (0-10).  Same Study 1 Israeli specification as
      study1_israel_ethiopian_perceived_violence.
  - description: study2_us_black_perceived_violence
    value: 0.347
    claim_type: coefficient
    standard_error: 0.115
    sample_size: 3013
    unit: points on a 0-10 scale
    location: "Table 2, Panel (A) US Sample, Black protesters, Perceived degree of violence"
    context: >
      Table 2 ("Group Identity, Protest Goal, and Commitment to
      Nonviolence"), Panel (A) U.S. sample, row Black protesters, column
      Perceived degree of violence.  Study 2 online survey experiment
      (U.S., June 2020): a 2 x 2 x 2 factorial vignette design randomizing
      protester identity (white vs Black), protest goal (general:
      protesting layoffs; group-based: protesting racial prejudice and
      police brutality) and whether protesters explicitly stated a
      commitment to nonviolence.  Outcome: perceived violence, 0-10.  OLS
      of the outcome on indicators for Black protesters, minority group
      goal and commitment to nonviolence; base white protesters, generic
      goal, no commitment.  The paper does not describe weights for
      Study 2.
  - description: study2_us_black_police_action
    value: 0.429
    claim_type: coefficient
    standard_error: 0.114
    sample_size: 3008
    unit: points on a 0-10 scale
    location: "Table 2, Panel (A) US Sample, Black protesters, Police action required"
    context: >
      Table 2, Panel (A) U.S. sample, row Black protesters, column Police
      action required (0-10).  Same Study 2 U.S. specification as
      study2_us_black_perceived_violence; Table 2 reports slightly fewer
      observations for this column than for the other two (respondents
      missing this outcome are dropped).
  - description: respondents_study1_us
    value: 2269
    claim_type: other
    unit: respondents
    location: "Research Design (text); Table 1, Panel (A), Observations"
    context: >
      Study 1 U.S. sample size: respondents to the U.S. survey experiment,
      the observations in each Table 1 Panel (A) regression.
  - description: respondents_study1_israel
    value: 3063
    claim_type: other
    unit: respondents
    location: "Research Design (text); Table 1, Panel (B), Observations"
    context: >
      Study 1 Israeli sample size: respondents to the Israeli survey
      experiment, the observations in each Table 1 Panel (B) regression.
  - description: respondents_study2_us
    value: 3013
    claim_type: other
    unit: respondents
    location: "Research Design (text); Table 2, Panel (A), Observations"
    context: >
      Study 2 U.S. sample size: respondents to the June 2020 U.S. survey
      experiment, the observations in the Table 2 Panel (A) perceived
      violence and recall regressions.
  - description: respondents_study2_israel
    value: 3465
    claim_type: other
    unit: respondents
    location: "Research Design (text); Table 2, Panel (B), Observations"
    context: >
      Study 2 Israeli sample size: respondents to the June 2020 Israeli
      survey experiment, the observations in each Table 2 Panel (B)
      regression.

# The meta-database's 43 rows for this paper (team 25) are robustness
# variants, not reproductions: 27 rows against Tables 1-2 (Table 1: 9
# "Remove weights" + 9 "New weights"; Table 2: 9 "New weights"; o_coeff
# equal to the printed values, r_coeff the re-weighted estimate, e.g.
# U.S. Black perceived violence 0.235 -> 0.137 unweighted / 0.199
# re-weighted) and 16 rows against appendix Tables A3 / A5 (recodes,
# logit, aggregation; one A5 row blank).
# Their r_coeff values are therefore not transcribed.  The computational
# verdict for the pinned tables comes from DP86 itself (section 3.2:
# Table 1 reproduces exactly; section 4.1: Table 2 replicates
# perfectly), so each finding records the paper's own value with
# outcome matches.
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 0.235
    outcome: matches
    notes: DP86 s.3.2, Table 1 reproduces exactly; meta-database rows for this cell are re-weighting variants (0.137 unweighted, 0.199 new weights).
