notes: >
  Headline finding: nonviolent protest by ethnic minorities is perceived as
  more violent and as requiring more police action than identical protest
  by majorities (Study 1: U.S. Black protesters +0.235 / +0.268 on 0-10
  scales; Israel Arab protesters +0.623 / +0.964, Ethiopian +0.425 /
  +0.181 n.s.), and Study 2 replicates it in June 2020 (U.S. Black
  protesters +0.347 / +0.429).

  Original analysis in R (base lm() with stargazer output); language: r
  is the reproduction target and matches the original.

  outcome_label.  The I4R verdict is "minor discrepancies"; the schema
  has no such label.  The discrepancy is confined to the observational
  Figure 1 / Table A5 (none pinned) and every pinned table reproduces
  exactly, so the entry is labelled reproducible (stratification only).
  DP86's robustness findings (weights, aggregation) would argue for
  not_robust on the observational claim, which is not pinned.

  Curation pass (2026-10-21).  Pinned 12 claims: the eight protester-
  identity coefficients for the two outcomes the abstract names
  (perceived violence, police action required) — Study 1 U.S. (Black),
  Study 1 Israel (Ethiopian, Arab) and Study 2 U.S. (Black) — each with
  its SE in standard_error, and the four survey sample sizes stated in
  the Research Design section and the tables' Observations rows.

  What was read.  The published PDF (abstract, design sections, Tables
  1-2), the supplementary information PDF (static.cambridge.org, sample
  and weighting description), DP86 in full (EconStor), the Dataverse API
  metadata, the whole package (downloaded to a scratch directory, never
  committed): the master script and replicate_table_1.R /
  replicate_table_4.R, and the shipped Tables/*.tex; the meta-database's
  43 rows.  No code was run.

  Weights (matters for independent mode).  The main text never mentions
  weights; the SI says Study 1 oversampled Black Americans and Arab
  Israelis and uses sample weights.  The package's Table 1 regressions are
  weighted lm() fits (weights = weight) and the Table 2 regressions are
  unweighted; the contexts state this from the SI.  A reproducer that
  ignores the weights gets the meta-database's "Remove weights" values
  for Study 1 (e.g. U.S. Black perceived violence 0.137 (0.118), police
  0.171 (0.127); Israel Arab 0.584 / 0.890, Ethiopian 0.426 / 0.165),
  which would fail the U.S. claims.  DP86 also reports that the shipped
  Study 1 weights adjust for ethnicity only (Arabs vs Jews), not age,
  gender or education.  Standard errors are the default lm() (classical
  OLS) ones; the paper says only "OLS regressions".

  Package structure (package-only facts; never in contexts).  Replication/
  Code/Manekin_Mitts_Effective_for_Whom_Replication.R is the master: it
  loads libraries (lemon, stargazer, xtable, fastDummies, tidyr,
  gridExtra, stm, quanteda, ggplot2, dotwhisker, ggeffects, estimatr,
  corrplot), setwd()s to an absolute Dropbox path, load()s ten
  Data/*.rdata files, then source()s one script per exhibit.  Table 1 is
  Code/replicate_table_1.R: lm(degree_violence / police_action_required
  / recall_violence2 ~ identity_protesters + tactic, data =
  us_survey_wave1 / isr_survey_wave1, weights = weight), written by
  stargazer to Tables/table_1_panel_A.tex / _B.tex.  The paper's Table 2
  is produced by Code/replicate_table_4.R (misnamed, as DP86 notes):
  lm(... ~ black + group_goal + commitment, data = us_survey_wave2) and
  lm(... ~ identity_protesters + group_goal + commitment, data =
  isr_survey_wave2), unweighted, written to Tables/table_4_panel_A.tex /
  _B.tex.  Every pinned value and SE equals the shipped .tex.  Selecting
  files by name (table_2) will not find the Table 2 script.

  Left out.  Recall-violence columns (binary recall measure; the U.S.
  Study 2 Black effect is insignificant), tactic and goal/commitment
  coefficients, intercepts and R-squared, Study 2 Israel identity effects
  (Ethiopian 0.950 (0.139) / 0.732 (0.144), Arab 0.587 (0.139) / 0.802
  (0.144); not named in the abstract, kept to the 12-claim target), the
  observational NAVCO/EPR estimates (Figure 1, appendix Tables A3 / A5,
  the abstract's first finding: not tabulated in the main text, and the
  part DP86 found discrepant and fragile), Figure 3-4 conditional effects
  and the structural topic models.
