notes: >
  Headline finding: in a gym-attendance field experiment, an enhanced
  information treatment that made participants more aware of their
  present focus raised the behavior change premium (Table 3 col 1: +1.36,
  SE 0.57, from an information-control mean of 0.66) but LOWERED take-up
  of "more visits" commitment contracts (Table 4 col 1: -0.080, SE
  0.031); take-up is only weakly related to the behavior change premium
  (0.027 per SD) and rises with over-optimism (actual minus expected
  attendance, -0.043 per SD).

  Curation pass (2026-11-01).  Pinned 11 claims: Table 3 col 1 basic and
  enhanced information effects, col 2 goal-expected gap, col 3
  actual-expected gap (each with its robust SE); Table 4 col 1 basic and
  enhanced effects, col 2 behavior change premium, col 3 goal-expected
  gap, col 4 actual-expected gap (each with its subject-clustered SE);
  the Table 3 N (1,126 participants; also the Table 4 cluster count, not
  pinned separately) and the Table 4 N (2,824 participant x threshold
  choices).  Left out: the information-treatment coefficients in Table 3
  cols 2-3 (0.45 (0.57), 1.41 (0.58); 0.28 (0.56), 1.25 (0.59)) and
  Table 4 cols 2-4 (-0.023/-0.086, -0.013/-0.079, -0.019/-0.072), the
  dependent-variable means (1.17 (0.22) and 0.66 (0.24) in Table 3; 0.49
  (0.01) and 0.52 (0.01) in Table 4), Table 2 summary statistics (N =
  1,248 participants after the 44 endogenous-assignment exclusions),
  Table 5 take-up rates (no I4R row to check the open text against),
  Table 6 (wave 3 beliefs), the in-text averages ($2.01 / $1.20 behavior
  change premium) and everything structural (Tables 7-9, MATLAB).  The
  Table 3 sample excludes the 122 wave 3 participants assigned a
  commitment contract (1,248 - 122 = 1,126); the contexts state neither
  count.

  Cross-check.  Every pinned value and SE equals the I4R o_coeff_dbl /
  o_std_err_dbl (published tables), the NBER August 2021 text, and the
  package's own estout output (regs_avg_delta_ex1_all.tex,
  regs_commit_pooled_all.tex).  The numbers.tex macros also carry 1.36,
  0.71, 0.45 (the Table 3 in-text coefficients) and 8.0 / 3 / 3.8
  (Table 4 coefficients x 100).

  Package specification (package-only facts; never in contexts).
  Tables.do lines 225-423: gap_goal_exp = goal - days_0; gap_actual_exp
  = visits - days_exp; delta_k = (wtp_k - wtp_{k-1})/(k - (k-1)) -
  (days_k + days_{k-1})/2 for the adjacent incentive pairs 1-2, 2-3, 3-5,
  5-7, 7-12, avg_delta_ex1 their mean; sample `!missing(incentive)`; the
  three variables are z-scored over that sample.  Table 3: `reg
  avg_delta_ex1 wave2 wave3 first_info new_info [z_gap_goal_exp |
  z_gap_actual_exp] if !missing(incentive), r`.  Table 4: `reshape long
  commit, i(id) j(t)` then `reg commit i.t wave2 wave3 [z_avg_delta_ex1 |
  z_gap_goal_exp | z_gap_actual_exp] first_info new_info if
  !missing(incentive), vce(cluster id)`.  first_info / new_info are the
  basic (wave 1) and enhanced (waves 2-3) information indicators.

  What could not be verified.  The published REStud PDF was not read
  (OUP refuses non-browser clients); the NBER revision's Tables 3-4
  match every I4R published-value row, and the package output matches
  both.  The do-files were not run and no independent re-estimate was
  done; the I4R team's perfect-reproduction verdict is the evidence.

  Original analysis in Stata 14 (reduced form) and MATLAB R2019a
  (structural simulations, out of scope); language is r, the
  reproduction target.
