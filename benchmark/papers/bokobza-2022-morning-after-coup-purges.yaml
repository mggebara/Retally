    "Final files/", none restricted, 102.8 MB as stored (Dataverse API,
    checked 2026-11-01); no archives.  Data: morning_after_dataset_
    countrylevel.dta (Stata 14, ingested and served as .tab; the
    downloader fetches the 1.78 MB .dta original; country-year panel,
