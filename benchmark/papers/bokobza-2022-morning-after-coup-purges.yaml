# Original paper: Bokobza, L., Krishnarajan, S., Nyrup, J., Sakstrup, C.,
#   & Aaskoven, L. (2022). "The Morning After: Cabinet Instability and the
#   Purging of Ministers after Failed Coup Attempts in Autocracies." The
#   Journal of Politics, 84(3), 1437-1452.  doi:10.1086/716952
#
# Reproduction report: none in the I4R Discussion Paper series.  The paper
#   is in the I4R First Meta Database as replication team 95 (tag T95,
#   database rows 5629-5765, 137 rows, 135 with a replicator coefficient;
#   date_entered 2023-09-28).  Verdict: reproducible —
#   perfect_reproduction = Yes, computational_reproduction = 1,
#   why_not_perfect_repro = "Perfect Reproduction", and every row records
#   "Analysis and cleaning code produce the same output as presented in
#   the paper" (run time under an hour; authors not contacted).  The
#   replicators worked in Stata and R.  Their rows are cross-software and
#   robustness checks against appendix Tables A1-A3 and K1-K3 and Figures
#   3-5: the R individual-level models re-estimated with fixest (identical
#   to the paper's felm) and plm, the country-level Stata models re-coded
#   in R (with country / leader random effects as a variant), and
#   fixed-effects logit / ordered-beta estimators.
#
# Why this paper:
#   1. First Journal of Politics entry; political-economy panel design
#      (country-year and minister-year linear models with country / leader
#      and year fixed effects, country-clustered SEs).
#   2. Mixed-language original: the country-level analysis is Stata, the
#      individual-level analysis R (lfe::felm), so the reproduction mixes a
#      .dta and a 96 MB .rds.
#   3. Exact I4R reproduction with 135 paired rows; one never-revised
#      Dataverse version under CC0.
#
# What original_claims pins.  The main text has no tables: every result
#   is a coefficient plot (Figure 2 country level; Figures 3-5 minister
#   level) whose numbers the paper prints in the online appendix "Tables
#   for Figure 2" (A1 country fixed effects, A2 leader fixed effects) and
#   "Tables for Figure 3, 4, & 5" (K1-K3).  Those tables ARE the headline
#   results (the abstract's and introduction's "extra 8-11 percent of the
#   cabinet" is the A1/A2 failed-coup range; "20 percentage points" for
#   defence ministers is K2's failed-coup coefficient), so the pins are
#   their failed-coup coefficients and the key interactions, with SEs as
#   printed (two decimals).  The two headline sample sizes are not pinned
#   because the main text states both (see the blind-mode caveat in the
#   notes).  None of the robustness appendices (B-J, L-R) is pinned.
#
# Paper text.  The open copy is the Aarhus University Pure accepted
#   manuscript (72 pp. with the online appendix).  Every pinned value
#   equals the I4R o_coeff / o_std_err for the same cell (rounded to the
#   printed two decimals; see the notes), so the AM tables match the
#   published ones as far as the meta-database records them.

