# instead of lfe::felm; those rows reproduce the coefficients exactly
# (r_coeff = o_coeff to six decimals, SE within 0.00002) and record the
# figure marginal effects (failed coup + interaction), so an interaction's
# reproduced value is the difference of two fixest marginal effects.  The
# plm rows carry the same coefficients with different (non-clustered) SEs.
# Country level (claims 0-3): the verdict is a perfect reproduction of the
# package; the replicators' own R re-coding of the Stata models
# ("Reproduction in R", recorded as a recode) lands within one SE but not
# on the printed values, and several columns share a rounded o_coeff so
# rows cannot be tied to columns one-to-one.  Those claims record the
# paper's value under the blanket verdict (as in leeson-2022), with the R
# re-coding values in the notes.
