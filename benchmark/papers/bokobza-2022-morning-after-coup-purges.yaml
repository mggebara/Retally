notes: >
  Headline findings: failed coup attempts raise the year-to-year cabinet
  replacement rate in autocracies by 8-11 percentage points (Figure 2;
  Tables A1-A2: 0.10 and 0.11 with country fixed effects, 0.08 and 0.09
  with leader fixed effects, SE 0.03 throughout), while alternative
  instability events (civil war, nonviolent campaigns, military disputes,
  interstate war, strikes; Table A3) do not once leader fixed effects are
  included.  At the minister level, purges after failed coups target
  newcomers (0.14 for under two years' experience; interaction -0.10 for
  over six years), ministers from parties other than the leader's (0.17;
  -0.13 for the leader's party), defence ministers (0.20; natural
  resources -0.18 relative to defence) and non-leader prime ministers /
  presidents (0.37).

  Curation pass (2026-11-01).  Pinned 11 claims: four A1/A2 failed-coup
  coefficients (Base and Main, country and leader fixed effects), four
  K1 coefficients (failed coup and the over-6-years and leader's-party
  interactions) and three K2 coefficients (failed coup in the
  responsibility and importance models, natural-resources interaction),
  each with its SE.  The A1 Base N (3,715) and the K1 experience-model N
  (90,020) were pinned in a first draft and dropped after the step-6
  leak check: the main text states both ("up to 3,715 country-year
  observations"; Figure 3 note "Up to 90,020 minister-years"), so a blind
  run would read them in the paper.  sample_size: A1 Base 3,715, Main 3,676; A2 Base
  3,332, Main 3,307; K1 experience 90,020, affiliation 86,057; K2
  responsibility 76,530, importance 90,014.  All coefficients and SEs
  are printed to two decimals; the printed-precision floor (+-0.005)
  binds.  Full-precision values (Stata log; I4R o_coeff for K): A1
  0.0985 (0.0327), 0.1055 (0.0323); A2 0.0839 (0.0317), 0.0853 (0.0318);
  K1 0.142112 (0.041926), interaction over 6 years -0.103 (0.052), 0.174175
  (0.056053), leader's party -0.126 (0.061); K2 0.202499 (0.065968),
  natural resources -0.183 (0.083), 0.370185 (0.09339).  Note that A1
  Main 0.1055 and A2 Main 0.0853 sit just inside their printed bands.
  Left out: the other A1/A2 columns (electoral, economic, instability,
  purges moving averages, all controls), the A3 placebos, K1 2-3 and 4-6
  year interactions, K2 foreign/finance/other and importance-tier
  interactions, Table K3 (Figure 5), control coefficients, within R2s,
  the Figure 1 medians (17.4% / 38.1%) and all robustness appendices.

  Cross-check against the meta-database.  Every pinned coefficient and SE
  equals its o_coeff / o_std_err rounded to two decimals: A1 rows record
  0.10 / 0.11 (0.03), A2 rows 0.08 / 0.09 (0.03), K1 0.142112 (0.041926)
  and 0.174175 (0.056053), K2 0.202499 (0.065968) and 0.370185 (0.09339);
  the interactions match the figure-row o_coeff (-0.103, -0.126, -0.183)
  and the differences of the recorded marginal effects.  The I4R "table
  k3" label covers both the K2 importance column and Table K3.  Row 5691
  records 0.85329 for what is 0.085329 (the "Other type of minister"
  marginal effect; typo in the database).

  What was read.  The accepted manuscript PDF (all 72 pp.: text, Figures
  1-5 notes, appendices A-R); the meta-database's 137 team-95 rows;
  Dataverse API metadata (version list, file list, licence); Crossref
  metadata; the package: readme.txt, the coefficient lines and sample
  sizes in the Stata .smcl log for Tables A1-A2, the R Markdown log's
  structure and console output, and figure4.jpg.  The R script, do-file
  and .tex tables were not read in full.

  Package-only facts (never in contexts).  Country level: xtreg
  replacement_rateadj_minister coupattempt_whogov L.gdp_cap_pwt_ln
  L.pop_pwt_ln [L.military_c L.monarchy_c L.party_c] i.YEAR_DATA if
  democracy1==0 & independent==1, fe cluster(COUNTRY_ID); the leader
  fixed-effects tables re-xtset the panel on the leader identifier
  (leader_cab_id) and run the same xtreg, fe.  The .dta has 7,878 rows.
  Individual level: read_rds(...) filtered to democracy_lag == 0 &
  leader == 0 & non-missing purged_y1, gdp_cap_pwt_ln and pop_pwt_ln
  (98,719 rows; 95,751 with a non-missing coupattempt_presentyear, 2,039
  of them coup years), then lfe::felm models with country and year
  fixed effects and country clusters, written with texreg to
  output/appendix_k*.tex; the R script loads packages with pacman and
  uses windowsFonts.  The K1 experience sample (junior ministers
  excluded) has 90,020 rows with a non-missing coup indicator, per the R
  log's N computation for Figure 3.

  Strip rule (independent / blind mount).  The name and content rules
  already withheld .Rhistory, the .R script, the .smcl log, the do-file
  saved as .txt (script-content:stata) and appendix_k1-3.tex
  (regression-table).  They kept morning_after_logfile_individuallevel.html,
  a pandoc-rendered R Markdown log holding the whole R script and its
  console output (filter counts including the K1 N).  benchmark/
  strip_rule.py now strips an HTML page with five or more
  language-tagged code chunks (132 <pre class="r"> chunks here) as
  script-content:r.  The 14 .jpg coefficient plots stay (binary, no
  printed numbers; they are the paper's own figures).

  Blind-mode caveat (oracle render check 2026-11-01).  The blind
  pipeline's first prompt (the methodology summary, which receives the
  paper text) contains no package script text and none of the 11 pinned
  values as results; the pinned-value forms it does contain are "p <
  0.05" and "p < 0.1" (footnotes 21 and 20) and the illustrative "If the
  estimate is 0.10" (results section).  The prose does state rounded
  effects: "10 percentage points" for the A1 Base model, an "8-11
  percentage-point" range across Figure 2, and "20 percentage points"
  for ministers of defense (with foreign affairs 16, finance 10, other
  7), so a blind run sees claims 0 and 8 to the printed precision in
  words.  Also: the pipeline's paper parser titles this PDF "General
  Rights", from the Aarhus University cover sheet on page 1.

  Original analysis in Stata (country level) and R (individual level,
  lfe); language is r, the reproduction target.
