original_claims:
  # ---- Country level: Figure 2 / Table A1 (country fixed effects) ----
  - description: failed_coup_base_country_fe
    value: 0.10
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 3715
    unit: change in the cabinet replacement rate (share of ministers, 0-1)
    location: "Table A1 (Tables for Figure 2), column Base Model, Failed coup attempt"
    context: >
      Table A1 ("Failed coup attempts. Country fixed effects: Country-level
      results"), Base Model column; plotted in the left panel of Figure 2.
      Time-series cross-sectional OLS of the year-to-year cabinet
      replacement rate (one minus the cabinet-size-adjusted retention rate
      of ministers, from WhoGov, July to July) on a failed coup attempt
      indicator (Powell and Thyne data; a failed coup before 1 July counts
      in that year, one after 1 July in the following year), with logged
      GDP per capita and logged population (Penn World Table 9.0) lagged
      one year, country fixed effects and year fixed effects.  Sample:
      country-years of independent countries with a lagged Boix-Miller-
      Rosato democracy score of 0, 115 autocracies, 1967-2016.  Standard
      errors clustered by country.
  - description: failed_coup_main_country_fe
    value: 0.11
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 3676
    unit: change in the cabinet replacement rate (share of ministers, 0-1)
    location: "Table A1, column Main Model, Failed coup attempt"
    context: >
      Table A1, Main Model column (Figure 2, left panel).  Same
      specification as failed_coup_base_country_fe plus lagged dummies
      for monarchy, military regime and party regime (Anckar and
      Fredriksson 2019); country and year fixed effects, country-clustered
      standard errors.
  # ---- Country level: Table A2 (leader fixed effects) ----
  - description: failed_coup_base_leader_fe
    value: 0.08
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 3332
    unit: change in the cabinet replacement rate (share of ministers, 0-1)
    location: "Table A2 (Tables for Figure 2), column Base Model, Failed coup attempt"
    context: >
      Table A2 ("Failed coup attempts. Leader fixed effects: Country-level
      results"), Base Model column (Figure 2, left panel, leader fixed
      effects).  Same regressors as failed_coup_base_country_fe (failed
      coup attempt, lagged logged GDP per capita and population, year
      fixed effects) with leader fixed effects instead of country fixed
      effects, so identification is within each autocrat's tenure.
      Standard errors clustered by country.
  - description: failed_coup_main_leader_fe
    value: 0.09
    claim_type: coefficient
    standard_error: 0.03
    sample_size: 3307
    unit: change in the cabinet replacement rate (share of ministers, 0-1)
    location: "Table A2, column Main Model, Failed coup attempt"
    context: >
      Table A2, Main Model column: the Main Model controls (lagged GDP per
      capita, population, monarchy, military and party regime dummies)
      with leader and year fixed effects; the monarchy dummy drops out as
      collinear with the leader fixed effects.  Country-clustered standard
      errors.
  # ---- Minister level: Figure 3 / Table K1 (loyalty) ----
  - description: failed_coup_experience_model
    value: 0.14
    claim_type: coefficient
    standard_error: 0.04
    sample_size: 90020
    unit: change in the probability of being purged next year
    location: "Table K1 (Table for Figure 3), column H2a: Experience, Failed coup attempt"
    context: >
      Table K1, column H2a: Experience; Figure 3 left panel.  Linear
      probability model of whether a cabinet member is purged (absent from
      the cabinet the following year; reshuffles within the cabinet are
      not purges) on a failed coup attempt indicator, experience-group
      dummies (2-3, 4-6, over 6 years in cabinet; reference under 2
      years), their interactions with the failed coup indicator, lagged
      logged GDP per capita and population, country and year fixed
      effects.  Minister-years in autocracies 1967-2016, excluding the
      leader and junior ministers or other low-ranking posts; standard
      errors clustered by country.  The failed coup coefficient is the
      effect for ministers with under two years of experience.
  - description: failed_coup_x_over_6_years_experience
    value: -0.10
    claim_type: coefficient
    standard_error: 0.05
    sample_size: 90020
    unit: difference in the change in purge probability
    location: "Table K1, column H2a: Experience, FCA*Over 6 years of experience (Ref: <2 y)"
    context: >
      Table K1, column H2a: Experience: the interaction of the failed coup
      attempt indicator with having over six years of cabinet experience
      (reference: under two years), in the same linear probability model
      as failed_coup_experience_model.
  - description: failed_coup_affiliation_model
    value: 0.17
    claim_type: coefficient
    standard_error: 0.06
    sample_size: 86057
    unit: change in the probability of being purged next year
    location: "Table K1, column H2b: Affiliation, Failed coup attempt"
    context: >
      Table K1, column H2b: Affiliation; Figure 3 right panel.  Linear
      probability model of being purged next year on the failed coup
      attempt indicator, party affiliation dummies (no party affiliation;
      from the leader's party; reference: from another party than the
      leader's), their interactions with the failed coup indicator, cubic
      polynomials in the minister's years in office, lagged logged GDP per
      capita and population, country and year fixed effects,
      country-clustered standard errors.  The failed coup coefficient is
      the effect for ministers from another party than the leader's.
  - description: failed_coup_x_leaders_party
    value: -0.13
    claim_type: coefficient
    standard_error: 0.06
    sample_size: 86057
    unit: difference in the change in purge probability
    location: "Table K1, column H2b: Affiliation, FCA*From the leader's party (Ref: Other party)"
    context: >
      Table K1, column H2b: the interaction of the failed coup attempt
      indicator with being from the leader's party (reference: another
      party), in the same model as failed_coup_affiliation_model.
  # ---- Minister level: Figure 4 / Table K2 (responsibility) ----
  - description: failed_coup_responsibility_model
    value: 0.20
    claim_type: coefficient
    standard_error: 0.07
    sample_size: 76530
    unit: change in the probability of being purged next year
    location: "Table K2 (Table for Figure 4), column H3a: Responsibility, Failed coup attempt"
    context: >
      Table K2, column H3a: Responsibility; Figure 4 left panel.  Linear
      probability model of being purged next year on the failed coup
      attempt indicator, portfolio dummies (Minister of Foreign Affairs,
      of Finance, of Natural Resources, other type of minister; reference:
      Minister of Defense), their interactions with the failed coup
      indicator, cubic polynomials in years in office, lagged logged GDP
      per capita and population, country and year fixed effects,
      country-clustered standard errors.  The failed coup coefficient is
      the effect for ministers of defense.
  - description: failed_coup_x_natural_resources
    value: -0.18
    claim_type: coefficient
    standard_error: 0.08
    sample_size: 76530
    unit: difference in the change in purge probability
    location: "Table K2, column H3a: Responsibility, FCA*Minister of Natural Resources (Ref: D)"
    context: >
      Table K2, column H3a: the interaction of the failed coup attempt
      indicator with being minister of natural resources (reference:
      minister of defense), in the same model as
      failed_coup_responsibility_model.
  - description: failed_coup_importance_model
    value: 0.37
    claim_type: coefficient
    standard_error: 0.09
    sample_size: 90014
    unit: change in the probability of being purged next year
    location: "Table K2, column H3b: Importance, Failed coup attempt"
    context: >
      Table K2, column H3b: Importance; Figure 4 right panel.  Linear
      probability model of being purged next year on the failed coup
      attempt indicator, rank-tier dummies (vice-president / deputy prime
      minister / top minister; medium-ranking; low-ranking; junior
      minister; reference: prime minister or president who is not the
      leader), their interactions with the failed coup indicator, cubic
      polynomials in years in office, lagged logged GDP per capita and
      population, country and year fixed effects, country-clustered
      standard errors.  The failed coup coefficient is the effect for a
      prime minister or president who is not the leader.

# The meta-database's paired rows for the pinned cells.  Individual level
