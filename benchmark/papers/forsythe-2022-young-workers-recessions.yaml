notes: >
  Headline finding: in the matched monthly CPS (1994-2016), the monthly
  hiring probability of workers with at most ten years of potential
  experience falls with the state unemployment rate (Table 1 Panel B:
  -0.335 pp per point with no controls, -0.253 in the preferred
  specification with state, demographic and month-year fixed effects),
  while experienced workers' hiring barely moves (-0.0367) or rises
  (0.0496); the gap holds for hires from employment, unemployment and
  non-participation (Table 2), and new hires' log weekly wages fall
  faster for the young (Table 10: -0.0262 vs -0.0116 per point), which
  the paper reads as support for its bargained cyclical-upgrading model.
  Full-sample N 16,948,516.

  Outcome label.  The meta-database leaves computational_reproduction
  and perfect_reproduction blank for this paper and files every row as a
  robustness check; the shortlist recorded "reproducible
  (perfect_reproduction=Yes, computational_reproduction=1)", which the
  database copy in benchmark/corpus/ does not show.  DP 163 never ran
  the package: it reconstructs the data from IPUMS-CPS and recodes every
  regression, and concludes that the results "closely replicate" (same
  signs and significance in Tables 1, 2 and B.2; magnitude differences
  elsewhere that it attributes to the different data construction).
  outcome_label is therefore robust, not reproducible: in schema.py
  REPRODUCIBLE means the code runs and the numbers match, which nobody
  checked, while ROBUST means the claims survive reasonable alternative
  specifications, which is what DP 163 shows (an independent data build
  with a different N, recoded regressions, plus the 2019 sample
  extension and MSA-level unemployment).  No one on record has run the
  shipped do-files.  The per-claim findings record where the rebuilt data
  move a number by more than a paper SE; because the replicators did not
  use the package, they say nothing about whether the package itself
  reproduces the printed tables.

  Sandbox memory.  yh_data.csv is 2.17 GB uncompressed (35 columns of
  raw CPS person-month pairs), and the reproduction sandbox runs every
  script under a fixed memory cap: DockerExecutor
  (src/retally/codegen/docker_executor.py) starts each container with
  `docker run --memory 4g` (memory_limit default "4g", Pipeline
  docker_memory default "4g"; the benchmark runner does not override
  it), also with --cpus 1.0, a 300 s default timeout, a read-only root
  and a 256 MB /tmp.  A reproduction that loads the full file into R,
  or builds the fixed-effects design on all of its rows, may be killed
  for exceeding that cap, and a pass or fail on this entry has to be
  read with that in mind.  This is a property of the entry, recorded
  here, not something the entry works around.

  I4R rows (team 109, DP 163, rows 6412-6626; 215 rows, 214 with
  r_coeff).  158 "New data (all)" rows are the DP's Appendix A.1 direct
  replication (Tables 1-6, 10, B.2); 28 "Increase sample (time)" rows are
  Appendix A.2 (sample extended to 2019, Tables 1-2); 28 more add a
  changed main variable (Appendix A.3, MSA unemployment, Tables 1-2); one
  row is blank.  Transcription slips in o_coeff_dbl, checked against the
  paper and DP 163's "[original]" rows: Table 1 Panel B col 1 PE > 10 x U.
  Rate is printed -0.0367 but recorded as -0.367 (rows 6434, 6491); Table
  4 col 1 PE <= 10 is printed 0.193 but recorded as 0.192 (not pinned).
  Every other pinned value and SE equals o_coeff_dbl / o_std_err_dbl.

  Curation pass (2026-11-01).  Pinned 13 claims, all from the main-text
  Tables 1, 2 and 10, with state-clustered SEs in standard_error: Table 1
  Panel B young and experienced interactions in column (1) (no fixed
  effects; the abstract-level numbers of the introduction, which quotes
  five times these) and column (4) (preferred, = Table 2 column 1);
  Table 1 Panel A aggregate effect in columns (1) and (4); Table 2
  young and experienced interactions for hires from employment, and the
  young interaction for hires from unemployment and from NILF; Table 10
  Panel B column (1) young and experienced log-wage interactions; the
  full-sample N.  sample_size is set where the paper prints the N of the
  same regression (Table 1 / Table 2 col 1: 16,948,516); Table 2
  columns 2-4 print 10,814,088 / 653,100 / 5,481,328 and Table 10
  column 1 prints 112,858 (not pinned, not in contexts).  Left out:
  Table 1 columns (2)-(3) and the PE <= 10 main effects (4.988 etc.),
  R-squared, the Table 2 Wald statistics (569.88, 206.51, 38.15,
  237.47), Table 2 experienced interactions for the unemployed (-1.505)
  and NILF (0.0148), Tables 3-9 (flows, separations, composition, search,
  availability, education), Table 10 columns (2)-(4) and Panel A,
  Figure 2 and the appendix (Table B.2).

  What was read.  The author's pre-publication PDF (whole text and
  Tables 1-10); Crossref and Zenodo API metadata; I4R DP 163 (EconStor
  PDF, whole text and Appendix A tables); the meta-database's 215 rows;
  the whole package listing, ReadMe.pdf, the CSV headers and the
  data-construction and regression do-files (downloaded to the
  gitignored .cache/datasets/, never committed).

  Package structure (package-only facts; never in contexts).
  YH_data_init.do: years from education (peeduc 31-46 mapped to 0-22,
  e.g. 39 -> 12, 43 -> 16), exp = age - yrsch - 6 (age set missing above
  79); young = exp <= 10 (negative experience counts as young);
  youngurate / oldurate = v2unemp times the group indicator; hired = 1 if
  employed in month 2 (v2pemlr 1-2), reset to 0 if v2puiodp1 == 1 (same
  employer) or if employed in month 1 with v2puiodp1 missing; hired2
  also 0 if v2peio1cow >= 5 (self-employed / without pay); hired100 =
  100 x hired2; demo2 = group(minority female hisp educ) with educ in 7
  levels; weight = (v2pwsswgt + pwsswgt) / 2; date = ym(v2hryear,
  v2hrmonth); log weekly real wage = log(v2prernwa / cpi), wage
  regressions restricted to hires with v2prwernal == 0 and occupation /
  industry fixed effects on the 2002-recoded codes; final sample keep if
  exp and v2unemp non-missing.  YH_regs.do: every table is Stata `reg
  ... [aweight=weight], vce(cl v2gestfips)` with i.v2gestfips i.date
  i.demo2 dummies; Table 2 columns 2-4 condition on pemlr 1-2 / 3-4 / >4
  in month 1; output via esttab.  hryear is two-digit for 1994-1997 in
  the .csv.

  What could not be verified.  The do-files were not run and no
  estimate was recomputed here (the 2.2 GB .csv and a multi-hour Stata
  run made that out of scope for a zero-cost curation pass), so the
  entry rests on the paper, the meta-database and DP 163; whether the
  package reproduces the printed tables is untested by anyone on record.
  The published EJ PDF was not read (paywalled); the pre-publication
  version's pinned values agree with the published ones as recorded by
  the meta-database and DP 163.  publication_date is the 2016 working
  paper, dated from a news article rather than from the working-paper
  file itself.

  Original analysis in Stata 14.2 (seven do-files, parmest and esttab);
  language is r, the reproduction target.
