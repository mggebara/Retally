# Original paper: Forsythe, E. (2022). "Why Don't Firms Hire Young
#   Workers During Recessions?" The Economic Journal, 132(645),
#   1765-1789.  doi:10.1093/ej/ueab096 (first published online
#   2021-12-07).
#
# Reproduction report: Créchet, J., Cui, J., Sabada, B., & Sawyer, A.
#   (2024). "Why Don't Firms Hire Young Workers During Recessions? A
#   Replication of Forsythe (The Economic Journal, 2022)." I4R Discussion
#   Paper No. 163 (September 2024; Ottawa replication games, May 2023; I4R
#   First Meta Database replication team 109).  Verdict: the main results
#   replicate — "We replicate the original results very closely" — but
#   NOT from the package: the team rebuilt the CPS panel from IPUMS-CPS
#   and wrote the dataset construction and every regression from scratch
#   in Stata (their N is 16,208,583 against the paper's 16,948,516; tighter
#   longitudinal matching, IPUMS-harmonised education / occupation /
#   industry codes, negative potential experience set to zero).  Same
#   signs and significance for Tables 1, 2 and B.2; small magnitude
#   differences elsewhere; two robustness extensions (sample to 2019,
#   MSA-level unemployment) leave the conclusions unchanged.  The
#   meta-database files all 215 rows as robustness ("New data (all)",
#   158; "Increase sample (time)", 28; the same plus a changed main
#   variable, 28; one blank) and leaves computational_reproduction /
#   perfect_reproduction blank; the shortlist (candidates-2026-11-01)
#   recorded the paper as reproducible.  outcome_label is ROBUST, not
#   reproducible: I4R never ran the package — DP 163 rebuilt the panel
#   from IPUMS, recoded every regression, got a different N, and found
#   the claims survive that independent construction (and two
#   extensions), which is the schema's ROBUST ("claims survive reasonable
#   alternative specifications"), not REPRODUCIBLE ("code runs and the
#   numbers match").  No one on record has run the shipped do-files.
#   See notes.
#
# Why this paper:
#   1. A CPS labour-market panel with linear probability models — a method
#      family the evaluation set lacks — on one large plain .csv extract.
#   2. A clean "independent re-derivation" benchmark: the human
#      replicators themselves worked from the paper's description, not
#      the authors' code, which is exactly what independent / blind mode
#      asks of the model.
#   3. Author's pre-publication PDF is open; the package is on Zenodo
#      under CC BY 4.0.
#
# What original_claims pins: 13 numbers from the main-text Tables 1, 2
#   and 10 — the young (potential experience <= 10) and experienced
#   (> 10) interactions with the state unemployment rate with no controls
#   and in the preferred specification, the aggregate Panel A effect with
#   and without month-year fixed effects, the interactions by origin
#   labour-force status (Table 2), the new-hire log-wage interactions
#   (Table 10, all hires) that test the model, and the full-sample N.
#   No appendix (Table B.2) or Figure 2 coefficients, no summary
#   statistics.

id: forsythe-2022-young-workers-recessions
i4r_report_url: https://www.econstor.eu/bitstream/10419/303195/1/I4R-DP163.pdf
language: r
outcome_label: robust
split: holdout
# Contamination bookkeeping.  The paper circulated as a working paper
# under the same title well before publication: a University of Illinois
# News Bureau article dated 2016-05-16 describes it and links an online
# copy (found by web search 2026-11-01), and the Illinois Experts record
# of the working paper shows "Submitted 2019-03-03".  The 2016 working
# paper is taken as the first public version (month precision).  EJ:
# published online 2021-12-07, print 2022-06-17 (Crossref API
# published-online / published-print).  Package: Zenodo record 5710784
# (concept 5710783, one version), created and published 2021-11-18
# (Zenodo API created / publication_date).
publication_date: "2016-05"
package_release_date: "2021-11-18"

paper:
  # Author's pre-publication version ("September 21, 2021", 47 pp.), on
  # her Illinois site; checked 2026-11-01: 200 application/pdf, %PDF
  # magic, to a Retally-curation user agent.  Its Tables 1-10 print the
  # same values as the published article for every number pinned here:
  # each pinned value equals the meta-database's o_coeff_dbl /
  # o_std_err_dbl and the "[original]" rows that DP 163 copies from the
  # EJ article (two meta-database transcription slips noted on the
  # claims).
  source: https://publish.illinois.edu/elizaforsythe/files/2022/01/Forsythe_Youth_Hiring_prepub_version_2021.pdf
  title: "Why Don't Firms Hire Young Workers During Recessions?"
  authors:
    - Eliza Forsythe

dataset:
  source: https://zenodo.org/records/5710784
  access_notes: >
    Zenodo record 5710784 (concept 5710783, one version), open access, CC
    BY 4.0: ONE file, "3 replication package.zip" (347,250,427 bytes, md5
    f94b809c73d85b38f5437ccf2d06dcd0; the filename has spaces), checked
    and downloaded with the project downloader 2026-11-01.  Not nested.
    It unpacks to "3 replication package/" (about 2.2 GB): ReadMe.pdf
    (2 pp., dated 2021-09-19: run times, data sources, file roles, no
    numbers from the paper), Dofiles/ (seven Stata do-files: YH_master,
    YH_fileconversion, YH_data_init, YH_regs, YH_figures,
    YH_appendix_tables, YH_appendix_figure) and Data/ with five plain
    .csv files: yh_data.csv (2,174,065,890 bytes uncompressed — the
    matched CPS person-month pairs, raw CPS variable names, second-month
    variables prefixed v2), v2unemp_smy.csv (LAUS state-month
    unemployment rates), wage_deflation_1994_2016.csv (CPI-U, 1994 = 1),
    occ_xwalk2002.csv and ind_xwalk2002.csv (occupation / industry
    crosswalks to 2002 Census codes).  No logs, no table output, no
    paper or manuscript PDF (the code writes to an Output/ folder that is
    not shipped).  The script-free copy (independent / blind) removes the
    seven do-files by suffix and keeps everything else; yh_data.csv is
    above the strip rule's 50 MB content-test cap, which only matters for
    text files that could carry results, and it is data.  Practical
    caveat: the main .csv is 2.2 GB (the ReadMe ran the code on a
    396 GB-RAM server; regressions took about 90 minutes in Stata), so
    an R reproduction needs a memory-aware reader (data.table::fread
    with select=) and fixest for the high-dimensional fixed effects.

code_repo:
  url: https://zenodo.org/records/5710784

original_claims:
  # ---- Table 1: hiring and the state unemployment rate ----
  - description: young_x_unemp_rate_no_controls
    value: -0.335
    claim_type: coefficient
    standard_error: 0.0203
    sample_size: 16948516
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 1, Panel B, column (1), PE <= 10 x U. Rate"
    context: >
      Table 1 ("Hiring Over the Business Cycle: With and Without
      Controls"), Panel B, column (1), row PE <= 10 x U. Rate.  Linear
      probability model (Equation 1 of the paper) of an indicator equal
      to 100 if the individual is hired in month t — begins a job at a new
      firm, either from non-employment in month t-1 or, if employed in
      t-1, reporting a change of employer since last month; new jobs
      classified as self-employment are not hires — on an indicator for
      potential experience (age minus years of education minus six) of at
      most ten years, and the state monthly unemployment rate interacted
      with each of the two potential-experience groups (at most ten
      years; more than ten years), with no main effect of the
      unemployment rate.  Column (1) has no fixed effects.  Sample: the
      matched monthly CPS panel, January 1994 to September 2016 (pairs of
      consecutive months matched on administrative IDs and confirmed on
      sex, race and age, following Madrian and Lefgren; May-August 1995
      and month pairs spanning the eight-month sampling break excluded),
      civilians over 16 with non-missing age and education, all
      labour-force statuses in t-1.  Weighted by the average of the two
      months' CPS sampling weights; standard errors clustered by state
      (51 including DC).  The coefficient is the young workers' hiring
      response to one percentage point of state unemployment.
  - description: experienced_x_unemp_rate_no_controls
    value: -0.0367
    claim_type: coefficient
    standard_error: 0.0131
    sample_size: 16948516
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 1, Panel B, column (1), PE > 10 x U. Rate"
    context: >
      Table 1, Panel B, column (1), row PE > 10 x U. Rate: the
      experienced workers' (more than ten years of potential experience)
      hiring response in the same regression as
      young_x_unemp_rate_no_controls (no fixed effects, CPS weights,
      state-clustered standard errors).
  - description: young_x_unemp_rate_preferred
    value: -0.253
    claim_type: coefficient
    standard_error: 0.0185
    sample_size: 16948516
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 1, Panel B, column (4), PE <= 10 x U. Rate (also Table 2, column (1))"
    context: >
      Table 1, Panel B, column (4) — the paper's preferred specification,
      reprinted as Table 2, column (1) (sample: All) — row PE <= 10 x U.
      Rate.  Same regression as young_x_unemp_rate_no_controls with state
      fixed effects, demographic fixed effects (indicators for every
      combination of gender, white / non-white, Hispanic descent and
      seven education levels: less than high school, high school, some
      college, four-year college, master's, professional degree, PhD) and
      month-year fixed effects.  CPS weights; standard errors clustered
      by state.
  - description: experienced_x_unemp_rate_preferred
    value: 0.0496
    claim_type: coefficient
    standard_error: 0.0142
    sample_size: 16948516
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 1, Panel B, column (4), PE > 10 x U. Rate (also Table 2, column (1))"
    context: >
      Table 1, Panel B, column (4) (= Table 2, column (1)), row PE > 10 x
      U. Rate: the experienced workers' hiring response in the preferred
      specification (state, demographic and month-year fixed effects), the
      same regression as young_x_unemp_rate_preferred.  Positive and
      significant in the paper.
  - description: aggregate_unemp_rate_no_controls
    value: -0.119
    claim_type: coefficient
    standard_error: 0.0150
    sample_size: 16948516
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 1, Panel A, column (1), State Unemp. Rate"
    context: >
      Table 1, Panel A, column (1), row State Unemp. Rate.  Regression of
      the hired indicator (times 100) on the state monthly unemployment
      rate alone, for all working-age individuals in the matched CPS
      panel, no fixed effects; CPS weights, standard errors clustered by
      state.
  - description: aggregate_unemp_rate_month_year_fe
    value: -0.0326
    claim_type: coefficient
    standard_error: 0.0132
    sample_size: 16948516
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 1, Panel A, column (4), State Unemp. Rate"
    context: >
      Table 1, Panel A, column (4), row State Unemp. Rate: the same
      single-regressor hiring regression as
      aggregate_unemp_rate_no_controls with state, demographic and
      month-year fixed effects.
  # ---- Table 2: hiring by labour-force status in the previous month ----
  - description: young_x_unemp_rate_employed
    value: -0.168
    claim_type: coefficient
    standard_error: 0.0156
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 2, column (2) Employed, PE <= 10 x U. Rate"
    context: >
      Table 2 ("Hiring Over the Business Cycle: Young and Experienced"),
      column (2), sample Employed: the preferred specification (potential
      experience main effect, both unemployment-rate interactions, state,
      demographic and month-year fixed effects, CPS weights,
      state-clustered standard errors) estimated on individuals employed
      in month t-1, so a hire is a move to a new employer.  Row PE <= 10 x
      U. Rate.
  - description: experienced_x_unemp_rate_employed
    value: 0.0179
    claim_type: coefficient
    standard_error: 0.0101
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 2, column (2) Employed, PE > 10 x U. Rate"
    context: >
      Table 2, column (2), sample Employed, row PE > 10 x U. Rate; same
      regression as young_x_unemp_rate_employed.  Not statistically
      significant in the paper.
  - description: young_x_unemp_rate_unemployed
    value: -1.928
    claim_type: coefficient
    standard_error: 0.167
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 2, column (3) Unemployed, PE <= 10 x U. Rate"
    context: >
      Table 2, column (3), sample Unemployed: the preferred specification
      estimated on individuals unemployed in month t-1.  Row PE <= 10 x U.
      Rate.
  - description: young_x_unemp_rate_nilf
    value: -0.490
    claim_type: coefficient
    standard_error: 0.0332
    unit: percentage points of the monthly hiring probability per percentage point of state unemployment
    location: "Table 2, column (4) NILF, PE <= 10 x U. Rate"
    context: >
      Table 2, column (4), sample NILF: the preferred specification
      estimated on individuals not in the labour force in month t-1.  Row
      PE <= 10 x U. Rate.
  # ---- Table 10: new hires' log wages ----
  - description: wage_young_x_unemp_rate_all_hires
    value: -0.0262
    claim_type: coefficient
    standard_error: 0.00360
    unit: log points of the weekly wage per percentage point of state unemployment
    location: "Table 10, Panel B, column (1) All, PE <= 10 x U. Rate"
    context: >
      Table 10 ("Log Wages During Recessions for New Hires"), Panel B
      ("Disaggregated by Potential Experience"), column (1), sample All
      (all new hires, whatever their status in the previous month).
      Regression of the log weekly wage of newly hired workers (weekly
      wages that are not allocated / imputed by the Census, deflated to
      1994 dollars) on the potential-experience-at-most-ten indicator and
      its interactions with the state unemployment rate, as in Equation
      1, with a constant and state, demographic, month-year, occupation
      and industry fixed effects; CPS weights, standard errors clustered
      by state.  Row PE <= 10 x U. Rate.
  - description: wage_experienced_x_unemp_rate_all_hires
    value: -0.0116
    claim_type: coefficient
    standard_error: 0.00348
    unit: log points of the weekly wage per percentage point of state unemployment
    location: "Table 10, Panel B, column (1) All, PE > 10 x U. Rate"
    context: >
      Table 10, Panel B, column (1), sample All, row PE > 10 x U. Rate;
      same new-hire log-wage regression as
      wage_young_x_unemp_rate_all_hires.
  # ---- Sample size ----
  - description: n_obs_full_sample
    value: 16948516
    claim_type: count
    unit: person-month observations (matched consecutive-month pairs)
    location: "Table 1, N (all columns); Table 2, column (1)"
    context: >
      Number of observations in the full-sample hiring regressions of
      Table 1 (every column) and Table 2 column (1): matched
      consecutive-month CPS person observations, January 1994 to
      September 2016, after the sample restrictions described for
      young_x_unemp_rate_no_controls.

