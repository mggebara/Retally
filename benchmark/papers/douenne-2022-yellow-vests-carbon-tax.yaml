  # ---- Section IV: causal effects of beliefs on support (abstract, Tables 6 and 8) ----
  - description: believes_not_lose_on_acceptance_iv_table6_col1
    value: 0.534
    claim_type: coefficient
    standard_error: 0.132
    unit: change in the probability of accepting the tax and targeted dividend
    location: "Table 6, column (1), Believes does not lose"
    context: >
      Table 6 ("Effect of Self-Interest on Acceptance"), column (1), the
      paper's main self-interest estimate: two-stage least squares of
      acceptance of the tax and targeted dividend ("Yes" or "Don't know" to
      supporting it) on the belief that one does not lose from it,
      instrumented by the respondent's and the second adult's random
      eligibility for the targeted dividend (eligibility thresholds at the
      20th, 30th, 40th or 50th income percentile, randomly assigned) and
      their interaction (first stage: Table 5 column 1), controlling for
      fixed effects for the policy assigned, a single-adult indicator,
      initial acceptance of the tax and dividend, incomes (piecewise
      linear with kinks at the 20th and 70th percentiles), estimated
      gains, socio-demographics and other motives.  Sample: households
      where at least one adult's income is between the 10th and 60th
      percentiles.
  - description: believes_effective_on_approval_iv_table8_col1
    value: 0.416
    claim_type: coefficient
    standard_error: 0.168
    unit: change in the probability of approving the tax and dividend
    location: "Table 8, column (1), Believes in effectiveness"
    context: >
      Table 8 ("Effect of Believing in Environmental Effectiveness on
      Approval"), column (1), the paper's main environmental-effectiveness
      estimate: two-stage least squares of initial approval of the tax and
      dividend (answer "Yes") on believing it is environmentally effective
      (answer "Yes"), instrumented by the two randomly displayed
      information treatments on the scientific consensus about the
      effectiveness of carbon taxation and on climate change (first stage:
      Table 7), controlling for socio-demographics, other motives, incomes
      and estimated gains.  All respondents.

# Paper says X, humans got Y.  DP58 re-codes Table 4 in R from the
# authors' processed data.  Its uncorrected re-estimate of column 1
# (DP58 Table 2 col 1, treatment as coded, three covariates with missing
# values dropped) is 0.272 (0.059); every reproduced_value below is the
# replicators' value AFTER CORRECTING THE MISCLASSIFIED TREATMENT (56
# respondents whose win/lose indicator contradicts the sign of their
# simulated net gain), the meta-database rows marked "Corrected treatment
# variable" / "Changing coding of treatment".  outcome: matches when the
# corrected value is within 5% of the printed one or 0.01 in absolute
# terms, does_not_match otherwise (all corrected values stay within one
# printed SE).  Tables 4 cols (2) and (4), Table 4 col (1)'s acceptance
# coefficient and Tables 6 and 8 have no I4R row and no finding.
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 0.216
    outcome: does_not_match
    notes: >
      Coding error fixed: treatment set to 1 exactly when the simulated net
      gain is positive.  DP58 Table 2 col 3 / meta-database row 6688: 0.216
      (SE 0.066), p = 0.001, N = 757 (col 4, no covariates: 0.234 (0.069)).
      As coded: 0.272 (0.059) (row 6656); no covariates 0.241 (0.056).
      rdrobust variants (DP58 Table 3, rows 6631-6690): conventional
      0.157-0.282, bias-corrected 0.131-0.287; the misclassified
      respondents dropped (col 6) 0.282 (0.069).
  - claim_id: 3
