# Original paper: Douenne, T., & Fabre, A. (2022). "Yellow Vests,
#   Pessimistic Beliefs, and Carbon Tax Aversion." American Economic
#   Journal: Economic Policy, 14(1), 81-110.  doi:10.1257/pol.20200092
#   (February 2022 issue).
#
# Reproduction report: Rivers, N., Woerman, M., & Yassin, K. (2023).
#   "Yellow Vests, Pessimistic Beliefs, and Carbon Tax Aversion (2022): A
#   Comment." I4R Discussion Paper No. 58 (September 2023; EconStor
#   hdl:10419/275821; I4R First Meta Database tag T110, rows 6627-6692,
#   66 rows, 46 with both an original and a replicated coefficient, all
#   from Table 4).
#
#   Verdict: NOT reproducible in the meta-database's sense
#   (computational_reproduction = 0, perfect_reproduction = No;
#   why_not_perfect_repro: "Coding error: treatment classification was
#   incorrect 7% (56/3002) ... unable to reproduce the exact sample ...
#   recoded Analysis (not cleaning data) from scratch").  DP58 itself is
#   milder: it re-codes Section III.A (the effect of the win/lose feedback
#   on beliefs, Table 4) in R from the authors' processed data and
#   "successfully replicate[s] the average treatment effect" (0.272 with
#   the treatment as coded vs the printed 0.269), but finds (a) 56 of
#   3,002 respondents (1.8%; almost 7% of the |net gain| < EUR 50 window)
#   whose win/lose feedback indicator contradicts their simulated net gain
#   — fixing it moves column 1 to 0.216 — and (b) that the column 3
#   heterogeneity estimates are misspecified (the running-variable
#   polynomial is not interacted with the subgroup indicators); with the
#   interactions the Yellow Vests interaction loses significance and the
#   acceptance interaction grows to 0.378-0.618.  DP58 does not examine
#   Sections IV (Tables 5-8).
#
# Why this paper: the first AEJ paper and the only "not reproducible"
#   verdict of the 2026-11-02 shortlist; R original (with Python 2 for
#   the tax-incidence microsimulation), small package (43 MB zip), plain
#   csv / RData, a coding error the replicators fixed, and a regression
#   table (Table 4) whose every coefficient has an I4R row.
#
# What original_claims pins: the PUBLISHED values of Table 4 (all four
#   columns: the main RDD estimate, the full-sample and belief-of-winning
#   variants, and the six column 3 coefficients I4R re-estimated, plus the
#   window N), and the two causal effects the abstract and Section IV
#   lead with: Table 6 column 1 (believing one does not lose -> acceptance,
#   2SLS on the random eligibility thresholds) and Table 8 column 1
#   (believing in environmental effectiveness -> approval, 2SLS on the
#   random information treatments).  i4r_replicator_findings carry the
#   replicators' corrected-treatment values for every Table 4 claim with a
#   meta-database row.
#
# IMPORTANT — package version.  dataset.source is a GitHub archive zip of
#   the authors' repository thomasdouenne/yellow_vests_aej_ep at commit
#   0faf9e7121ba1f67b1f5b327ed55efcc1665daec (2021-05-11, "revision
#   replication", the last commit; the repository was never pushed
#   again).  The official deposit is openICPSR project 128143 (doi:
#   10.3886/E128143V1, published 2022-01-28), which sits behind a login,
#   so it could not be compared file by file.  Its public landing page
#   lists one folder, "yellow_vests_aej_ep", last modified 2021-05-11
#   09:22 — the same day as this commit — so the GitHub copy very likely
#   IS the deposited snapshot, but it predates the deposit's publication
#   and may differ from what I4R ran (the package README cites a "V2" DOI
#   that the openICPSR page does not list).  The archive URL ignores HTTP
#   range requests; src/retally/dataset/downloader.py fetches it as a
#   direct URL (HEAD -> codeload.github.com, Content-Disposition
#   "yellow_vests_aej_ep-0faf9e7....zip"), extracts it and deletes the zip
#   (checked 2026-11-02 with the project's downloader: 43 MB zip, 92 MB
#   extracted).

id: douenne-2022-yellow-vests-carbon-tax
i4r_report_url: https://www.econstor.eu/bitstream/10419/275821/1/I4R-DP058.pdf
# Target language for regeneration (the original analysis is R 4.0.3;
# the tax-incidence microsimulation that produced the simulated gains is
# Python 2.7, and its outputs ship in the processed data).
language: r
outcome_label: not_reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  First public version: FAERE Working Paper
# 2019.10 (also Policy Paper 2019.05), "Can We Reconcile French People
# with the Carbon Tax? Disentangling Beliefs from Preferences", 2019 (no
# month on RePEc; same survey and design); then PSE Working Paper 2020-05
# / halshs-02482639, "Yellow Vests, Carbon Tax Aversion, and Biased
# Beliefs" (February 2020); journal version AEJ:EP 14(1), February 2022.
# Found by web search 2026-11-02 (IDEAS / RePEc listings).  Package: the
# GitHub repository was created 2020-12-02 (GitHub API created_at; first
# commit "Import all material necessery for replication" the same day);
# the pinned commit is 2021-05-11; openICPSR 128143 V1 was published
# 2022-01-28 (openICPSR landing page).
publication_date: "2019"
package_release_date: "2020-12-02"

paper:
  # Published AEJ:EP version (UvA-DARE cover page "Final published
  # version" + the AEA typeset article, 32 pp. with the cover); checked
  # 2026-11-02: 200 application/pdf, %PDF magic, 998,397 bytes, to a
  # Retally-curation user agent.
  source: https://pure.uva.nl/ws/files/131576690/pol.20200092.pdf
  title: "Yellow Vests, Pessimistic Beliefs, and Carbon Tax Aversion"
  authors:
    - Thomas Douenne
    - Adrien Fabre

dataset:
  source: https://github.com/thomasdouenne/yellow_vests_aej_ep/archive/0faf9e7121ba1f67b1f5b327ed55efcc1665daec.zip
  access_notes: >
    GitHub archive zip of thomasdouenne/yellow_vests_aej_ep at commit
    0faf9e7121ba1f67b1f5b327ed55efcc1665daec (2021-05-11; GPL-3.0 LICENSE
    file); 43 MB as downloaded, 92 MB extracted into one top folder
    yellow_vests_aej_ep-0faf9e7.../ (GitHub reports the repository at
    68.8 MB).  The official deposit (openICPSR 128143, login required) was
    not compared; its single folder carries the same 2021-05-11
    modification date.  Contents: code/ holds the R scripts (preparation.R
    builds the analysis data frame, papier.R runs every table,
    packages_functions.R, matching_predict_winner.R), the raw and prepared
    Qualtrics survey (survey.csv 11.1 MB, survey_prepared.csv 9.3 MB,
    questionnaire.qsf), auxiliary csv files (ERFS income distribution,
    INSEE postal codes 27.4 MB, town sizes, subjective / objective gain
    distributions, a transport-survey extract), quotas.xlsx, and two R
    workspaces: after_preparation.RData (12.7 MB; the processed data frame
    the analysis uses, plus helper functions) and after_papier.RData (13.4
    MB; a save.image() taken at the end of papier.R that also holds every
    model formula and the stargazer output of the paper's tables).
    tables/ holds 15 stargazer .tex tables, Table 4 included
    (effect_feedback.tex), Tables 5-8 (first_stage_private_benefits,
    results_private_benefits, first_stage_environmental_effectiveness,
    ee) and appendix tables.  images/ holds 41 .png figures and a .jpeg.
    The Python 2 tax-incidence code (model_reforms/,
    model_reforms_data/, four top-level .py files) and its prediction
    csv outputs sit beside it; its INSEE inputs (data_menages.csv etc.)
    are not in the repository.  conso-eff-fonction.xls (national
    accounts) and README.md (run instructions, file list, data
    availability; no results) complete it.  No logs, no manuscript PDF.
    The script-free copy (blind / independent) withholds every .R / .py
    file, the 15 tables/*.tex (regression-table) and after_papier.RData
    (regression-table: the R-workspace content test added with this
    entry); it keeps after_preparation.RData, which embeds the source of
    the functions defined in preparation.R (srcrefs; about 1,100 of its
    1,270 substantive lines) but none of papier.R.

code_repo:
  url: https://github.com/thomasdouenne/yellow_vests_aej_ep
  commit: 0faf9e7121ba1f67b1f5b327ed55efcc1665daec

original_claims:
  # ---- Table 4: effect of the win/lose feedback on beliefs (the target of DP58) ----
  - description: predicted_winner_believes_not_lose_table4_col1
    value: 0.269
    claim_type: coefficient
    standard_error: 0.058
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (1), Predicted winner"
    context: >
      Table 4 ("Effect of Feedback on Belief of Winning"), column (1), the
      paper's main specification (equation 2), a regression discontinuity
      in the respondent-specific estimated net gain from the tax and
      dividend policy.  Among respondents who received the customized
      win/lose feedback, restricted to those whose estimated net gain is
      within EUR 50 per year of zero: a linear probability model of the
      belief after feedback (1 if the respondent believes they do not lose,
      0 if they believe they lose) on the predicted-winner indicator (the
      win feedback, which switches on when the estimated net gain exceeds
      zero), a quadratic in the estimated net gain, initial acceptance of
      the tax and dividend, and controls for incomes (piecewise
      continuous), socio-demographics and other motives.  This is the
      coefficient on the predicted-winner indicator.
  - description: initial_acceptance_believes_not_lose_table4_col1
    value: 0.306
    claim_type: coefficient
    standard_error: 0.066
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (1), Initial tax acceptance"
    context: >
      Table 4, column (1): the coefficient on initial acceptance of the tax
      and dividend (the answer when the policy was first presented, before
      any feedback) in the main feedback regression (estimated net gain
      within EUR 50 of zero; quadratic in the estimated net gain; income,
      socio-demographic and other-motive controls).
  - description: predicted_winner_believes_not_lose_full_sample_table4_col2
    value: 0.208
    claim_type: coefficient
    standard_error: 0.035
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (2), Predicted winner"
    context: >
      Table 4, column (2): the same regression as column (1) estimated on
      every respondent who received the win/lose feedback (no restriction
      on the estimated net gain).  Coefficient on the predicted-winner
      indicator.
  - description: predicted_winner_heterogeneity_table4_col3
    value: 0.246
    claim_type: coefficient
    standard_error: 0.064
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (3), Predicted winner"
    context: >
      Table 4, column (3): column (1) (estimated net gain within EUR 50 of
      zero) with heterogeneous treatment effects — the predicted-winner
      indicator interacted with initial tax acceptance, with being a
      Yellow Vests supporter (declared themselves part of or supporting
      the movement), and with the initial win/lose belief (whether the
      respondent initially thought they would not lose), the main effects
      of these, and the same controls plus the initial win/lose category.
      Coefficient on the predicted-winner indicator (the effect for the
      omitted groups).
  - description: initial_acceptance_heterogeneity_table4_col3
    value: 0.015
    claim_type: coefficient
    standard_error: 0.087
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (3), Initial tax acceptance"
    context: >
      Table 4, column (3), the heterogeneity regression: the main effect of
      initial tax acceptance.
  - description: yellow_vests_supporter_heterogeneity_table4_col3
    value: 0.019
    claim_type: coefficient
    standard_error: 0.058
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (3), Yellow Vests supporter"
    context: >
      Table 4, column (3), the heterogeneity regression: the main effect of
      being a Yellow Vests supporter.
  - description: winner_x_initial_acceptance_table4_col3
    value: 0.166
    claim_type: coefficient
    standard_error: 0.079
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (3), Predicted winner x Initial tax acceptance"
    context: >
      Table 4, column (3): the interaction of the predicted-winner
      indicator with initial tax acceptance — how much larger the effect
      of the win feedback is among respondents who initially accepted the
      tax and dividend.
  - description: winner_x_yellow_vests_supporter_table4_col3
    value: -0.151
    claim_type: coefficient
    standard_error: 0.069
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (3), Predicted winner x Yellow Vests supporter"
    context: >
      Table 4, column (3): the interaction of the predicted-winner
      indicator with being a Yellow Vests supporter — the paper's evidence
      that opponents of the tax discard favourable information.
  - description: winner_x_initial_win_belief_table4_col3
    value: 0.080
    claim_type: coefficient
    standard_error: 0.079
    unit: change in the probability of believing one does not lose (0/1 outcome)
    location: "Table 4, column (3), Predicted winner x G"
    context: >
      Table 4, column (3): the interaction of the predicted-winner
      indicator with the initial win/lose belief (initially believing one
