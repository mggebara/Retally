notes: >
  Headline findings (as published): French respondents, surveyed after the
  Yellow Vests protests, largely reject a carbon tax with a uniform
  dividend, overestimate their losses, think it regressive and doubt its
  effectiveness.  The customized win/lose feedback moves beliefs only
  modestly (Table 4: a regression discontinuity at zero estimated net
  gain; the effect is larger for those who initially accepted the tax and
  smaller for Yellow Vests supporters), while believing one does not lose
  (Table 6) or that the tax is effective (Table 8) raises support
  substantially.  DP58 (Rivers, Woerman & Yassin) confirms the average
  feedback effect, finds 56 misclassified treatment indicators (column 1
  falls to 0.216 when fixed) and argues the column 3 heterogeneity is
  misspecified; it does not examine Tables 5-8.

  Original analysis in R 4.0.3 (stargazer tables; ivreg / ivmodel for
  diagnostics), with a Python 2.7 microsimulation upstream; language: r is
  the reproduction target.

  Curation pass (2026-11-02).  Pinned 13 claims: all of Table 4 (the
  table I4R examined: nine coefficients with SEs and the column (1) N,
  757; column (2) N 1,968, the R2s and column (1)'s acceptance row in
  other columns are not pinned) and the two IV estimates the abstract
  rounds to "more than 50 p.p." and "more than 40 p.p." (Table 6 col 1,
  0.534; Table 8 col 1, 0.416).  Values exactly as printed in the
  published AEJ:EP PDF.  Every Table 4 column (1) and (3) value equals
  the meta-database's o_coeff / o_std_err (0.269/0.058, 0.246/0.064,
  0.015/0.087, 0.019/0.058, 0.166/0.079, -0.151/0.069, 0.080/0.079) and
  the package's tables/effect_feedback.tex.

  What was read.  The published PDF (all 32 pp. of the UvA copy:
  abstract, Sections III-IV, Tables 3-8); DP58 (19 pp., all tables); the
  66 meta-database rows; the package README, tables/effect_feedback.tex,
  papier.R sections 4.1.2, 5.1 and 5.2; the object lists of both RData
  workspaces (R in the retally-sandbox-r image); GitHub API commit list
  and repository metadata; openICPSR 128143's public landing page.

  Package-only facts (never in contexts).  The analysis loads
  after_preparation.RData (data frame s, 3,002 rows).  Table 4 (papier.R
  lines 202-243): lm(gagnant_feedback_categorie != 'Perdant' ~
  simule_gagnant + tax_acceptance + (taxe_approbation == 'NSP') + prog_na
  + Simule_gain + Simule_gain2 + taxe_efficace + single +
  hausse_depenses_par_uc + variables_demo + piecewise income percentiles
  of respondent and spouse with kinks at 20 and 70), data = s, subset =
  variante_taxe_info == 'f' & abs(simule_gain) < 50 (column 2 drops the
  gain restriction), weights = s$weight (survey weights; the paper never
  mentions them in Table 4).  Column 3 adds (gagnant_categorie !=
  'Perdant') * simule_gagnant + simule_gagnant * gj + simule_gagnant *
  tax_acceptance; column 4's outcome is gagnant_feedback_categorie ==
  'Gagnant'.  simule_gagnant is the feedback actually shown; simule_gain
  the estimated net gain (DP58's misclassification is simule_gagnant !=
  (simule_gain > 0) for 56 rows).  Table 6 col 1 (lines 264-282): a
  hand-rolled 2SLS — first stage lm(gagnant_cible_categorie != 'Perdant'
  ~ traite_cible * traite_cible_conjoint + cible + ...), second stage
  lm(taxe_cible_approbation != 'Non' ~ ... + non_perdant) on the fitted
  values, subset to respondent or spouse in income percentiles 10-60,
  weighted; the printed SE is the uncorrected second-stage OLS SE.  Table
  8 col 1 (lines 365-375): first stage lm(taxe_efficace == 'Oui' ~
  variables_reg_ee + apres_modifs + info_CC), second stage
  lm(taxe_approbation == 'Oui' ~ variables_reg_ee + taxe_efficace.hat),
  weighted, again with uncorrected SEs (the ivreg used for the effective
  F is unweighted).  variables_reg_ee uses Revenu / Revenu2 / spouse
  income quadratics and gagnant_categorie instead of the piecewise
  percentiles.

  Benchmark implications.  An independent run must recover the survey
  weights, the |estimated gain| < 50 window among feedback recipients and
  the long control list; the window and the feedback indicator are in the
  processed data, so the printed Table 4 values are reachable, and a run
  that rebuilds the indicator from the sign of the estimated net gain
  will land near DP58's corrected values instead.  A proper 2SLS for
  Tables 6 and 8 reproduces the coefficients but not the printed SEs,
  which are second-stage OLS SEs.

  Blind-mode caveat.  The paper's prose rounds several pinned values:
  "27 p.p." (Table 4 col 1), "15 p.p." (col 4), "from 27 p.p. to 41 p.p."
  and "less than 10 p.p." (col 3 combinations), "53 p.p." (Table 6 col 1)
  and "42 p.p." (Table 8 col 1).  The value-matching redactor may not
  catch percentage-point forms, so a blind run can see these to two
  digits.

  Mount caveat.  after_preparation.RData (kept: it is the processed data
  the analysis and DP58 use) carries the source of preparation.R's
  functions as srcrefs; the analysis script papier.R is not in it.
  after_papier.RData (withheld) held the formulas and stargazer tables.

  Left out.  Tables 1-3 and 5 (descriptive / first stages), Table 6 cols
  2-4 and Table 8 cols 2-3 (robustness), the appendix tables, and DP58's
  rdrobust and placebo estimates.
