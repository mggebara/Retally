notes: >
  Headline findings: women whose age put them at risk of marrying during
  the 1861-1863 interruption of the London Season were more likely to
  marry a commoner (Table 2 Panel A col 1, 0.005 (0.002) per percentage
  point of synthetic probability) and less likely to marry an heir
  (-0.004 (0.002)), and sorted less by family landholdings (col 3, 0.524
  (0.196) percentile ranks, which the text reads as a 31 percent
  reduction in sorting, the abstract's "30 percent"; col 4 -0.516
  (0.225); col 5 married down 0.009 (0.003)).  The abstract's "40
  percent" more peer-commoner intermarriage is not a Table 2 number.
  Never married, col 6, 0.002 (0.002), is insignificant.  Panel B
  (distance to London) 0.006 (0.002), -0.005 (0.002), 0.512 (0.213),
  -0.537 (0.221).  Ns: 644 baseline, 324 landholdings sample, 765
  marital-rates sample (Panel B: 484 / 260 / 565, not pinned).

  Curation pass (2026-11-09).  Pinned 13 claims from Table 2, values
  exactly as printed.  Cross-check against the meta-database: every
  o_coeff_dbl / o_std_err_dbl in the 70 Table 2 rows equals a printed
  Table 2 value (0.005/0.002, -0.004/0.002, 0.524/0.196, -0.516/0.225,
  0.009/0.003, 0.002/0.002, 0.006/0.002, -0.005/0.002, 0.512/0.213,
  -0.537/0.221).  Left out: Panel B columns 5-6 and the Panel B Ns
  (kept the entry at 13), the Distance coefficients, percent correct and
  dependent-variable means (summary statistics), the bootstrap-t
  p-values in brackets, Table 3's IV estimates (second-stage 0.39 /
  0.54 / -0.33 / -0.45 ... with first-stage F; a separate estimator, kept
  for a later pass), Tables 1, 4, 5 (descriptive / contingency /
  chi-squared), Section IV and every appendix table.

  Printed precision.  The package's outreg2 output (results/Table2_A.txt,
  Table2_B.txt, withheld from independent / blind mounts) prints the
  probit marginal effects at four decimals: Panel A col 1 0.0045
  (0.0021), col 2 -0.0036 (0.0017), col 5 0.0090 (0.0026), col 6 0.0021
  (0.0017); Panel B col 1 0.0062 (0.0025), col 2 -0.0047 (0.0018).  The
  paper rounds them to three decimals; 0.0045 printed as 0.005 sits at
  the half-unit edge of the printed-precision floor (the four-decimal
  figure is itself rounded), and Panel B col 1's SE 0.0025 prints as
  (0.002) in the paper but (0.003) in DP47.  The OLS columns are printed
  at the same three decimals in both.

  Paper vs package.  The Table 2 notes call the estimates "estimates of
  equations (2) and (3)" without saying "marginal effects"; the do-file
  runs probit ... cluster(byear) followed by margins, dydx(*) predict(pr)
  post, i.e. average marginal effects, which is how the text interprets
  them (and how Figure 6's notes describe the probit estimates).  The
  contexts say "marginal effect".

  Package-only facts (never in contexts).  Table 2 (programs/02_analysis/
  master-analysis.do, "TABLE 2"): use data/final-data.dta, keep if
  base_sample==1 (cols 1-5) or marital_rates_sample==1 (col 6);
  outcomes cOut (married a commoner), mheir, fmissmatch (|diff|),
  fmissmatch2 (husband - wife), fdown (married down: wife's family acres
  fATot > husband's sfATot), celibacy; treatment syntheticT; controls
  pr4 biorder hengpee; Panel B adds distlondon; probit / reg with
  cluster(byear) (21 birth-year clusters); probit columns report margins,
  dydx(*) predict(pr).  The bootstrap-t p-values come from
  programs/04_auxiliary/cgmreg.do (the hour-long small-cluster step).
  The analysis file carries the sample flags and the synthetic
  probability ready-made, so the dataprep chain (master-dataprep.do on
  the raw .txt sources) need not be re-run.

  What was read.  The published article (all 43 pp., Tables 1-5 in
  detail); DP47 in full; the 71 meta-database rows; README.pdf; the
  Table 2 section of master-analysis.do; the results/Table2 and Table3
  outputs; the strip-rule classification of the extracted package.

  What could not be verified.  The authors' Stata code and the analysis
  were not run (no Stata here, no independent R cross-check in this
  pass).  The thesis version's numbers were not compared.

  Original analysis in Stata (with ArcMap for the maps); language: r is
  the reproduction target.
