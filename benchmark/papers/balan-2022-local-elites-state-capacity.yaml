notes: >
  Headline findings: chief collection (Local) raised property tax
  compliance relative to state collectors (Central) by 0.023 (0.008)
  without time fixed effects (Table 4 col 1, N 28,872, 221 clusters) and
  0.032 (0.007) in the preferred specification with campaign-period
  fixed effects (col 2, N 27,764, 213 clusters, Central mean 0.063); 0.033
  (0.007) with house fixed effects (col 4) and 0.040 (0.008) excluding
  exempt properties (col 5, N 23,803).  Revenues: 79.640 (22.856) CF per
  property (col 2, Central mean 182.236, the abstract's 44 percent) and
  68.855 (20.560) with house fixed effects (col 4).  Chiefs collected
  more bribes at endline, 0.018 (0.009) (Table 5 Panel B, N 1,169, Central
  mean 0.014), made no more tax visits, -0.009 (0.026) (Table 6 col 1, N
  18,162, 209 clusters).  State collectors informed by chiefs (CLI) raised
  compliance by 0.024 (0.009) and revenue by 46.566 (21.200) CF (Table 7
  cols 1-2, N 20,636, 165 clusters).  In CLI, a one-point higher chief
  ease-of-payment rating goes with 0.056 (0.007) higher compliance (Table
  8 Panel A col 2, N 8,135, 80 clusters).

  Paper text and how it was verified.  The source is the AEA-typeset
  article (page proofs, pp. 1-36) on Weigel's website.  Its Tables 4-8
  were read cell by cell and each of the 129 non-empty meta-database rows
  was matched to the same table, row and column: every o_coeff_dbl /
  o_std_err_dbl equals the printed cell (Table 4 Panel B values rounded to
  two decimals in the database, e.g. 57.63 (25.69) for 57.627 (25.688),
  81.83 (38.59) for 81.830 (38.595)), apart from these database slips:
  Table 5 "Assigned high band" coded 0.300 (paper 0.030, SE 0.021 agrees);
  Table 5 "Responsiveness of government" coded -0.490 (paper -0.049, SE
  0.045 agrees); Table 7 col 2 coded 46.556 on one row (paper 46.566, the
  other two rows agree); Table 7 col 3 coded with SE -0.026 on two rows
  (paper -0.016 (0.028); -0.026 is the column 4 coefficient); and several
  Table 8 SEs carried at more digits on robustness rows (0.0211, 0.0125,
  0.0158, 0.00929; printed 0.021, 0.012, 0.016, 0.009).  The candidates
  file's PDF link is a different paper (see header).  An EGAP working
  paper copy (December 3, 2020, 121 pp. with appendix) was also read for
  online Appendix A2.5 (time fixed effects); its tables were not used.

  Curation pass (2026-11-09).  13 claims (2 counts).  Left out: Table 4
  column 3 (neighborhood-level collapse) and the other Panel B columns,
  the Table 4 cluster counts (the column 2 count is printed in output.tex's
  appendix-table notes, which the script-free copy keeps), Table 5's other
  rows (property assessments, midline bribes, government and tax views),
  Table 6 cols 2-4, Table 7 cols 3-6, Table 8's other cells
  (willingness to pay, predicted propensities in Local and Central), Table
  3 balance, Table 9 (incidence) and the online appendix.

  Package-only facts (never in contexts).  2_Data_Construction.do builds
  Data/03_clean_combined/analysis_data.dta from the registration roll,
  the tax payment receipts (taxes_paid = 1 for a matched receipt at least
  the assigned rate), the flier mail-merge, the midline survey and the
  randomization assignment; taxes_paid_amt = taxes_paid * rate; tmt 1
  Central, 2 Local, 3 CLI; a7 is the neighborhood (cluster) id;
  today_alt is the neighborhood's first tax-payment date, or its last
  registration date when no payment was recorded.  Table4.do: keep tmt
  1-3; egen time_FE_tdm_2mo_CvL = cut(today_alt), at(21355 21415 21475
  21532) (Stata dates 2018-06-20, 08-19, 10-18, 12-14); reg taxes_paid
  t_l i.stratum [i.house] [i.time_FE_tdm_2mo_CvL] if inlist(tmt,1,2)
  [& exempt!=1], cl(a7).  Table 5 endline bribe: endline_round1_noPII
  (tot_complete==1), bribe filled from bribe2a / bribe2b / bribe3, merged
  to neighborhood treatment, reg bribe_endline t_l i.stratum, cluster(a7).
  Table 6 uses the cut points 21355 21415 21475 21529 and visit_post_carto
  (0 if not visited or zero visits after registration).  Table 7:
  time_FE_tdm_2mo_CvCLI = cut(today_alt), at(21365.5 21425.5 21485.5
  21519); reg taxes_paid / taxes_paid_amt t_cli i.house i.stratum
  i.time_FE_tdm_2mo_CvCLI if inlist(tmt,1,3), cl(a7).  Table 8 col 2:
  reg taxes_paid pay_ease i.house i.stratum if t_cli==1, cluster(a7),
  pay_ease from chief_consultations.dta.  The do-files use lowercase
  "data/" paths while the folder is "Data/" (matters on a case-sensitive
  file system), and 0_Master.do's stem names "Updated October 2024".

  Blind-mode exposure (step 6, 2026-11-09).  Both modes reached
  llm_answer_pending at the generation prompt (the methodology-summary
  and hyperparameter extraction prompts were answered by hand with a
  results-free summary and an empty list).  The blind generation prompt
  states no pinned value or SE at printed precision or rounded to 1-3
  significant figures (the only hits are file sizes in the dataset
  listing, "23.1 KB", "21.0 KB") and carries no do-file text; the
  dataset listing names the .dta columns.  The abstract excerpt is the
  title and author line only.  The paper parser takes the page-1 running
  head ("American Economic Review 2022, 112(3): 1-36") as the title.
  Every context fits the generator's 600-character limit.

  What could not be verified.  The authors' Stata code was not run (no
  Stata here) and no independent R cross-check was made.  V1 (the version
  I4R used) was not compared with V3; the authors' CHANGES.txt says
  results are unchanged.  The CEPR first version's exact date was not
  read (403).

  Original analysis in Stata 14.2; language: r is the reproduction target.
