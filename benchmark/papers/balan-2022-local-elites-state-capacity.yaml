# Original paper: Balán, P., Bergeron, A., Tourek, G., & Weigel, J. L.
#   (2022). "Local Elites as State Capacity: How City Chiefs Use Local
#   Information to Increase Tax Compliance in the Democratic Republic of
#   the Congo." American Economic Review, 112(3), 762-797.
#   doi:10.1257/aer.20201159 (March 2022 issue; Crossref DOI created
#   2022-02-28, issued 2022-03-01).
#
# Reproduction report: I4R First Meta Database replication team 48 (130
#   rows under the paper title, one of them empty, entered 2023-08-02).
#   No I4R discussion paper was found for this report (EconStor / web
#   searches for the title with "I4R", 2026-11-09), so i4r_report_url
#   points at the meta-database's source repository.  Verdict:
#   reproducible, with caveats — the team's survey answer
#   (best_describe_compreprod) is "Analysis code produces the same output
#   as presented in the paper. However, the cleaning code fails to run or
#   produces different results from those presented in the paper"; the
#   run took 10-11 hours in Stata, the team rated it 4 of 10, and the one
#   row with perfect_reproduction "No" explains: "Additional Stata
#   packages needed to be downloaded (cibar, binscatter, ranktest).
#   Applying Stata labels produced minor errors. Opposite sign on one
#   coefficient estimates (Table 5, dependent variables Incorrect
#   Exemption)" (that row codes -0.012 as 0.012; not pinned here).
#   result_same is blank and coding_correction "Not done by replicators"
#   on every row.  All 129 non-empty rows are ROBUSTNESS variants against
#   main Tables 4-8: randomization inference (54 rows), baseline-respondent
#   subsample (35), controls plus that subsample (24), and ordered probit
#   (16, half of them also with controls and the subsample).  The
#   randomization-inference rows re-run the paper's own regression and
#   print its point estimate to 3-4 decimals (0.0322 for the printed
#   0.032).  Each rounds to the printed value in Tables 4, 6 and 7 and
#   Table 8 columns 1-4, and in Table 5 except the incorrect-exemption
#   sign flip; Table 8's predicted-propensity columns differ in the second
#   significant digit (0.0403 vs 0.039, 0.0428 vs 0.041, 0.0152 vs 0.016,
#   0.0381 vs 0.037; none pinned).  So the analysis data the package's
#   cleaning code builds reproduce every pinned cell.  Found from the
#   candidates file
#   (corpus/candidates-2026-11-07.md, row T48).
#
# Why this paper:
#   1. A neighborhood-cluster-randomized field experiment (356
#      neighborhoods of Kananga, DRC) with stratum fixed effects,
#      campaign-period fixed effects and neighborhood-clustered SEs, on
#      the universe of registered properties (administrative tax records)
#      plus household surveys.
#   2. The package ships NO analysis data: Data/02_intermediate and
#      Data/03_clean_combined are empty, so every number needs the long
#      cleaning chain (registration roll, tax payment receipts, flier
#      mail-merge, midline survey, randomization assignment) before any
#      regression.
#   3. A manually placed openICPSR package (data_access: manual), version
#      V3 (October 2025), which post-dates the I4R replication (see
#      dataset.access_notes).
#
# What original_claims pins: Table 4 (Local versus Central) compliance in
#   columns 1, 2, 4 and 5 and revenues in columns 2 and 4, with SEs, and
#   the column 1 and column 2 observation counts; Table 5 Panel B endline
#   bribe payment; Table 6 column 1 (visited by collector); Table 7 (CLI
#   versus Central) compliance and revenues; Table 8 Panel A column 2
#   (chief's ease-of-payment rating and compliance in CLI).  13 claims, 2
#   of them counts, values exactly as printed.
#
# Paper text: the published AER article as typeset by the AEA (page
#   proofs paginated 1-36 rather than 762-797, "American Economic Review
#   2022, 112(3): 1-36" on p. 1, InDesign footer dated 1/26/22), posted on
#   co-author Weigel's website.  Its main Tables 4-8 were compared cell by
#   cell with the meta-database: every row's o_coeff_dbl / o_std_err_dbl
#   equals the same table, row and column of this copy, except the
#   meta-database slips listed in notes.  The candidates file's PDF link
#   (jonathanweigel.com/s/weigel_et-al_collectors.pdf) is a DIFFERENT
#   paper (Weigel et al., "Supermodular Bureaucrats", June 2025); its "45
#   of 60" exact tokens were coincidental.

id: balan-2022-local-elites-state-capacity
i4r_report_url: https://github.com/I4Replication/I4R-First-Meta-Paper
# Target language for regeneration (the original is Stata 14.2 with
# estout, mmat2tex, geodist, winsor and other SSC packages; Retally
# generates R and reads the .dta files with haven).
language: r
outcome_label: reproducible
# Pipeline tuning is frozen; this is an evaluation paper.
split: holdout
# Contamination bookkeeping.  publication_date is the FIRST public
# version: CEPR Discussion Paper 15138 (RePEc lists 2020-08; a search
# snippet gives the title-page date as July 31, 2020; the CEPR PDF answers
# 403 to scripts, so the exact day was not read).  Later versions: EGAP
# working paper dated December 3, 2020 (egap.org, PDF created
# 2021-01-27) and a CEPR revision dated May 1, 2021.  The journal
# version: Crossref issued 2022-03-01 (DOI created 2022-02-28).
# package_release_date is the DataCite registration of the FIRST version
# of the package, doi:10.3886/E147561V1 (registered 2022-02-24T13:55:11Z,
# DataCite API 2026-11-09).  The pinned V3 (doi:10.3886/E147561V3) was
# registered 2025-10-29 and V2 on 2024-11-14; the openICPSR page itself
# needs a login.  The package README is dated October 21, 2021.
publication_date: "2020-07"
package_release_date: "2022-02-24"

paper:
  # The AEA-typeset published article on co-author Jonathan Weigel's
  # website (redirects to static1.squarespace.com); checked 2026-11-09:
  # 200 application/pdf, 243,824 bytes, 36 pp. (main text only; the
  # online appendix is not included), md5 a9e57a03b2b7422ec4fd3e2d3aabc958,
  # PDF title metadata the article title, CreationDate 2022-01-26.  The
  # AEA PDF itself is paywalled.
  source: https://jonathanweigel.com/s/balan-et-al_chieftaxation_aer_2022.pdf
  title: "Local Elites as State Capacity: How City Chiefs Use Local Information to Increase Tax Compliance in the Democratic Republic of the Congo"
  authors:
    - Pablo Balán
    - Augustin Bergeron
    - Gabriel Tourek
    - Jonathan L. Weigel

dataset:
  source: benchmark/manual-packages/T48/147561-V3.zip
  data_access: manual
  access_notes: >
    AEA Data and Code Repository on openICPSR, project 147561, version V3
    (doi:10.3886/E147561V3); login and terms-of-use click-through required,
    so the zip was downloaded by hand (2026-11-09) and placed unchanged at
    benchmark/manual-packages/T48/147561-V3.zip (46,038,471 bytes, md5
    4a061afd880035d6f914a1bbeaec8cb5; SOURCE.txt beside it).  Versions:
    V1 (registered 2022-02-24, the one I4R team 48 used in 2023), V2
    (2024-11-14) and V3 (2025-10-29).  The package's CHANGES.txt: "V2:
    Removed extraneous variables, leaves our results and correspondence
    with the paper unchanged" and "V3: Removed additional variables
    containing potential PII that were mistakenly included. Results and
    correspondence with paper remain unchanged."  V3 is the only version
    on disk; V1 and V2 were not compared, so the authors' statement that
    no result changed is unverified here.  Top folder "Replication
    Materials - Updated October 2025"; 116 zip entries (105 files), 532 MB
    uncompressed, no nested archives.  Contents: README.pdf (14 pp.,
    October 21, 2021; data list, software, run order, exhibit-to-program
    map with line numbers, no estimates); CHANGES.txt; output.tex (the
    LaTeX wrapper that \input's the generated tables, which are not
    shipped; it carries the main and appendix table captions and notes,
    no estimates, but its appendix-table notes state the Local-versus-
    Central cluster count, which is why that count is not pinned);
    Documents/ with three PNG illustrations (tax flier, neighborhood
    polygons, strata map), property_registration_path.pdf (an ArcMap map)
    and the paper's bibliography (.bbl); Data/01_base/admin_data/ with
    Stata .dta (registration_noPII 85 MB, taxroll_noPII,
    tax_payments_noPII, tax_payment_timing_noPII, fliers_campaign 40 MB,
    randomization_assignment, randomization_schedule, stratum,
    hh_distances, chief/collector rosters and others), three
    fliers_pilot_set*.xlsx mail-merge sheets and three .csv
    (property_values_MLestimates 24 MB, adjacent_neighborhoods,
    concessions_chefferies); Data/01_base/survey_data/ with the household
    baseline, midline (193 MB), endline round 1 and 2 and 2016-campaign
    endline surveys, chief and collector surveys as .dta and
    resident_info_quiz.csv; Data/02_intermediate and Data/03_clean_combined
    are EMPTY (the analysis files are built by the cleaning do-file);
    Dofiles/ with 0_Master.do, 1_Package_Setup.do, 2_Data_Construction.do
    (45 KB), 3_Main / 4_Appendix drivers, 53 per-exhibit do-files and a
    Stata swap file (~0_Master.do.stswp).  The script-free copy
    (independent / blind) withholds 58 files (benchmark.strip_rule
    .classify_tree on the extracted package, 2026-11-09): the 57 .do by
    suffix and the .stswp by content (Stata code).  Kept: README.pdf,
    CHANGES.txt, output.tex, the Documents/ files and all data, none of
    which prints a pinned value or SE.  Project page:
    https://www.openicpsr.org/openicpsr/project/147561/version/V3/view

original_claims:
  # ---- Table 4: Local versus Central, compliance and revenues ----
  - description: compliance_local_table4_panelA_col1
    value: 0.023
    claim_type: coefficient
    standard_error: 0.008
    unit: share of properties paying the property tax (0-1)
    location: "Table 4, Panel A (Compliance), Local, column (1)"
    context: >
      Table 4, Panel A, column (1).  OLS of equation (1): the Local
      coefficient (city chiefs collected; Central, state agents, is the
      excluded category) in a regression of an indicator that the
      registered property paid the 2018 property tax (payment records
      matched to the property register by tax ID) on the Local indicator
      and randomization stratum fixed effects; no time or house type
      fixed effects.  Sample: all registered properties in Local and
      Central neighborhoods.  Standard errors clustered by neighborhood.
  - description: compliance_local_table4_panelA_col2
    value: 0.032
    claim_type: coefficient
    standard_error: 0.007
    unit: share of properties paying the property tax (0-1)
    location: "Table 4, Panel A (Compliance), Local, column (2)"
    context: >
      Table 4, Panel A, column (2), the preferred specification: the
      Local coefficient with stratum fixed effects plus time fixed
      effects for waves of the campaign, no house type fixed effects,
      SEs clustered by neighborhood.  Per online Appendix A2.5 the time
      fixed effects are two-month periods beginning at the midpoint
      between the first days of the two arms compared (Local, Central)
      and ending at the midpoint between their last days; properties
      whose neighborhood falls outside them drop out.
  - description: compliance_local_house_fe_table4_panelA_col4
    value: 0.033
    claim_type: coefficient
    standard_error: 0.007
    unit: share of properties paying the property tax (0-1)
    location: "Table 4, Panel A (Compliance), Local, column (4)"
    context: >
      Table 4, Panel A, column (4): the column (2) regression (stratum and
      campaign-period time fixed effects) with house fixed effects added,
      i.e. dummies for the property value band (low-value versus
      high-value band, the two flat tax liabilities).  Same sample as
      column (2); standard errors clustered by neighborhood.  The entry is
      the Local coefficient.
  - description: compliance_local_exempt_excluded_table4_panelA_col5
    value: 0.040
    claim_type: coefficient
    standard_error: 0.008
    unit: share of properties paying the property tax (0-1)
    location: "Table 4, Panel A (Compliance), Local, column (5)"
    context: >
      Table 4, Panel A, column (5): the column (4) specification (stratum,
      campaign-period time and house fixed effects) excluding properties
      the collectors designated as exempt from the tax.  Standard errors
      clustered by neighborhood.  The entry is the Local coefficient.
  - description: revenue_local_table4_panelB_col2
    value: 79.640
    claim_type: coefficient
    standard_error: 22.856
    unit: Congolese francs per property
    location: "Table 4, Panel B (Revenues), Local, column (2)"
    context: >
      Table 4, Panel B, column (2): the column (2) specification (Local
      indicator, stratum fixed effects, campaign-period time fixed
      effects, no house fixed effects) with property tax revenue per
      property in Congolese francs as the outcome (the amount paid, zero
      for non-payers).  Same sample as Panel A column (2); standard errors
      clustered by neighborhood.  The entry is the Local coefficient.
  - description: revenue_local_house_fe_table4_panelB_col4
    value: 68.855
    claim_type: coefficient
    standard_error: 20.560
    unit: Congolese francs per property
    location: "Table 4, Panel B (Revenues), Local, column (4)"
    context: >
      Table 4, Panel B, column (4): revenue per property in Congolese
      francs on the Local indicator with stratum, campaign-period time
      and house (property value band) fixed effects.  Standard errors
      clustered by neighborhood.  The entry is the Local coefficient.
  - description: n_obs_table4_col1
    value: 28872
    claim_type: count
    unit: properties
    location: "Table 4, Observations, column (1) (both panels)"
    context: >
      Number of observations in Table 4, column (1): every registered
      property in the Local and Central neighborhoods (no time fixed
      effects, so none is dropped).
  - description: n_obs_table4_col2
    value: 27764
    claim_type: count
    unit: properties
    location: "Table 4, Observations, column (2) (both panels; column 4 has the same count)"
    context: >
      Number of observations in Table 4, column (2) (and column 4):
      registered Local and Central properties whose neighborhood falls
      within the campaign periods that define the time fixed effects.

  # ---- Table 5: mismanagement (bribes) ----
  - description: paid_bribe_endline_local_table5_panelB
    value: 0.018
    claim_type: coefficient
    standard_error: 0.009
    unit: share of respondents reporting a bribe payment (0-1)
    location: "Table 5, Panel B (Bribes), Paid bribe (endline), beta-hat and SE"
    context: >
      Table 5 ("Local versus Central: Mismanagement and Views of
      Government, Chiefs, and Taxes"), Panel B, row "Paid bribe
      (endline)".  OLS of equation (1) comparing Local and Central, with
      a self-reported indicator for having paid a bribe ("transport") to
      tax collectors, measured in the endline household survey (baseline
      respondents tracked in 2019), as the outcome, on the Local
      indicator and randomization stratum fixed effects; no time fixed
      effects and no house type fixed effects (endline outcome).
      Standard errors clustered by neighborhood.  The entry is the Local
      coefficient.

  # ---- Table 6: tax visits ----
  - description: visited_by_collector_local_table6_col1
    value: -0.009
    claim_type: coefficient
    standard_error: 0.026
    unit: share of properties visited (0-1)
    location: "Table 6, Local, column (1) Visited by collector"
    context: >
      Table 6 ("Local versus Central: Tax Visits"), column (1).  OLS of
      equation (1) with an indicator that the household reported (in the
      midline survey) any tax visit by collectors after the registration
      visit as the outcome, on the Local indicator with house type,
      randomization stratum and campaign-period time fixed effects;
      Local and Central properties.  Standard errors clustered by
      neighborhood.  The entry is the Local coefficient.

  # ---- Table 7: Central versus CLI ----
  - description: compliance_cli_table7_col1
    value: 0.024
    claim_type: coefficient
    standard_error: 0.009
    unit: share of properties paying the property tax (0-1)
    location: "Table 7, CLI, column (1) Compliance"
    context: >
      Table 7, column (1): the CLI coefficient (state collectors who
      consulted the chief on each owner's ability and willingness to pay
      before tax visits; Central excluded) in an OLS of the property tax
      payment indicator with house type, stratum and time fixed effects,
      the time fixed effects two-month campaign periods from the midpoint
      of the CLI and Central first days to the midpoint of their last
      days.  Sample: registered CLI and Central properties.  SEs
      clustered by neighborhood.
  - description: revenue_cli_table7_col2
    value: 46.566
    claim_type: coefficient
    standard_error: 21.200
    unit: Congolese francs per property
    location: "Table 7, CLI, column (2) Revenues"
    context: >
      Table 7, column (2): the column (1) specification with property tax
      revenue per property in Congolese francs as the outcome.  CLI and
      Central properties; standard errors clustered by neighborhood.  The
      entry is the CLI coefficient.

  # ---- Table 8: the value of chiefs' information ----
  - description: compliance_ease_of_payment_cli_table8_panelA_col2
    value: 0.056
    claim_type: coefficient
    standard_error: 0.007
    unit: change in the probability of payment per point of the chief's ease-of-payment rating
    location: "Table 8, Panel A (Ease of payment), Ease of payment, column (2) Compliance"
    context: >
      Table 8 ("The Value of Chiefs' Information"), Panel A, column (2).
      Within the CLI arm only, OLS of the property tax payment indicator
      on the chief's rating of the owner's ability to pay (ease of
      payment, on the three-point scale recorded on the property register
      during the chief consultation), with house type and randomization
      stratum fixed effects and no further controls.  Standard errors
      clustered by neighborhood.  The entry is the Ease of payment
      coefficient.

# All 129 non-empty meta-database rows are robustness variants (none is
# labelled a plain reproduction).  For every pinned coefficient the team's
# "Alternative Methods: Randomization Inference" row re-runs the paper's own
# regression and records its point estimate at more digits (randomization
# inference changes only the p-value), so that estimate is recorded as the
# reproduced value and rounds to the printed one.  The other rows against
# the same cells are different specifications (baseline-respondent
# subsample, added controls, ordered probit) and are quoted in notes, not
# recorded.  The two N claims have no row and carry no finding.
