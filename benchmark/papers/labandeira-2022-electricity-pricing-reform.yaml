# Original paper: Labandeira, X., Labeaga, J. M., & Teixidó, J. J.
#   (2022). "Major Reforms in Electricity Pricing: Evidence from a
#   Quasi-Experiment." The Economic Journal, 132(644), 1517-1541.
#   doi:10.1093/ej/ueab076 (first published online 2021-09-22).
#
# Reproduction report: no I4R Discussion Paper exists for this paper.
#   The I4R First Meta Database (replication team 49, University of
#   Calgary, five replicators; rows 2226-2248, entered 2023-09-12) is the
#   record.  Verdict: computationally reproducible with minor
#   discrepancies (computational_reproduction = 1, perfect_reproduction
#   = No).  why_not_perfect_repro: "There are minor changes at the third
#   decimal point in tables 4 and 5.  There is also a minor discrepancy
#   between the text and the code, though the values created are all the
#   same as the original paper's estimates."  Survey answer: "Analysis
#   and cleaning code produce the same output as presented in the paper"
#   (raw and final data, complete cleaning and analysis code; Stata, run
#   in under an hour).  The schema has no "minor discrepancies" label, so
#   outcome_label is reproducible (as for leeson-2022): every Table 2
#   number the team checked reproduces, and the discrepancies are
#   third-decimal changes in the quantile Tables 4-5 (not pinned) and
#   text-versus-code differences that the meta-database's "coding
#   correction" rows quantify (see i4r_replicator_findings).
#
# Why this paper:
#   1. A household-panel difference-in-differences with an IV variant
#      (LIML, three instruments, household fixed effects by
#      within-transformation) on the Spanish Household Budget Survey:
#      energy demand / IO, new to the catalog.
#   2. 22 paired meta-database rows, all on Table 2's treatment
#      coefficient (columns 2, 3, 4, 6, 7, 8).
#   3. A ready analysis file ships (.dta plus a .csv copy), so the
#      60-minute raw-data build is not needed; package on Zenodo, CC BY 4.0.
#
# Open text and version check (step 1).  The open text is the ACCEPTED
#   MANUSCRIPT dated 5 August 2021 (Diposit UB handle 2445/185932); the
#   package README says the code was "last run top to bottom on August 5,
#   2021", the same day.  Every Table 2 treatment coefficient and SE the
#   meta-database records as the published value (o_coeff_dbl /
#   o_std_err_dbl; 6 distinct coefficients, 6 SEs, 22 rows) is printed
#   identically in the manuscript, except one database typo: column 8 is
#   printed -0.089 and recorded -0.89 (o_coeff "-0.89", same SE 0.053,
#   o_p 0.095 consistent with -0.089/0.053); the printed -0.089 is pinned.
#   The other pinned values (columns 1 and 5 treatment, the two
#   price-elasticity rows, N and households) have no meta-database row;
#   they were verified against the package by an independent re-estimate
#   (see notes), which reproduces every one.
#
# What original_claims pins: Table 2's treatment (Reform T) coefficient
#   in all eight columns with SEs, the ln(price) coefficient of columns 1
#   and 3 with SEs, and the Table 2 observation and household counts.
#   12 claims.
#
# Leak check of the mount: the package ships no logs, no table output
#   (the do-files write .xls files that are not included), no manuscript
#   PDF; Readme.pdf documents data provenance and run order only (no
#   estimates).  The strip rule's suffix rule removes the three .do
#   files; nothing else carries results, so the strip rule is unchanged.

id: labandeira-2022-electricity-pricing-reform
i4r_report_url: https://github.com/I4Replication/I4R-First-Meta-Paper
language: r
outcome_label: reproducible
split: holdout
# Contamination bookkeeping.  First public version: IREA Working Paper
# 2018/28 (University of Barcelona), same title; the PDF carries no
# month, its PDF ModDate is 2018-12-11 and the IREA server's
# Last-Modified header is 2018-12-11 (checked 2026-11-02).  That WP
# already prints the OLS and fixed-effects columns of Table 2 (its
# columns 1-4 = the published columns 1, 3, 5, 7, same treatment
# values); the IV columns are new in the published version.  Accepted
# manuscript 2021-08-05; EJ online 2021-09-22 (Crossref published-online);
# print EJ 132(644), May 2022.  Package: Zenodo record 5423782, created
# and published 2021-09-03 (Zenodo API created / publication_date), one
# version (concept record 5423781).
publication_date: "2018-12"
package_release_date: "2021-09-03"

paper:
  # Accepted manuscript (5 Aug 2021, 36 pp.) in the University of
  # Barcelona repository Diposit UB, handle 2445/185932; the bitstream URL
  # redirects to /server/api/core/bitstreams/.../content.  Fetched
  # 2026-11-02: 200, %PDF, 1,100,346 bytes, to a Retally-curation user
  # agent.
  source: https://diposit.ub.edu/bitstreams/6883bfcc-fd5d-466e-adb7-52565ba562bd/download
  title: "Major Reforms in Electricity Pricing: Evidence from a Quasi-Experiment"
  authors:
    - Xavier Labandeira
    - José M. Labeaga
    - Jordi J. Teixidó

dataset:
  source: https://zenodo.org/records/5423782
  access_notes: >
    Zenodo record 5423782 (one version; concept 5423781), open access,
    CC BY 4.0: ONE file, "3 Replication package.zip" (558,082,125 bytes,
    md5 babd3effb22d2d5868344d0ad83f67c1; about 3.3 GB unpacked).  Not
    nested.  It holds a folder "3 Replication package/" with Readme.pdf
    (data provenance and run order; no estimates), dofiles/ (1_Raw
    data.do, 2_Dataset.do, "3_ Results TABLES.do"), "analysis data/"
    (data_to_run_DOFILE3.dta, 290 MB, and the same data as "Data_to
    run_DOFILE3.csv", 328 MB: 203,416 household-year rows, 2006-2015, 403
    columns) and "raw data/" (2.8 GB: the INE Household Budget Survey
    user files "Fichero de usuario de gastos/hogar a2006-a2015.txt" and
    the purchased panel-link files enlace*.TXT, all fixed-width text).
    No logs, no table output (do-file 3 writes outreg2 .xls files that
    are not shipped), no paper PDF.  The script-free copy removes the
    three .do files only.  Download through the project's downloader
    took about 5 minutes (2 MB/s).

code_repo:
  url: https://zenodo.org/records/5423782

original_claims:
  # ---- Table 2: consumption columns ----
  - description: reform_consumption_ols_col1
    value: -0.178
    claim_type: coefficient
    standard_error: 0.027
    unit: log points of annualised household electricity consumption (kWh)
    location: "Table 2, column (1), Reform (T)"
    context: >
      Table 2 ("Effect of the Reform on Residential Electricity
      Consumption and Expenditure (2011-2014)"), column (1), row Reform
      (T): the paper's difference-in-differences estimate of the August
      2013 Spanish electricity pricing reform (fixed charge raised,
      regulated volumetric rate cut) on household electricity
      consumption, estimated by OLS.  Data: Spanish Household Budget
      Survey households interviewed between August 2011 and April 2014,
      each interviewed twice, in the same two-week period of two
      consecutive years; the control group has both interviews before
      the reform, the treated group its second interview after it.  T is
      the post-reform dummy for interviews whose electricity bill falls
      under the reform (the paper places the response one month after
      the reform, when households receive a reformed bill).  Dependent
      variable: log of electricity consumption in the month before the
      interview (kWh, annualised by the survey).  Regressors: T, log
      household price per kWh (expenditure divided by consumption), log
      income and its square, months since reform, and controls for
      household size, number of rooms, dwelling surface, elderly members,
      education of the household head, household economic situation
      (number of economically active members), renting, building older
      than 25 years, municipality-size dummies, urban area, province
      capital, regional dummies, quarterly dummies and year fixed
      effects.  No household fixed effects.  Standard errors clustered
      at the household level.
  - description: reform_consumption_iv_col2
    value: -0.123
    claim_type: coefficient
    standard_error: 0.026
    unit: log points of annualised household electricity consumption (kWh)
    location: "Table 2, column (2), Reform (T)"
    context: >
      Table 2, column (2), row Reform (T): the column (1) consumption
      regression with the log electricity price instrumented by the
      households' effective prices (expenditure divided by quantity) of
      potatoes, water and fuel, estimated by limited-information maximum
      likelihood (LIML); year fixed effects and controls, no household
      fixed effects, standard errors clustered at the household level
      according to the table note.
  - description: reform_consumption_fe_col3
    value: -0.154
    claim_type: coefficient
    standard_error: 0.028
    unit: log points of annualised household electricity consumption (kWh)
    location: "Table 2, column (3), Reform (T)"
    context: >
      Table 2, column (3), row Reform (T): the column (1) consumption
      regression estimated with household fixed effects (LSDV / within
      estimator), year fixed effects and the same controls; standard
      errors clustered at the household level.  The paper's main
      estimate of the reform's effect on consumption once unobserved
      household heterogeneity is controlled for.
  - description: reform_consumption_fe_iv_col4
    value: -0.123
    claim_type: coefficient
    standard_error: 0.054
    unit: log points of annualised household electricity consumption (kWh)
    location: "Table 2, column (4), Reform (T)"
    context: >
      Table 2, column (4), row Reform (T): the household fixed-effects
      consumption regression of column (3) with the log electricity price
      instrumented by the effective prices of potatoes, water and fuel
      (LIML), the paper's preferred specification.  The table note
      states robust standard errors clustered at the household level.
  # ---- Table 2: expenditure columns ----
  - description: reform_expenditure_ols_col5
    value: -0.156
    claim_type: coefficient
    standard_error: 0.027
    unit: log points of annualised household electricity expenditure (EUR)
    location: "Table 2, column (5), Reform (T)"
    context: >
      Table 2, column (5), row Reform (T): the column (1) OLS
      specification (same sample, regressors, controls, quarterly
      dummies and year fixed effects, household-clustered standard
      errors) with the log of household electricity expenditure as the
      dependent variable.
  - description: reform_expenditure_iv_col6
    value: -0.090
    claim_type: coefficient
    standard_error: 0.027
    unit: log points of annualised household electricity expenditure (EUR)
    location: "Table 2, column (6), Reform (T)"
    context: >
      Table 2, column (6), row Reform (T): the column (2) IV (LIML)
      specification, log price instrumented by the effective prices of
      potatoes, water and fuel, no household fixed effects, with log
      electricity expenditure as the dependent variable.
  - description: reform_expenditure_fe_col7
    value: -0.098
    claim_type: coefficient
    standard_error: 0.028
    unit: log points of annualised household electricity expenditure (EUR)
    location: "Table 2, column (7), Reform (T)"
    context: >
      Table 2, column (7), row Reform (T): the column (3) household
      fixed-effects specification with log electricity expenditure as the
      dependent variable; household-clustered standard errors.
  - description: reform_expenditure_fe_iv_col8
    value: -0.089
    claim_type: coefficient
    standard_error: 0.053
    unit: log points of annualised household electricity expenditure (EUR)
    location: "Table 2, column (8), Reform (T)"
    context: >
      Table 2, column (8), row Reform (T): the column (4) household
      fixed-effects IV (LIML) specification with log electricity
      expenditure as the dependent variable; the paper's preferred
      expenditure estimate (significant at the 10% level in the table).
  # ---- Table 2: price coefficients ----
  - description: price_elasticity_consumption_ols_col1
    value: -1.044
    claim_type: coefficient
    standard_error: 0.024
    unit: elasticity of consumption with respect to the kWh price
    location: "Table 2, column (1), ln(price kWh)"
    context: >
      Table 2, column (1), row ln(price kWh): the coefficient on the log
      household price per kWh (all taxes included) in the OLS consumption
      regression of reform_consumption_ols_col1.
  - description: price_elasticity_consumption_fe_col3
    value: -1.026
    claim_type: coefficient
    standard_error: 0.025
    unit: elasticity of consumption with respect to the kWh price
    location: "Table 2, column (3), ln(price kWh)"
    context: >
      Table 2, column (3), row ln(price kWh): the log-price coefficient in
      the household fixed-effects consumption regression of
      reform_consumption_fe_col3.
  # ---- Table 2: sample ----
  - description: n_obs_table2
    value: 20872
    claim_type: count
    unit: household-year observations
    location: "Table 2, Observations"
    context: >
      Number of observations in the Table 2 regressions (the same in all
      eight columns): household-interview observations of the 2011-2014
      panel with complete data on the regression variables.
  - description: n_households_table2
    value: 10729
    claim_type: count
    unit: households
    location: "Table 2, Number of id (columns 3, 4, 7, 8)"
    context: >
      Number of households (the "Number of id" row) in the household
      fixed-effects columns of Table 2.

# No I4R Discussion Paper; the meta-database's 22 paired rows (team 49)
# are all robustness or coding-correction variants of Table 2's
# treatment coefficient, none a plain re-run.  The team's verdict is that
# the package reproduces the printed estimates ("the values created are
# all the same as the original paper's estimates"), so each finding
# below records the printed value as reproduced (outcome matches) and
# lists the variant rows in its note.  The "coding correction" rows are
# the text-versus-code discrepancy: re-running the code as the paper
# describes it (household-clustered SEs in columns 4 and 8; quarterly
# dummies in the IV columns 2 and 6) — reported here, not taken as the
# reproduced value, because the replicators classed the paper
# computationally reproducible.
i4r_replicator_findings:
