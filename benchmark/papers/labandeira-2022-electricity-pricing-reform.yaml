notes: >
  Headline findings (as published): after Spain's August 2013 reform,
  which more than doubled the fixed (capacity) charge and cut the
  regulated volumetric rate, treated households cut electricity
  consumption (about 15% with household fixed effects, 12% in the
  preferred FE-IV column) and electricity expenditure (about 9-10%),
  i.e. they responded to the higher average price rather than the lower
  marginal price, and the reform lowered rather than raised revenue.
  Tables 3-5 (2013 cross-section, quantile regressions) and the
  progressivity indices are not pinned.

  Pinned values (package-only facts kept here): Table 2 treatment
  coefficient and SE in columns 1-8: -0.178 (0.027), -0.123 (0.026),
  -0.154 (0.028), -0.123 (0.054), -0.156 (0.027), -0.090 (0.027), -0.098
  (0.028), -0.089 (0.053); ln(price kWh) column 1 -1.044 (0.024), column
  3 -1.026 (0.025); Observations 20,872 in every column; Number of id
  10,729.  Left out: ln(income), its square and months-since-reform rows,
  the constants, R-squared, and the IV diagnostics (first-stage F,
  Kleibergen-Paap, Cragg-Donald, Montiel-Pflueger, Sargan, Hansen).

  Independent cross-check (not the package code: numpy least squares
  with household-clustered sandwich SEs on data_to_run_DOFILE3.dta,
  complete cases of the column 1 variables among rows with a non-missing
  treatment dummy).  N = 20,872, households 10,729 (10,143 with two
  observations).  Column 1: T -0.1779 (0.0268), ln price -1.0445
  (0.0245), ln income 0.3961, its square -0.0283, months since reform
  0.0202; column 3 (within, clustered): T -0.1536 (0.0279), ln price
  -1.0262 (0.0251); column 5: T -0.1563 (0.0269), ln price -0.0492;
  column 7: T -0.0984 (0.0278), ln price -0.0268.  Every printed value of
  columns 1, 3, 5, 7 is reproduced at the printed precision.  The IV
  columns (2, 4, 6, 8) were not re-estimated; their treatment
  coefficients and SEs equal the meta-database's published values.

  Package-only facts (never in contexts).  "3_ Results TABLES.do" opens
  "data.dta" from a hard-coded Windows path (the shipped file is
  data_to_run_DOFILE3.dta); it needs ivreg2, weakivtest, outreg2, univar,
  progres (ssc).  Treatment is TT202 (= 1 for second interviews after
  two-week period 202, i.e. from the October 2013 interviews on;
  missing for first interviews in that window); outcome lnc_ele /
  lng_ele; price lnPRE = log kWh price minus a household-specific
  Stone-type price index IP (a real price — the paper does not say so);
  lny is deflated the same way; dist = months since reform, coded 0 for
  every untreated observation (the meta-database's "recoded negative"
  rows change this).  2_Dataset.do trims consumption and kWh price to
  their 1st-99th percentiles (not stated in the paper).  Column 1: reg
  ... i.TAMAMU i.CCAA CAPROV NMIEMB NHABIT SUPERF i.ESTUDRED
  i.SITUACTHOG_j mayores alqui urban edif25 i.year i.trim, vce(cluster
  id) — i.ESTUDRED abbreviates the data's ESTUDREDSP; e(sample) defines
  sample1 and the data are then kept to it.  Columns 3/7: xtreg ..., fe
  vce(cluster id).  Columns 2/6: ivreg2 ... (lnPRE = lnPRE_aguav_
  lnPRE_papas_ lnPRE_gascar_) with dummies itam2-5, iccaa2-19,
  iestud2-4, isitu2-3, iyear7-9, cluster(id) liml nocons — NO quarterly
  dummies and no constant, although the paper says every column has
  quarterly dummies (the meta-database's coding-correction rows add
  them: -0.170 / -0.204).  Columns 4/8: ivreg2 on hand-demeaned (w*)
  variables with r first liml nocons — heteroskedasticity-robust, NOT
  household-clustered, although the table note says clustered (the
  coding-correction rows cluster: SE 0.076 / 0.075); the demeaned
  regressors omit the province-capital, rooms, surface, urban,
  municipality-size, region and quarter terms.  A reproduction that
  follows the paper's text will therefore tend to miss columns 2 and 6
  (quarter dummies move the coefficient) and the SEs of columns 4 and 8.

  What was read.  The accepted manuscript (all 36 pp.; Table 2 and its
  note, Sections 2-3); the IREA WP 2018/28 (Table 2 and abstract, for
  the contamination dates); the Zenodo API record; the package listing,
  Readme.pdf, do-file 3 (Tables 1-7) and the variable construction in
  do-file 2 (price index, trimming, months since reform, treatment);
  the analysis .dta (columns, summaries); the meta-database's 23 team-49
  rows (one empty).  Not read: do-file 1 (raw-data build) beyond its
  role in the README; the raw .txt files.

  What could not be verified.  The published EJ typeset version (OUP
  refuses scripts): pinned values are from the accepted manuscript,
  which matches every meta-database published value and the package
  re-estimate.  The IV columns were not re-run independently.  The
  do-files were not run.

  Original analysis in Stata 14 (three do-files); language is r, the
  reproduction target.
