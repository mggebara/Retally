notes: >
  Headline findings (+/-45-month column (3), N 1214 / 1222 / 1203 in
  Table 3 and 1133 / 1203 / 1137 / 1133 in Table 4): crossing the age
  threshold cuts days outside last week by -1.090 (0.180), raises being
  under curfew by 0.708 (0.045) and never going out by 0.297 (0.036);
  the mental distress index rises 0.205 (0.094) SD, the somatic index
  0.175 (0.085), the nonsomatic index 0.158 (0.092), and the SRQ-20 sum
  0.734 (0.440) "yes" answers.

  Paper text and how it was verified.  The published article was not
  read: the AEA page labels it "Complimentary", but pubs.aeaweb.org
  answers scripts with a Cloudflare challenge, and docs.iza.org (the
  candidates file's link) answers 403; neither was bypassed.  The source
  is IZA DP 14281 (April 2021) from the Bonn legal-deposit server.  Its
  Table 3 and Table 4 were read cell by cell and compared with the 28
  meta-database rows as the same table, row and column (3) (+/-45):
  every row's o_coeff_dbl / o_std_err_dbl names one of the seven column
  (3) cells, and all seven equal the WP cell: Table 3 days outside
  -1.09 (0.180), under curfew 0.708 (0.045), never goes out 0.297
  (0.036); Table 4 mental distress index 0.205 (0.094), somatic 0.175
  (0.085), nonsomatic 0.158 (0.092), SRQ-20 sum 0.734 (0.440).  The WP
  prints the days-outside estimate as "-1.09"; DP16 Tables 1-2 print
  -1.090, and the authors' table code formats coefficients to three
  decimals, so the value is pinned as -1.090 (numerically the same).
  Two DB variants are DP16 transcription slips, not different
  published values: rows coded -1.089 (0.179) and 0.708 (0.044) come
  from DP16 Table 3 column (1) (the rdrobust table), whereas DP16
  Tables 1 and 2 column (1), described identically as "a reproduction of
  the results presented in Table 3, Column 3", print -1.090 (0.180) and
  0.708 (0.045) as the WP does.  One more DB slip: the no-covariates row for
  the nonsomatic index codes r_std_err 0.100 where DP16 Table 5 prints
  0.125 (r_coeff 0.100 is right).
  The three N claims have no I4R row.  They are pinned because the WP is
  a late revision of the published paper: the published online appendix
  is dated April 6, 2021 (web search result for the AEA materials page,
  not opened), the WP was created April 9, 2021; DP16 quotes the
  published pp. 334-335 mental-health paragraph and cites footnote 30
  (p. 329) on the uniform kernel, and the WP's own paragraph and footnote
  30 read the same; and the package data reproduce exactly the WP's N for
  all seven column (3) outcomes.

  Independent check of the data (2026-11-09, numpy least squares with
  Stata's CR1 cluster correction, no Stata here).  With survey
  non-respondents dropped and listwise deletion on the controls, the
  column (3) regressions give days outside -1.090 (0.180) N 1214, under
  curfew 0.708 (0.045) N 1222, never out 0.297 (0.036) N 1203, SRQ-20
  sum 0.734 (0.440) N 1133, 91 birth-cohort clusters: the published
  values exactly.  The three indices came out at 0.214 (0.097), 0.173
  (0.085) and 0.147 (0.093) with an inverse-covariance index computed on
  the control group and re-standardised (N 1133 / 1203 / 1137 exact);
  other weightings gave 0.08-0.16, so the index claims depend on
  matching the Anderson construction, which the package's missing
  _gweightave2.ado would have fixed.

  Curation pass (2026-11-09).  10 claims.  Left out: the +/-17, +/-30
  and +/-60 columns (bandwidth robustness inside the main tables), the
  p-values and sharpened q-values, the control group means, Table 3/4
  remaining N rows, Tables 1-2 (summary statistics), Table 5 (channels;
  the abstract calls labor market and conflict effects not robust) and
  Table 6 (policy support), and the appendix.

  Package-only facts (never in contexts).  1 Tables.do: keep if
  non_response==0; global contr "month_* province_n_* i.ethnicity
  i.education female i.survey_taker_id"; vce(cluster modate); xi: reg y
  before1955 di1* $contr if inrange(dif,-45,45) (di1, di1_i the linear
  running-variable terms on each side; dif the running variable in
  months); indices egen z_depression / z_somatic / z_nonsomatic =
  weightave2(list), normby(controldummy) with controldummy = before1955==0,
  then set missing if any component item is missing; sum_srq =
  rowtotal(list1), missing if any item missing.  Outcomes outside_week,
  under_curfew, never_out.  estout cells b(fmt(%9.3f)) se(par).

  Blind-mode exposure (step 6, 2026-11-09).  Both modes reach
  llm_answer_pending with the manual package mounted (17 files
  stripped).  The blind generation prompt (reached by answering the
  methodology and hyperparameter prompts with results-free text) states
  no pinned value or SE at printed precision or rounded to 2-3
  significant figures and carries no script text; its only numeric
  near-hit is the abstract's "approximately 0.2 standard deviation".
  The dataset listing shows the .dta column names and Stata variable
  labels (e.g. the treatment dummy's label "born before December
  1955"), no estimates.  The paper text given to the methodology
  summariser carries the WP's rounded in-text results (1-1.1 days, 71
  and 30 percentage points, 0.21 / 0.18 / 0.16 SD, 0.7); the summariser
  is told to leave results out, and the README's blind-mode caveat
  covers this.  The parser takes the IZA cover line ("DISCUSSION PAPER
  SERIES") as the title.

  What was read.  IZA DP 14281 pp. 1-17, Tables 3-4 and Appendix B; DP16
  in full; the 29 meta-database rows; the package README and the Tables
  3-4 block of 1 Tables.do, the headers of every other script; the
  DataCite records of E131981V1 and E183165V1; the strip-rule
  classification of the extracted package.

  What could not be verified.  The published article and its online
  appendix were not read (Cloudflare challenge).  That the re-deposit's
  analysis file is byte-identical to the authors' own package (openICPSR
  131981, login) was not checked; it reproduces the published numbers.
  The authors' Stata code was not run (no Stata here).

  Original analysis in Stata 17 (estout, fsum, _gweightave2.ado) with R
  for appendix figures; language: r is the reproduction target.
