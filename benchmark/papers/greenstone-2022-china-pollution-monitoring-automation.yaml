# Table 2 Panel A).  As in goni-2022 and molina-garzon-2022, the findings
# record the paper's value under that blanket verdict and quote one of the
# meta-database's robustness rows in the note; no DB row is a plain
# recomputation.
i4r_replicator_findings:
  - claim_id: 0
    reproduced_value: 34.7
    outcome: matches
    notes: DP113 Sec. 2 blanket (estimates identical); DB rows are variants, e.g. nearest-station weather 34.8 (10.7) DP Table 2 Panel b.
  - claim_id: 1
    reproduced_value: 34.9
    outcome: matches
    notes: DP113 Sec. 2 blanket; DB rows are variants, e.g. nearest-station weather 34.7 (5.8), DWA weather 30.9 (6.1) DP Table 2.
  - claim_id: 2
