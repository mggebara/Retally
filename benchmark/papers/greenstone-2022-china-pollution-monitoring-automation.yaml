notes: >
  Headline findings: reported PM10 jumped at automation by 34.9 (5.8)
  ug/m3 with station FE, month FE and weather controls (Table 1 Panel A
  col 2; 34.7 (10.7) without; the text's "35 percent" relative to the
  post-automation mean of 99.5), 27.5 (9.8) in Wave 1, 64.7 (9.9) in Wave
  2 and 57.1 (8.6) in deadline cities, with no jump in satellite AOD
  (-0.005 (0.021), col 2).  Event study (Panel B) 1-2 months after
  automation: 60.3 (11.0) deadline sample with month FE, 31.4 (11.1) with
  year-month FE, 66.5 (14.3) matched, 0.24 (0.09) log PM10 matched; N
  176,426 in cols 1-2.  Searches (Table 2 Panel A col 2): face masks 11.03
  (1.66), air filters 8.73 (1.86).

  Paper text and how it was verified.  The published AER: Insights
  article could not be read (paywalled; no open repository copy reachable
  from scripts, see the header).  The catalog source is NBER WP 27502
  (July 2020).  Its Table 1 equals the published Table 1 in every printed
  number checked: all 10 Panel A coefficients and SEs, the Obs. and
  Bandwidth rows, all 35 Panel B coefficients with SEs and the Panel B
  Obs. row are identical to DP113's "Panel a. Original" blocks (DP Table 2
  and Table 4; token-by-token comparison of the extracted text, 2026-11-09),
  which the DP labels as the original paper's Table 1 (the DP block also
  prints a Constant row the WP omits), and
  every pinned value / SE equals a meta-database o_coeff_dbl /
  o_std_err_dbl row (34.7/10.7, 34.9/5.8, 27.5/9.8, 64.7/9.9, 57.1/8.6,
  -0.005/0.021, 60.3/11.0, 31.4/11.1, 66.5/14.3, 0.24/0.09, 11.03/1.66,
  8.73/1.86).  The WP's Table 3 is the published Table 2: columns 1-2 of
  Panel A are identical to DP Table 7 Panel a (10.10, 11.03, 7.36, 8.73,
  1.06, 1.15, 0.18, 0.16 with SEs), but columns 3-4 (normal vs
  manipulating cities) differ from the published values (WP 7.18 / 15.43
  for face masks vs published 6.46 / 18.77), so the published version
  changed the manipulating-city split; those columns are not pinned.  The
  R-squared row differs only in rounding (WP 0.34, DP 0.3).  The WP's
  Table 2 (city characteristics) is not a main table of the published
  article.  The contexts use the WP's wording; the published table titles
  are taken from DP113 ("Automating Air Quality Monitoring System and
  Avoidance Behaviors" for Table 2).  The claim text writes the
  pollutant as "PM₁₀" (Unicode subscript digits) and the descriptions as
  "pm": the leak checks read "PM10" as a stated "10", which is the
  one-figure rounding of several pinned values and SEs (9.8, 9.9, 10.7,
  11.03).

  Curation pass (2026-11-09).  13 claims.  Left out: Panel A columns 1,
  3-5 of the AOD row (placebo nulls; column 2 kept), the Obs. / Bandwidth
  rows (data-driven bandwidths), the pre-period event-study coefficients,
  the 3-4 / 5-6 / 7-12 months after coefficients, Table 2 columns 1, 3, 4
  and the log-search rows, Table 2 Panel B (search event study; the
  meta-database's SE column for it holds p-value-like numbers such as
  1.56e-05), and all appendix tables.

  Package-only facts (never in contexts).  Code/Tables.do, "Table 1A":
  station_day_1116 = pollution_1116.dta merged 1:1 with weather_1116.dta
  on station_n date, then station_list.dta on pm10_n (Prepare_Data.do
  step 1); T = date - auto_date; reghdfe pm10 wind_speed rain temp rh,
  absorb(pm10_n month) res(); rdrobust <y> T, c(0) p(1) q(2) kernel(tri)
  vce(cluster code_city) masspoints(off) — col 1 on raw pm10 restricted to
  non-missing weather, cols 2-5 on the residual, col 3 phase==1, col 4
  phase==2, col 5 auto_date==19359 | 19724 (2013-01-01 / 2014-01-01).
  AOD row on station_month.dta (station-month means of the daily file
  merged with aod_month.dta, running variable n_month).  Obs. is
  e(N_h_l)+e(N_h_r), bandwidth floor(e(h_l)).  "Table 1B": years
  2012-2013, deadline stations, treat = auto_date==19359, period dummies
  m712/m56/m34 before (Jan-Jun, Jul-Aug, Sep-Oct 2012), m12/m34/m56/m712
  after (2013), reference Nov-Dec 2012; reghdfe pm10 treat_m*
  wind_speed rain temp rh, absorb(pm10_n month) or absorb(pm10_n
  year_month), vce(cluster code_city).  Matching (did_ddl_match.dta):
  geonear each Wave 1 deadline station to its nearest Wave 2 deadline
  station (ellipsoid), keep pairs within 400 km, joinby so control
  stations repeat (the 400 km cap is not in the paper).  "Table 2A":
  search_city_month.dta = city-day means of station_day_1116 merged with
  mask_filter_search.dta, averaged by code_city x n_month (months from
  automation); reghdfe pmmask / filter on weather, absorb(code_city
  month), rdrobust on the residual over n_month with the same options.
  Columns 3-4 use a city RD flag built in Prepare_Data.do from
  city-by-city RDs.  The neural-net PM10 correction (brain.ado) is
  appendix-only.  README states Stata/MP 15, 10-40 minutes.

  Blind-mode exposure (step 6, 2026-11-09).  The blind generation prompt
  states no pinned value or SE at printed precision.  It does carry the
  abstract's first 500 characters, which say reported PM10 "increased by
  35%" — a percentage of the post-automation mean, not the pinned
  coefficient, but numerically the two-figure rounding of the headline
  34.9 (and of 34.7); the README's blind-mode caveat covers this.  The
  paper parser takes the WP cover line "NBER WORKING PAPER SERIES" as the
  title.

  What was read.  NBER WP 27502 in full through the main tables (pp.
  1-22), the BFI WP title pages; DP113 in full; the 271 meta-database
