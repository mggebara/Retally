  - claim_id: 3
    reproduced_value: 64.7
    outcome: matches
    notes: DP113 Sec. 2 blanket; DB rows are variants, e.g. nearest-station weather 67.4 (10.8) DP Table 2 Panel b.
  - claim_id: 4
