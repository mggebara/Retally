notes: >
  Headline findings: in the communication rounds of a public goods game,
  health officials in decentralized Honduran municipalities contribute
  more than those in centrally administered ones (Table 2 col 2
  interaction 0.76 (0.38); col 1 Decentralized 0.83 (0.23); N 1,980
  participant-rounds), and decentralization is associated with more
  cross-level ties, especially friendships (Table 3 Strong Ties Full
  Model 1.07 (0.31); N 231 base, 226 full).

  Curation pass (2026-11-06).  Pinned 12 claims: Table 2 Decentralized
  and Communication in both columns, the column 2 interaction and N;
  Table 3 Decentralized in all four columns with SEs, and the two Ns.
  Values exactly as printed in the Early View PDF (2 decimals).
  Cross-check against the meta-database: the seven paired rows'
  o_coeff / o_std_err round to the printed values (0.826 (0.226), 2.541
  (0.214), 0.409 (0.302), 2.023 (0.317), 0.762 (0.380), 0.240 (0.144),
  1.074 (0.314)).  Left out: Table 1 (weighted descriptive statistics),
  the Table 2 controls, R-squared and AIC, the Table 3 controls,
  constants and BIC, the text's raw communication-round means (7.9 vs
  6.7 lempiras), Figure 3-4 predictions and every SI table.

  Paper vs package.  Table 2's note says "robust standard errors"; the
  do-file runs reg with [pweight = weights_games_full_scaled],
  vce(cluster publicid), i.e. SEs clustered by participant (220
  clusters in the estimation sample).  Heteroskedasticity-robust SEs
  without clustering would differ; the contexts repeat the paper's
  wording.  Table 3's printed "0.22 = †" in the All Ties Base column is
  a typesetting artefact (the coefficient is 0.22, significant at 10 %).

  Package-only facts (never in contexts).  Table 2 (do-file):
  publicgoodgame_dataAug27.dta; contribution on decentralized i.p_type
  communication round lag_groupcontribution num_players knownpeople
  Q2_female Q1_Edad Q2_Educacion Q3_YrsSalud Q5_Trust1Base, column 2
  with i.decentralized##i.communication; pweights
  weights_games_full_scaled; clustered by publicid.  p_type is numeric
  1-4 with the mayor's office (A / M) as base.  The file has 2,257 rows
  (some contribution codes negative, dropped by the R script's Table 1
  code; the regression's listwise deletion and the lag drop round 1).
  Table 3 (R): clanalysis_anondata_vNov16.csv; glm(family = poisson,
  weights = weights_games_full_scaled) of net_crosslevel_propnumknown /
  net_crosslevel_propnumfriends with offset(log(net_crosslevel_propdenom*)),
  full models adding Mujer, Q2_Educacion, Q1_Edad, Q3_YrsSalud,
  gen_trust, Participant_C, Participant_G, Participant_R; SEs from the
  script's clse.f (CR1 clustered by publicid_muni), passed to texreg.
  LEAK SURFACE: the game .dta also ships the authors' fitted values and
  CI bounds from the Table 2 models (outcome_ols_1, standarderror_ols,
  highconf_1, lowconf_1, outcome_ols_2, highconf_ols_2, lowconf_ols_2;
  documented in the codebook).  They are data columns, which the strip
  rule never touches; regressing outcome_ols_1 on the regressors would
  recover the column 1 coefficients but not the SEs or the column 2
  interaction.  Recorded, not fixed.

  What was read.  The Early View PDF (all 16 pp.); the package README
  and codebook; the do-file in full; the R script's Table 1 and Table 3
  sections; the Dataverse API metadata for both versions and for
  KDJD27; the meta-database's 8 team-17 rows.

  Independent cross-check (2026-11-06; not the package code: pandas /
  statsmodels on the downloaded files).  Table 2 col 1: Decentralized
  0.826 (0.226), Communication 2.541 (0.214), N 1,980, R2 0.263; col 2:
  Decentralized 0.409 (0.302), Communication 2.023 (0.317), interaction
  0.762 (0.380), R2 0.266 (WLS with participant-clustered SEs).  Table
  3: All Ties base 0.218 (0.124), full 0.240 (0.144); Strong Ties base
  0.607 (0.279), full 1.074 (0.314); N 231 / 226.  All round to the
  printed values.

  What could not be verified.  The authors' Stata and R code was not
  run.  Whether the issue PDF (pp. 554-569) differs from the Early View
  print in any number was not checked (the issue PDF is not open); the
  seven DB rows, entered from the published article, agree with it.

  Original analysis in Stata 15 (Table 2) and R 3.6.1 (Tables 1 and 3);
  language: r is the reproduction target.
