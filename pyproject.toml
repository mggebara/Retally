[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retally"
version = "0.1.0"
description = "Open Source Research Assistant — automated validation of academic paper results"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",        # Claude API for claim extraction and code generation
    "pymupdf>=1.24.0",          # PDF parsing (fitz)
    "requests>=2.31.0",         # HTTP downloads
    "tqdm>=4.66.0",             # Download progress bars
    "pandas>=2.0.0",            # DataFrame handling in the host-side dataset downloader
    "pyreadr>=0.5.7",           # Fallback reader for .RData/.rds in the prompt's dataset listing
]

# scikit-learn, numpy, scipy, etc. are NOT host runtime deps — they only run
# inside generated reproduction code.  In the default (Docker) execution mode
# they live in docker/requirements.sandbox.txt.  Users who explicitly opt into
# the subprocess executor need them on the host; install via ``pip install
# "retally[host-exec]"``.

[project.optional-dependencies]
host-exec = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]
kaggle = ["kaggle>=1.6.0"]
uci = ["ucimlrepo>=0.0.3"]
openml = ["openml>=0.14.0"]

# Developer tooling is a PEP 735 dependency group consumed by
# ``uv sync`` (which installs the default ``dev`` group automatically;
# no ``--extra dev`` needed).  Pip ≥25.1 supports the same via
# ``pip install --group dev``.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "kaggle>=1.6.0",
    "ucimlrepo>=0.0.3",
    # Benchmark catalog uses YAML for the per-paper entries; the runner
    # lives in benchmark/ at the repo root and is dev-only tooling.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "requires_docker: mark test as requiring a running Docker daemon and the sandbox image",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/retally/paper/extractor.py" = ["E501"]
"src/retally/codegen/generator.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
