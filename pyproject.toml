[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-validator"
version = "0.1.0"
description = "Automated reproduction and validation of academic paper results"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",        # Claude API for claim extraction and code generation
    "pymupdf>=1.24.0",          # PDF parsing (fitz)
    "requests>=2.31.0",         # HTTP downloads
    "kaggle>=1.6.0",            # Kaggle dataset API
    "tqdm>=4.66.0",             # Download progress bars
    "scikit-learn>=1.3.0",      # ML algorithms used in generated reproduction code
    "pandas>=2.0.0",            # DataFrame handling in downloader and generated code
    "numpy>=1.24.0",            # Numerical operations in generated code
    "ucimlrepo>=0.0.3",         # UCI ML Repository downloads
]

[project.optional-dependencies]
ml-extras = [
    "openml>=0.14.0",           # OpenML dataset downloads (optional; liac-arff build may fail)
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options.markers]
requires_docker = "mark test as requiring a running Docker daemon and the sandbox image"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff.lint]
select = ["E", "F", "I"]
