[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-validator"
version = "0.1.0"
description = "Automated reproduction and validation of academic paper results"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",       # Claude API for claim extraction and code generation
    "pymupdf>=1.24.0",          # PDF parsing (fitz)
    "requests>=2.31.0",         # HTTP downloads
    "kaggle>=1.6.0",            # Kaggle dataset API
    "tqdm>=4.66.0",             # Download progress bars
    "pydantic>=2.0.0",          # Runtime validation of parsed structures
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff.lint]
select = ["E", "F", "I"]
